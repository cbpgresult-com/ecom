<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | MyStore</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #151515;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 0 5%;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .search {
      flex: 1;
    }

    .search input {
      width: 100%;
      height: 44px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 16px;
      background: #f7f7f8;
      outline: none;
    }

    .header-cart {
      background: #111;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-count {
      background: white;
      color: #111;
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: 4px;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      max-width: 1350px;
      margin: auto;
      padding: 30px 5% 70px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 900;
      margin: 0 0 7px;
    }

    .page-subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(320px, .75fr);
      gap: 22px;
      align-items: start;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,.04);
    }

    .card-title {
      margin: 0 0 20px;
      font-size: 20px;
      font-weight: 900;
    }

    /* =========================
       ADDRESS
    ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #777;
    }

    .field textarea {
      min-height: 95px;
      resize: vertical;
    }

    .address-type {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .address-type label {
      cursor: pointer;
    }

    .address-type input {
      display: none;
    }

    .address-type span {
      display: block;
      padding: 9px 15px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .address-type input:checked + span {
      background: #111;
      color: white;
      border-color: #111;
    }

    /* =========================
       PAYMENT
    ========================= */

    .payment-option {
      border: 1px solid #ddd;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .payment-option:hover {
      border-color: #999;
    }

    .payment-option.selected {
      border-color: #111;
      background: #fafafa;
    }

    .payment-option label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .payment-option input {
      width: 18px;
      height: 18px;
      accent-color: #111;
    }

    .payment-name {
      font-weight: 800;
      font-size: 14px;
    }

    .payment-description {
      color: #777;
      font-size: 12px;
      margin-left: 30px;
      margin-top: 4px;
    }

    /* =========================
       ORDER ITEMS
    ========================= */

    .order-item {
      display: grid;
      grid-template-columns: 65px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item:last-child {
      border-bottom: 0;
    }

    .order-image {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      background: #f5f5f5;
      object-fit: contain;
    }

    .order-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .order-quantity {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

    .order-price {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      position: sticky;
      top: 95px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 14px 0;
      font-size: 14px;
      color: #555;
    }

    .summary-row.discount {
      color: #16803c;
    }

    .divider {
      border: 0;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: 900;
    }

    /* =========================
       PLACE ORDER
    ========================= */

    .place-order {
      width: 100%;
      height: 54px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s;
    }

    .place-order:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0,0,0,.16);
    }

    .place-order:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .secure {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 13px;
      line-height: 1.5;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;
      border-radius: 20px;
      padding: 90px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 60px;
    }

    .empty h2 {
      margin: 15px 0 7px;
    }

    .empty p {
      color: #777;
    }

    .empty button {
      margin-top: 15px;
      border: 0;
      background: #111;
      color: white;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translate(-50%, 30px);
      background: #111;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 9999;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .header {
        height: auto;
        padding: 12px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .logo {
        font-size: 21px;
      }

      .search {
        order: 3;
        flex-basis: 100%;
      }

      .header-cart {
        padding: 10px 13px;
      }

      .page {
        padding: 22px 12px 45px;
      }

      .page-title {
        font-size: 26px;
      }

      .checkout-layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }

      .card {
        padding: 19px;
        border-radius: 16px;
      }
    }

    @media (max-width: 550px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .card-title {
        font-size: 18px;
      }

      .address-type span {
        padding: 8px 12px;
      }

      .order-item {
        grid-template-columns: 55px 1fr auto;
      }

      .order-image {
        width: 55px;
        height: 55px;
      }

      .total-row {
        font-size: 19px;
      }

      .place-order {
        height: 51px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div
      class="logo"
      onclick="window.location.href='index.html'">

      MyStore

    </div>

    <div class="search">

      <input
        type="text"
        placeholder="Search products..."
        onclick="window.location.href='index.html'">

    </div>

    <button
      class="header-cart"
      onclick="window.location.href='cart.html'">

      🛒 Cart

      <span
        id="cartCount"
        class="cart-count">
        0
      </span>

    </button>

  </header>


  <main class="page">

    <h1 class="page-title">
      Checkout
    </h1>

    <div class="page-subtitle">
      Complete your order securely
    </div>


    <div
      id="checkoutLayout"
      class="checkout-layout">


      <!-- LEFT -->

      <section>


        <!-- ADDRESS -->

        <div class="card">

          <h2 class="card-title">
            📍 Delivery Address
          </h2>


          <div class="form-grid">


            <div class="field">

              <label>
                Full Name *
              </label>

              <input
                id="name"
                type="text"
                placeholder="Enter your full name"
                autocomplete="name">

            </div>


            <div class="field">

              <label>
                Mobile Number *
              </label>

              <input
                id="mobile"
                type="tel"
                maxlength="10"
                inputmode="numeric"
                placeholder="10-digit mobile number"
                autocomplete="tel">

            </div>


            <div class="field">

              <label>
                Pincode *
              </label>

              <input
                id="pincode"
                type="tel"
                maxlength="6"
                inputmode="numeric"
                placeholder="6-digit pincode">

            </div>


            <div class="field">

              <label>
                City *
              </label>

              <input
                id="city"
                type="text"
                placeholder="City">

            </div>


            <div class="field">

              <label>
                State *
              </label>

              <select id="state">

                <option value="">
                  Select State
                </option>

                <option>Uttar Pradesh</option>
                <option>Delhi</option>
                <option>Maharashtra</option>
                <option>Bihar</option>
                <option>Madhya Pradesh</option>
                <option>Rajasthan</option>
                <option>Gujarat</option>
                <option>West Bengal</option>
                <option>Punjab</option>
                <option>Haryana</option>
                <option>Uttarakhand</option>
                <option>Jharkhand</option>
                <option>Chhattisgarh</option>
                <option>Odisha</option>
                <option>Karnataka</option>
                <option>Telangana</option>
                <option>Tamil Nadu</option>
                <option>Kerala</option>
                <option>Andhra Pradesh</option>

              </select>

            </div>


            <div class="field">

              <label>
                Landmark
              </label>

              <input
                id="landmark"
                type="text"
                placeholder="Nearby landmark">

            </div>


            <div class="field full">

              <label>
                Complete Address *
              </label>

              <textarea
                id="address"
                placeholder="House/Flat No., Building, Street, Area..."
              ></textarea>

            </div>

          </div>


          <div class="address-type">

            <label>

              <input
                type="radio"
                name="addressType"
                value="Home"
                checked>

              <span>
                🏠 Home
              </span>

            </label>


            <label>

              <input
                type="radio"
                name="addressType"
                value="Work">

              <span>
                🏢 Work
              </span>

            </label>

          </div>

        </div>


        <!-- PAYMENT -->

        <div class="card">

          <h2 class="card-title">
            💳 Payment Method
          </h2>


          <div
            class="payment-option selected"
            onclick="selectPayment('UPI', this)">

            <label>

              <input
                type="radio"
                name="payment"
                value="UPI"
                checked>

              <div>

                <div class="payment-name">
                  UPI
                </div>

                <div class="payment-description">
                  Pay securely using UPI
                </div>

              </div>

            </label>

          </div>


          <div
            class="payment-option"
            onclick="selectPayment('CARD', this)">

            <label>

              <input
                type="radio"
                name="payment"
                value="CARD">

              <div>

                <div class="payment-name">
                  Credit / Debit Card
                </div>

                <div class="payment-description">
                  Visa, Mastercard, RuPay and more
                </div>

              </div>

            </label>

          </div>


          <div
            class="payment-option"
            onclick="selectPayment('COD', this)">

            <label>

              <input
                type="radio"
                name="payment"
                value="COD">

              <div>

                <div class="payment-name">
                  Cash on Delivery
                </div>

                <div class="payment-description">
                  Pay when your order arrives
                </div>

              </div>

            </label>

          </div>

        </div>


      </section>


      <!-- RIGHT -->

      <aside class="summary">


        <!-- ITEMS -->

        <div class="card">

          <h2 class="card-title">
            Order Summary
          </h2>

          <div id="orderItems"></div>

        </div>


        <!-- PRICE -->

        <div class="card">


          <div class="summary-row">

            <span>
              Item Total
            </span>

            <strong id="subtotal">
              ₹0
            </strong>

          </div>


          <div class="summary-row discount">

            <span>
              Discount
            </span>

            <strong id="discount">
              - ₹0
            </strong>

          </div>


          <div class="summary-row">

            <span>
              Delivery
            </span>

            <strong>
              FREE
            </strong>

          </div>


          <hr class="divider">


          <div class="total-row">

            <span>
              Total Amount
            </span>

            <span id="total">
              ₹0
            </span>

          </div>


          <button
            id="placeOrderBtn"
            class="place-order"
            onclick="placeOrder()">

            🔒 Place Order

          </button>


          <div class="secure">

            Your payment information is protected.<br>
            Secure checkout experience.

          </div>

        </div>

      </aside>

    </div>


    <!-- EMPTY -->

    <div
      id="empty"
      class="empty"
      style="display:none;">

      <div class="empty-icon">
        🛒
      </div>

      <h2>
        Your cart is empty
      </h2>

      <p>
        Add products to continue checkout.
      </p>

      <button
        onclick="window.location.href='index.html'">

        Start Shopping

      </button>

    </div>

  </main>


  <div
    id="toast"
    class="toast">
  </div>


  <script>

    /* =========================
       CART
    ========================= */

    let cart =
      JSON.parse(
        localStorage.getItem("cart") || "[]"
      );


    let selectedPayment = "UPI";


    /* =========================
       ELEMENTS
    ========================= */

    const orderItems =
      document.getElementById("orderItems");

    const subtotalElement =
      document.getElementById("subtotal");

    const discountElement =
      document.getElementById("discount");

    const totalElement =
      document.getElementById("total");

    const cartCount =
      document.getElementById("cartCount");


    /* =========================
       MONEY
    ========================= */

    function money(value) {

      return Number(value || 0)
        .toLocaleString("en-IN");

    }


    /* =========================
       RENDER
    ========================= */

    function renderCheckout() {

      cart =
        JSON.parse(
          localStorage.getItem("cart") || "[]"
        );


      updateCartCount();


      if (!cart.length) {

        document.getElementById(
          "checkoutLayout"
        ).style.display = "none";

        document.getElementById(
          "empty"
        ).style.display = "block";

        return;

      }


      let subtotal = 0;

      let mrpTotal = 0;


      orderItems.innerHTML = "";


      cart.forEach(item => {

        const quantity =
          Number(item.quantity || 1);

        const price =
          Number(item.price || 0);

        const mrp =
          Number(item.mrp || price);


        subtotal +=
          price * quantity;


        mrpTotal +=
          mrp * quantity;


        const row =
          document.createElement("div");

        row.className =
          "order-item";


        row.innerHTML = `

          <img
            class="order-image"
            src="${
              item.image ||
              "https://placehold.co/100x100/png?text=Product"
            }"
            alt="${escapeHTML(item.name)}">


          <div>

            <div class="order-name">

              ${escapeHTML(item.name)}

            </div>

            <div class="order-quantity">

              Qty: ${quantity}

            </div>

          </div>


          <div class="order-price">

            ₹${money(price * quantity)}

          </div>

        `;


        orderItems.appendChild(row);

      });


      const discount =
        Math.max(
          0,
          mrpTotal - subtotal
        );


      subtotalElement.textContent =
        `₹${money(subtotal)}`;


      discountElement.textContent =
        `- ₹${money(discount)}`;


      totalElement.textContent =
        `₹${money(subtotal)}`;

    }


    /* =========================
       PAYMENT
    ========================= */

    function selectPayment(method, element) {

      selectedPayment =
        method;


      document
        .querySelectorAll(".payment-option")
        .forEach(option =>
          option.classList.remove("selected")
        );


      element.classList.add("selected");


      const radio =
        element.querySelector(
          "input"
        );


      if (radio) {
        radio.checked = true;
      }

    }


    /* =========================
       VALIDATION
    ========================= */

    function validateAddress() {

      const name =
        document.getElementById("name")
          .value.trim();

      const mobile =
        document.getElementById("mobile")
          .value.trim();

      const pincode =
        document.getElementById("pincode")
          .value.trim();

      const city =
        document.getElementById("city")
          .value.trim();

      const state =
        document.getElementById("state")
          .value;

      const address =
        document.getElementById("address")
          .value.trim();


      if (!name) {

        showToast(
          "Please enter your name"
        );

        return false;

      }


      if (!/^[0-9]{10}$/.test(mobile)) {

        showToast(
          "Enter a valid 10-digit mobile number"
        );

        return false;

      }


      if (!/^[0-9]{6}$/.test(pincode)) {

        showToast(
          "Enter a valid 6-digit pincode"
        );

        return false;

      }


      if (!city) {

        showToast(
          "Please enter your city"
        );

        return false;

      }


      if (!state) {

        showToast(
          "Please select your state"
        );

        return false;

      }


      if (!address) {

        showToast(
          "Please enter your complete address"
        );

        return false;

      }


      return true;

    }


    /* =========================
       PLACE ORDER
    ========================= */

    function placeOrder() {

      if (!cart.length) {

        showToast(
          "Your cart is empty"
        );

        return;

      }


      if (!validateAddress()) {

        return;

      }


      /*
        Temporary order object.
        Database + real payment
        will be connected next.
      */

      const addressType =
        document.querySelector(
          'input[name="addressType"]:checked'
        )?.value || "Home";


      const order = {

        orderId:
          "ORD" +
          Date.now(),

        customer: {

          name:
            document.getElementById("name")
              .value.trim(),

          mobile:
            document.getElementById("mobile")
              .value.trim(),

          pincode:
            document.getElementById("pincode")
              .value.trim(),

          city:
            document.getElementById("city")
              .value.trim(),

          state:
            document.getElementById("state")
              .value,

          landmark:
            document.getElementById("landmark")
              .value.trim(),

          address:
            document.getElementById("address")
              .value.trim(),

          addressType:
            addressType

        },

        paymentMethod:
          selectedPayment,

        items:
          cart,

        createdAt:
          new Date().toISOString()

      };


      localStorage.setItem(
        "pendingOrder",
        JSON.stringify(order)
      );


      /*
        For now:
        COD can continue to order confirmation.

        UPI/Card will be connected
        to the real payment gateway
        in the next phase.
      */

      if (
        selectedPayment === "COD"
      ) {

        localStorage.removeItem(
          "cart"
        );


        window.location.href =
          "order-success.html";

        return;

      }


      showToast(
        `${selectedPayment} payment gateway will be connected next`
      );

    }


    /* =========================
       CART COUNT
    ========================= */

    function updateCartCount() {

      const count =
        cart.reduce(
          (total, item) =>
            total +
            Number(item.quantity || 0),
          0
        );


      cartCount.textContent =
        count;

    }


    /* =========================
       TOAST
    ========================= */

    let toastTimer;


    function showToast(message) {

      const toast =
        document.getElementById("toast");


      toast.textContent =
        message;


      toast.classList.add("show");


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove("show");

          },
          2500
        );

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(value) {

      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       START
    ========================= */

    renderCheckout();

  </script>

</body>
</html>
