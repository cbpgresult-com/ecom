<!-- ================= MOBILE PRODUCT LOADING ================= -->

<div id="mobileProductLoading" class="mobileProductLoading">

  <div class="mobileProductLoadingHeader">

    <button
      class="mpBack"
      type="button"
      aria-label="Back"
      onclick="productGoBack()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
      >
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
      </svg>
    </button>

    <div class="mobileProductLoadingSpacer"></div>

    <button
      class="mobileProductLoadingAction"
      type="button"
      aria-label="Search"
      onclick="productGoSearch()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
      >
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
      </svg>
    </button>

    <button
      class="mobileProductLoadingAction"
      type="button"
      aria-label="Cart"
      onclick="productGoCart()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
      >
        <circle cx="9" cy="20" r="1"/>
        <circle cx="18" cy="20" r="1"/>
        <path d="M3 4h2l2.4 11.5h10.8L21 8H6"/>
      </svg>

      <span
        id="mobileProductLoadingBadge"
        class="mobileProductLoadingBadge"
      ></span>

    </button>

  </div>

  <div class="mobileProductLoadingCenter">

    <div
      class="mobileProductLoadingSpinner"
      aria-label="Loading"
    ></div>

  </div>

</div>
