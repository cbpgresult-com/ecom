<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | MyStore</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

.page{
  width:min(1450px,100%);
  margin:auto;
  padding:22px 4%;
}

.product{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 40px #0000000d;
}

.grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  min-height:650px;
}

.gallery{
  padding:28px;
  background:linear-gradient(145deg,#fff,#f1f3f5);
  border-right:1px solid #eee;
}

/* =========================
   IMAGE SLIDER
========================= */

.main{
  height:550px;
  background:#fff;
  border:1px solid #eee;
  border-radius:20px;
  position:relative;
  overflow:hidden;
}

.pill{
  position:absolute;
  top:16px;
  left:16px;
  background:#111;
  color:#fff;
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  z-index:6;
  letter-spacing:.3px;
}

.slider{
  display:flex;
  height:100%;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.slider::-webkit-scrollbar{
  display:none;
}

.slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.slide img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  padding:35px;
  min-width:0;
  min-height:0;
}

.imgFallback{
  display:none;
  align-items:center;
  justify-content:center;
  height:100%;
  width:100%;
  color:#777;
  font-size:13px;
  position:absolute;
  inset:0;
}

.navBtn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid #ddd;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 14px #0000001f;
  z-index:6;
  color:#111;
  transition:box-shadow .15s,transform .15s;
}

.navBtn:hover:not(:disabled){
  box-shadow:0 6px 18px #00000029;
  transform:translateY(-50%) scale(1.05);
}

.navBtn:disabled{
  opacity:.35;
  cursor:default;
}

.prevBtn{
  left:14px;
}

.nextBtn{
  right:14px;
}

.dots{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:14px 0 2px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#d9d9d9;
  border:0;
  padding:0;
  cursor:pointer;
}

.dot.active{
  background:#111;
  width:20px;
  border-radius:5px;
  transition:width .2s,background .2s;
}

/* =========================
   PRODUCT INFO
========================= */

.info{
  padding:38px 42px;
  display:flex;
  flex-direction:column;
}

.tag{
  align-self:flex-start;
  background:#111;
  color:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.3px;
}

.title{
  font-size:29px;
  line-height:1.3;
  margin:14px 0 0;
  font-weight:700;
  color:#1a1a1a;
}

.rating{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:15px;
}

.rate{
  background:#15803d;
  color:#fff;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:3px;
}

.reviews{
  color:#6b7280;
  font-size:12px;
}

.pricebox{
  margin-top:24px;
  padding-bottom:20px;
  border-bottom:1px solid #eee;
}

.price{
  font-size:33px;
  font-weight:800;
  letter-spacing:-.5px;
}

.mrp{
  text-decoration:line-through;
  color:#888;
  font-size:14px;
}

.off{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-left:8px;
}

.desc{
  color:#4b5563;
  font-size:14px;
  line-height:1.75;
  margin-top:20px;
}

.stock{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:6px;
}

/* =========================
   QUANTITY
========================= */

.qtyrow{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  margin-top:14px;
  font-size:12px;
  font-weight:800;
  min-height:34px;
}

.qty{
  display:flex;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  height:34px;
}

.qty button{
  width:32px;
  border:0;
  background:#f7f7f7;
  font-size:13px;
}

.qty span{
  width:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

#customizeWrap{
  display:none;
  align-items:center;
  gap:7px;
  margin-left:4px;
}

#customizeInput{
  width:125px;
  height:40px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:0 10px;
  outline:none;
  background:#fff;
}

/* =========================
   DELIVERY
========================= */

.deliveryDetails{
  margin-top:24px;
}

.deliveryTitle{
  font-size:18px;
  font-weight:800;
  margin-bottom:11px;
  color:#111;
  letter-spacing:-.2px;
}

.deliveryCard{
  border-radius:16px;
  overflow:hidden;
  border:1px solid #e3e7ed;
  background:#fff;
  box-shadow:0 8px 24px rgba(20,30,45,.07);
}

.deliveryAddress{
  display:flex;
  align-items:center;
  cursor:pointer;
  gap:11px;
  background:linear-gradient(180deg,#f4f8ff,#eef5ff);
  padding:13px 14px;
  min-height:50px;
}

.deliveryIcon{
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 26px;
  color:#111;
}

.deliveryIcon svg{
  width:22px;
  height:22px;
  display:block;
  stroke:currentColor;
}

.deliveryAddressText{
  flex:1 1 auto;
  min-width:0;
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#20242b;
  line-height:1.2;
  font-size:12px;
  font-weight:700;
  display:block;
}

.deliveryArrow{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  flex:0 0 24px;
}

.deliveryArrow svg{
  width:18px;
  height:18px;
  stroke:currentColor;
}

.deliveryDate{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  background:#fafafa;
  border-top:1px solid #edf0f3;
  font-size:12px;
  font-weight:800;
  color:#20242b;
}

.deliverySeller{
  padding:12px 14px 13px;
  background:#fafafa;
  border-top:1px solid #edf0f3;
}

.sellerMain{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:800;
  color:#20242b;
}

.sellerMain svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  flex:0 0 20px;
}

.sellerSub{
  font-size:10px;
  color:#747b85;
  margin:4px 0 0 28px;
}

.sellerLink{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin:6px 0 0 28px;
  color:#1769d5;
  font-size:11px;
  font-weight:800;
}

/* =========================
   FEATURES
========================= */

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:22px;
}

.feature{
  text-align:center;
  border:1px solid #e4e7eb;
  border-radius:15px;
  background:linear-gradient(180deg,#fff,#fbfcfd);
  padding:11px 5px 10px;
  font-size:9px;
  color:#69717c;
  min-height:78px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 16px rgba(20,30,45,.045);
}

.featureIcon{
  width:31px;
  height:31px;
  border-radius:10px;
  background:#f3f6fa;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:7px;
  color:#1d4ed8;
}

.featureIcon svg{
  width:19px;
  height:19px;
  stroke:currentColor;
}

.feature b{
  display:block;
  color:#20242b;
  font-size:9px;
  line-height:1.2;
  margin:0;
}

/* =========================================================
   PRODUCT HIGHLIGHTS
   SIMPLE STYLE - NO CARD
========================================================= */

.productHighlights{
  margin-top:28px;
  border-top:1px solid #e5e5e5;
}

.productHighlightsHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:70px;
  padding:12px 0;
  border-bottom:1px solid #e5e5e5;
  cursor:pointer;
}

.highlightHeaderText h2{
  margin:0;
  font-size:21px;
  line-height:1.25;
  font-weight:800;
  color:#111;
}

.highlightHeaderText p{
  margin:5px 0 0;
  color:#777;
  font-size:13px;
}

.sectionArrow{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#f5f6f7;
  color:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  flex:0 0 34px;
}

.highlightBody{
  display:none;
}

.highlightBody.open{
  display:block;
}

.highlightRows{
  width:100%;
}

.highlightRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:62px;
  align-items:center;
  border-bottom:1px solid #e5e5e5;
}

.highlightItem{
  padding:10px 12px 10px 0;
  min-width:0;
}

.highlightItem:nth-child(even){
  padding-left:23px;
  border-left:0;
}

.highlightLabel{
  color:#777;
  font-size:13px;
  line-height:1.25;
  margin-bottom:3px;
}

.highlightValue{
  color:#222;
  font-size:14px;
  font-weight:400;
  line-height:1.3;
  word-break:break-word;
}

/* =========================================================
   ALL DETAILS
   SAME SIMPLE STYLE
========================================================= */

.allDetailsSection{
  margin-top:22px;
  border-top:1px solid #e5e5e5;
}

.allDetailsHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:70px;
  padding:12px 0;
  border-bottom:1px solid #e5e5e5;
  cursor:pointer;
}

.allDetailsHeaderText h2{
  margin:0;
  font-size:21px;
  line-height:1.25;
  font-weight:800;
  color:#111;
}

.allDetailsHeaderText p{
  margin:5px 0 0;
  color:#777;
  font-size:13px;
}

.allDetailsBody{
  display:none;
  padding-top:17px;
}

.allDetailsBody.open{
  display:block;
}

.detailTabs{
  display:flex;
  gap:9px;
  border-bottom:1px solid #e5e5e5;
  padding-bottom:15px;
  margin-bottom:22px;
  overflow-x:auto;
  scrollbar-width:none;
}

.detailTabs::-webkit-scrollbar{
  display:none;
}

.detailTab{
  flex:0 0 auto;
  border:1px solid #d6d9dd;
  background:#fff;
  color:#222;
  padding:9px 15px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
}

.detailTab.active{
  background:#111;
  color:#fff;
  border-color:#111;
  font-weight:800;
}

.detailPanel{
  display:none;
}

.detailPanel.active{
  display:block;
}

.detailSection{
  margin-bottom:28px;
}

.detailSectionTitle{
  font-size:16px;
  font-weight:800;
  color:#222;
  margin:0 0 12px;
}

.detailRows{
  width:100%;
}

.detailRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:54px;
  border-bottom:1px solid #e5e5e5;
  align-items:center;
}

.detailKey{
  color:#777;
  font-size:13px;
  padding:10px 12px 10px 0;
}

.detailValue{
  color:#222;
  font-size:14px;
  padding:10px 0;
  word-break:break-word;
}

.detailDescription{
  color:#444;
  font-size:14px;
  line-height:1.75;
  padding-bottom:18px;
  white-space:pre-wrap;
}

.detailEmpty{
  color:#777;
  font-size:13px;
  padding:15px 0;
}

/* =========================
   CTA
========================= */

.cta{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:10px;
  margin-top:auto;
  padding-top:24px;
}

.add,
.buy{
  height:56px;
  border-radius:14px;
  font-weight:800;
  font-size:14px;
  transition:transform .12s,box-shadow .12s,background .15s;
}

.add{
  background:#fff;
  border:1px solid #d9dde3;
  box-shadow:0 5px 16px rgba(20,30,45,.05);
}

.add:hover{
  background:#f8fafc;
  box-shadow:0 8px 22px rgba(20,30,45,.08);
}

.add:active,
.buy:active{
  transform:scale(.98);
}

.buy{
  background:linear-gradient(135deg,#ffbd19,#ff9800);
  border:0;
  box-shadow:0 8px 22px rgba(255,152,0,.28);
  color:#1a1a1a;
}

.cta svg{
  width:18px;
  height:18px;
  vertical-align:-4px;
  margin-right:5px;
  stroke:currentColor;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  #customizeWrap{
    margin-left:0!important;
    flex:1;
    min-width:0;
  }

  #customizeWrap input{
    width:100%!important;
    max-width:135px;
    height:34px!important;
  }

  #customizeWrap label{
    font-size:10px!important;
  }

  .qtyrow{
    gap:6px;
    margin-top:12px;
    font-size:11px;
    min-height:32px;
  }

  .qty{
    height:32px;
    border-radius:8px;
  }

  .qty button{
    width:29px;
    font-size:12px;
  }

  .qty span{
    width:30px;
    font-size:11px;
  }

  .deliveryDetails{
    margin-top:18px;
  }

  .deliveryTitle{
    font-size:15px;
    margin-bottom:8px;
  }

  .deliveryAddress{
    padding:10px;
    font-size:10px;
    min-height:43px;
  }

  .deliveryDate{
    padding:10px;
    font-size:10px;
  }

  .deliverySeller{
    padding:10px;
  }

  .sellerMain{
    font-size:10px;
  }

  .sellerSub{
    font-size:8.5px;
    margin-left:27px;
  }

  .sellerLink{
    font-size:9px;
    margin:5px 0 0 27px;
  }

  .deliveryIcon{
    width:23px;
    height:23px;
    flex-basis:23px;
  }

  .deliveryIcon svg{
    width:19px;
    height:19px;
  }

  .deliveryAddressText{
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
    max-width:100%;
    display:block;
  }

  .deliveryArrow{
    width:21px;
    flex-basis:21px;
  }

  .deliveryArrow svg{
    width:16px;
    height:16px;
  }

  .features{
    gap:7px;
    margin-top:16px;
  }

  .feature{
    min-height:68px;
    padding:8px 3px;
  }

  .featureIcon{
    width:27px;
    height:27px;
    border-radius:9px;
    margin-bottom:5px;
  }

  .featureIcon svg{
    width:17px;
    height:17px;
  }

  .feature b{
    font-size:8.5px;
  }

  .page{
    padding:12px 9px 90px;
  }

  .product{
    border-radius:17px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .gallery{
    padding:9px 0;
    border-right:0;
    border-bottom:1px solid #eee;
  }

  .main{
    height:340px;
    border:0;
    background:transparent;
    border-radius:0;
    box-shadow:none;
  }

  .slide img{
    padding:10px;
  }

  .navBtn{
    display:none!important;
  }

  .info{
    padding:20px 16px;
  }

  .title{
    font-size:19px;
    line-height:1.35;
    margin-top:10px;
  }

  .price{
    font-size:26px;
  }

  .mrp{
    font-size:12px;
  }

  .off{
    font-size:12px;
  }

  .rate{
    font-size:11px;
  }

  .reviews{
    font-size:11px;
  }

  .productHighlights{
    margin-top:22px;
  }

  .highlightHeaderText h2,
  .allDetailsHeaderText h2{
    font-size:18px;
  }

  .highlightHeaderText p,
  .allDetailsHeaderText p{
    font-size:11px;
  }

  .sectionArrow{
    width:32px;
    height:32px;
    flex-basis:32px;
  }

  .highlightRow{
    min-height:57px;
  }

  .highlightItem{
    padding:9px 8px 9px 0;
  }

  .highlightItem:nth-child(even){
    padding-left:16px;
  }

  .highlightLabel{
    font-size:11px;
  }

  .highlightValue{
    font-size:12px;
  }

  .allDetailsBody{
    padding-top:14px;
  }

  .detailTabs{
    gap:7px;
    margin-bottom:18px;
  }

  .detailTab{
    font-size:12px;
    padding:8px 12px;
  }

  .detailSectionTitle{
    font-size:15px;
  }

  .detailRow{
    grid-template-columns:1fr 1fr;
    min-height:52px;
  }

  .detailKey{
    font-size:12px;
  }

  .detailValue{
    font-size:13px;
  }

  .detailDescription{
    font-size:13px;
  }

  .cta{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    background:#fff;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    margin:0;
    border-top:1px solid #ddd;
    box-shadow:0 -6px 20px #0000000f;
  }

  .add,
  .buy{
    height:51px;
  }
}
</style>
</head>

<body>

<main class="page">

<div id="loading"
     style="background:#fff;border-radius:20px;min-height:550px;display:flex;align-items:center;justify-content:center">
  <b>Loading product...</b>
</div>

<section id="product" class="product">

<div class="grid">

<!-- =========================
     GALLERY
========================= -->

<div class="gallery">

<div class="main">

<span id="badge" class="pill">BESTSELLER</span>

<button type="button"
        class="navBtn prevBtn"
        onclick="prevImage()"
        aria-label="Previous image">
  ‹
</button>

<button type="button"
        class="navBtn nextBtn"
        onclick="nextImage()"
        aria-label="Next image">
  ›
</button>

<div class="slider" id="slider"></div>

</div>

<div class="dots" id="dots"></div>

</div>


<!-- =========================
     PRODUCT INFO
========================= -->

<div class="info">

<span id="tag" class="tag">BESTSELLER</span>

<h1 id="title" class="title"></h1>

<div class="rating">
  <span id="rating" class="rate"></span>
  <span id="reviews" class="reviews"></span>
</div>

<div class="pricebox">
  <span id="price" class="price"></span>
  <br>
  <span id="mrp" class="mrp"></span>
  <span id="off" class="off"></span>
</div>


<!-- =========================
     DELIVERY
========================= -->

<div id="deliveryDetails" class="deliveryDetails">

<div class="deliveryTitle">
  Delivery details
</div>

<div class="deliveryCard">

<div class="deliveryAddress"
     id="deliveryAddressRow"
     role="button"

/* =====================================================
   ADDRESS
===================================================== */

function uniqueParts(arr){

  const out = [];

  for(const x of arr){

    const s = cleanPart(x);

    if(
      s &&
      !out.some(
        y =>
          y.toLowerCase() ===
          s.toLowerCase()
      )
    ){
      out.push(s);
    }

  }

  return out;
}


function formatSavedAddress(a){

  if(!a) return "";

  if(typeof a === "string"){
    return a.trim();
  }

  const village =
    cleanPart(
      a.village ||
      a.locality ||
      a.area ||
      a.town ||
      a.place ||
      ""
    );

  const district =
    cleanPart(
      a.district ||
      a.district_name ||
      ""
    );

  const city =
    cleanPart(
      a.city ||
      a.city_name ||
      ""
    );

  const state =
    cleanPart(
      a.state ||
      a.state_name ||
      ""
    );

  const pincode =
    cleanPart(
      a.pincode ||
      a.pin ||
      a.postal_code ||
      a.postcode ||
      ""
    );

  const plus =
    cleanPart(
      a.plus_code ||
      a.plusCode ||
      a.pluscode ||
      a.plus_code_address ||
      ""
    );

  const direct =
    cleanPart(
      a.full_address ||
      a.fullAddress ||
      a.formatted_address ||
      a.formattedAddress
    );

  const first =
    uniqueParts([
      village,
      district
    ]).join(", ");

  const second =
    uniqueParts([
      state,
      pincode
    ]).join(", ");

  const lines =
    [
      first,
      second,
      plus
    ].filter(Boolean);

  if(lines.length){
    return lines.join("\n");
  }

  return (
    uniqueParts([
      city,
      state,
      pincode
    ]).join(", ")
    || direct
  );
}


function addressCacheKey(userId){

  return (
    "mystore_delivery_address_cache_v3_" +
    String(userId || "guest")
  );
}


function cacheAddress(
  userId,
  addressObject,
  formatted
){

  try{

    const payload = {
      savedAt:Date.now(),
      text:
        formatted ||
        formatSavedAddress(addressObject),
      data:addressObject || null
    };

    localStorage.setItem(
      addressCacheKey(userId),
      JSON.stringify(payload)
    );

  }catch(e){

    console.warn(
      "Address cache error",
      e
    );

  }
}


function readCachedAddress(userId){

  try{

    const raw =
      localStorage.getItem(
        addressCacheKey(userId)
      );

    if(!raw) return "";

    const x = JSON.parse(raw);

    return (
      cleanPart(x?.text) ||
      formatSavedAddress(x?.data)
    );

  }catch(e){

    return "";

  }
}


function paintAddress(text){

  const el =
    document.getElementById(
      "deliveryAddressText"
    );

  if(!el) return;

  const value =
    cleanPart(text);

  if(!value){

    el.textContent =
      "Add delivery address";

    return;
  }

  /*
    New lines become spaces.
    CSS then shows one line with ...
  */

  el.textContent =
    value
      .replace(/\s*\n\s*/g," ")
      .replace(/\s+/g," ")
      .trim();
}


function looksLikeAddressObject(x){

  if(
    !x ||
    typeof x !== "object" ||
    Array.isArray(x)
  ){
    return false;
  }

  const keys =
    Object.keys(x)
      .map(k=>k.toLowerCase());

  return keys.some(
    k => [
      "village",
      "district",
      "state",
      "pincode",
      "pin",
      "postal_code",
      "plus_code",
      "full_address",
      "fulladdress",
      "formatted_address",
      "address",
      "locality"
    ].includes(k)
  );
}


function scanLocalStorageForAddress(){

  const preferred = [
    "selectedAddress",
    "selected_address",
    "savedAddress",
    "saved_address",
    "savedAddresses",
    "saved_addresses",
    "deliveryAddress",
    "delivery_address",
    "currentAddress",
    "current_address",
    "userAddress",
    "user_address",
    "address",
    "addresses"
  ];

  const keys = [];

  for(const k of preferred){

    if(!keys.includes(k)){
      keys.push(k);
    }

  }

  try{

    for(
      let i=0;
      i<localStorage.length;
      i++
    ){

      const k =
        localStorage.key(i);

      if(
        k &&
        !keys.includes(k)
      ){
        keys.push(k);
      }

    }

  }catch(e){}


  for(const key of keys){

    try{

      const raw =
        localStorage.getItem(key);

      if(!raw) continue;

      let value;

      try{
        value = JSON.parse(raw);
      }catch{
        value = raw;
      }

      const candidates = [];

      if(Array.isArray(value)){
        candidates.push(...value);
      }else{
        candidates.push(value);
      }


      for(const item of candidates){

        if(typeof item === "string"){

          const t =
            item.trim();

          if(
            t &&
            /(\d{5,6}|uttar|pradesh|district|village|plus)/i.test(t)
          ){
            return t;
          }

        }else if(
          looksLikeAddressObject(item)
        ){

          const t =
            formatSavedAddress(item);

          if(t) return t;

        }

      }

    }catch(e){}

  }

  return "";
}


async function getCurrentUser(){

  try{

    const {
      data,

      await supabaseClient.auth.getSession();

    if(error) return null;

    return (

    );

  }catch(e){

  }

async function readAddressTable(
  table,
  userId
){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from(table)
        .select("*")
        .eq("user_id",userId)
        .order(
          "created_at",
          {ascending:false}
        )
        .limit(20);

    if(
      error ||
      !Array.isArray(data) ||
      !data.length
    ){
      return null;
    }

    const preferred =
      data.find(
        a =>
          a?.is_current_location === true ||
          a?.isCurrentLocation === true ||
          a?.is_current === true ||
          a?.selected === true ||
          a?.is_selected === true ||
          String(
            a?.type || ""
          )
          .toLowerCase()
          .includes("current")
      ) || data[0];

    const text =
      formatSavedAddress(preferred);

    if(text){

      return {
        data:preferred,
        text
      };

    }

  }catch(e){}

  return null;
}


async function loadDeliveryAddress(){

  const user =
    await getCurrentUser();

  if(user){

    const cached =
      readCachedAddress(user.id);

    if(cached){
      paintAddress(cached);
    }

  }

  const local =
    scanLocalStorageForAddress();

  if(
    local &&
    (!user ||
      !readCachedAddress(user.id))
  ){

    paintAddress(local);

  }


  if(user){

    const tables = [
      "saved_addresses",
      "addresses",
      "user_addresses",
      "delivery_addresses"
    ];

    for(const table of tables){

      const result =
        await readAddressTable(
          table,
          user.id
        );

      if(result){

        cacheAddress(
          user.id,
          result.data,
          result.text
        );

        paintAddress(
          result.text
        );

        return;

      }

    }

  }

}

/* =====================================================
   GENERIC JSON PARSER
===================================================== */

function parseMaybeJSON(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return null;
  }

  if(
    typeof value === "object"
  ){
    return value;
  }

  if(typeof value === "string"){

    try{
      return JSON.parse(value);
    }catch{
      return value;
    }

  }

  return value;
}


/* =====================================================
   HIGHLIGHTS
===================================================== */

function normalizeHighlights(raw){

  raw =
    parseMaybeJSON(raw);

  if(!raw) return [];

  if(Array.isArray(raw)){
    return raw;
  }

  if(
    raw.highlights &&
    Array.isArray(raw.highlights)
  ){
    return raw.highlights;
  }

  if(
    raw.rows &&
    Array.isArray(raw.rows)
  ){
    return raw.rows;
  }

  if(
    raw.items &&
    Array.isArray(raw.items)
  ){
    return raw.items;
  }

  /*
    Object format:
    {
      Color:"Purple",
      Material:"Plastic"
    }
  */

  if(
    typeof raw === "object" &&
    !Array.isArray(raw)
  ){

    const output = [];

    for(
      const [key,value]
      of Object.entries(raw)
    ){

      if(
        [
          "sections",
          "description",
          "title"
        ].includes(key)
      ){
        continue;
      }

      output.push({
        key,
        value
      });

    }

    return output;
  }

  return [];
}


function highlightKey(row){

  if(
    row === null ||
    row === undefined
  ){
    return "";
  }

  if(
    typeof row !== "object"
  ){
    return "";
  }

  return String(
    row.key ??
    row.name ??
    row.label ??
    row.title ??
    row.field ??
    row.heading ??
    row.feature ??
    ""
  ).trim();
}


function highlightValue(row){

  if(
    row === null ||
    row === undefined
  ){
    return "";
  }

  if(
    typeof row !== "object"
  ){
    return String(row);
  }

  return detailValueText(
    row.value ??
    row.val ??
    row.text ??
    row.answer ??
    row.content ??
    ""
  ).trim();
}


function renderHighlights(){

  const wrap =
    document.getElementById(
      "productHighlights"
    );

  const rowsEl =
    document.getElementById(
      "highlightRows"
    );

  if(
    !wrap ||
    !rowsEl ||
    !product
  ){
    return;
  }


  const rows =
    normalizeHighlights(
      product.highlights
    )
    .map(row => ({
      key:highlightKey(row),
      value:highlightValue(row)
    }))
    .filter(
      row =>
        row.key ||
        row.value
    );


  if(!rows.length){

    wrap.style.display =
      "none";

    return;
  }


  wrap.style.display =
    "block";


  let html = "";

  for(
    let i=0;
    i<rows.length;
    i+=2
  ){

    const left =
      rows[i];

    const right =
      rows[i+1];

    html += `
      <div class="highlightRow">

        <div class="highlightItem">

          <div class="highlightLabel">
            ${escapeHtml(left.key)}
          </div>

          <div class="highlightValue">
            ${escapeHtml(left.value)}
          </div>

        </div>

        ${
          right
          ? `
          <div class="highlightItem">

            <div class="highlightLabel">
              ${escapeHtml(right.key)}
            </div>

            <div class="highlightValue">
              ${escapeHtml(right.value)}
            </div>

          </div>
          `
          : `
          <div class="highlightItem"></div>
          `
        }

      </div>
    `;
  }

  rowsEl.innerHTML =
    html;
}


function toggleHighlights(){

  highlightsOpen =
    !highlightsOpen;

  const body =
    document.getElementById(
      "highlightBody"

  const arrow =

/* =====================================================
   ALL DETAILS
===================================================== */

function detailValueText(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }


  if(
    typeof value === "string" ||
    typeof value === "number" ||
    typeof value === "boolean"
  ){
    return String(value);
  }


  if(Array.isArray(value)){

    return value
      .map(item =>
        detailValueText(item)
      )
      .filter(Boolean)
      .join(", ");
  }


  if(
    typeof value === "object"
  ){

    const possibleValue =
      value.value ??
      value.val ??
      value.text ??
      value.name ??
      value.label ??
      value.title;


    if(
      possibleValue !== undefined
    ){

      return detailValueText(
        possibleValue
      );

    }


    return Object.entries(value)
      .map(
        ([key,val]) => {

          const x =
            detailValueText(val);

          return x
            ? `${key}: ${x}`
            : "";

        }
      )
      .filter(Boolean)
      .join(", ");
  }


  return String(value);
}


function detailRowKey(row){

  if(
    !row ||
    typeof row !== "object"
  ){
    return "";
  }

  return String(
    row.key ??
    row.name ??
    row.label ??
    row.title ??
    row.field ??
    row.heading ??
    ""
  ).trim();
}


function detailRowValue(row){

  if(
    !row ||
    typeof row !== "object"
  ){
    return detailValueText(row);
  }

  return detailValueText(
    row.value ??
    row.val ??
    row.text ??
    row.answer ??
    row.content ??
    ""
  ).trim();
}


function normalizeDetailSections(raw){

  raw =
    parseMaybeJSON(raw);

  if(!raw) return [];


  if(Array.isArray(raw)){

    /*
      Direct section array:
      [
        {
          heading:"Body and Side",
          rows:[...]
        }
      ]
    */

    return raw;
  }


  if(
    raw.sections &&
    Array.isArray(raw.sections)
  ){

    return raw.sections;
  }


  if(
    raw.data &&
    Array.isArray(raw.data)
  ){

    return raw.data;
  }


  if(
    raw.rows &&
    Array.isArray(raw.rows)
  ){

    return [{
      heading:
        raw.heading ||
        raw.title ||
        "All details",

      rows:raw.rows
    }];
  }


  return [];
}


function renderDetailSection(
  section
){

  if(
    !section ||
    typeof section !== "object"
  ){
    return "";
  }


  const heading =
    String(
      section.heading ??
      section.title ??
      section.name ??
      section.section ??
      "Details"
    ).trim();


  let rows =
    section.rows ??
    section.items ??
    section.details ??
    section.fields ??
    [];


  rows =
    parseMaybeJSON(rows);


  if(!Array.isArray(rows)){
    return "";
  }


  const validRows =
    rows
      .map(row => {

        const key =
          detailRowKey(row);

        const value =
          detailRowValue(row);

        if(
          !key &&
          !value
        ){
          return null;
        }

        return {
          key,
          value
        };

      })
      .filter(Boolean);


  if(!validRows.length){
    return "";
  }


  return `

    <div class="detailSection">

      <h3 class="detailSectionTitle">
        ${escapeHtml(heading)}
      </h3>

      <div class="detailRows">

        ${validRows.map(row => `

          <div class="detailRow">

            <div class="detailKey">
              ${escapeHtml(row.key)}
            </div>

            <div class="detailValue">
              ${escapeHtml(row.value)}
            </div>

          </div>

        `).join("")}

      </div>

    </div>

  `;
}


function getAllDetailsSource(){

  if(!product){
    return null;
  }

  /*
    Admin code may save the same data
    under any of these names.
  */

  return (
    product.all_details ??
    product.allDetails ??
    product.details_data ??
    product.product_details ??
    product.specifications ??
    null
  );
}


function getDescriptionSource(){

  return product?.description || "";
}


function renderAllDetails(){

  const wrap =
    document.getElementById(
      "allDetailsSection"
    );

  const tabs =
    document.getElementById(
      "detailTabs"
    );

  const panels =
    document.getElementById(
      "detailPanels"
    );

  if(
    !wrap ||
    !tabs ||
    !panels ||
    !product
  ){
    return;
  }


  const raw =
    getAllDetailsSource();


  let sections =
    normalizeDetailSections(
      raw
    );


  /*
    Remove empty sections.
  */

  sections =
    sections
      .map(section => {

        if(
          !section ||
          typeof section !== "object"
        ){
          return null;
        }

        let rows =
          section.rows ??
          section.items ??
          section.details ??
          section.fields ??
          [];

        rows =
          parseMaybeJSON(rows);

        if(!Array.isArray(rows)){
          return null;
        }

        const valid =
          rows.filter(row => {

            const key =
              detailRowKey(row);

            const value =
              detailRowValue(row);

            return (
              key ||
              value
            );

          });

        if(!valid.length){
          return null;
        }

        return {
          ...section,
          rows:valid
        };

      })
      .filter(Boolean);


  /*
    If nothing is saved, don't show
    a broken/empty All Details block.
  */

  if(!sections.length){

    wrap.style.display =
      "none";

    return;
  }


  wrap.style.display =
    "block";


  /*
    Every admin section becomes a tab.
    If admin has tab_name/category,
    that is used.
  */

  tabs.innerHTML =
    sections.map(
      (section,index) => {

        const name =
          String(
            section.tab ??
            section.tab_name ??
            section.category ??
            (
              index === 0
                ? "Specifications"
                : "Details"
            )
          );


        return `

          <button
            type="button"
            class="detailTab ${
              index === currentDetailTab
                ? "active"
                : ""
            }"
            onclick="showDetailTab(${index})">

            ${escapeHtml(name)}

          </button>

        `;

      }
    ).join("");


  panels.innerHTML =
    sections.map(
      (section,index) => {

        return `

          <div
            class="detailPanel ${
              index === currentDetailTab
                ? "active"
                : ""
            }"
            id="detailPanel${index}">

            ${renderDetailSection(section)}

          </div>

        `;

      }
    ).join("");
}


function showDetailTab(index){

  currentDetailTab =
    index;


  document
    .querySelectorAll(
      ".detailTab"
    )
    .forEach(
      (tab,i) => {

        tab.classList.toggle(
          "active",
          i === index
        );

      }
    );


  document
    .querySelectorAll(
      ".detailPanel"
    )
    .forEach(
      (panel,i) => {

        panel.classList.toggle(
          "active",
          i === index
        );

      }
    );
}


function toggleAllDetails(){

  allDetailsOpen =
    !allDetailsOpen;

  const body =
    document.getElementById(
      "allDetailsBody"
    );

  const arrow =
    document.getElementById(
      "allDetailsArrow"
    );

  if(
    !body ||
    !arrow
  ){
    return;
  }


  body.classList.toggle(
    "open",
    allDetailsOpen
  );

  arrow.textContent =
    allDetailsOpen
      ? "↑"
      : "↓";
}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function load(){

  try{

    if(!id()){
      throw Error(
        "Product ID missing"
      );
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("id",id())
        .single();


    if(error){
      throw error;
    }


    let gallery = [];


    if(Array.isArray(data.images)){

      gallery =
        data.images;

    }else if(
      typeof data.images === "string"
    ){

      try{

        const parsed =
          JSON.parse(data.images);

        if(
          Array.isArray(parsed)
        ){
          gallery =
            parsed;
        }

      }catch{}

    }


    gallery =
      gallery
        .map(
          x =>
            typeof x === "string"
              ? x
              : (
                  x?.url ||
                  x?.src ||
                  x?.image ||
                  ""
                )
        )
        .filter(Boolean);


    const primary =
      data.main_image ||
      gallery[0] ||
      v(
        data,
        [
          "image",
          "image_url",
          "thumbnail",
          "product_image"
        ],
        ""
      );


    const images =
      [
        primary,
        ...gallery.filter(
          x => x !== primary
        )
      ].filter(Boolean);


    /*
      ==============================
      IMPORTANT DETAILS FIELDS
      ==============================

      This reads whatever field
      your Admin is using.
    */

    const allDetails =
      data.all_details ??
      data.allDetails ??
      data.details_data ??
      data.product_details ??
      data.specifications ??
      null;


    const highlights =
      data.product_highlights ??
      data.highlights ??
      data.productHighlights ??
      data.highlight_details ??
      data.highlight_data ??
      null;


    product = {

      id:data.id,

      title:
        v(
          data,
          [
            "name",
            "title",
            "product_name"
          ],
          "Product"
        ),

      image:primary,

      images:
        images.length
          ? images
          : [""],

      price:
        num(
          v(
            data,
            [
              "price",
              "selling_price",
              "sale_price"
            ],
            149
          )
        ) || 149,

      mrp:
        num(
          v(
            data,
            [
              "mrp",
              "original_price",
              "old_price"
            ],
            999
          )
        ) || 999,

      description:
        v(
          data,
          [
            "description",
            "short_description",
            "details"
          ],
          ""
        ),

      rating:
        v(
          data,
          [
            "rating",
            "avg_rating"
          ],
          4.5
        ),

      reviews:
        v(
          data,
          [
            "review_count",
            "reviews"
          ],
          128
        ),

      stock:
        Number(
          v(
            data,
            [
              "stock",
              "inventory",
              "available_stock"
            ],
            50
          )
        ),

      badge:
        v(
          data,
          [
            "badge",
            "label"
          ],
          "BESTSELLER"
        ),

      category:
        v(
          data,
          [
            "category",
            "category_name"
          ],
          ""
        ),

      customize_enabled:
        Boolean(
          data.customize_enabled
        ),

      return_enabled:
        data.return_enabled === undefined
          ? true
          : Boolean(
              data.return_enabled
            ),

      return_days:
        Number(
          data.return_days
        ) || 10,

      cod_enabled:
        data.cod_enabled === undefined
          ? true
          : Boolean(
              data.cod_enabled
            ),

      assured_enabled:
        data.assured_enabled === undefined
          ? true
          : Boolean(
              data.assured_enabled
            ),

      /*
        DETAILS
      */

      all_details:
        allDetails,

      highlights:
        highlights

    };


    render();


  }catch(e){

    console.error(e);

    document.getElementById(
      "loading"
    ).innerHTML = `

      <div style="text-align:center">

        <h2>
          Product not found
        </h2>

        <p>
          ${escapeHtml(
            e.message
          )}
        </p>

      </div>

    `;

  }
}


/* =====================================================
   RENDER
===================================================== */

function render(){

  renderDeliveryDetails();


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "product"
  ).style.display =
    "block";


  document.getElementById(
    "title"
  ).textContent =
    product.title;


  document.getElementById(
    "price"
  ).textContent =
    money(product.price);


  /*
    IMPORTANT:
    Buy price ALWAYS remains
    single product price.
    Qty change does NOT multiply it.
  */

  document.getElementById(
    "buyPrice"
  ).textContent =
    money(product.price);


  document.getElementById(
    "mrp"
  ).textContent =
    product.mrp
      ? money(product.mrp)
      : "";


  document.getElementById(
    "off"
  ).textContent =
    product.mrp > product.price
      ? Math.max(
          0,
          Math.round(
            (
              1 -
              product.price /
              product.mrp
            ) * 100
          )
        ) + "% OFF"
      : "";


  document.getElementById(
    "description"
  ).textContent =
    product.description;


  document.getElementById(
    "rating"
  ).textContent =
    "★ " +
    product.rating;


  document.getElementById(
    "reviews"
  ).textContent =
    product.reviews +
    " reviews";


  document.getElementById(
    "tag"
  ).textContent =
    product.badge;


  document.getElementById(
    "badge"
  ).textContent =
    product.badge;


  document.getElementById(
    "stock"
  ).textContent =
    product.stock > 0
      ? "✓ In Stock (" +
        product.stock +
        " available)"
      : "✕ Out of Stock";


  /* Customize */

  const customizeWrap =
    document.getElementById(
      "customizeWrap"
    );


  if(customizeWrap){

    customizeWrap.style.display =
      product.customize_enabled
        ? "flex"
        : "none";


    if(
      !product.customize_enabled
    ){

      document.getElementById(
        "customizeInput"
      ).value = "";

    }

  }


  /* Features */

  const features =
    document.getElementById(
      "features"
    );


  if(features){

    const returnText =
      product.return_enabled
        ? product.return_days +
          "-Day Return"
        : "No Return";


    features.innerHTML =

      `
      <div class="feature">

        <div class="featureIcon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="1.8">

            <path d="M3 12a9 9 0 1 0 3-6.7"/>
            <path d="M3 4v6h6"/>

            <path d="M12 7v5l3 2"/>

          </svg>

        </div>

        <b>
          ${returnText}
        </b>

      </div>
      `

      +

      (
        product.cod_enabled
          ? `
          <div class="feature">

            <div class="featureIcon">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="1.8">

                <rect
                  x="3"
                  y="6"
                  width="18"
                  height="12"
                  rx="2"/>

                <path d="M7 12h5"/>
                <path d="M16 10v4"/>

              </svg>

            </div>

            <b>
              Cash on Delivery
            </b>

          </div>
          `
          : ""
      )

      +

      (
        product.assured_enabled
          ? `
          <div class="feature">

            <div class="featureIcon">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="1.8">

                <path
                  d="M12 3 20 6v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-3Z"/>

                <path
                  d="m8.5 12 2.2 2.2 4.8-5"/>

              </svg>

            </div>

            <b>
              Trikunt Assured
            </b>

          </div>
          `
          : ""
      );


    const count =
      1 +
      (
        product.cod_enabled
          ? 1
          : 0
      ) +
      (
        product.assured_enabled
          ? 1
          : 0
      );


    features.style.gridTemplateColumns =
      "repeat(" +
      count +
      ",1fr)";

  }


  /* Images */

  currentIndex = 0;


  const slider =
    document.getElementById(
      "slider"
    );


  slider.innerHTML =
    product.images
      .map(
        (url,i) => `

          <div class="slide">

            <img
              src="${escapeHtml(url)}"
              alt="${escapeHtml(product.title)}"
              loading="${
                i === 0
                  ? "eager"
                  : "lazy"
              }"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex'
              "
            >

            <div class="imgFallback">
              Image unavailable
            </div>

          </div>

        `
      )
      .join("");


  slider.scrollLeft = 0;


  slider.removeEventListener(
    "scroll",
    onSliderScroll
  );


  slider.addEventListener(
    "scroll",
    onSliderScroll,
    {
      passive:true
    }
  );


  const dots =
    document.getElementById(
      "dots"
    );


  const multi =
    product.images.length > 1;


  dots.innerHTML =
    multi
      ? product.images
          .map(
            (_,i) => `

              <button
                type="button"
                class="dot ${
                  i === 0
                    ? "active"
                    : ""
                }"
                onclick="goToImage(${i})"
                aria-label="Go to image ${
                  i+1
                }">
              </button>

            `
          )
          .join("")
      : "";


  dots.style.display =
    multi
      ? "flex"
      : "none";


  document
    .querySelectorAll(
      ".navBtn"
    )
    .forEach(
      b =>
        b.style.display =
          multi
            ? ""
            : "none"
    );


  updateNavState();


  /*
    NEW SECTIONS
  */

  renderHighlights();

  renderAllDetails();


  updateCart();

}


/* =====================================================
   IMAGE SLIDER
===================================================== */

function onSliderScroll(){

  const slider =
    document.getElementById(
      "slider"
    );

  const w =
    slider.clientWidth || 1;

  const idx =
    Math.round(
      slider.scrollLeft /
      w
    );


  if(
    idx !== currentIndex
  ){

    currentIndex =
      idx;

    product.image =
      product.images[
        currentIndex
      ] ||
      product.image;


    updateDots();

    updateNavState();

  }

}


function updateDots(){

  document
    .querySelectorAll(
      "#dots .dot"
    )
    .forEach(
      (d,i) =>
        d.classList.toggle(
          "active",
          i === currentIndex
        )
    );

}


function updateNavState(){

  const prev =
    document.querySelector(
      ".prevBtn"
    );

  const next =
    document.querySelector(
      ".nextBtn"
    );


  if(
    !prev ||
    !next ||
    !product
  ){
    return;
  }


  prev.disabled =
    currentIndex <= 0;


  next.disabled =
    currentIndex >=
    product.images.length - 1;
}


function goToImage(i){

  const slider =
    document.getElementById(
      "slider"
    );


  currentIndex =
    Math.max(
      0,
      Math.min(
        product.images.length - 1,
        i
      )
    );


  product.image =
    product.images[
      currentIndex
    ] ||
    product.image;


  slider.scrollTo({
    left:
      currentIndex *
      slider.clientWidth,

    behavior:"smooth"
  });


  updateDots();

  updateNavState();

}


function prevImage(){

  goToImage(
    currentIndex - 1
  );

}


function nextImage(){

  goToImage(
    currentIndex + 1
  );

}


/* =====================================================
   QUANTITY
===================================================== */

function changeQty(n){

  qty =
    Math.max(
      1,
      Math.min(
        product.stock || 99,
        qty + n
      )
    );


  document.getElementById(
    "qty"
  ).textContent =
    qty;


  /*
    IMPORTANT:
    Buy price DOES NOT multiply.
  */

  document.getElementById(
    "buyPrice"
  ).textContent =
    money(product.price);

}


/* =====================================================
   CART
===================================================== */

async function getUser(){

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();

  return (
    data.session?.user ||
    null
  );

}


async function addToCart(){

  if(!product) return;


  const user =
    await getUser();


  if(!user){

    toast(
      "Please login first"
    );

    setTimeout(
      () =>
        location.href =
          "/ecom/account.html",
      800
    );

    return;
  }


  const {
    data:old,
    error:readError
  } =
    await supabaseClient
      .from("cart_items")
      .select("id,qty")
      .eq(
        "user_id",
        user.id
      )
      .eq(
        "product_id",
        product.id
      )
      .maybeSingle();


  if(readError){

    toast(
      readError.message
    );

    return;
  }


  const newQty =
    (old?.qty || 0) +
    qty;


  const customizeInput =
    document.getElementById(
      "customizeInput"
    );


  const customizeText =
    product.customize_enabled
      ? (
          customizeInput?.value ||
          ""
        ).trim()
      : "";


  const row = {

    user_id:user.id,

    product_id:product.id,

    title:product.title,

    image:product.image,

    price:product.price,

    mrp:product.mrp,

    qty:newQty,

    customize_text:
      customizeText,

    updated_at:
      new Date().toISOString()

  };


  const {
    error
  } =
    await supabaseClient
      .from("cart_items")
      .upsert(
        row,
        {
          onConflict:
            "user_id,product_id"
        }
      );


  if(error){

    toast(
      error.message
    );

    return;
  }


  updateCart();

  toast(
    "✓ Added to Cart"
  );

}


async function updateCart(){

  const user =
    await getUser();


  if(!user){

    const cartBadge =
      document.getElementById(
        "cartCount"
      );

    if(cartBadge){
      cartBadge.textContent =
        "0";
    }

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("cart_items")
      .select("qty")
      .eq(
        "user_id",
        user.id
      );


  if(error){

    console.error(error);

    return;
  }


  const cartBadge =
    document.getElementById(
      "cartCount"
    );


  if(cartBadge){

    cartBadge.textContent =
      (data || [])
        .reduce(
          (s,x) =>
            s +
            (
              Number(x.qty) ||
              0
            ),
          0
        );

  }

}


/* =====================================================
   BUY NOW
===================================================== */

async function buyNow(){

  if(!product) return;


  const user =
    await getUser();


  if(!user){

    toast(
      "Please login first"
    );

    setTimeout(
      () =>
        location.href =
          "/ecom/account.html",
      800
    );

    return;
  }


  const customizeInput =
    document.getElementById(
      "customizeInput"
    );


  const customizeText =
    product.customize_enabled
      ? (
          customizeInput?.value ||
          ""
        ).trim()
      : "";


  sessionStorage.setItem(
    "checkoutItems",
    JSON.stringify([
      {
        id:product.id,
        title:product.title,
        image:product.image,
        price:product.price,
        mrp:product.mrp,
        qty:qty,
        product_id:product.id,
        customize_text:
          customizeText
      }
    ])
  );


  location.href =
    "/ecom/checkout.html?mode=buy";
}
