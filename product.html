<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Product | MyStore</title>
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --black:#111;
  --black2:#222;
  --text:#111827;
  --muted:#6b7280;
  --line:#e7e9ed;
  --bg:#f5f6f8;
  --green:#15803d;
  --green2:#16a34a;
  --orange:#ff9f00;
  --blue:#2874f0;
  --card:#fff;
  --shadow:0 10px 35px rgba(17,24,39,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}

.site{
  min-height:100vh;
  padding-bottom:30px;
}

/* TOP HEADER */
.topbar{
  height:72px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:22px;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:50;
}
.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
  white-space:nowrap;
}
.search{
  flex:1;
  max-width:820px;
  height:45px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#f8f8f9;
  padding:0 16px;
  outline:none;
  font-size:14px;
}
.search:focus{border-color:#111;background:#fff}
.cart-btn{
  margin-left:auto;
  height:44px;
  padding:0 18px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  height:20px;
  padding:0 6px;
  margin-left:5px;
  border-radius:20px;
  background:#fff;
  color:#111;
  font-size:11px;
}

/* PAGE */
.page{
  width:min(1440px,100%);
  margin:auto;
  padding:22px 4%;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  height:42px;
  padding:0 14px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  font-size:13px;
  font-weight:800;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
  margin-bottom:16px;
}

/* PRODUCT */
.product-shell{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.product-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(430px,.9fr);
  min-height:650px;
}

/* GALLERY */
.gallery{
  padding:30px;
  background:
    radial-gradient(circle at 50% 30%,#fff 0,#f8f9fb 58%,#f1f2f4 100%);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
}
.main-image-wrap{
  flex:1;
  min-height:500px;
  border-radius:20px;
  background:#fff;
  border:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
.main-image{
  width:100%;
  height:100%;
  min-height:500px;
  object-fit:contain;
  padding:35px;
  transition:transform .35s ease;
}
.main-image-wrap:hover .main-image{transform:scale(1.025)}
.image-fallback{
  display:none;
  text-align:center;
  color:#9ca3af;
  font-size:25px;
  font-weight:800;
}
.gallery-badge{
  position:absolute;
  top:18px;
  left:18px;
  z-index:2;
  background:#111;
  color:#fff;
  border-radius:8px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.4px;
}
.thumbs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-top:14px;
}
.thumb{
  width:72px;
  height:72px;
  flex:none;
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:5px;
  object-fit:contain;
}
.thumb.active{border:2px solid #111}

/* INFO */
.info{
  padding:38px 42px 34px;
  display:flex;
  flex-direction:column;
}
.tag{
  display:inline-flex;
  align-self:flex-start;
  background:#111;
  color:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800;
  margin-bottom:14px;
}
.title{
  margin:0;
  font-size:32px;
  line-height:1.18;
  letter-spacing:-1px;
  font-weight:800;
}
.rating-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:15px;
}
.rating{
  background:#15803d;
  color:#fff;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:800;
}
.reviews{font-size:12px;color:#6b7280;font-weight:600}
.price-box{
  margin-top:25px;
  padding-bottom:22px;
  border-bottom:1px solid var(--line);
}
.price{
  font-size:38px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1.5px;
}
.mrp{
  display:inline-block;
  margin-top:9px;
  color:#8b8f97;
  text-decoration:line-through;
  font-size:14px;
}
.off{
  color:#15803d;
  font-size:13px;
  font-weight:800;
  margin-left:8px;
}
.description{
  margin:22px 0 0;
  color:#4b5563;
  font-size:14px;
  line-height:1.75;
}
.stock{
  margin-top:18px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#15803d;
  font-size:13px;
  font-weight:800;
}
.stock-dot{
  width:9px;height:9px;border-radius:50%;background:#16a34a;
  box-shadow:0 0 0 5px #dcfce7;
}
.quantity{
  margin-top:20px;
  display:flex;
  align-items:center;
  gap:12px;
}
.quantity-label{font-size:13px;font-weight:800}
.qtybox{
  display:flex;
  height:40px;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
}
.qtybox button{
  width:40px;
  border:0;
  background:#f7f7f7;
  font-size:19px;
}
.qtybox span{
  width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
}
.highlights{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:22px;
}
.highlight{
  border:1px solid var(--line);
  background:#fafafa;
  border-radius:12px;
  padding:12px 8px;
  text-align:center;
  font-size:10px;
  color:#4b5563;
  line-height:1.4;
}
.highlight strong{display:block;color:#111;font-size:11px;margin-bottom:3px}

/* BOTTOM CTA INSIDE PRODUCT */
.cta{
  margin-top:auto;
  padding-top:25px;
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:12px;
}
.add{
  height:56px;
  border:1.5px solid #111;
  background:#fff;
  color:#111;
  border-radius:13px;
  font-size:14px;
  font-weight:800;
}
.buy{
  height:56px;
  border:0;
  background:linear-gradient(135deg,#ffb000,#ff8a00);
  color:#111;
  border-radius:13px;
  font-size:14px;
  font-weight:800;
  box-shadow:0 10px 22px rgba(255,153,0,.22);
}
.add:active,.buy:active{transform:scale(.98)}
.buy-price{font-weight:900}

/* LOWER DETAILS */
.details{
  margin-top:20px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}
.tabs{
  display:flex;
  border-bottom:1px solid var(--line);
  overflow:auto;
}
.tab{
  flex:none;
  padding:17px 22px;
  background:#fff;
  border:0;
  font-size:13px;
  font-weight:800;
  color:#6b7280;
}
.tab.active{color:#111;border-bottom:2px solid #111}
.detail-content{
  padding:24px;
  color:#4b5563;
  font-size:13px;
  line-height:1.8;
}
.specs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px 30px;
}
.spec{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:11px 0;
  border-bottom:1px solid #f0f1f3;
}
.spec b{color:#111}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:1000;
  background:#111;
  color:#fff;
  padding:13px 17px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  transition:.25s;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* LOADER */
.loading{
  min-height:650px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
}
.loader{
  width:42px;height:42px;border:4px solid #eee;border-top-color:#111;
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* MOBILE */
@media(max-width:900px){
  .topbar{height:62px;padding:0 14px;gap:10px}
  .logo{font-size:20px}
  .search{display:none}
  .cart-btn{height:40px;padding:0 13px}
  .page{padding:12px 10px 90px}
  .back{margin-bottom:10px}
  .product-shell{border-radius:17px}
  .product-grid{grid-template-columns:1fr;min-height:0}
  .gallery{padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .main-image-wrap{min-height:390px;border-radius:15px}
  .main-image{min-height:390px;padding:25px}
  .info{padding:22px 17px 18px}
  .title{font-size:24px;letter-spacing:-.7px}
  .price{font-size:32px}
  .highlights{grid-template-columns:repeat(3,1fr)}
  .cta{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:100;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    margin:0;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
    border-top:1px solid #ddd;
    box-shadow:0 -8px 25px rgba(0,0,0,.08);
  }
  .add,.buy{height:51px}
  .details{margin-top:14px}
}
@media(max-width:500px){
  .gallery{padding:8px}
  .main-image-wrap{min-height:330px}
  .main-image{min-height:330px;padding:20px}
  .tag{margin-bottom:10px}
  .title{font-size:21px}
  .rating-row{margin-top:11px}
  .price-box{margin-top:18px;padding-bottom:17px}
  .description{margin-top:17px;font-size:13px}
  .highlights{gap:6px;margin-top:17px}
  .highlight{padding:9px 5px;font-size:9px}
  .highlight strong{font-size:10px}
  .specs{grid-template-columns:1fr}
  .detail-content{padding:17px}
}
</style>
</head>

<body>

<div class="site">

  <header class="topbar">
    <a class="logo" href="/">MyStore</a>
    <input id="search" class="search" placeholder="Search products..." aria-label="Search">
    <button class="cart-btn" onclick="goCart()">🛒 Cart <span class="badge" id="cartCount">0</span></button>
  </header>

  <main class="page">

    <a class="back" href="javascript:history.back()">← Back</a>

    <div id="loading" class="loading">
      <div class="loader"></div>
    </div>

    <section id="productShell" class="product-shell" style="display:none">

      <div class="product-grid">

        <div class="gallery">

          <div class="main-image-wrap">
            <span id="badge" class="gallery-badge">BESTSELLER</span>

            <img id="mainImage" class="main-image" alt="Product">

            <div id="imageFallback" class="image-fallback">
              Product Image
            </div>
          </div>

          <div id="thumbs" class="thumbs"></div>

        </div>

        <div class="info">

          <span id="tag" class="tag">BESTSELLER</span>

          <h1 id="title" class="title">Product</h1>

          <div class="rating-row">
            <span id="rating" class="rating">★ 4.5</span>
            <span id="reviews" class="reviews">128 reviews</span>
          </div>

          <div class="price-box">
            <div id="price" class="price">₹149</div>
            <span id="mrp" class="mrp">₹999</span>
            <span id="off" class="off">85% OFF</span>
          </div>

          <p id="description" class="description">
            Premium quality product with great value and reliable performance.
          </p>

          <div class="stock">
            <span class="stock-dot"></span>
            <span id="stockText">In Stock</span>
          </div>

          <div class="quantity">
            <span class="quantity-label">Quantity</span>
            <div class="qtybox">
              <button onclick="changeQty(-1)">−</button>
              <span id="qty">1</span>
              <button onclick="changeQty(1)">+</button>
            </div>
          </div>

          <div class="highlights">
            <div class="highlight">
              <strong>🚚 Fast Delivery</strong>
              Quick dispatch
            </div>
            <div class="highlight">
              <strong>🔒 Secure</strong>
              Safe checkout
            </div>
            <div class="highlight">
              <strong>✓ Genuine</strong>
              Quality assured
            </div>
          </div>

          <div class="cta">
            <button class="add" onclick="addToCart()">🛒 Add to Cart</button>
            <button class="buy" onclick="buyNow()">⚡ Buy at <span class="buy-price" id="buyPrice">₹149</span></button>
          </div>

        </div>

      </div>

    </section>

    <section id="details" class="details" style="display:none">

      <div class="tabs">
        <button class="tab active" onclick="showTab('about',this)">About</button>
        <button class="tab" onclick="showTab('specs',this)">Specifications</button>
        <button class="tab" onclick="showTab('delivery',this)">Delivery & Returns</button>
      </div>

      <div id="tabContent" class="detail-content"></div>

    </section>

  </main>

</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   SUPABASE
========================================================= */

/* =========================================
   SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL =
  "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let product = null;
let quantity = 1;
let cartLocal = [];

/* =========================================================
   HELPERS
========================================================= */

function money(v){
  const n = Number(v) || 0;
  return "₹" + Math.round(n).toLocaleString("en-IN");
}

function cleanPrice(v){
  if(typeof v === "number") return v;
  const m = String(v ?? "").match(/([0-9,]+(?:\.[0-9]+)?)/);
  return m ? Number(m[1].replace(/,/g,"")) : 0;
}

function escapeHtml(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove("show"),2200);
}

function getProductId(){
  const p = new URLSearchParams(location.search);
  return p.get("id");
}

/* =========================================================
   PRODUCT FIELD COMPATIBILITY
========================================================= */

function first(obj, keys, fallback=""){
  for(const key of keys){
    if(obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== ""){
      return obj[key];
    }
  }
  return fallback;
}

function normalizeProduct(row){

  const sell = cleanPrice(
    first(row,["price","selling_price","sale_price","offer_price"],149)
  );

  const mrp = cleanPrice(
    first(row,["mrp","original_price","old_price","compare_at_price"],0)
  );

  return {
    id: row.id,

    title: first(row,[
      "title","name","product_name"
    ],"Premium Product"),

    image: first(row,[
      "image","image_url","thumbnail","product_image"
    ],""),

    images: first(row,[
      "images","gallery","image_urls"
    ],null),

    price: sell || 149,

    mrp: mrp > sell ? mrp : Math.max(sell * 2, sell),

    description: first(row,[
      "description","short_description","details"
    ],"Premium quality product with great value and reliable performance."),

    rating: first(row,[
      "rating","avg_rating"
    ],4.5),

    reviews: first(row,[
      "reviews","review_count"
    ],128),

    stock: Number(first(row,[
      "stock","inventory","available_stock"
    ],50)),

    category: first(row,[
      "category","category_name"
    ],""),

    badge: first(row,[
      "badge","label"
    ],"BESTSELLER"),

    url: first(row,[
      "product_url","url"
    ],location.href)
  };
}

/* =========================================================
   LOAD PRODUCT
========================================================= */

async function loadProduct(){

  const id = getProductId();

  if(!id){
    showError("Product ID missing.");
    return;
  }

  try{

    const {data,error} = await sb
      .from("products")
      .select("*")
      .eq("id",id)
      .single();

    if(error) throw error;

    product = normalizeProduct(data);

    renderProduct();

  }catch(error){

    console.error(error);

    showError(
      "Product load nahi ho paya. Product ID ya Supabase products table check karein."
    );
  }
}

function showError(msg){

  document.getElementById("loading").innerHTML = `
    <div style="text-align:center;padding:30px">
      <div style="font-size:45px">😕</div>
      <h2 style="margin:12px 0 6px">Product not found</h2>
      <p style="color:#6b7280;font-size:13px">${escapeHtml(msg)}</p>
      <a href="/" class="back" style="margin-top:15px">Continue Shopping</a>
    </div>
  `;
}

/* =========================================================
   RENDER
========================================================= */

function renderProduct(){

  document.title =
    product.title + " | MyStore";

  document.getElementById("loading").style.display = "none";
  document.getElementById("productShell").style.display = "block";
  document.getElementById("details").style.display = "block";

  document.getElementById("title").textContent = product.title;
  document.getElementById("price").textContent = money(product.price);
  document.getElementById("buyPrice").textContent = money(product.price);

  document.getElementById("mrp").textContent =
    product.mrp > product.price
      ? money(product.mrp)
      : "";

  const discount =
    product.mrp > product.price
      ? Math.round((1 - product.price/product.mrp) * 100)
      : 0;

  document.getElementById("off").textContent =
    discount ? discount + "% OFF" : "";

  document.getElementById("description").textContent =
    product.description;

  document.getElementById("rating").textContent =
    "★ " + product.rating;

  document.getElementById("reviews").textContent =
    product.reviews + " reviews";

  document.getElementById("tag").textContent =
    product.badge || "BESTSELLER";

  document.getElementById("badge").textContent =
    product.badge || "BESTSELLER";

  document.getElementById("stockText").textContent =
    product.stock > 0
      ? `In Stock (${product.stock} available)`
      : "Out of Stock";

  if(product.stock <= 0){
    document.querySelector(".buy").disabled = true;
    document.querySelector(".add").disabled = true;
    document.querySelector(".buy").style.opacity = ".55";
    document.querySelector(".add").style.opacity = ".55";
  }

  const main =
    document.getElementById("mainImage");

  main.src = product.image;

  main.onerror = function(){
    this.style.display = "none";
    document.getElementById("imageFallback").style.display = "block";
  };

  renderThumbs();
  showTab("about",document.querySelector(".tab.active"));
}

/* =========================================================
   THUMBNAILS
========================================================= */

function parseImages(){

  const list = [];

  if(product.image) list.push(product.image);

  let extra = product.images;

  if(typeof extra === "string"){
    try{
      extra = JSON.parse(extra);
    }catch{
      extra = extra.split(",").map(x=>x.trim());
    }
  }

  if(Array.isArray(extra)){
    extra.forEach(x=>{
      if(typeof x === "string" && x && !list.includes(x)){
        list.push(x);
      }
    });
  }

  return list.slice(0,6);
}

function renderThumbs(){

  const images = parseImages();

  const box = document.getElementById("thumbs");

  if(images.length <= 1){
    box.style.display = "none";
    return;
  }

  box.innerHTML = images.map((src,i)=>`
    <img
      class="thumb ${i===0 ? "active":""}"
      src="${escapeHtml(src)}"
      onclick="selectImage('${escapeHtml(src)}',this)"
      onerror="this.style.display='none'"
      alt="">
  `).join("");
}

window.selectImage = function(src,el){

  document.getElementById("mainImage").src = src;

  document.querySelectorAll(".thumb")
    .forEach(x=>x.classList.remove("active"));

  if(el) el.classList.add("active");
};

/* =========================================================
   QUANTITY
========================================================= */

window.changeQty = function(delta){

  const max =
    Math.max(
      1,
      Number(product?.stock || 99)
    );

  quantity =
    Math.max(
      1,
      Math.min(max,quantity + delta)
    );

  document.getElementById("qty").textContent =
    quantity;

  document.getElementById("buyPrice").textContent =
    money(product.price * quantity);
};

/* =========================================================
   LOCAL CART
   Works now even before cart_items SQL exists.
========================================================= */

function readLocalCart(){

  try{
    return JSON.parse(
      localStorage.getItem("mystore_cart") || "[]"
    );
  }catch{
    return [];
  }
}

function writeLocalCart(cart){

  localStorage.setItem(
    "mystore_cart",
    JSON.stringify(cart)
  );

  updateCartCount();
}

function updateCartCount(){

  cartLocal = readLocalCart();

  const count =
    cartLocal.reduce(
      (sum,item)=>sum + (Number(item.qty)||1),
      0
    );

  document.getElementById("cartCount").textContent =
    count;
}

/* =========================================================
   ADD TO CART
========================================================= */

window.addToCart = async function(){

  if(!product) return;

  cartLocal = readLocalCart();

  const existing =
    cartLocal.find(
      item => String(item.id) === String(product.id)
    );

  if(existing){
    existing.qty =
      Number(existing.qty || 1) + quantity;
  }else{
    cartLocal.push({
      id:product.id,
      title:product.title,
      image:product.image,
      price:product.price,
      mrp:product.mrp,
      qty:quantity,
      product_url:
        location.pathname + location.search
    });
  }

  writeLocalCart(cartLocal);

  toast("✓ Added to Cart");

  /*
   * Future:
   * Once cart_items table is created,
   * this same button will sync to Supabase.
   */
};

/* =========================================================
   BUY NOW
========================================================= */

window.buyNow = function(){

  if(!product) return;

  const item = {
    id:product.id,
    title:product.title,
    image:product.image,
    price:product.price,
    mrp:product.mrp,
    qty:quantity,
    product_url:
      location.pathname + location.search
  };

  /*
   * Checkout already supports:
   * /checkout.html?mode=buy
   *
   * So Buy Now goes directly to checkout.
   */

  sessionStorage.setItem(
    "checkoutItems",
    JSON.stringify([item])
  );

  window.location.href =
    "/ecom/checkout.html?mode=buy";
};

/* =========================================================
   CART
========================================================= */

window.goCart = function(){

  /*
   * Change this URL if your cart page has
   * another path.
   */

  window.location.href =
    "/ecom/cart.html";
};

/* =========================================================
   DETAILS TABS
========================================================= */

window.showTab = function(type,button){

  document.querySelectorAll(".tab")
    .forEach(t=>t.classList.remove("active"));

  if(button) button.classList.add("active");

  const content =
    document.getElementById("tabContent");

  if(type === "about"){

    content.innerHTML = `
      <h3 style="margin:0 0 10px;color:#111">
        ${escapeHtml(product.title)}
      </h3>
      <p>${escapeHtml(product.description)}</p>
      <p>
        Designed for a smooth shopping experience with
        reliable quality, secure checkout and convenient delivery.
      </p>
    `;

  }else if(type === "specs"){

    content.innerHTML = `
      <div class="specs">
        <div class="spec"><span>Category</span><b>${escapeHtml(product.category || "—")}</b></div>
        <div class="spec"><span>Rating</span><b>★ ${escapeHtml(product.rating)}</b></div>
        <div class="spec"><span>Reviews</span><b>${escapeHtml(product.reviews)}</b></div>
        <div class="spec"><span>Availability</span><b>${product.stock > 0 ? "In Stock" : "Out of Stock"}</b></div>
        <div class="spec"><span>Product ID</span><b>${escapeHtml(product.id)}</b></div>
        <div class="spec"><span>Payment</span><b>COD available</b></div>
      </div>
    `;

  }else{

    content.innerHTML = `
      <p><b style="color:#111">Delivery:</b> Product will be dispatched after order confirmation.</p>
      <p><b style="color:#111">Payment:</b> Cash on Delivery is available.</p>
      <p><b style="color:#111">Returns:</b> Return/replacement policy will be shown according to the product.</p>
    `;
  }
};

/* =========================================================
   SEARCH
========================================================= */

document.getElementById("search")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter" && this.value.trim()){

      window.location.href =
        "/ecom/index.html?search=" +
        encodeURIComponent(this.value.trim());

    }

  });

/* =========================================================
   INIT
========================================================= */

updateCartCount();
loadProduct();

</script>
