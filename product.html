<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | MyStore</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111;
}

button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.page{
  width:min(1450px,100%);
  margin:auto;
  padding:22px 4%;
}

.product{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 40px #0000000d;
}

.grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  min-height:650px;
  align-items:start;
}

.gallery{
  padding:28px;
  background:linear-gradient(145deg,#fff,#f1f3f5);
  border-right:1px solid #eee;
}

/* ================= IMAGE SLIDER ================= */

.main{
  height:550px;
  background:#fff;
  border:1px solid #eee;
  border-radius:20px;
  position:relative;
  overflow:hidden;
}

.pill{
  position:absolute;
  top:16px;
  left:16px;
  background:#111;
  color:#fff;
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  z-index:6;
  letter-spacing:.3px;
}

.slider{
  display:flex;
  height:100%;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.slider::-webkit-scrollbar{
  display:none;
}

.slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.slide img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  padding:35px;
  min-width:0;
  min-height:0;
}

.imgFallback{
  display:none;
  align-items:center;
  justify-content:center;
  height:100%;
  width:100%;
  color:#777;
  font-size:13px;
  position:absolute;
  inset:0;
}

.navBtn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid #ddd;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 14px #0000001f;
  z-index:6;
  color:#111;
  transition:box-shadow .15s,transform .15s;
}

.navBtn:hover:not(:disabled){
  box-shadow:0 6px 18px #00000029;
  transform:translateY(-50%) scale(1.05);
}

.navBtn:disabled{
  opacity:.35;
  cursor:default;
}

.prevBtn{left:14px}
.nextBtn{right:14px}

.dots{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:14px 0 2px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#d9d9d9;
  border:0;
  padding:0;
  cursor:pointer;
}

.dot.active{
  background:#111;
  width:20px;
  border-radius:5px;
  transition:width .2s,background .2s;
}

/* ================= PRODUCT INFO ================= */

.info{
  padding:38px 42px;
  display:flex;
  flex-direction:column;
}

.tag{
  align-self:flex-start;
  background:#111;
  color:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.3px;
}

.title{
  font-size:29px;
  line-height:1.3;
  margin:14px 0 0;
  font-weight:700;
  color:#1a1a1a;
}

.rating{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:15px;
}

.rate{
  background:#15803d;
  color:#fff;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:3px;
}

.reviews{
  color:#6b7280;
  font-size:12px;
}

.pricebox{
  margin-top:24px;
  padding-bottom:20px;
  border-bottom:1px solid #eee;
}

.price{
  font-size:33px;
  font-weight:800;
  letter-spacing:-.5px;
}

.mrp{
  text-decoration:line-through;
  color:#888;
  font-size:14px;
}

.off{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-left:8px;
}

.desc{
  display:none!important;
}

.stock{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:6px;
}

/* ================= QUANTITY ================= */

.qtyrow{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  margin-top:14px;
  font-size:12px;
  font-weight:800;
  min-height:34px;
}

.qty{
  display:flex;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  height:34px;
}

.qty button{
  width:32px;
  border:0;
  background:#f7f7f7;
  font-size:13px;
}

.qty span{
  width:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* ================= DELIVERY ================= */

.deliveryDetails{
  margin-top:24px;
}

.deliveryTitle{
  font-size:18px;
  font-weight:800;
  margin-bottom:11px;
  color:#111;
  letter-spacing:-.2px;
}

.deliveryCard{
  border-radius:16px;
  overflow:hidden;
  border:1px solid #e3e7ed;
  background:#fff;
  box-shadow:0 8px 24px rgba(20,30,45,.07);
}

.deliveryAddress{
  display:flex;
  align-items:center;
  cursor:pointer;
  gap:11px;
  background:linear-gradient(180deg,#f4f8ff,#eef5ff);
  padding:13px 14px;
  min-height:50px;
}

.deliveryIcon{
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 26px;
  color:#111;
}

.deliveryIcon svg{
  width:22px;
  height:22px;
  display:block;
  stroke:currentColor;
}

.deliveryAddressText{
  flex:1 1 auto;
  min-width:0;
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#20242b;
  line-height:1.2;
  font-size:12px;
  font-weight:700;
  display:block;
}

.deliveryArrow{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  flex:0 0 24px;
}

.deliveryArrow svg{
  width:18px;
  height:18px;
  stroke:currentColor;
}

.deliveryDate{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  background:#fafafa;
  border-top:1px solid #edf0f3;
  font-size:12px;
  font-weight:800;
  color:#20242b;
}

.deliverySeller{
  padding:12px 14px 13px;
  background:#fafafa;
  border-top:1px solid #edf0f3;
}

.sellerMain{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:800;
  color:#20242b;
}

.sellerMain svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  flex:0 0 20px;
}

.sellerSub{
  font-size:10px;
  color:#747b85;
  margin:4px 0 0 28px;
}

.sellerLink{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin:6px 0 0 28px;
  color:#1769d5;
  font-size:11px;
  font-weight:800;
}

/* ================= FEATURE BOXES ================= */

.features{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin-top:22px;
}

.feature{
  text-align:center;
  border:1px solid #e4e7eb;
  border-radius:15px;
  background:linear-gradient(180deg,#fff,#fbfcfd);
  padding:8px 2px 7px;
  font-size:8px;
  min-width:0;
  color:#69717c;
  min-height:68px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 16px rgba(20,30,45,.045);
}

.featureIcon{
  width:26px;
  height:26px;
  border-radius:8px;
  background:#f3f6fa;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:5px;
  color:#1d4ed8;
}

.featureIcon svg{
  width:16px;
  height:16px;
  stroke:currentColor;
}

.feature b{
  display:block;
  color:#20242b;
  font-size:8px;
  line-height:1.15;
  margin:0;
  white-space:nowrap;
}

/* Desktop: keep all 3 feature boxes in one row */
@media(min-width:901px){
  .features{
    display:flex!important;
    flex-wrap:nowrap!important;
    gap:7px;
  }
  .features .feature{
    flex:1 1 0!important;
    width:0!important;
    min-width:0!important;
  }
}

/* ================= CUSTOMIZE ================= */

#customizeWrap{
  display:none;
  align-items:center;
  gap:7px;
  margin-left:4px;
}

#customizeInput{
  width:125px;
  height:40px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:0 10px;
  outline:none;
  background:#fff;
}

/* =========================================================
   FLIPKART STYLE PRODUCT HIGHLIGHTS + ALL DETAILS
   NO CARD
========================================================= */

.productSections{
  margin-top:25px;
  width:100%;
  background:#fff;
  grid-column:1;
  grid-row:2;
  padding:0 28px 28px;
}

/* Laptop/Desktop: details below the image on the left. */
.gallery{
  grid-column:1;
  grid-row:1;
}

.info{
  grid-column:2;
  grid-row:1 / span 2;
}

/* main section */

.cleanSection{
  width:100%;
  border-top:1px solid #e5e7eb;
  background:#fff;
}

.cleanSection:last-child{
  border-bottom:1px solid #e5e7eb;
}

.cleanSectionHeader{
  width:100%;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px 0;
  cursor:pointer;
  user-select:none;
}

.cleanSectionHeaderLeft{
  min-width:0;
}

.cleanSectionTitle{
  margin:0;
  font-size:20px;
  line-height:1.25;
  font-weight:800;
  color:#212121;
}

.cleanSectionSubtitle{
  margin-top:6px;
  color:#707070;
  font-size:13px;
  line-height:1.3;
}

.cleanArrow{
  width:34px;
  height:34px;
  min-width:34px;
  border:0;
  border-radius:9px;
  background:#f5f6f7;
  color:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .2s,background .2s;
}

.cleanArrow:hover{
  background:#eceeef;
}

.cleanArrow svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  transition:transform .2s;
}

.cleanSection.open .cleanArrow svg{
  transform:rotate(180deg);
}

/* content */

.cleanSectionBody{
  display:none;
  padding:0 0 18px;
}

.cleanSection.open .cleanSectionBody{
  display:block;
}

/* ================= HIGHLIGHTS ================= */

.highlightList{
  width:100%;
  border-top:1px solid #e5e5e5;
}

.highlightRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  min-height:62px;
  padding:12px 0;
  border-bottom:1px solid #e5e5e5;
  align-items:center;
}

.highlightItem{
  min-width:0;
}

.highlightLabel{
  display:block;
  color:#777;
  font-size:12px;
  line-height:1.3;
  margin-bottom:4px;
}

.highlightValue{
  display:block;
  color:#212121;
  font-size:14px;
  line-height:1.35;
  font-weight:700;
  word-break:break-word;
}

/* ================= ALL DETAILS ================= */

.detailsTabs{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 0 15px;
  border-bottom:1px solid #e5e5e5;
  overflow-x:auto;
  scrollbar-width:none;
}

.detailsTabs::-webkit-scrollbar{
  display:none;
}

.detailsTab{
  flex:0 0 auto;
  border:1px solid #d7d9dc;
  background:#fff;
  color:#444;
  border-radius:8px;
  padding:9px 14px;
  font-size:14px;
  line-height:1;
  white-space:nowrap;
}

.detailsTab.active{
  background:#111;
  color:#fff;
  border-color:#111;
  font-weight:800;
}

.detailsPanel{
  display:none;
  padding-top:18px;
}

.detailsPanel.active{
  display:block;
}

.detailGroup{
  margin-bottom:28px;
}

.detailGroup:last-child{
  margin-bottom:0;
}

.detailGroupTitle{
  font-size:16px;
  font-weight:800;
  color:#333;
  margin:0 0 9px;
}

.detailGrid{
  width:100%;
}

.detailRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  min-height:57px;
  padding:11px 0;
  border-bottom:1px solid #e5e5e5;
  align-items:center;
}

.detailLabel{
  color:#777;
  font-size:13px;
  line-height:1.3;
}

.detailValue{
  color:#333;
  font-size:14px;
  line-height:1.35;
  word-break:break-word;
}

.descriptionPanel{
  color:#444;
  font-size:14px;
  line-height:1.75;
  white-space:pre-line;
}

.manufacturerBox{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 25px;
}

/* ================= OLD DETAILS HIDDEN ================= */

/*
   Old bottom About/Specifications/Delivery card is not used.
   Product Highlights + All details are now the only details section.
*/
#details{
  display:none!important;
}

/* ================= CTA ================= */

.cta{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:10px;
  margin-top:auto;
  padding-top:24px;
}

.add,.buy{
  height:56px;
  border-radius:14px;
  font-weight:800;
  font-size:14px;
  transition:transform .12s,box-shadow .12s,background .15s;
}

.add{
  background:#fff;
  border:1px solid #d9dde3;
  box-shadow:0 5px 16px rgba(20,30,45,.05);
}

.add:hover{
  background:#f8fafc;
  box-shadow:0 8px 22px rgba(20,30,45,.08);
}

.add:active,.buy:active{
  transform:scale(.98);
}

.buy{
  background:linear-gradient(135deg,#ffbd19,#ff9800);
  border:0;
  box-shadow:0 8px 22px rgba(255,152,0,.28);
  color:#1a1a1a;
}

.cta svg{
  width:18px;
  height:18px;
  vertical-align:-4px;
  margin-right:5px;
  stroke:currentColor;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  #customizeWrap{
    margin-left:0!important;
    flex:1;
    min-width:0;
  }

  #customizeWrap input{
    width:100%!important;
    max-width:135px;
    height:34px!important;
  }

  #customizeWrap label{
    font-size:10px!important;
  }

  .qtyrow{
    gap:6px;
    margin-top:12px;
    font-size:11px;
    min-height:32px;
  }

  .qty{
    height:32px;
    border-radius:8px;
  }

  .qty button{
    width:29px;
    font-size:12px;
  }

  .qty span{
    width:30px;
    font-size:11px;
  }

  .deliveryDetails{
    margin-top:18px;
  }

  .deliveryTitle{
    font-size:15px;
    margin-bottom:8px;
  }

  .deliveryAddress{
    padding:10px 10px;
    font-size:10px;
    min-height:43px;
  }

  .deliveryDate{
    padding:10px;
    font-size:10px;
  }

  .deliverySeller{
    padding:10px;
  }

  .sellerMain{
    font-size:10px;
  }

  .sellerSub{
    font-size:8.5px;
    margin-left:27px;
  }

  .sellerLink{
    font-size:9px;
    margin:5px 0 0 27px;
  }

  .deliveryIcon{
    width:23px;
    height:23px;
    flex-basis:23px;
  }

  .deliveryIcon svg{
    width:19px;
    height:19px;
  }

  .deliveryAddressText{
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
    max-width:100%;
  }

  .deliveryArrow{
    width:21px;
    flex-basis:21px;
  }

  .deliveryArrow svg{
    width:16px;
    height:16px;
  }

  .features{
    gap:7px;
    margin-top:16px;
  }

  .feature{
    min-height:68px;
    padding:8px 3px;
  }

  .featureIcon{
    width:27px;
    height:27px;
    border-radius:9px;
    margin-bottom:5px;
  }

  .featureIcon svg{
    width:17px;
    height:17px;
  }

  .feature b{
    font-size:8.5px;
  }

  .page{
    padding:12px 9px 90px;
  }

  .product{
    border-radius:17px;
  }

  .grid{
    grid-template-columns:1fr;
    display:flex;
    flex-direction:column;
  }

  .gallery{
    order:1;
    padding:9px 0;
    border-right:0;
    border-bottom:1px solid #eee;
    width:100%;
  }

  .info{
    order:2;
    grid-column:auto;
    grid-row:auto;
    width:100%;
  }

  .productSections{
    order:3;
    grid-column:auto;
    grid-row:auto;
    width:100%;
    padding:0;
  }

  .main{
    height:340px;
    border:0;
    background:transparent;
    border-radius:0;
    box-shadow:none;
  }

  .slide img{
    padding:10px;
  }

  .navBtn{
    display:none!important;
  }

  .info{
    padding:20px 16px;
  }

  .title{
    font-size:19px;
    line-height:1.35;
    margin-top:10px;
  }

  .price{
    font-size:26px;
  }

  .mrp{
    font-size:12px;
  }

  .off{
    font-size:12px;
  }

  .rate{
    font-size:11px;
  }

  .reviews{
    font-size:11px;
  }

  /* screenshot-like mobile highlights/details */

  .productSections{
    margin-top:22px;
  }

  .cleanSectionHeader{
    min-height:70px;
    padding:13px 0;
  }

  .cleanSectionTitle{
    font-size:19px;
  }

  .cleanSectionSubtitle{
    font-size:12px;
    margin-top:5px;
  }

  .cleanArrow{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:9px;
  }

  .highlightRow{
    grid-template-columns:1fr 1fr;
    gap:22px;
    min-height:61px;
    padding:11px 0;
  }

  .highlightLabel{
    font-size:12px;
    margin-bottom:3px;
  }

  .highlightValue{
    font-size:14px;
  }

  .detailsTabs{
    gap:7px;
    padding-bottom:14px;
  }

  .detailsTab{
    font-size:13px;
    padding:9px 13px;
    border-radius:8px;
  }

  .detailGroup{
    margin-bottom:25px;
  }

  .detailGroupTitle{
    font-size:16px;
    margin-bottom:8px;
  }

  .detailRow{
    grid-template-columns:1fr 1fr;
    gap:20px;
    min-height:56px;
    padding:10px 0;
  }

  .detailLabel{
    font-size:12px;
  }

  .detailValue{
    font-size:13px;
  }

  .descriptionPanel{
    font-size:13px;
    line-height:1.7;
  }

  .manufacturerBox{
    grid-template-columns:1fr 1fr;
    gap:0 20px;
  }

  .cta{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    background:#fff;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    margin:0;
    border-top:1px solid #ddd;
    box-shadow:0 -6px 20px #0000000f;
  }

  .add,.buy{
    height:51px;
  }
}

@media(max-width:420px){

  .cleanSectionTitle{
    font-size:18px;
  }

  .cleanSectionSubtitle{
    font-size:11px;
  }

  .highlightRow,
  .detailRow{
    gap:14px;
  }

  .highlightLabel{
    font-size:11px;

<script>

const SUPABASE_URL="https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let product=null;
let qty=1;
let currentIndex=0;

const cameFromIndexLoader =
  Boolean(
    new URLSearchParams(
      window.location.search
    ).get("navt")
  );



const money=n=>
"₹"+Math.round(Number(n)||0).toLocaleString("en-IN");

const id=()=>
new URLSearchParams(location.search).get("id");

function v(o,ks,d=""){
  for(const k of ks){
    if(o[k]!=null && o[k]!=="")
      return o[k];
  }
  return d;
}

function num(v){
  const m=String(v??"").match(/[0-9,]+(?:\.[0-9]+)?/);
  return m?Number(m[0].replace(/,/g,"")):0;
}

function toast(x){
  const t=document.getElementById("toast");
  t.textContent=x;
  t.classList.add("show");

  clearTimeout(window.tt);

  window.tt=setTimeout(
    ()=>t.classList.remove("show"),
    2200
  );
}

function escapeHtml(value){
  const s=String(value??"");

  return s.replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}


/* =========================================================
   JSON / ARRAY HELPERS
========================================================= */

function parseJSON(value,fallback=null){

  if(value==null || value==="")
    return fallback;

  if(typeof value==="object")
    return value;

  try{
    return JSON.parse(value);
  }catch{
    return fallback;
  }
}

function cleanPart(v){
  return v==null ? "" : String(v).trim();
}

function uniqueParts(arr){

  const out=[];

  for(const x of arr){

    const s=cleanPart(x);

    if(
      s &&
      !out.some(
        y=>y.toLowerCase()===s.toLowerCase()
      )
    ){
      out.push(s);
    }

  }

  return out;
}


/* =========================================================
   ADDRESS
========================================================= */

function formatSavedAddress(a){

  if(!a) return "";

  if(typeof a==="string")
    return a.trim();

  const village=cleanPart(
    a.village ||
    a.locality ||
    a.area ||
    a.town ||
    a.place ||
    ""
  );

  const district=cleanPart(
    a.district ||
    a.district_name ||
    ""
  );

  const city=cleanPart(
    a.city ||
    a.city_name ||
    ""
  );

  const state=cleanPart(
    a.state ||
    a.state_name ||
    ""
  );

  const pincode=cleanPart(
    a.pincode ||
    a.pin ||
    a.postal_code ||
    a.postcode ||
    ""
  );

  const plus=cleanPart(
    a.plus_code ||
    a.plusCode ||
    a.pluscode ||
    a.plus_code_address ||
    ""
  );

  const direct=cleanPart(
    a.full_address ||
    a.fullAddress ||
    a.formatted_address ||
    a.formattedAddress
  );

  const first=
    uniqueParts([village,district])
    .join(", ");

  const second=
    uniqueParts([state,pincode])
    .join(", ");

  const lines=[
    first,
    second,
    plus
  ].filter(Boolean);

  if(lines.length)
    return lines.join("\n");

  const fallback=
    uniqueParts([city,state,pincode])
    .join(", ");

  return fallback || direct;
}

function addressCacheKey(userId){
  return "mystore_delivery_address_cache_v3_"+
    String(userId||"guest");
}

function cacheAddress(
  userId,
  addressObject,
  formatted
){

  try{

    const payload={
      savedAt:Date.now(),
      text:
        formatted ||
        formatSavedAddress(addressObject),
      data:addressObject||null
    };

    localStorage.setItem(
      addressCacheKey(userId),
      JSON.stringify(payload)
    );

  }catch(e){
    console.warn("Address cache error",e);
  }
}

function readCachedAddress(userId){

  try{

    const raw=
      localStorage.getItem(
        addressCacheKey(userId)
      );

    if(!raw) return "";

    const x=JSON.parse(raw);

    return cleanPart(x?.text) ||
      formatSavedAddress(x?.data);

  }catch(e){
    return "";
  }
}

function paintAddress(text){

  const el=
    document.getElementById(
      "deliveryAddressText"
    );

  if(!el) return;

  const value=cleanPart(text);

  if(!value){

    el.textContent=
      "Add delivery address";

    return;
  }

  el.textContent=
    value
      .replace(/\s*\n\s*/g," ")
      .replace(/\s+/g," ")
      .trim();
}

function looksLikeAddressObject(x){

  if(
    !x ||
    typeof x!=="object" ||
    Array.isArray(x)
  )
    return false;

  const keys=
    Object.keys(x)
      .map(k=>k.toLowerCase());

  return keys.some(k=>[
    "village",
    "district",
    "state",
    "pincode",
    "pin",
    "postal_code",
    "plus_code",
    "full_address",
    "fulladdress",
    "formatted_address",
    "address",
    "locality"
  ].includes(k));
}

function scanLocalStorageForAddress(){

  const preferred=[
    "selectedAddress",
    "selected_address",
    "savedAddress",
    "saved_address",
    "savedAddresses",
    "saved_addresses",
    "deliveryAddress",
    "delivery_address",
    "currentAddress",
    "current_address",
    "userAddress",
    "user_address",
    "address",
    "addresses"
  ];

  const keys=[];

  for(const k of preferred)
    if(!keys.includes(k))
      keys.push(k);

  try{

    for(let i=0;i<localStorage.length;i++){

      const k=localStorage.key(i);

      if(k && !keys.includes(k))
        keys.push(k);
    }

  }catch(e){}

  for(const key of keys){

    try{

      const raw=localStorage.getItem(key);

      if(!raw) continue;

      let value;

      try{
        value=JSON.parse(raw);
      }catch{
        value=raw;
      }

      const candidates=[];

      if(Array.isArray(value))
        candidates.push(...value);
      else
        candidates.push(value);

      for(const item of candidates){

        if(typeof item==="string"){

          const t=item.trim();

          if(
            t &&
            /(\d{5,6}|uttar|pradesh|district|village|plus)/i.test(t)
          )
            return t;

        }else if(
          looksLikeAddressObject(item)
        ){

          const t=
            formatSavedAddress(item);

          if(t) return t;
        }

      }

    }catch(e){}
  }

  return "";
}

async function getCurrentUser(){

  try{

    const {data,error}=
      await supabaseClient.auth.getSession();

    if(error) return null;

    return data?.session?.user||null;

  }catch(e){

    return null;

  }
}

async function readAddressTable(
  table,
  userId
){

  try{

    const {data,error}=
      await supabaseClient
        .from(table)
        .select("*")
        .eq("user_id",userId)
        .order("created_at",{ascending:false})
        .limit(20);

    if(
      error ||
      !Array.isArray(data) ||
      !data.length
    )
      return null;

    const preferred=
      data.find(a=>
        a?.is_current_location===true ||
        a?.isCurrentLocation===true ||
        a?.is_current===true ||
        a?.selected===true ||
        a?.is_selected===true ||
        String(a?.type||"")
          .toLowerCase()
          .includes("current")
      ) || data[0];

    const text=
      formatSavedAddress(preferred);

    if(text)
      return {
        data:preferred,
        text
      };

  }catch(e){}

  return null;
}

async function loadDeliveryAddress(){

  const user=
    await getCurrentUser();

  if(user){

    const cached=
      readCachedAddress(user.id);

    if(cached)
      paintAddress(cached);
  }

  const local=
    scanLocalStorageForAddress();

  if(
    local &&
    (!user ||
    !readCachedAddress(user.id))
  )
    paintAddress(local);

  if(user){

    const tables=[
      "saved_addresses",
      "addresses",
      "user_addresses",
      "delivery_addresses"
    ];

    for(const table of tables){

      const result=
        await readAddressTable(
          table,
          user.id
        );

      if(result){

        cacheAddress(
          user.id,
          result.data,
          result.text
        );

        paintAddress(result.text);

        return;
      }
    }
  }

  const current=
    document.getElementById(
      "deliveryAddressText"
    );

  if(
    current &&
    !current.textContent.trim()
  )
    current.textContent=
      "Add delivery address";
}

function openAddressSelector(){

  try{

    const target=
      localStorage.getItem(
        "addressSelectorUrl"
      );

    if(target){
      navigateWithProductLoader(target);
      return;
    }

  }catch{}

  navigateWithProductLoader("/ecom/checkout.html");
}

function getDeliveryDate(){

  const d=new Date();

  d.setHours(0,0,0,0);

  d.setDate(d.getDate()+5);

  return d.toLocaleDateString(
    "en-IN",
    {
      day:"numeric",
      month:"short",
      weekday:"short"
    }
  );
}

async function renderDeliveryDetails(){

  const date=
    document.getElementById(
      "deliveryDateText"
    );

  if(date)
    date.textContent=
      "Delivery by "+getDeliveryDate();

  await loadDeliveryAddress();
}


/* =========================================================
   HIGHLIGHTS DATA
========================================================= */

function getHighlights(data){

  let raw=v(
    data,
    [
      "product_highlights",
      "highlights",
      "productHighlights",
      "highlight"
    ],
    null
  );

  raw=parseJSON(raw,raw);

  if(!raw) return [];

  /*
    Supported formats:

    [
      {label:"Color",value:"Purple"},
      {label:"Material",value:"Plastic"}
    ]

    OR

    {
      "Color":"Purple",
      "Material":"Plastic"
    }
  */

  if(Array.isArray(raw)){

    return raw
      .map(x=>{

        if(typeof x==="string")
          return {
            label:"",
            value:x
          };

        return {
          label:
            x.label ||
            x.title ||
            x.name ||
            x.key ||
            "",
          value:
            x.value ||
            x.text ||
            x.content ||
            ""
        };

      })
      .filter(x=>
        cleanPart(x.label) ||
        cleanPart(x.value)
      );
  }

  if(typeof raw==="object"){

    return Object.entries(raw)
      .map(([label,value])=>({
        label,
        value:
          typeof value==="object"
            ? JSON.stringify(value)
            : value
      }))
      .filter(x=>
        cleanPart(x.label) ||
        cleanPart(x.value)
      );
  }

  return [];
}


/* =========================================================
   ALL DETAILS / SPECIFICATIONS
========================================================= */

function normalizeDetailGroups(raw){
  raw=parseJSON(raw,raw);
  if(!raw) return [];

  const textValue=value=>{
    if(value==null) return "";
    if(typeof value==="string" || typeof value==="number" || typeof value==="boolean") return String(value);
    try{return JSON.stringify(value);}catch{return String(value);}
  };

  /* Admin format:
     [
       {
         title:"Body and Design Features",
         rows:[
           {key:"Body Material",value:"Plastic"},
           {key:"Frame Material",value:"TR90"}
         ]
       }
     ]
  */
  if(Array.isArray(raw)){
    return raw.map(group=>{
      if(!group || typeof group!=="object") return {title:"",items:[]};

      const title=group.title || group.name || "";

      if(Array.isArray(group.rows)){
        return {
          title,
          items:group.rows.map(row=>({
            label:row?.key || row?.label || row?.name || "",
            value:textValue(row?.value ?? row?.text ?? row?.content ?? "")
          })).filter(x=>cleanPart(x.label)||cleanPart(x.value))
        };
      }

      if(Array.isArray(group.items)){
        return {
          title,
          items:group.items.map(row=>({
            label:row?.key || row?.label || row?.name || row?.title || "",
            value:textValue(row?.value ?? row?.text ?? row?.content ?? "")
          })).filter(x=>cleanPart(x.label)||cleanPart(x.value))
        };
      }

      const copy={...group};
      delete copy.title;
      delete copy.name;
      delete copy.rows;
      delete copy.items;

      return {
        title,
        items:Object.entries(copy).map(([label,value])=>({
          label,
          value:textValue(value)
        })).filter(x=>cleanPart(x.label)||cleanPart(x.value))
      };
    }).filter(x=>x.items.length);
  }

  if(typeof raw==="object"){
    return Object.entries(raw).map(([groupTitle,value])=>{
      if(value && typeof value==="object" && !Array.isArray(value)){
        return {
          title:groupTitle,
          items:Object.entries(value).map(([label,val])=>({
            label,
            value:textValue(val)
          })).filter(x=>cleanPart(x.label)||cleanPart(x.value))
        };
      }
      return {
        title:"",
        items:[{label:groupTitle,value:textValue(value)}]
      };
    }).filter(x=>x.items.length);
  }

  return [];
}

/* =========================================================
   IMAGE SLIDER
========================================================= */

function onSliderScroll(){

  const slider=
    document.getElementById(
      "slider"
    );

  const w=
    slider.clientWidth||1;

  const idx=
    Math.round(
      slider.scrollLeft/w
    );

  if(idx!==currentIndex){

    currentIndex=idx;

    product.image=
      product.images[currentIndex] ||
      product.image;

    updateDots();
    updateNavState();
  }
}

function updateDots(){

  document
    .querySelectorAll(
      "#dots .dot"
    )
    .forEach(
      (d,i)=>
        d.classList.toggle(
          "active",
          i===currentIndex
        )
    );
}

function updateNavState(){

  const prev=
    document.querySelector(
      ".prevBtn"
    );

  const next=
    document.querySelector(
      ".nextBtn"
    );

  if(
    !prev ||
    !next ||
    !product
  )
    return;

  prev.disabled=
    currentIndex<=0;

  next.disabled=
    currentIndex>=
    product.images.length-1;
}

function goToImage(i){

  const slider=
    document.getElementById(
      "slider"
    );

  currentIndex=
    Math.max(
      0,
      Math.min(
        product.images.length-1,
        i
      )
    );

  product.image=
    product.images[currentIndex] ||
    product.image;

  slider.scrollTo({
    left:
      currentIndex*
      slider.clientWidth,
    behavior:"smooth"
  });

  updateDots();
  updateNavState();
}

function prevImage(){
  goToImage(
    currentIndex-1
  );
}

function nextImage(){
  goToImage(
    currentIndex+1
  );
}

   ADD TO CART
========================================================= */

async function addToCart(){

  if(!product) return;

  const user=
    await getUser();

  if(!user){

    toast("Please login first");

    setTimeout(
      () =>
        navigateWithProductLoader("/ecom/account.html"),
      800
    );

    return;
  }

  const {
    data:old,
    error:readError
  }=
    await supabaseClient
      .from("cart_items")
      .select("id,qty")
      .eq("user_id",user.id)
      .eq("product_id",product.id)
      .maybeSingle();

  if(readError){

    toast(readError.message);

    return;
  }

  const newQty=
    (old?.qty||0)+qty;

  const customizeInput=
    document.getElementById(
      "customizeInput"
    );

  const customizeText=
    product.customize_enabled
      ? (
          customizeInput?.value||""
        ).trim()
      : "";

  const row={

    user_id:user.id,

    product_id:product.id,

    title:product.title,

    image:product.image,

    price:product.price,

    mrp:product.mrp,

    qty:newQty,

    customize_text:
      customizeText,

    updated_at:
      new Date().toISOString()
  };

  const {error}=
    await supabaseClient
      .from("cart_items")
      .upsert(
        row,
        {
          onConflict:
            "user_id,product_id"
        }
      );

  if(error){

    toast(error.message);

    return;
  }

  updateCart();

  toast("✓ Added to Cart");
}

        (s,x)=>
          s+
          (Number(x.qty)||0),
        0
      );

    cartBadge.textContent=total;
    setMobileProductCartBadge(total);
  }
}

/* =========================================================
   REAL NAVIGATION LOADER — PRODUCT PAGE
   Same loader for every internal page navigation on mobile.
   No artificial delay.
========================================================= */

function showProductNavigationLoader(){

  const loading =
    document.getElementById(
      "mobileProductLoading"
    );

  if(
    window.innerWidth <= 900 &&
    loading
  ){

    const badge =
      document.getElementById(
        "mobileProductCartBadge"
      );

    const loadBadge =
      document.getElementById(
        "mobileProductLoadingBadge"
      );

    if(
      badge &&
      loadBadge &&
      badge.textContent.trim()
    ){

      loadBadge.textContent =
        badge.textContent.trim();

      loadBadge.classList.add(
        "show"
      );
    }

    loading.classList.remove(
      "hide"
    );

    loading.setAttribute(
      "aria-hidden",
      "false"
    );

    document.body.style.overflow =
      "hidden";
  }
}


function navigateWithProductLoader(
  url
){

  showProductNavigationLoader();

  /*
    Direct navigation.
    No timeout.
    No requestAnimationFrame.
    No artificial wait.
  */
  window.location.assign(url);
}

/* ---------- Cart badge ---------- */

function setMobileProductCartBadge(
  value
){

  const text =
    String(value || "").trim();

  const badges = [
    document.getElementById(
      "mobileProductLoadingBadge"
    ),
    document.getElementById(
      "mobileProductCartBadge"
    )
  ];

  badges.forEach(
    badge => {

      if(!badge) return;

      if(
        text &&
        text !== "0"
      ){

        badge.textContent =
          Number(text) > 99
            ? "99+"
            : text;

        badge.classList.add(
          "show"
        );

      }else{

        badge.textContent =
          "";

        badge.classList.remove(
          "show"
        );
      }
    }
  );
}


/* ---------- Loaded header ---------- */

function updateMobileProductHeader(){

  const input =
    document.getElementById(
      "mobileProductSearchInput"
    );

  if(
    input &&
    product
  ){

    input.value =
      product.title || "";
  }

  const source =
    document.getElementById(
      "mobileProductLoadingBadge"
    );

  if(
    source &&
    source.textContent.trim()
  ){

    setMobileProductCartBadge(
      source.textContent.trim()
    );
  }
}


function showMobileProductLoadedHeader(){

  const loading =
    document.getElementById(
      "mobileProductLoading"
    );

  const header =
    document.getElementById(
      "mobileProductHeader"
    );

  if(
    window.innerWidth <= 900
  ){

    if(loading){

      loading.classList.add(
        "hide"
      );

      loading.setAttribute(
        "aria-hidden",
        "true"
      );
    }

    if(header){

      header.classList.add(
        "show"
      );
    }

    document.body.style.overflow =
      "";

    updateMobileProductHeader();
  }
}


/* =========================================================
   CATCH ALL NORMAL INTERNAL LINKS
   Product page → any same-site page
   ========================================================= */

document.addEventListener(
  "click",
  function(event){

    if(
      window.innerWidth > 900
    ){
      return;
    }

    const link =
      event.target.closest(
        "a[href]"
      );

    if(!link) return;

    if(
      link.target === "_blank" ||
      link.hasAttribute("download")
    ){
      return;
    }

    const raw =
      link.getAttribute(
        "href"
      );

    if(
      !raw ||
      raw === "#" ||
      raw.startsWith(
        "javascript:"
      ) ||
      raw.startsWith(
        "mailto:"
      ) ||
      raw.startsWith(
        "tel:"
      )
    ){
      return;
    }

    let url;

    try{

      url =
        new URL(
          raw,
          window.location.href
        );

    }catch(e){

      return;
    }

    /*
      Only same-site links get the loader.
      External links behave normally.
    */
    if(
      url.origin !==
      window.location.origin
    ){
      return;
    }

    event.preventDefault();

    showProductNavigationLoader();

    window.location.assign(
      url.href
    );

  },
  true
);
