<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | MyStore</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.page{
  width:min(1450px,100%);
  margin:auto;
  padding:22px 4%
}

.product{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 40px #0000000d
}

.grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  min-height:650px
}

.gallery{
  padding:28px;
  background:linear-gradient(145deg,#fff,#f1f3f5);
  border-right:1px solid #eee
}

/* IMAGE SLIDER */
.main{
  height:550px;
  background:#fff;
  border:1px solid #eee;
  border-radius:20px;
  position:relative;
  overflow:hidden
}

.pill{
  position:absolute;
  top:16px;
  left:16px;
  background:#111;
  color:#fff;
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  z-index:6;
  letter-spacing:.3px
}

.slider{
  display:flex;
  height:100%;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none
}

.slider::-webkit-scrollbar{display:none}

.slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
}

.slide img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  padding:35px;
  min-width:0;
  min-height:0
}

.imgFallback{
  display:none;
  align-items:center;
  justify-content:center;
  height:100%;
  width:100%;
  color:#777;
  font-size:13px;
  position:absolute;
  inset:0
}

.navBtn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid #ddd;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 14px #0000001f;
  z-index:6;
  color:#111
}

.navBtn:disabled{
  opacity:.35;
  cursor:default
}

.prevBtn{left:14px}
.nextBtn{right:14px}

.dots{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:14px 0 2px
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#d9d9d9;
  border:0;
  padding:0
}

.dot.active{
  background:#111;
  width:20px;
  border-radius:5px
}

/* INFO */
.info{
  padding:38px 42px;
  display:flex;
  flex-direction:column
}

.tag{
  align-self:flex-start;
  background:#111;
  color:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800
}

.title{
  font-size:29px;
  line-height:1.3;
  margin:14px 0 0;
  font-weight:700;
  color:#1a1a1a
}

.rating{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:15px
}

.rate{
  background:#15803d;
  color:#fff;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  font-weight:800
}

.reviews{
  color:#6b7280;
  font-size:12px
}

.pricebox{
  margin-top:24px;
  padding-bottom:20px;
  border-bottom:1px solid #eee
}

.price{
  font-size:33px;
  font-weight:800
}

.mrp{
  text-decoration:line-through;
  color:#888;
  font-size:14px
}

.off{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-left:8px
}

.desc{
  color:#4b5563;
  font-size:14px;
  line-height:1.75;
  margin-top:20px
}

.stock{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:6px
}

/* QTY */
.qtyrow{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  margin-top:14px;
  font-size:12px;
  font-weight:800;
  min-height:34px
}

.qty{
  display:flex;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  height:34px
}

.qty button{
  width:32px;
  border:0;
  background:#f7f7f7
}

.qty span{
  width:34px;
  display:flex;
  align-items:center;
  justify-content:center
}

/* ADDRESS */
.deliveryDetails{
  margin-top:24px
}

.deliveryTitle{
  font-size:18px;
  font-weight:800;
  margin-bottom:11px
}

.deliveryCard{
  border-radius:16px;
  overflow:hidden;
  border:1px solid #e3e7ed;
  background:#fff;
  box-shadow:0 8px 24px rgba(20,30,45,.07)
}

.deliveryAddress{
  display:flex;
  align-items:center;
  cursor:pointer;
  gap:11px;
  background:linear-gradient(180deg,#f4f8ff,#eef5ff);
  padding:13px 14px;
  min-height:50px
}

.deliveryIcon{
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 26px
}

.deliveryIcon svg{
  width:22px;
  height:22px
}

.deliveryAddressText{
  flex:1 1 auto;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
  font-weight:700
}

.deliveryArrow{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center
}

.deliveryDate{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  background:#fafafa;
  border-top:1px solid #edf0f3;
  font-size:12px;
  font-weight:800
}

.deliverySeller{
  padding:12px 14px 13px;
  background:#fafafa;
  border-top:1px solid #edf0f3
}

.sellerMain{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:800
}

.sellerMain svg{
  width:20px;
  height:20px
}

.sellerSub{
  font-size:10px;
  color:#747b85;
  margin:4px 0 0 28px
}

.sellerLink{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin:6px 0 0 28px;
  color:#1769d5;
  font-size:11px;
  font-weight:800
}

/* FEATURES */
.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:22px
}

.feature{
  text-align:center;
  border:1px solid #e4e7eb;
  border-radius:15px;
  background:linear-gradient(180deg,#fff,#fbfcfd);
  padding:11px 5px;
  font-size:9px;
  color:#69717c;
  min-height:78px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.featureIcon{
  width:31px;
  height:31px;
  border-radius:10px;
  background:#f3f6fa;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:7px;
  color:#1d4ed8
}

.featureIcon svg{
  width:19px;
  height:19px
}

.feature b{
  color:#20242b;
  font-size:9px
}

/* =====================================================
   PRODUCT HIGHLIGHTS
   EXACT SIMPLE STYLE
===================================================== */

.productExtra{
  margin-top:28px;
  border-top:1px solid #e5e7eb;
}

.extraSection{
  border-bottom:1px solid #e5e7eb;
}

.extraHeader{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  background:#fff;
  border:0;
  padding:20px 0 14px;
}

.extraHeaderText{
  min-width:0;
}

.extraTitle{
  font-size:20px;
  font-weight:800;
  color:#171717;
  margin:0 0 4px;
  line-height:1.25;
}

.extraSubtitle{
  font-size:13px;
  color:#737373;
  line-height:1.4;
}

.extraArrow{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 34px;
  margin-left:15px;
  transition:transform .2s
}

.extraArrow svg{
  width:18px;
  height:18px;
  stroke:#222
}

.extraSection.closed .extraArrow{
  transform:rotate(180deg)
}

.extraBody{
  overflow:hidden;
  max-height:2000px;
  opacity:1;
  transition:max-height .28s ease,opacity .2s ease
}

.extraSection.closed .extraBody{
  max-height:0;
  opacity:0
}

/* HIGHLIGHT ROWS */
.highlightList{
  border-top:1px solid #e5e5e5;
}

.highlightRow{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 0;
  min-height:61px;
  border-bottom:1px solid #e5e5e5;
}

.highlightIcon{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.highlightIcon svg{
  width:19px;
  height:19px;
  stroke:#222;
}

.highlightText{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.highlightLabel{
  color:#777;
  font-size:12px;
  line-height:1.2;
}

.highlightValue{
  color:#111;
  font-size:14px;
  line-height:1.25;
  font-weight:800;
  word-break:break-word;
}

/* ALL DETAILS */
.detailsHeading{
  font-size:17px;
  font-weight:800;
  margin:18px 0 8px;
}

.detailRows{
  width:100%;
}

.detailRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:57px;
  align-items:center;
  border-bottom:1px solid #e5e5e5;
  column-gap:25px;
}

.detailLabel{
  color:#777;
  font-size:13px;
  line-height:1.35;
}

.detailValue{
  color:#111;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
}

.detailDescription{
  padding:16px 0 20px;
  color:#444;
  font-size:13px;
  line-height:1.7;
}

/* CTA */
.cta{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:10px;
  margin-top:auto;
  padding-top:24px
}

.add,.buy{
  height:56px;
  border-radius:14px;
  font-weight:800;
  font-size:14px
}

.add{
  background:#fff;
  border:1px solid #d9dde3;
  box-shadow:0 5px 16px rgba(20,30,45,.05)
}

.buy{
  background:linear-gradient(135deg,#ffbd19,#ff9800);
  border:0;
  box-shadow:0 8px 22px rgba(255,152,0,.28);
  color:#1a1a1a
}

.cta svg{
  width:18px;
  height:18px;
  vertical-align:-4px;
  margin-right:5px
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
  z-index:100
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

/* MOBILE */
@media(max-width:900px){

  .page{
    padding:12px 9px 90px
  }

  .product{
    border-radius:17px
  }

  .grid{
    grid-template-columns:1fr
  }

  .gallery{
    padding:9px 0;
    border-right:0;
    border-bottom:1px solid #eee
  }

  .main{
    height:340px;
    border:0;
    background:transparent;
    border-radius:0
  }

  .slide img{
    padding:10px
  }

  .navBtn{
    display:none!important
  }

  .info{
    padding:20px 16px
  }

  .title{
    font-size:19px;
    line-height:1.35
  }

  .price{
    font-size:26px
  }

  .features{
    gap:7px;
    margin-top:16px
  }

  .feature{
    min-height:68px;
    padding:8px 3px
  }

  .featureIcon{
    width:27px;
    height:27px
  }

  .feature b{
    font-size:8.5px
  }

  .deliveryDetails{
    margin-top:18px
  }

  .deliveryTitle{
    font-size:15px;
    margin-bottom:8px
  }

  .deliveryAddress{
    padding:10px;
    min-height:43px
  }

  .deliveryDate{
    padding:10px;
    font-size:10px
  }

  .deliverySeller{
    padding:10px
  }

  .deliveryAddressText{
    font-size:10px;
  }

  .sellerMain{
    font-size:10px
  }

  .sellerSub{
    font-size:8.5px
  }

  .sellerLink{
    font-size:9px
  }

  /* EXACT MOBILE HIGHLIGHT STYLE */
  .productExtra{
    margin-top:22px
  }

  .extraHeader{
    padding:16px 0 12px
  }

  .extraTitle{
    font-size:18px
  }

  .extraSubtitle{
    font-size:11px
  }

  .extraArrow{
    width:32px;
    height:32px;
    flex-basis:32px
  }

  .highlightRow{
    min-height:62px;
    padding:11px 0
  }

  .highlightIcon{
    width:38px;
    height:38px;
    flex-basis:38px
  }

  .highlightLabel{
    font-size:11px
  }

  .highlightValue{
    font-size:13px
  }

  .detailsHeading{
    font-size:16px;
    margin:16px 0 6px
  }

  .detailRow{
    grid-template-columns:1fr 1fr;
    min-height:55px;
    column-gap:15px
  }

  .detailLabel{
    font-size:12px
  }

  .detailValue{
    font-size:13px
  }

  .detailDescription{
    font-size:12px
  }

  .cta{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    background:#fff;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    margin:0;
    border-top:1px solid #ddd;
    box-shadow:0 -6px 20px #0000000f
  }

  .add,.buy{
    height:51px
  }
}
</style>
</head>

</div>

<!-- QTY -->

<button onclick="changeQty(1)">+</button>

</div>

<div id="customizeWrap"
style="display:none;align-items:center;gap:7px;margin-left:4px;">

<label for="customizeInput"
style="font-size:12px;font-weight:800;white-space:nowrap;">
Customize
</label>

<input id="customizeInput"
type="text"
maxlength="100"
placeholder="Name / Text"
style="width:125px;height:40px;border:1px solid #ddd;border-radius:10px;padding:0 10px;outline:none;background:#fff;">

</div>

</div>

<!-- FEATURES -->

<!-- =====================================================
     PRODUCT HIGHLIGHTS + ALL DETAILS
===================================================== -->

<div class="productExtra">

<!-- PRODUCT HIGHLIGHTS -->

<section id="highlightSection" class="extraSection">

<button class="extraHeader"
type="button"
onclick="toggleExtra('highlightSection')">

<div class="extraHeaderText">

<div class="extraTitle">
Product Highlights
</div>

<div class="extraSubtitle">
Key features, expiry, usage, and more
</div>

</div>

<div class="extraArrow">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

</svg>

</div>

</button>

<div class="extraBody">

</div>

</section>


<!-- ALL DETAILS -->

<section id="allDetailsSection" class="extraSection">

<button class="extraHeader"
type="button"
onclick="toggleExtra('allDetailsSection')">

<div class="extraHeaderText">

<div class="extraTitle">
All details
</div>

<div class="extraSubtitle">
Features, description and more
</div>

</div>

<div class="extraArrow">

<svg viewBox="0 0 24 24"

</div>

stroke="currentColor"

<circle cx="9" cy="19" r="1.5"/>
<circle cx="18" cy="19" r="1.5"/>

</svg>

Add to Cart

</button>


<button class="buy"
onclick="buyNow()">

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.9">

<path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/>

</svg>

Buy at <span id="buyPrice"></span>

</button>

</div>

</div>
</div>

</section>

</main>

<div id="toast" class="toast"></div>

   HELPERS
===================================================== */

const money=n =>
"₹"+Math.round(Number(n)||0).toLocaleString("en-IN");

const id=() =>
new URLSearchParams(location.search).get("id");

function v(o,ks,d=""){
for(const k of ks){
if(o[k]!=null && o[k]!=="") return o[k];
}
return d;
}

function num(v){
const m=String(v??"")
.match(/[0-9,]+(?:\.[0-9]+)?/);
return m?Number(m[0].replace(/,/g,"")):0;
}

function escapeHtml(value){
const s=String(value??"");
return s.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function toast(x){
const t=document.getElementById("toast");
t.textContent=x;
t.classList.add("show");
clearTimeout(window.tt);
window.tt=setTimeout(()=>{
t.classList.remove("show")
},2200);
}


/* =====================================================
   EXTRA DATA PARSER
   Supports JSON / ARRAY / OBJECT / STRING
===================================================== */

function parseExtraData(value){

if(value==null || value==="") return [];

if(Array.isArray(value)) return value;

if(typeof value==="object"){

/* object like:
   {Color:"Purple", Material:"Plastic"}
*/

return Object.entries(value).map(([label,val])=>({
label:label,
value:val
}));

}

if(typeof value==="string"){

let s=value.trim();

if(!s) return [];

try{

const parsed=JSON.parse(s);

if(Array.isArray(parsed)) return parsed;

if(parsed && typeof parsed==="object"){
return Object.entries(parsed).map(([label,val])=>({
label:label,
value:val
}));
}

}catch(e){}

/*
   Supports:
   Color: Purple
   Material: Plastic
*/

return s
.split(/\n|•/)
.map(x=>x.trim())
.filter(Boolean)
.map(x=>{

const p=x.indexOf(":");

if(p>-1){

return {
label:x.slice(0,p).trim(),
value:x.slice(p+1).trim()
};

}

return {
label:"",
value:x
};

});

}

return [];
}


function normalizeExtra(item){

if(item==null) return null;

if(typeof item==="string"){

return {
label:"",
value:item
};

}

if(Array.isArray(item)){

return {
label:item[0]||"",
value:item[1]||""
};

}

if(typeof item==="object"){

const label=
item.label ??
item.name ??
item.key ??
item.title ??
item.field ??
item.heading ??
"";

const value=
item.value ??
item.text ??
item.answer ??
item.content ??
item.description ??
"";

return {
label:String(label).trim(),
value:String(value).trim(),
icon:item.icon||""
};

}

return null;
}

function getHighlights(data){

let raw=
v(data,[
"product_highlights",
"product_highlight",
"highlights",
"highlight",
"key_features",
"keyFeatures"
],"");

let arr=parseExtraData(raw)
.map(normalizeExtra)
.filter(x=>x && x.value);

}

"allDetails",

"specs",
"details"
],"");

let arr=parseExtraData(raw)
.map(normalizeExtra)
.filter(x=>x && (x.label || x.value));

return arr;

}

/* =====================================================
   ADDRESS
===================================================== */

function cleanPart(v){
return v==null?"":String(v).trim();
}

function uniqueParts(arr){

const out=[];

for(const x of arr){

const s=cleanPart(x);

if(
s &&
!out.some(
y=>y.toLowerCase()===s.toLowerCase()
)
){
out.push(s);
}

}

return out;
}

function formatSavedAddress(a){

if(!a)return "";

if(typeof a==="string")return a.trim();

const village=
cleanPart(
a.village ||
a.locality ||
a.area ||
a.town ||
a.place ||
""
);

const district=
cleanPart(
a.district ||
a.district_name ||
""
);

const city=
cleanPart(
a.city ||
a.city_name ||
""
);

const state=
cleanPart(
a.state ||
a.state_name ||
""
);

const pincode=
cleanPart(
a.pincode ||
a.pin ||
a.postal_code ||
a.postcode ||
""
);

const plus=
cleanPart(
a.plus_code ||
a.plusCode ||
a.pluscode ||
a.plus_code_address ||
""
);

const direct=
cleanPart(
a.full_address ||
a.fullAddress ||
a.formatted_address ||
a.formattedAddress
);

const first=
uniqueParts([
village,
district
]).join(", ");

const second=
uniqueParts([
state,
pincode
]).join(", ");

const lines=[
first,
second,
plus
].filter(Boolean);

if(lines.length)return lines.join("\n");

const fallback=
uniqueParts([
city,
state,
pincode
]).join(", ");

return fallback||direct;
}

function addressCacheKey(userId){

return "mystore_delivery_address_cache_v3_"+
String(userId||"guest");

}

function cacheAddress(userId,addressObject,formatted){

try{

localStorage.setItem(
addressCacheKey(userId),
JSON.stringify({
savedAt:Date.now(),
text:formatted||formatSavedAddress(addressObject),
data:addressObject||null
})
);

}catch(e){}

}

function readCachedAddress(userId){

try{

const raw=
localStorage.getItem(
addressCacheKey(userId)
);

if(!raw)return "";

const x=JSON.parse(raw);

return cleanPart(x?.text) ||
formatSavedAddress(x?.data);

}catch(e){

return "";

}

}

function paintAddress(text){

const el=
document.getElementById(
"deliveryAddressText"
);

if(!el)return;

const value=cleanPart(text);

el.textContent=
value?
value.replace(/\s*\n\s*/g," ")
.replace(/\s+/g," ")
.trim()
:
"Add delivery address";

}

async function getCurrentUser(){

try{

const {data,error}=
await supabaseClient.auth.getSession();

if(error)return null;

return data?.session?.user||null;

}catch(e){

return null;

}

}

async function readAddressTable(table,userId){

try{

const {data,error}=
await supabaseClient
.from(table)
.select("*")
.eq("user_id",userId)
.order("created_at",{ascending:false})
.limit(20);

if(
error ||
!Array.isArray(data) ||
!data.length
)return null;

const preferred=
data.find(a=>
a?.is_current_location===true ||
a?.isCurrentLocation===true ||
a?.is_current===true ||
a?.selected===true ||
a?.is_selected===true
)||
data[0];

const text=
formatSavedAddress(preferred);

if(text){

return {
data:preferred,
text:text
};

}

}catch(e){}

return null;

}

async function loadDeliveryAddress(){

const user=
await getCurrentUser();

if(user){

const cached=
readCachedAddress(user.id);

if(cached)paintAddress(cached);

}

if(user){

const tables=[
"saved_addresses",
"addresses",
"user_addresses",
"delivery_addresses"
];

for(const table of tables){

const result=
await readAddressTable(
table,
user.id
);

if(result){

cacheAddress(
user.id,
result.data,
result.text
);

paintAddress(result.text);

return;

}

}

}

}

d.setDate(d.getDate()+5);

return d.toLocaleDateString(

{
day:"numeric",
month:"short",
weekday:"short"
}
);

}

/* =====================================================
   SLIDER
===================================================== */

function onSliderScroll(){

const slider=
document.getElementById("slider");

const w=
slider.clientWidth||1;

const idx=
Math.round(
slider.scrollLeft/w
);

if(idx!==currentIndex){

currentIndex=idx;

product.image=
product.images[currentIndex]||
product.image;

updateDots();

updateNavState();

}

}

function updateDots(){

document
.querySelectorAll("#dots .dot")
.forEach(
(d,i)=>
d.classList.toggle(
"active",
i===currentIndex
)
);

}

function updateNavState(){

const prev=
document.querySelector(".prevBtn");

const next=
document.querySelector(".nextBtn");

if(!prev||!next||!product)return;

prev.disabled=
currentIndex<=0;

next.disabled=
currentIndex>=
product.images.length-1;

}

function goToImage(i){

const slider=
document.getElementById("slider");

currentIndex=
Math.max(
0,
Math.min(
product.images.length-1,
i
)
);

product.image=
product.images[currentIndex]||
product.image;

slider.scrollTo({
left:
currentIndex*
slider.clientWidth,
behavior:"smooth"
});

updateDots();

updateNavState();

}

function prevImage(){
goToImage(currentIndex-1)
}

function nextImage(){
goToImage(currentIndex+1)
}

Math.max(
1,
Math.min(
product.stock||99,
qty+n
)
);

"qty"
).textContent=qty;

/* IMPORTANT:
   Unit price only
*/

document.getElementById(
"buyPrice"
).textContent=
money(product.price);

}


/* =====================================================
   CART
===================================================== */

async function getUser(){

const {data}=
await supabaseClient.auth.getSession();

return data.session?.user||null;

}

async function addToCart(){

if(!product)return;

const user=
await getUser();

if(!user){

toast("Please login first");

setTimeout(
()=>location.href="/ecom/account.html",
800
);

return;

}

const {data:old,error:readError}=
await supabaseClient
.from("cart_items")
.select("id,qty")
.eq("user_id",user.id)
.eq("product_id",product.id)
.maybeSingle();

if(readError){

toast(readError.message);
return;

}

const newQty=
(old?.qty||0)+qty;

const customizeInput=
document.getElementById(
"customizeInput"
);

const customizeText=
product.customize_enabled
?
(customizeInput?.value||"").trim()
:"";

const row={

user_id:user.id,

product_id:product.id,

title:product.title,

image:product.image,

price:product.price,

mrp:product.mrp,

qty:newQty,

customize_text:customizeText,

updated_at:
new Date().toISOString()

};

const {error}=
await supabaseClient
.from("cart_items")
.upsert(
row,
{
onConflict:
"user_id,product_id"
}
);

if(error){

toast(error.message);
return;

}

updateCart();

toast("✓ Added to Cart");

}
