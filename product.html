<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | MyStore</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.page{
  width:min(1450px,100%);
  margin:auto;
  padding:22px 4%
}

.product{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 40px #0000000d
}

.grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  min-height:650px
}

.gallery{
  padding:28px;
  background:linear-gradient(145deg,#fff,#f1f3f5);
  border-right:1px solid #eee
}

/* IMAGE SLIDER */
.main{
  height:550px;
  background:#fff;
  border:1px solid #eee;
  border-radius:20px;
  position:relative;
  overflow:hidden
}

.pill{
  position:absolute;
  top:16px;
  left:16px;
  background:#111;
  color:#fff;
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  z-index:6;
  letter-spacing:.3px
}

.slider{
  display:flex;
  height:100%;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none
}

.slider::-webkit-scrollbar{display:none}

.slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
}

.slide img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  padding:35px;
  min-width:0;
  min-height:0
}

.imgFallback{
  display:none;
  align-items:center;
  justify-content:center;
  height:100%;
  width:100%;
  color:#777;
  font-size:13px;
  position:absolute;
  inset:0
}

.navBtn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid #ddd;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 14px #0000001f;
  z-index:6;
  color:#111
}

.prevBtn{left:14px}
.nextBtn{right:14px}

.navBtn:disabled{
  opacity:.35;
  cursor:default
}

.dots{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:14px 0 2px
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#d9d9d9;
  border:0;
  padding:0
}

.dot.active{
  background:#111;
  width:20px;
  border-radius:5px
}

/* INFO */
.info{
  padding:38px 42px;
  display:flex;
  flex-direction:column
}

.tag{
  align-self:flex-start;
  background:#111;
  color:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800
}

.title{
  font-size:29px;
  line-height:1.3;
  margin:14px 0 0;
  font-weight:700;
  color:#1a1a1a
}

.rating{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:15px
}

.rate{
  background:#15803d;
  color:#fff;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  font-weight:800
}

.reviews{
  color:#6b7280;
  font-size:12px
}

.pricebox{
  margin-top:24px;
  padding-bottom:20px;
  border-bottom:1px solid #eee
}

.price{
  font-size:33px;
  font-weight:800
}

.mrp{
  text-decoration:line-through;
  color:#888;
  font-size:14px
}

.off{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-left:8px
}

.desc{
  color:#4b5563;
  font-size:14px;
  line-height:1.75;
  margin-top:20px
}

.stock{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:6px
}

/* QTY */
.qtyrow{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  margin-top:14px;
  font-size:12px;
  font-weight:800;
  min-height:34px
}

.qty{
  display:flex;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  height:34px
}

.qty button{
  width:32px;
  border:0;
  background:#f7f7f7;
  font-size:13px
}

.qty span{
  width:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px
}

/* CUSTOMIZE */
#customizeWrap{
  display:none;
  align-items:center;
  gap:7px;
  margin-left:4px
}

#customizeWrap input{
  width:125px;
  height:36px;
  border:1px solid #ddd;
  border-radius:9px;
  padding:0 10px;
  outline:none
}

/* DELIVERY */
.deliveryDetails{
  margin-top:24px
}

.deliveryTitle{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px
}

.deliveryCard{
  border-radius:14px;
  overflow:hidden;
  border:1px solid #ececec;
  background:#fff
}

.deliveryAddress{
  display:flex;
  align-items:center;
  cursor:pointer;
  gap:10px;
  background:#f2f7ff;
  padding:12px 13px;
  font-size:12px;
  font-weight:600;
  min-height:48px
}

.deliveryIcon{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 24px;
  font-size:17px
}

.deliveryAddressText{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#30343b
}

.deliveryArrow{
  font-size:20px;
  color:#777
}

.deliveryDate{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 13px;
  background:#f7f7f7;
  border-top:1px solid #eee;
  font-size:12px;
  font-weight:800
}

.deliverySeller{
  padding:12px 13px;
  background:#f7f7f7;
  border-top:1px solid #eee
}

.sellerMain{
  font-size:12px;
  font-weight:700
}

.sellerSub{
  font-size:10px;
  color:#777;
  margin-top:3px
}

.sellerLink{
  display:inline-block;
  margin-top:5px;
  color:#1769d5;
  font-size:11px;
  font-weight:800
}

/* PREMIUM HIGHLIGHTS */
.productHighlights{
  display:none;
  margin-top:22px;
  border:1px solid #e7e9ed;
  border-radius:16px;
  background:linear-gradient(145deg,#fff,#fafbfc);
  overflow:hidden;
  box-shadow:0 5px 18px #00000008
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px 16px;
  border-bottom:1px solid #eee
}

.sectionHeadLeft{
  display:flex;
  align-items:center;
  gap:9px
}

.sectionHeadIcon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:linear-gradient(135deg,#f0e9ff,#e9fff3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px
}

.sectionHead h3{
  margin:0;
  font-size:15px;
  font-weight:900
}

.highlightGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:12px
}

.highlightCard{
  position:relative;
  min-height:76px;
  border:1px solid #eceef1;
  border-radius:13px;
  padding:11px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  overflow:hidden
}

.highlightCard:before{
  content:"";
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:3px;
  border-radius:0 4px 4px 0;
  background:var(--highlight-color,#111)
}

.highlightIcon{
  width:35px;
  height:35px;
  flex:0 0 35px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:color-mix(in srgb,var(--highlight-color,#111) 10%,white);
  color:var(--highlight-color,#111);
  font-size:16px;
  font-weight:900
}

.highlightText{
  min-width:0
}

.highlightLabel{
  font-size:10px;
  color:#777;
  font-weight:700;
  line-height:1.2
}

.highlightValue{
  margin-top:4px;
  font-size:12px;
  color:#171717;
  font-weight:900;
  line-height:1.25;
  word-break:break-word
}

/* ALL DETAILS */
.allDetails{
  display:none;
  margin-top:12px;
  border:1px solid #e7e9ed;
  border-radius:16px;
  background:#fff;
  overflow:hidden
}

.allDetailsButton{
  width:100%;
  border:0;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px;
  text-align:left
}

.allDetailsLeft{
  display:flex;
  align-items:center;
  gap:10px
}

.allDetailsIcon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#f2f5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px
}

.allDetailsTitle{
  font-size:15px;
  font-weight:900
}

.allDetailsSub{
  font-size:10px;
  color:#888;
  margin-top:2px
}

.detailsChevron{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#f5f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  transition:.2s
}

.allDetails.open .detailsChevron{
  transform:rotate(180deg)
}

.allDetailsContent{
  display:none;
  border-top:1px solid #eee;
  padding:12px
}

.allDetails.open .allDetailsContent{
  display:block
}

.detailSection{
  border:1px solid #eceef1;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:10px
}

.detailSection:last-child{
  margin-bottom:0
}

.detailSectionTitle{
  padding:11px 12px;
  background:#f8f9fb;
  font-size:12px;
  font-weight:900
}

.detailRows{
  display:flex;
  flex-direction:column
}

.detailRow{
  display:grid;
  grid-template-columns:minmax(120px,.7fr) 1.3fr;
  gap:10px;
  padding:10px 12px;
  border-top:1px solid #f0f0f0;
  font-size:11px;
  line-height:1.4
}

.detailKey{
  color:#777;
  font-weight:700
}

.detailValue{
  color:#171717;
  font-weight:800;
  word-break:break-word
}

/* FEATURES */
.features{
  display:grid;
  gap:8px;
  margin-top:18px
}

.feature{
  text-align:center;
  border:1px solid #e8e8e8;
  border-radius:12px;
  background:#fff;
  padding:10px 4px 9px;
  font-size:9px;
  color:#666;
  min-height:68px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.featureIcon{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#f4f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  margin-bottom:5px
}

.feature b{
  display:block;
  color:#222;
  font-size:9px
}

/* CTA */
.cta{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:10px;
  margin-top:auto;
  padding-top:24px
}

.add,.buy{
  height:56px;
  border-radius:13px;
  font-weight:800;
  font-size:14px
}

.add{
  background:#fff;
  border:1.5px solid #111
}

.buy{
  background:linear-gradient(135deg,#ffb000,#ff8900);
  border:0;
  box-shadow:0 8px 20px #ff89004d;
  color:#1a1a1a
}

/* DETAILS */
.details{
  margin-top:18px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden
}

.tabs{
  display:flex;
  border-bottom:1px solid #eee
}

.tab{
  border:0;
  background:#fff;
  padding:17px 21px;
  font-weight:800;
  color:#777
}

.tab.active{
  color:#111;
  border-bottom:2px solid #111
}

.content{
  padding:22px;
  color:#4b5563;
  font-size:13px;
  line-height:1.8
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
  z-index:100
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

/* MOBILE */
@media(max-width:900px){

  #customizeWrap{
    margin-left:0;
    flex:1;
    min-width:0
  }

  #customizeWrap input{
    width:100%;
    max-width:135px;
    height:34px
  }

  .qtyrow{
    gap:6px;
    margin-top:12px;
    font-size:11px;
    min-height:32px
  }

  .qty{
    height:32px;
    border-radius:8px
  }

  .qty button{
    width:29px;
    font-size:12px
  }

  .qty span{
    width:30px;
    font-size:11px
  }

  .deliveryDetails{
    margin-top:18px
  }

  .deliveryTitle{
    font-size:15px;
    margin-bottom:8px
  }

  .deliveryAddress{
    padding:10px;
    font-size:10px;
    min-height:42px
  }

  .deliveryDate{
    padding:9px 10px;
    font-size:10px
  }

  .deliverySeller{
    padding:9px 10px
  }

  .sellerMain{
    font-size:10px
  }

  .sellerSub{
    font-size:8.5px
  }

  .sellerLink{
    font-size:9px
  }

  .highlightGrid{
    grid-template-columns:1fr 1fr;
    gap:7px;
    padding:9px
  }

  .sectionHead{
    padding:12px
  }

  .sectionHead h3,
  .allDetailsTitle{
    font-size:13px
  }

  .highlightCard{
    min-height:68px;
    padding:9px;
    gap:8px
  }

  .highlightIcon{
    width:30px;
    height:30px;
    flex-basis:30px;
    font-size:14px
  }

  .highlightLabel{
    font-size:8.5px
  }

  .highlightValue{
    font-size:10px
  }

  .allDetailsButton{
    padding:12px
  }

  .allDetailsSub{
    font-size:8.5px
  }

  .detailRow{
    grid-template-columns:1fr 1.3fr;
    padding:9px 10px;
    font-size:10px
  }

  .page{
    padding:12px 9px 90px
  }

  .product{
    border-radius:17px
  }

  .grid{
    grid-template-columns:1fr
  }

  .gallery{
    padding:9px 0;
    border-right:0;
    border-bottom:1px solid #eee
  }

  .main{
    height:340px;
    border:0;
    background:transparent;
    border-radius:0;
    box-shadow:none
  }

  .slide img{
    padding:10px
  }

  .navBtn{
    display:none!important
  }

  .info{
    padding:20px 16px
  }

  .title{
    font-size:19px;
    line-height:1.35;
    margin-top:10px
  }

  .price{
    font-size:26px
  }

  .mrp{
    font-size:12px
  }

  .off{
    font-size:12px
  }

  .rate{
    font-size:11px
  }

  .reviews{
    font-size:11px
  }

  .cta{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    background:#fff;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    margin:0;
    border-top:1px solid #ddd;
    box-shadow:0 -6px 20px #0000000f
  }

  .add,.buy{
    height:51px
  }
}
</style>
</head>

<main class="page">

<div id="loading"
style="background:#fff;border-radius:20px;min-height:550px;display:flex;align-items:center;justify-content:center">
<b>Loading product...</b>
</div>

<section id="product" class="product">

<div class="grid">

<!-- GALLERY -->
<div class="gallery">

<div class="main">

<span id="badge" class="pill">BESTSELLER</span>

<button type="button"

<div class="slider" id="slider"></div>

</div>

<div class="dots" id="dots"></div>

</div>

<!-- INFO -->
<div class="info">

<h1 id="title" class="title"></h1>

<div class="rating">

</div>

<div class="pricebox">
<span id="price" class="price"></span><br>
<span id="mrp" class="mrp"></span>
<span id="off" class="off"></span>
</div>

<!-- DELIVERY -->
<div id="deliveryDetails" class="deliveryDetails">

<div class="deliveryTitle">Delivery details</div>

<div class="deliveryCard">

<div class="deliveryAddress"
id="deliveryAddressRow"
onclick="openAddressSelector()">

<div class="deliveryIcon">⌖</div>

<div id="deliveryAddressText"
class="deliveryAddressText">
Select delivery address
</div>

<div class="deliveryArrow">›</div>

</div>

<div class="deliveryDate">

<div class="deliveryIcon">🚚</div>

<div id="deliveryDateText">
Delivery by …
</div>

</div>

<div class="deliverySeller">

<div class="sellerMain">
▣ Fulfilled by MyStore
</div>

<div class="sellerSub">
Trusted seller · Quality checked
</div>

<a class="sellerLink"
href="/ecom/index.html">
See other sellers
</a>

</div>

</div>
</div>

<div id="description" class="desc"></div>

<div id="stock" class="stock"></div>

<!-- QTY -->
<div class="qtyrow">

Qty.

<div class="qty">

<button onclick="changeQty(-1)">−</button>

<span id="qty">1</span>

<button onclick="changeQty(1)">+</button>

</div>

<div id="customizeWrap">

<label style="font-size:10px;font-weight:800;white-space:nowrap">
Customize
</label>

<input
id="customizeInput"
type="text"
maxlength="100"
placeholder="Name / Text">

</div>

</div>

<!-- PRODUCT HIGHLIGHTS -->
<section id="productHighlights" class="productHighlights">

<div class="sectionHead">

<div class="sectionHeadLeft">

<div class="sectionHeadIcon">✦</div>

<h3>Product Highlights</h3>

</div>

</div>

<div id="highlightGrid" class="highlightGrid"></div>

</section>

<!-- ALL DETAILS -->
<section id="allDetails" class="allDetails">

<button
type="button"
class="allDetailsButton"
onclick="toggleAllDetails()">

<div class="allDetailsLeft">

<div class="allDetailsIcon">▤</div>

<div>

<div class="allDetailsTitle">
All Details
</div>

<div class="allDetailsSub">
View complete product information
</div>

</div>

</div>

<div class="detailsChevron">
⌄
</div>

</button>

<div id="allDetailsContent"
class="allDetailsContent">
</div>

</section>

<!-- FEATURES -->
<div id="features" class="features"></div>

<!-- CTA -->
<div class="cta">

<button class="add"
onclick="addToCart()">
🛒 Add to Cart
</button>

<button class="buy"
onclick="buyNow()">
⚡ Buy at <span id="buyPrice"></span>
</button>

</div>

</div>
</div>

</section>

<section id="details"
class="details"
style="display:none">

<div class="tabs">

<button class="tab active"
onclick="tab('about',this)">
About
</button>

<button class="tab"
onclick="tab('specs',this)">
Specifications
</button>

<button class="tab"
onclick="tab('delivery',this)">
Delivery & Returns
</button>

</div>

<div id="content" class="content"></div>

</section>

</main>

<div id="toast" class="toast"></div>

let qty=1;
let currentIndex=0;

const money=n=>
"₹"+Math.round(Number(n)||0)
.toLocaleString("en-IN");

const id=()=>
new URLSearchParams(location.search).get("id");

function v(o,ks,d=""){
for(const k of ks)
if(o[k]!=null&&o[k]!=="")return o[k];
return d;
}

function num(v){
const m=String(v??"")
.match(/[0-9,]+(?:\.[0-9]+)?/);

return m
?Number(m[0].replace(/,/g,""))
:0;
}

function toast(x){

const t=document.getElementById("toast");

t.textContent=x;

t.classList.add("show");

clearTimeout(window.tt);

window.tt=setTimeout(
()=>t.classList.remove("show"),
2200
);

}

function escapeHtml(value){

const s=String(value??"");

return s.replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);

}

/* ADDRESS */

function getSavedAddress(){

const keys=[
"selectedAddress",
"savedAddress",
"deliveryAddress",
"currentAddress",
"userAddress",
"address"
];

for(const key of keys){

try{

const raw=localStorage.getItem(key);

if(!raw)continue;

let x=raw;

try{
x=JSON.parse(raw)
}catch{}

if(typeof x==="string"&&x.trim())
return x.trim();

if(x&&typeof x==="object"){

const parts=[
x.village,
x.village_name,
x.address,
x.full_address,
x.fullAddress,
x.formatted_address,
x.formattedAddress,
x.addressLine,
x.address_line,
x.area,
x.locality,
x.city,
x.district,
x.state,
x.pincode,
x.pin
]
.filter(v=>v!=null&&String(v).trim())
.map(v=>String(v).trim());

if(parts.length)
return [...new Set(parts)].join(", ");

}

}catch{}

}

return "Add delivery address";
}

function openAddressSelector(){

try{

const target=
localStorage.getItem("addressSelectorUrl");

if(target){
location.href=target;
return;
}

location.href="/ecom/checkout.html";

}

function getDeliveryDate(){

const d=new Date();

d.setHours(0,0,0,0);

d.setDate(d.getDate()+5);

return d.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
weekday:"short"
}
);

}

function renderDeliveryDetails(){

document.getElementById(
"deliveryAddressText"
);

document.getElementById(

address.textContent=
getSavedAddress();

if(date)
date.textContent=

/* JSON DETAILS */

function parseJson(value,fallback=[]){

if(Array.isArray(value))
return value;

if(typeof value!=="string")
return fallback;

try{

const parsed=
JSON.parse(value);

return Array.isArray(parsed)
?parsed
:fallback;

}catch{

return fallback;

}

}

/* HIGHLIGHTS */

function normalizeHighlights(data){

return parseJson(data,[])
.map(item=>({

icon:String(item?.icon||""),
label:String(item?.label||""),
value:String(item?.value||""),
color:String(item?.color||"#111111")

}))
.filter(item=>
item.label.trim()||
item.value.trim()
);

}

/* ALL DETAILS */

function normalizeAllDetails(data){

return parseJson(data,[])
.map(section=>({

title:String(section?.title||""),

rows:Array.isArray(section?.rows)
?section.rows.map(row=>({

key:String(row?.key||""),
value:String(row?.value||"")

}))
.filter(row=>
row.key.trim()||
row.value.trim()
)
:[]

}))
.filter(section=>
section.title.trim()||
section.rows.length
);

}

/* RENDER HIGHLIGHTS */

function renderHighlights(){

const section=
document.getElementById(
"productHighlights"
);

const grid=
document.getElementById(
"highlightGrid"
);

if(!section||!grid)return;

const highlights=
normalizeHighlights(
product.highlights
);

if(!highlights.length){

section.style.display="none";

grid.innerHTML="";

return;

}

section.style.display="block";

grid.innerHTML=
highlights.map(h=>{

const color=
/^#[0-9a-fA-F]{6}$/.test(h.color)
?h.color
:"#111111";

return `

<div
class="highlightCard"
style="--highlight-color:${escapeHtml(color)}">

<div class="highlightIcon">
${escapeHtml(h.icon||"✓")}
</div>

<div class="highlightText">

<div class="highlightLabel">
${escapeHtml(h.label)}
</div>

<div class="highlightValue">
${escapeHtml(h.value)}
</div>

</div>

</div>

`;

}).join("");

}

/* RENDER ALL DETAILS */

function renderAllDetails(){

const section=
document.getElementById("allDetails");

const content=
document.getElementById(
"allDetailsContent"
);

if(!section||!content)return;

const groups=
normalizeAllDetails(
product.all_details
);

if(!groups.length){

section.style.display="none";

content.innerHTML="";

return;

}

section.style.display="block";

content.innerHTML=
groups.map(group=>`

<div class="detailSection">

${group.title.trim()
?`<div class="detailSectionTitle">
${escapeHtml(group.title)}
</div>`
:""}

<div class="detailRows">

${group.rows.map(row=>`

<div class="detailRow">

<div class="detailKey">
${escapeHtml(row.key)}
</div>

<div class="detailValue">
${escapeHtml(row.value)}
</div>

</div>

`).join("")}

</div>

</div>

`).join("");

}

function toggleAllDetails(){

const box=
document.getElementById(
"allDetails"
);

if(box)
box.classList.toggle("open");

}

/* LOAD PRODUCT */

async function load(){

try{

if(!id())
throw Error("Product ID missing");

const {data,error}=
await supabaseClient
.from("products")
.select("*")
.eq("id",id())
.single();

if(error)throw error;

let gallery=[];

if(Array.isArray(data.images))
gallery=data.images;

else if(typeof data.images==="string"){

try{

const parsed=
JSON.parse(data.images);

if(Array.isArray(parsed))
gallery=parsed;

}catch{}

}

gallery=
gallery
.map(x=>
typeof x==="string"
?x
:(x?.url||
x?.src||
x?.image||
"")
)
.filter(Boolean);

const primary=
data.main_image||
gallery[0]||
v(data,[
"image",
"image_url",
"thumbnail",
"product_image"
],"");

const images=
[
primary,
...gallery.filter(x=>x!==primary)
]
.filter(Boolean);

product={

id:data.id,

title:v(
data,
["name","title","product_name"],
"Product"
),

image:primary,

images:

images.length
?images
:[""],

price:
num(v(
data,
["price","selling_price","sale_price"],
149
))||149,

mrp:
num(v(
data,
["mrp","original_price","old_price"],
999
))||999,

description:
v(
data,
[
"description",
"short_description",
"details"
],
"Premium quality product."
),

rating:
v(
data,
["rating","avg_rating"],
4.5
),

reviews:
v(
data,
["review_count","reviews"],
128
),

stock:
Number(
v(
data,
[
"stock",
"inventory",
"available_stock"
],
50
)
),

badge:
v(
data,
["badge","label"],
"BESTSELLER"
),

category:
v(
data,
["category","category_name"],
""
),

customize_enabled:
Boolean(data.customize_enabled),

return_enabled:
data.return_enabled===undefined
?true
:Boolean(data.return_enabled),

return_days:
Number(data.return_days)||10,

cod_enabled:
data.cod_enabled===undefined
?true
:Boolean(data.cod_enabled),

assured_enabled:
data.assured_enabled===undefined
?true
:Boolean(data.assured_enabled),

/*
IMPORTANT:
Admin ke Supabase columns

highlights:
data.highlights||[],

all_details:
data.all_details||[]

};

render();

}catch(e){

console.error(e);

"loading"
).innerHTML=
"<div style='text-align:center'>"+

}

renderDeliveryDetails();

document.getElementById(

/* IMAGES */

currentIndex=0;

const slider=
document.getElementById("slider");

slider.innerHTML=
product.images.map(
(url,i)=>`

<div class="slide">

<img
src="${escapeHtml(url)}"
alt="${escapeHtml(product.title)}"
loading="${i===0?"eager":"lazy"}"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='flex';
">

<div class="imgFallback">
Image unavailable
</div>

</div>

`
).join("");

slider.scrollLeft=0;

slider.removeEventListener(

);

slider.addEventListener(
"scroll",
onSliderScroll,
{passive:true}
);

/* DOTS */

const dots=
document.getElementById("dots");

const multi=
product.images.length>1;

dots.innerHTML=
multi
?product.images.map(
(_,i)=>`

<button
type="button"
class="dot ${i===0?"active":""}"
onclick="goToImage(${i})"
aria-label="Go to image ${i+1}">
</button>

`
).join("")
:"";

dots.style.display=
multi?"flex":"none";

document
.querySelectorAll(".navBtn")
.forEach(
b=>b.style.display=
multi?"":"none"
);

updateNavState();

/* ABOUT */

document.getElementById(
"content"
).innerHTML=
"<h3>"+
escapeHtml(product.title)+
"</h3><p>"+
escapeHtml(product.description)+
"</p>";

updateCart();

}

/* SLIDER */

function onSliderScroll(){

const slider=
document.getElementById("slider");

const w=
slider.clientWidth||1;

const idx=
Math.round(
slider.scrollLeft/w
);

if(idx!==currentIndex){

currentIndex=idx;

product.image=
product.images[currentIndex]||
product.image;

updateDots();

updateNavState();

}

}

function updateDots(){

document
.querySelectorAll("#dots .dot")
.forEach(
(d,i)=>
d.classList.toggle(
"active",
i===currentIndex
)
);

}

function updateNavState(){

const prev=
document.querySelector(".prevBtn");

const next=
document.querySelector(".nextBtn");

if(!prev||!next||!product)return;

prev.disabled=
currentIndex<=0;

next.disabled=
currentIndex>=
product.images.length-1;

}

function goToImage(i){

const slider=
document.getElementById("slider");

currentIndex=
Math.max(
0,
Math.min(
product.images.length-1,
i
)
);

product.image=
product.images[currentIndex]||
product.image;

slider.scrollTo({
left:
currentIndex*
slider.clientWidth,
behavior:"smooth"
});

updateDots();

updateNavState();

}

function prevImage(){
goToImage(currentIndex-1)
}

function nextImage(){
goToImage(currentIndex+1)
}

/* QTY */

function changeQty(n){

qty=
Math.max(
1,
Math.min(
product.stock||99,
qty+n
)
);

document.getElementById(
"qty"
).textContent=qty;

/*
BUY PRICE FIX:
Qty change hone par button price same rahega.
*/

document.getElementById(
"buyPrice"
).textContent=
money(product.price);

}

/* USER */

async function getUser(){

const {data}=
await supabaseClient.auth.getSession();

return data.session?.user||null;

}

/* CART */

async function addToCart(){

if(!product)return;

const user=
await getUser();

if(!user){

toast("Please login first");

setTimeout(
()=>location.href=
"/ecom/account.html",
800
);

return;

}

const {data:old,error:readError}=
await supabaseClient
.from("cart_items")
.select("id,qty")
.eq("user_id",user.id)
.eq("product_id",product.id)
.maybeSingle();

if(readError){

toast(readError.message);
return;

}

const newQty=
(old?.qty||0)+qty;

const customizeInput=
document.getElementById(
"customizeInput"
);

const customizeText=
product.customize_enabled
?(customizeInput?.value||"").trim()
:"";

const row={

user_id:user.id,

product_id:product.id,

title:product.title,

image:product.image,

price:product.price,

mrp:product.mrp,

qty:newQty,

customize_text:customizeText,

updated_at:
new Date().toISOString()

};

const {error}=
await supabaseClient
.from("cart_items")
.upsert(
row,
{
onConflict:
"user_id,product_id"
}
);

if(error){

toast(error.message);
return;

}

updateCart();

toast("✓ Added to Cart");

}

async function updateCart(){

const user=
await getUser();

if(!user){

const cartBadge=
document.getElementById(
"cartCount"
);

if(cartBadge)
cartBadge.textContent="0";

return;

}

const {data,error}=
await supabaseClient
.from("cart_items")
.select("qty")
.eq("user_id",user.id);

if(error){

console.error(error);
return;

}

const cartBadge=
document.getElementById(
"cartCount"
);

if(cartBadge)
cartBadge.textContent=
(data||[])
.reduce(
(s,x)=>
s+(Number(x.qty)||0),
0
);

}
