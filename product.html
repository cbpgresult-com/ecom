<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | MyStore</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f5ff;
  color:#111;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= HEADER ================= */


/* ================= PAGE ================= */

.page{
  width:min(1450px,100%);
  margin:auto;
  padding:22px 4%;
}


/* ================= PRODUCT ================= */

.product{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(55,30,120,.08);
}

.grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  min-height:650px;
}

/* ================= GALLERY ================= */

.gallery{
  padding:28px;
  background:linear-gradient(145deg,#fff,#f2efff);
  border-right:1px solid #eee8ff;
}

.main{
  height:550px;
  background:#fff;
  border:1px solid #eee8ff;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  touch-action:pan-y;
}

.main img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  padding:35px;
  min-width:0;
  min-height:0;
  user-select:none;
  -webkit-user-drag:none;
}

.pill{
  position:absolute;
  top:16px;
  left:16px;
  z-index:5;
  background:#24115f;
  color:#fff;
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
}

.thumbs{
  display:flex;
  gap:8px;
  padding-top:13px;
  overflow:auto;
  scrollbar-width:none;
}

.thumbs::-webkit-scrollbar{
  display:none;
}

.thumb{
  width:70px;
  height:70px;
  object-fit:contain;
  background:#fff;
  border:1px solid #ddd8f4;
  border-radius:10px;
  padding:5px;
  flex:0 0 auto;
}

.thumb.active{
  border:2px solid #6d28d9;
  box-shadow:0 0 0 2px rgba(109,40,217,.10);
}

/* ================= INFO ================= */

.info{
  padding:38px 42px;
  display:flex;
  flex-direction:column;
}

.tag{
  align-self:flex-start;
  background:#24115f;
  color:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800;
}

.title{
  font-size:34px;
  line-height:1.2;
  margin:14px 0 0;
  color:#171323;
}

.rating{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:15px;
}

.rate{
  background:#15803d;
  color:#fff;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:800;
}

.reviews{
  color:#6b7280;
  font-size:12px;
}

.pricebox{
  margin-top:24px;
  padding-bottom:20px;
  border-bottom:1px solid #eee8ff;
}

.price{
  font-size:39px;
  font-weight:800;
  color:#24115f;
}

.mrp{
  text-decoration:line-through;
  color:#888;
  font-size:14px;
}

.off{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-left:8px;
}

.desc{
  color:#4b5563;
  font-size:14px;
  line-height:1.75;
  margin-top:20px;
}

.stock{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-top:16px;
}

.qtyrow{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:20px;
  font-size:13px;
  font-weight:800;
}

.qty{
  display:flex;
  border:1px solid #ddd8f4;
  border-radius:10px;
  overflow:hidden;
  height:40px;
}

.qty button{
  width:40px;
  border:0;
  background:#f7f5ff;
  color:#24115f;
  font-weight:800;
}

.qty span{
  width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.customize-row{display:none;align-items:center;gap:10px;margin-top:14px}.customize-row.show{display:flex}.customize-input{flex:1;height:40px;border:1px solid #ddd8f4;border-radius:10px;padding:0 12px;outline:0;background:#fff}.customize-input:focus{border-color:#6d28d9}.customize-label{font-size:13px;font-weight:800;color:#24115f;white-space:nowrap}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px;
}

.feature{
  min-width:0;
  text-align:center;
  border:1px solid #eeeeee;
  border-radius:11px;
  background:#fff;
  padding:10px 4px 9px;
  font-size:9px;
  color:#555;
  box-sizing:border-box;
}

.feature-icon{
  width:22px;
  height:22px;
  margin:0 auto 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  background:#f5f7fb;
  font-size:13px;
  font-weight:900;
}

.feature b{
  display:block;
  color:#202020;
  font-size:9px;
  line-height:1.2;
  margin-bottom:3px;
  white-space:normal;
}

.feature small{
  display:block;
  color:#777;
  font-size:8px;
  line-height:1.2;
}

.cta{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:10px;
  margin-top:auto;
  padding-top:24px;
}

.add,
.buy{
  height:56px;
  border-radius:13px;
  font-weight:800;
  font-size:14px;
}

.add{
  background:#fff;
  border:1.5px solid #24115f;
  color:#24115f;
}

.buy{
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  border:0;
  color:#fff;
}

/* ================= DETAILS ================= */

.details{
  margin-top:18px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
}

.tabs{
  display:flex;
  border-bottom:1px solid #eee8ff;
}

.tab{
  border:0;
  background:#fff;
  padding:17px 21px;
  font-weight:800;
  color:#777;
}

.tab.active{
  color:#6d28d9;
  border-bottom:2px solid #6d28d9;
}

.content{
  padding:22px;
  color:#4b5563;
  font-size:13px;
  line-height:1.8;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#24115f;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){
  .page{
    padding:10px 8px 88px;
  }

  

/* VERY SMALL PHONES */

@media(max-width:380px){

  .main{
    height:315px;
  }

  .title{
    font-size:18px;
  }

  .price{
    font-size:26px;
  }

  .thumb{
    width:53px;
    height:53px;
  }

  .add,
  .buy{
    font-size:11px;
  }
}


/* ===== MOBILE COMPACT QTY / DELIVERY FEATURES ===== */
@media(max-width:900px){
  .qtyrow{gap:5px;margin-top:10px;font-size:11px;flex-wrap:nowrap;line-height:1}
  .qty{height:32px;border-radius:8px}
  .qty button{width:30px;font-size:12px}
  .qty span{width:32px;font-size:11px}
  .customize-row{gap:6px;margin-top:8px}
  .customize-input{height:32px;font-size:11px;padding:0 8px}
  .customize-label{font-size:10px}
  .features{gap:6px;margin-top:14px}
  .feature{padding:8px 2px 7px;font-size:7px;border-radius:9px}
  .feature-icon{width:20px;height:20px;font-size:11px;margin-bottom:4px;border-radius:6px}
  .feature b{font-size:8px;margin-bottom:2px}
  .feature small{font-size:7px}
}
</style>
</head>

<body>

<main class="page">
<div
    id="loading"
    style="
      background:#fff;
      border-radius:20px;
      min-height:550px;
      display:flex;
      align-items:center;
      justify-content:center
    "
  >
    <b>Loading product...</b>
  </div>


  <section
    id="product"
    class="product"
  >

    <div class="grid">

      <!-- ================= GALLERY ================= -->

      <div class="gallery">

        <div
          class="main"
          id="mainGallery"
        >

          <span
            id="badge"
            class="pill"
          >
            BESTSELLER
          </span>

          <div
            id="imageFallback"
            style="
              display:none;
              color:#777;
              font-size:13px
            "
          >
            Image unavailable
          </div>

          <!-- ORIGINAL MAIN IMAGE -->
          <img
            id="mainImage"
            draggable="false"
          >

        </div>


        <div
          id="thumbs"
          class="thumbs"
        ></div>

      </div>


      <!-- ================= INFO ================= -->

      <div class="info">

        <span
          id="tag"
          class="tag"
        >
          BESTSELLER
        </span>


        <h1
          id="title"
          class="title"
        ></h1>


        <div class="rating">

          <span
            id="rating"
            class="rate"
          ></span>

          <span
            id="reviews"
            class="reviews"
          ></span>

        </div>


        <div class="pricebox">

          <span
            id="price"
            class="price"
          ></span>

          <br>

          <span
            id="mrp"
            class="mrp"
          ></span>

          <span
            id="off"
            class="off"
          ></span>

        </div>


        <div
          id="description"
          class="desc"
        ></div>


        <div
          id="stock"
          class="stock"
        ></div>


        <div class="qtyrow">

          Qty.

          <div class="qty">

            <button onclick="changeQty(-1)">
              −
            </button>

            <span id="qty">
              1
            </span>

            <button onclick="changeQty(1)">
              +
            </button>

          </div>

        </div>

        <div id="customizeRow" class="customize-row">
          <span class="customize-label">Customize</span>
          <input id="customizeInput" class="customize-input" type="text" maxlength="120" placeholder="Enter customization...">
        </div>

        <div id="deliveryFeatures" class="features"></div>


        <div class="cta">

          <button
            class="add"
            onclick="addToCart()"
          >
            🛒 Add to Cart
          </button>

          <button
            class="buy"
            onclick="buyNow()"
          >
            ⚡ Buy at
            <span id="buyPrice"></span>
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- ================= DETAILS ================= -->

  <section
    id="details"
    class="details"
    style="display:none"
  >

    <div class="tabs">

      <button
        class="tab active"
        onclick="tab('about',this)"
      >
        About
      </button>

      <button
        class="tab"
        onclick="tab('specs',this)"
      >
        Specifications
      </button>

      <button
        class="tab"
        onclick="tab('delivery',this)"
      >
        Delivery & Returns
      </button>

    </div>


    <div
      id="content"
      class="content"
    ></div>

  </section>

</main>


<div
  id="toast"
  class="toast"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let product = null;
let qty = 1;
let currentImageIndex = 0;


/* ================= HELPERS ================= */

const money = n =>
"₹" +
Math.round(Number(n)||0)
.toLocaleString("en-IN");


const id = () =>
new URLSearchParams(location.search).get("id");


function v(o,ks,d=""){

  for(const k of ks){

    if(
      o[k] != null &&
      o[k] !== ""
    ){
      return o[k];
    }

  }

  return d;
}


function num(v){

  const m =
  String(v??"")
  .match(/[0-9,]+(?:\.[0-9]+)?/);

  return m
    ? Number(m[0].replace(/,/g,""))
    : 0;
}


function toast(x){

  const t =
  document.getElementById("toast");

  t.textContent = x;

  t.classList.add("show");

  clearTimeout(window.tt);

  window.tt =
  setTimeout(
    () => t.classList.remove("show"),
    2200
  );
}


/* ================= LOAD PRODUCT ================= */

async function load(){

  try{

    if(!id())
      throw Error("Product ID missing");


    const {
      data,
      error
    } =
    await supabaseClient
    .from("products")
    .select("*")
    .eq("id",id())
    .single();


    if(error)
      throw error;


    let gallery = [];


    if(Array.isArray(data.images)){

      gallery = data.images;

    }

    else if(
      typeof data.images === "string"
    ){

      try{

        const parsed =
        JSON.parse(data.images);

        if(Array.isArray(parsed))
          gallery = parsed;

      }catch{}

    }


    gallery =
    gallery
    .map(
      x =>
      typeof x === "string"
      ? x
      : (
          x?.url ||
          x?.src ||
          x?.image ||
          ""
        )
    )
    .filter(Boolean);


    const primary =
    data.main_image ||
    gallery[0] ||
    v(
      data,
      [
        "image",
        "image_url",
        "thumbnail",
        "product_image"
      ],
      ""
    );


    product = {

      id:data.id,

      title:v(
        data,
        [
          "name",
          "title",
          "product_name"
        ],
        "Product"
      ),

      image:primary,

      images:[
        primary,
        ...gallery.filter(
          x => x !== primary
        )
      ],

      price:
      num(
        v(
          data,
          [
            "price",
            "selling_price",
            "sale_price"
          ],
          149
        )
      ) || 149,

      mrp:
      num(
        v(
          data,
          [
            "mrp",
            "original_price",
            "old_price"
          ],
          999
        )
      ) || 999,

      description:v(
        data,
        [
          "description",
          "short_description",
          "details"
        ],
        "Premium quality product."
      ),

      rating:v(
        data,
        [
          "rating",
          "avg_rating"
        ],
        4.5
      ),

      reviews:v(
        data,
        [
          "review_count",
          "reviews"
        ],
        128
      ),

      stock:Number(
        v(
          data,
          [
            "stock",
            "inventory",
            "available_stock"
          ],
          50
        )
      ),

      badge:v(
        data,
        [
          "badge",
          "label"
        ],
        "BESTSELLER"
      ),

      category:v(
        data,
        [
          "category",
          "category_name"
        ],
        ""
      ),

      customizeEnabled:Boolean(
        data.customize_enabled ?? false
      ),

      stockStatus:String(data.stock_status || "stock"),
      returnEnabled:Boolean(data.return_enabled ?? true),
      returnDays:Number(data.return_days || 10),
      codEnabled:Boolean(data.cod_enabled ?? true),
      assuredEnabled:Boolean(data.assured_enabled ?? true)

    };


    render();

  }

  catch(e){

    console.error(e);

    document.getElementById(
      "loading"
    ).innerHTML =
    `
      <div style="text-align:center">
        <h2>Product not found</h2>
        <p>${e.message}</p>
      </div>
    `;

  }

}


/* ================= RENDER ================= */

function render(){

  document.getElementById(
    "loading"
  ).style.display =
  "none";


  document.getElementById(
    "product"
  ).style.display =
  "block";


  document.getElementById(
    "details"
  ).style.display =
  "block";


  document.getElementById(
    "title"
  ).textContent =
  product.title;


  document.getElementById(
    "price"
  ).textContent =
  money(product.price);


  document.getElementById(
    "buyPrice"
  ).textContent =
  money(product.price);

  const customizeRow = document.getElementById("customizeRow");
  const customizeInput = document.getElementById("customizeInput");
  if(product.customizeEnabled){
    customizeRow.classList.add("show");
  }else{
    customizeRow.classList.remove("show");
    customizeInput.value = "";
  }


  document.getElementById(
    "mrp"
  ).textContent =
  product.mrp
  ? money(product.mrp)
  : "";


  document.getElementById(
    "off"
  ).textContent =
  product.mrp > product.price
  ? Math.max(
      0,
      Math.round(
        (1-product.price/product.mrp)*100
      )
    ) + "% OFF"
  : "";


  document.getElementById(
    "description"
  ).textContent =
  product.description;


  document.getElementById(
    "rating"
  ).textContent =
  "★ " + product.rating;


  document.getElementById(
    "reviews"
  ).textContent =
  product.reviews + " reviews";


  document.getElementById(
    "tag"
  ).textContent =
  product.badge;


  document.getElementById(
    "badge"
  ).textContent =
  product.badge;


  const stockEl=document.getElementById("stock");
  stockEl.className="stock";
  if(product.stock<=0){
    stockEl.textContent="✕ Out of Stock";
    stockEl.classList.add("out-stock");
  }else if(product.stockStatus==="few_left"){
    stockEl.textContent="Few left";
    stockEl.classList.add("few-left-stock");
  }else{
    stockEl.textContent="✓ In Stock ("+product.stock+" available)";
  }

  /* DELIVERY / RETURN FEATURES */
  const features=document.getElementById("deliveryFeatures");
  const cards=[];

  cards.push(`
    <div class="feature">
      <span class="feature-icon return-icon">↩</span>
      <b>${product.returnEnabled ? product.returnDays+"-Day Return" : "No Return"}</b>
      <small>${product.returnEnabled ? "Easy returns" : "Not returnable"}</small>
    </div>
  `);

  if(product.codEnabled){
    cards.push(`
      <div class="feature">
        <span class="feature-icon cod-icon">▣</span>
        <b>Cash on Delivery</b>
        <small>Available</small>
      </div>
    `);
  }

  if(product.assuredEnabled){
    cards.push(`
      <div class="feature">
        <span class="feature-icon assured-icon">✓</span>
        <b>Trikunt Assured</b>
        <small>Quality assured</small>
      </div>
    `);
  }

  features.innerHTML=cards.join("");


  /* MAIN IMAGE */

  setMainImage(0);


  /* THUMBNAILS */

  const thumbs =
  document.getElementById("thumbs");

  thumbs.innerHTML =
  product.images
  .map(
    (url,i) =>
    `
      <button
        type="button"
        style="
          border:0;
          background:transparent;
          padding:0;
        "
        onclick="selectImage(${i})"
      >
        <img
          class="thumb ${i===0?"active":""}"
          src="${escapeHtml(url)}"
          alt="${escapeHtml(product.title)}"
          onerror="this.style.visibility='hidden'"
          draggable="false"
        >
      </button>
    `
  )
  .join("");


  content.innerHTML =
  "<h3>"+
  product.title+
  "</h3><p>"+
  product.description+
  "</p>";


  updateCart();

}


/* ================= MAIN IMAGE ================= */

function setMainImage(index){

  if(
    !product ||
    !product.images ||
    !product.images[index]
  ){
    return;
  }


  currentImageIndex =
  index;


  product.image =
  product.images[index];


  const main =
  document.getElementById(
    "mainImage"
  );


  const fallback =
  document.getElementById(
    "imageFallback"
  );


  fallback.style.display =
  "none";


  main.style.display =
  "block";


  main.alt =
  product.title;


  main.src =
  product.images[index];


  main.onerror =
  () => {

    main.style.display =
    "none";

    fallback.style.display =
    "block";

  };


  updateActiveThumb(index);

}


/* ================= SELECT IMAGE ================= */

function selectImage(index){

  setMainImage(index);

}


/* ================= ACTIVE THUMB ================= */

function updateActiveThumb(index){

  document
  .querySelectorAll(
    "#thumbs .thumb"
  )
  .forEach(
    (x,i) => {

      x.classList.toggle(
        "active",
        i === index
      );

    }
  );


  const active =
  document.querySelector(
    "#thumbs .thumb.active"
  );


  if(
    active &&
    window.innerWidth <= 900
  ){

    active.scrollIntoView({
      behavior:"smooth",
      block:"nearest",
      inline:"center"
    });

  }

}


/* =====================================================
   MOBILE FINGER SWIPE
   ===================================================== */

let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;


const mainGallery =
document.getElementById(
  "mainGallery"
);


mainGallery.addEventListener(
  "touchstart",
  function(e){

    if(
      !product ||
      window.innerWidth > 900
    ){
      return;
    }


    const touch =
    e.changedTouches[0];


    touchStartX =
    touch.clientX;


    touchStartY =
    touch.clientY;

  },
  {
    passive:true
  }
);


mainGallery.addEventListener(
  "touchend",
  function(e){

    if(
      !product ||
      window.innerWidth > 900
    ){
      return;
    }


    const touch =
    e.changedTouches[0];


    touchEndX =
    touch.clientX;


    touchEndY =
    touch.clientY;


    handleSwipe();

  },
  {
    passive:true
  }
);


function handleSwipe(){

  const diffX =
  touchEndX - touchStartX;


  const diffY =
  touchEndY - touchStartY;


  /*
     Vertical movement zyada ho
     to swipe ignore.
  */

  if(
    Math.abs(diffY) >
    Math.abs(diffX)
  ){
    return;
  }


  /*
     Minimum 45px horizontal movement.
  */

  if(
    Math.abs(diffX) < 45
  ){
    return;
  }


  /* LEFT = NEXT */

  if(diffX < 0){

    if(
      currentImageIndex <
      product.images.length - 1
    ){

      setMainImage(
        currentImageIndex + 1
      );

    }

  }


  /* RIGHT = PREVIOUS */

  else{

    if(
      currentImageIndex > 0
    ){

      setMainImage(
        currentImageIndex - 1
      );

    }

  }

}


/* ================= ESCAPE ================= */

function escapeHtml(value){

  const s =
  String(value??"");


  return s.replace(
    /[&<>"']/g,
    c =>
    ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}


/* ================= QUANTITY ================= */

function changeQty(n){

  qty =
  Math.max(
    1,
    Math.min(
      product.stock || 99,
      qty+n
    )
  );


  document.getElementById(
    "qty"
  ).textContent =
  qty;


}


/* ================= USER ================= */

async function getUser(){

  const {data} =
  await supabaseClient
  .auth
  .getSession();


  return data.session?.user || null;

}


/* ================= ADD CART ================= */

async function addToCart(){

  if(!product)
    return;


  const user =
  await getUser();


  if(!user){

    toast(
      "Please login first"
    );

    setTimeout(
      () =>
      location.href =
      "/ecom/account.html",
      800
    );

    return;

  }


  const {
    data:old,
    error:readError
  } =
  await supabaseClient
  .from("cart_items")
  .select("id,qty")
  .eq(
    "user_id",
    user.id
  )
  .eq(
    "product_id",
    product.id
  )
  .maybeSingle();


  if(readError){

    toast(
      readError.message
    );

    return;

  }


  const newQty =
  (old?.qty || 0) + qty;


  const row = {

    user_id:user.id,

    product_id:product.id,

    title:product.title,

    image:product.image,

    price:product.price,

    mrp:product.mrp,

    qty:newQty,

    customize_text:product.customizeEnabled
      ? document.getElementById("customizeInput").value.trim()
      : null,

    updated_at:
    new Date().toISOString()

  };


  const {error} =
  await supabaseClient
  .from("cart_items")
  .upsert(
    row,
    {
      onConflict:
      "user_id,product_id"
    }
  );


  if(error){

    toast(
      error.message
    );

    return;

  }


  updateCart();

  toast(
    "✓ Added to Cart"
  );

}


/* ================= CART COUNT ================= */

async function updateCart(){

  const user =
  await getUser();


  if(!user){

    cartCount.textContent =
    "0";

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
  .from("cart_items")
  .select("qty")
  .eq(
    "user_id",
    user.id
  );


  if(error){

    console.error(error);

    return;

  }


  cartCount.textContent =
  (data || [])
  .reduce(
    (s,x) =>
    s + (Number(x.qty)||0),
    0
  );

}


/* ================= BUY NOW ================= */

async function buyNow(){

  if(!product)
    return;


  const user =
  await getUser();


  if(!user){

    toast(
      "Please login first"
    );

          ? document.getElementById("customizeInput").value.trim()
          : null,

      }

  location.href =

}


/* ================= TABS ================= */

function tab(type,b){

  document
  .querySelectorAll(".tab")
  .forEach(
    x =>
    x.classList.remove(
      "active"
    )
  );


  b.classList.add(
    "active"
  );


  content.innerHTML =
  type === "about"

  ?

  "<h3>"+
  product.title+
  "</h3><p>"+
  product.description+
  "</p>"

  :

  type === "specs"

  ?

  "<p><b>Category:</b> "+
  (product.category||"—")+
  "</p>"+
  "<p><b>Rating:</b> ★ "+
  product.rating+
  "</p>"+
  "<p><b>Product ID:</b> "+
  product.id+
  "</p>"+
  "<p><b>Payment:</b> COD available</p>"

  :

  "<p><b>Delivery:</b> Dispatch after order confirmation.</p>"+
  "<p><b>Returns:</b> Product policy applies.</p>";

}
