<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | MyStore</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .product-page {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 25px;
      font-weight: 600;
      transition: opacity 0.15s ease;
    }

    .back-btn:hover {
      opacity: 0.7;
    }

    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      background: white;
      padding: 30px;
      border-radius: 22px;
    }

    .product-detail-image {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 18px;
      background: #f5f5f5;
    }

    .detail-info {
      padding: 10px;
    }

    .detail-badge {
      display: inline-block;
      background: #111;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .detail-title {
      font-size: 34px;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .detail-rating {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      font-size: 15px;
      color: #333;
    }

    .detail-rating svg {
      width: 16px;
      height: 16px;
      fill: #f5a623;
      flex-shrink: 0;
    }

    .detail-price {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .detail-mrp {
      color: #999;
      text-decoration: line-through;
      margin-right: 10px;
    }

    .detail-discount {
      color: #16803c;
      font-weight: 700;
    }

    .detail-description {
      color: #666;
      line-height: 1.7;
      margin: 25px 0;
    }

    .stock {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .stock.in-stock {
      color: #16803c;
    }

    .stock.out-stock {
      color: #b91c1c;
    }

    .stock svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .detail-cart {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: #111;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .detail-cart svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .detail-cart:hover {
      opacity: .85;
    }

    .detail-cart:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .loading-product,
    .error-product {
      text-align: center;
      padding: 100px 20px;
    }

    @media (max-width: 700px) {
      .product-page {
        margin: 15px auto;
        padding: 12px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 15px;
      }

      .detail-title {
        font-size: 25px;
      }

      .detail-price {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
      MyStore
    </div>

    <div class="search">
      <input type="text" placeholder="Search products..." onclick="window.location.href='index.html'">
    </div>

    <button class="cart-btn" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      Cart
      <span id="cartCount">0</span>
    </button>
  </header>


  <main class="product-page">

    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"></path>
      </svg>
      Back
    </button>

    <div id="loadingProduct" class="loading-product">
      Loading product...
    </div>

    <div id="productContainer" style="display:none;"></div>

    <div id="errorProduct" class="error-product" style="display:none;">
      <h2>Product not found</h2>
      <p>This product is unavailable or has been removed.</p>
      <br>
      <button class="detail-cart" onclick="window.location.href='index.html'">
        Continue Shopping
      </button>
    </div>

  </main>


  <script>

    /* =========================================
       ICONS
       ========================================= */

    const ICONS = {
      star: `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,

      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,

      cross: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,

      cart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>`
    };



/* =========================================
   SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL =
  "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );




    /* =========================================
       PRODUCT ID
       ========================================= */

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");


    /* =========================================
       LOAD PRODUCT
       ========================================= */

    async function loadProduct() {
      if (!productId) {
        showError();
        return;
      }

      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .eq("is_active", true)
        .single();

      if (error || !data) {
        console.error(error);
        showError();
        return;
      }

      showProduct(data);
    }


    /* =========================================
       SHOW PRODUCT
       ========================================= */

    function showProduct(product) {
      document.title = product.name + " | MyStore";

      const container = document.getElementById("productContainer");

      const image = product.main_image || "https://placehold.co/600x600/png?text=Product";

      const price = Number(product.price || 0).toLocaleString("en-IN");

      const mrp = product.mrp
        ? Number(product.mrp).toLocaleString("en-IN")
        : "";

      const inStock = Number(product.stock) > 0;

      container.innerHTML = `
        <div class="product-detail">

          <div>
            <img
              class="product-detail-image"
              src="${image}"
              alt="${escapeHTML(product.name)}"
            >
          </div>

          <div class="detail-info">

            ${
              product.badge
                ? `<span class="detail-badge">${escapeHTML(product.badge)}</span>`
                : ""
            }

            <h1 class="detail-title">${escapeHTML(product.name)}</h1>

            <div class="detail-rating">
              ${ICONS.star}
              ${product.rating || 0}
              ${product.review_count ? `(${product.review_count} reviews)` : ""}
            </div>

            <div class="detail-price">₹${price}</div>

            <div>
              ${mrp ? `<span class="detail-mrp">₹${mrp}</span>` : ""}
              ${
                product.discount_percent
                  ? `<span class="detail-discount">${product.discount_percent}% OFF</span>`
                  : ""
              }
            </div>

            <p class="detail-description">
              ${escapeHTML(product.description || "No description available.")}
            </p>

            <div class="stock ${inStock ? "in-stock" : "out-stock"}">
              ${inStock ? ICONS.check : ICONS.cross}
              ${inStock ? `In Stock (${product.stock} available)` : "Out of Stock"}
            </div>

            <button
              class="detail-cart"
              ${!inStock ? "disabled" : ""}
              onclick="addToCart(${product.id})">
              ${inStock ? ICONS.cart : ""}
              ${inStock ? "Add to Cart" : "Out of Stock"}
            </button>

          </div>

        </div>
      `;

      document.getElementById("loadingProduct").style.display = "none";
      container.style.display = "block";
    }


    /* =========================================
       ADD TO CART
       ========================================= */

    async function addToCart(id) {
      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", id)
        .single();

      if (error || !data) {
        alert("Product unavailable.");
        return;
      }

      let cart = JSON.parse(localStorage.getItem("cart") || "[]");

      const existing = cart.find(item => item.id === data.id);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: data.id,
          name: data.name,
          price: data.price,
          image: data.main_image,
          quantity: 1
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
      alert("Product added to cart!");
    }


    /* =========================================
       CART COUNT
       ========================================= */

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const count = cart.reduce((total, item) => total + item.quantity, 0);
      document.getElementById("cartCount").textContent = count;
    }


    /* =========================================
       ERROR
       ========================================= */

    function showError() {
      document.getElementById("loadingProduct").style.display = "none";
      document.getElementById("errorProduct").style.display = "block";
    }


    /* =========================================
       HTML SECURITY
       ========================================= */

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    updateCartCount();
    loadProduct();

  </script>

</body>
</html>
