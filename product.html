<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | MyStore</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* =========================
   PAGE
========================= */
.page{
  width:min(1450px,100%);
  margin:auto;
  padding:22px 4% 45px
}

.product{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 40px #0000000d
}

.grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  min-height:650px
}

/* =========================
   GALLERY
========================= */
.gallery{
  padding:28px;
  background:linear-gradient(145deg,#fff,#f1f3f5);
  border-right:1px solid #eee
}

.main{
  height:550px;
  background:#fff;
  border:1px solid #eee;
  border-radius:20px;
  position:relative;
  overflow:hidden
}

.pill{
  position:absolute;
  top:16px;
  left:16px;
  background:#111;
  color:#fff;
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  z-index:6;
  letter-spacing:.3px
}

.slider{
  display:flex;
  height:100%;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none
}

.slider::-webkit-scrollbar{display:none}

.slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
}

.slide img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  padding:35px;
  min-width:0;
  min-height:0
}

.imgFallback{
  display:none;
  align-items:center;
  justify-content:center;
  height:100%;
  width:100%;
  color:#777;
  font-size:13px;
  position:absolute;
  inset:0
}

.navBtn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid #ddd;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 14px #0000001f;
  z-index:6;
  color:#111;
  transition:box-shadow .15s,transform .15s
}

.navBtn:hover:not(:disabled){
  box-shadow:0 6px 18px #00000029;
  transform:translateY(-50%) scale(1.05)
}

.navBtn:disabled{
  opacity:.35;
  cursor:default
}

.prevBtn{left:14px}
.nextBtn{right:14px}

.dots{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:14px 0 2px
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#d9d9d9;
  border:0;
  padding:0;
  cursor:pointer
}

.dot.active{
  background:#111;
  width:20px;
  border-radius:5px;
  transition:width .2s,background .2s
}

/* =========================
   PRODUCT INFO
========================= */
.info{
  padding:38px 42px;
  display:flex;
  flex-direction:column
}

.tag{
  align-self:flex-start;
  background:#111;
  color:#fff;
  border-radius:7px;
  padding:6px 9px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.3px
}

.title{
  font-size:29px;
  line-height:1.3;
  margin:14px 0 0;
  font-weight:700;
  color:#1a1a1a
}

.rating{
  display:flex;
  gap:9px;
  align-items:center;
  margin-top:15px
}

.rate{
  background:#15803d;
  color:#fff;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:3px
}

.reviews{
  color:#6b7280;
  font-size:12px
}

.pricebox{
  margin-top:24px;
  padding-bottom:20px;
  border-bottom:1px solid #eee
}

.price{
  font-size:33px;
  font-weight:800;
  letter-spacing:-.5px
}

.mrp{
  text-decoration:line-through;
  color:#888;
  font-size:14px
}

.off{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-left:8px
}

.desc{
  color:#4b5563;
  font-size:14px;
  line-height:1.75;
  margin-top:20px
}

.stock{
  color:#15803d;
  font-weight:800;
  font-size:13px;
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:6px
}

/* =========================
   DELIVERY
========================= */
.deliveryDetails{
  margin-top:24px
}

.deliveryTitle{
  font-size:18px;
  font-weight:800;
  margin-bottom:11px;
  color:#111;
  letter-spacing:-.2px
}

.deliveryCard{
  border-radius:16px;
  overflow:hidden;
  border:1px solid #e3e7ed;
  background:#fff;
  box-shadow:0 8px 24px rgba(20,30,45,.07)
}

.deliveryAddress{
  display:flex;
  align-items:center;
  cursor:pointer;
  gap:11px;
  background:linear-gradient(180deg,#f4f8ff,#eef5ff);
  padding:13px 14px;
  min-height:50px
}

.deliveryIcon{
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 26px;
  color:#111
}

.deliveryIcon svg{
  width:22px;
  height:22px;
  display:block;
  stroke:currentColor
}

/* ADDRESS ALWAYS ONE LINE */
.deliveryAddressText{
  flex:1 1 auto;
  min-width:0;
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
  color:#20242b;
  line-height:1.2;
  font-size:12px;
  font-weight:700
}

.deliveryArrow{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  flex:0 0 24px
}

.deliveryArrow svg{
  width:18px;
  height:18px;
  stroke:currentColor
}

.deliveryDate{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  background:#fafafa;
  border-top:1px solid #edf0f3;
  font-size:12px;
  font-weight:800;
  color:#20242b
}

.deliverySeller{
  padding:12px 14px 13px;
  background:#fafafa;
  border-top:1px solid #edf0f3
}

.sellerMain{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:800;
  color:#20242b
}

.sellerMain svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  flex:0 0 20px
}

.sellerSub{
  font-size:10px;
  color:#747b85;
  margin:4px 0 0 28px
}

.sellerLink{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin:6px 0 0 28px;
  color:#1769d5;
  font-size:11px;
  font-weight:800
}

/* =========================
   QTY
========================= */
.qtyrow{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  margin-top:14px;
  font-size:12px;
  font-weight:800;
  min-height:34px
}

.qty{
  display:flex;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
  height:34px
}

.qty button{
  width:32px;
  border:0;
  background:#f7f7f7;
  font-size:13px
}

.qty span{
  width:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px
}

/* =========================
   CUSTOMIZE
========================= */
#customizeWrap{
  display:none;
  align-items:center;
  gap:7px;
  margin-left:4px
}

/* =========================
   PREMIUM FEATURES
========================= */
.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:22px
}

.feature{
  text-align:center;
  border:1px solid #e4e7eb;
  border-radius:15px;
  background:linear-gradient(180deg,#fff,#fbfcfd);
  padding:11px 5px 10px;
  font-size:9px;
  color:#69717c;
  min-height:78px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 16px rgba(20,30,45,.045)
}

.featureIcon{
  width:31px;
  height:31px;
  border-radius:10px;
  background:#f3f6fa;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:7px;
  color:#1d4ed8
}

.featureIcon svg{
  width:19px;
  height:19px;
  stroke:currentColor
}

.feature b{
  display:block;
  color:#20242b;
  font-size:9px;
  line-height:1.2;
  margin:0
}

/* =========================
   CTA
========================= */
.cta{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:10px;
  margin-top:auto;
  padding-top:24px
}

.add,.buy{
  height:56px;
  border-radius:14px;
  font-weight:800;
  font-size:14px;
  transition:transform .12s,box-shadow .12s,background .15s
}

.add{
  background:#fff;
  border:1px solid #d9dde3;
  box-shadow:0 5px 16px rgba(20,30,45,.05)
}

.add:hover{
  background:#f8fafc;
  box-shadow:0 8px 22px rgba(20,30,45,.08)
}

.add:active,.buy:active{
  transform:scale(.98)
}

.buy{
  background:linear-gradient(135deg,#ffbd19,#ff9800);
  border:0;
  box-shadow:0 8px 22px rgba(255,152,0,.28);
  color:#1a1a1a
}

.cta svg{
  width:18px;
  height:18px;
  vertical-align:-4px;
  margin-right:5px;
  stroke:currentColor
}

/* =====================================================
   PRODUCT HIGHLIGHTS + ALL DETAILS
===================================================== */
.details{
  margin-top:18px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(20,30,45,.045)
}

/* section heading */
.detailsSectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  border-bottom:1px solid #eee;
  background:#fff
}

.detailsSectionHead h2{
  font-size:21px;
  margin:0;
  font-weight:800;
  color:#171717
}

.sectionArrow{
  width:35px;
  height:35px;
  border:0;
  border-radius:10px;
  background:#f4f5f7;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
  color:#111
}

.sectionArrow:hover{
  background:#e9edf2
}

.sectionArrow svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  transition:transform .2s
}

/* highlights */
.highlights{
  padding:4px 20px 18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:45px
}

.highlight{
  min-height:64px;
  display:grid;
  grid-template-columns:155px minmax(0,1fr);
  align-items:center;
  gap:12px;
  border-bottom:1px solid #eee;
  padding:12px 0;
  font-size:13px
}

.highlight b{
  color:#777;
  font-weight:500
}

.highlight span{
  color:#222;
  font-weight:500;
  word-break:break-word
}

/* ALL DETAILS */
.detailsBody{
  display:none
}

.detailsTabs{
  display:flex;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  overflow:auto;
  background:#fff
}

.detailTab{
  border:0;
  background:#fff;
  padding:16px 20px;
  font-weight:700;
  color:#777;
  white-space:nowrap;
  position:relative
}

.detailTab.active{
  color:#111
}

.detailTab.active:after{
  content:"";
  position:absolute;
  bottom:0;
  left:16px;
  right:16px;
  height:2px;
  background:#111;
  border-radius:3px
}

.detailContent{
  padding:22px;
  color:#4b5563;
  font-size:13px;
  line-height:1.8
}

.specGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 40px
}

.specItem{
  padding:12px 0;
  border-bottom:1px solid #eee;
  display:grid;
  grid-template-columns:170px 1fr;
  gap:12px
}

.specItem b{
  color:#777;
  font-weight:500
}

.specItem span{
  color:#222;
  font-weight:500;
  word-break:break-word
}

.infoBox{
  background:#f8fafc;
  border:1px solid #e8ebef;
  border-radius:12px;
  padding:15px
}

.infoBox p{
  margin:0 0 9px
}

.infoBox p:last-child{
  margin-bottom:0
}

/* =========================
   TOAST
========================= */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#111;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
  z-index:100
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

/* =========================
   MOBILE
========================= */
@media(max-width:900px){

  #customizeWrap{
    margin-left:0!important;
    flex:1;
    min-width:0
  }

  #customizeWrap input{
    width:100%!important;
    max-width:135px;
    height:34px!important
  }

  #customizeWrap label{
    font-size:10px!important
  }

  .qtyrow{
    gap:6px;
    margin-top:12px;
    font-size:11px;
    min-height:32px
  }

  .qty{
    height:32px;
    border-radius:8px
  }

  .qty button{
    width:29px;
    font-size:12px
  }

  .qty span{
    width:30px;
    font-size:11px
  }

  .deliveryDetails{
    margin-top:18px
  }

  .deliveryTitle{
    font-size:15px;
    margin-bottom:8px
  }

  .deliveryAddress{
    padding:10px 10px;
    font-size:10px;
    min-height:43px
  }

  .deliveryDate{
    padding:10px;
    font-size:10px
  }

  .deliverySeller{
    padding:10px
  }

  .sellerMain{
    font-size:10px
  }

  .sellerSub{
    font-size:8.5px;
    margin-left:27px
  }

  .sellerLink{
    font-size:9px;
    margin:5px 0 0 27px
  }

  .deliveryIcon{
    width:23px;
    height:23px;
    flex-basis:23px
  }

  .deliveryIcon svg{
    width:19px;
    height:19px
  }

  .deliveryAddressText{
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
    max-width:100%;
    display:block
  }

  .deliveryArrow{
    width:21px;
    flex-basis:21px
  }

  .deliveryArrow svg{
    width:16px;
    height:16px
  }

  .features{
    gap:7px;
    margin-top:16px
  }

  .feature{
    min-height:68px;
    padding:8px 3px
  }

  .featureIcon{
    width:27px;
    height:27px;
    border-radius:9px;
    margin-bottom:5px
  }

  .featureIcon svg{
    width:17px;
    height:17px
  }

  .feature b{
    font-size:8.5px
  }

  .page{
    padding:12px 9px 90px
  }

  .product{
    border-radius:17px
  }

  .grid{
    grid-template-columns:1fr
  }

  .gallery{
    padding:9px 0;
    border-right:0;
    border-bottom:1px solid #eee
  }

  .main{
    height:340px;
    border:0;
    background:transparent;
    border-radius:0;
    box-shadow:none
  }

  .slide img{
    padding:10px
  }

  .navBtn{
    display:none!important
  }

  .info{
    padding:20px 16px
  }

  .title{
    font-size:19px;
    line-height:1.35;
    margin-top:10px
  }

  .price{
    font-size:26px
  }

  .mrp{
    font-size:12px
  }

  .off{
    font-size:12px
  }

  .rate{
    font-size:11px
  }

  .reviews{
    font-size:11px
  }

  .cta{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:50;
    background:#fff;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    margin:0;
    border-top:1px solid #ddd;
    box-shadow:0 -6px 20px #0000000f
  }

  .add,.buy{
    height:51px
  }

  .details{
    border-radius:15px;
    margin-top:14px
  }

  .detailsSectionHead{
    padding:15px
  }

  .detailsSectionHead h2{
    font-size:18px
  }

  .highlights{
    grid-template-columns:1fr;
    padding:2px 15px 14px;
    gap:0
  }

  .highlight{
    grid-template-columns:130px minmax(0,1fr);
    min-height:58px;
    padding:11px 0;
    font-size:11px
  }

  .detailsTabs{
    overflow-x:auto
  }

  .detailTab{
    padding:14px 16px;
    font-size:12px
  }

  .detailContent{
    padding:16px;
    font-size:12px
  }

  .specGrid{
    grid-template-columns:1fr
  }

  .specItem{
    grid-template-columns:140px 1fr;
    font-size:11px
  }
}

@media(max-width:500px){

  .features{
    grid-template-columns:repeat(3,1fr)
  }

  .feature{
    font-size:8px
  }

  .feature b{
    font-size:8.5px
  }

  .highlight{
    grid-template-columns:115px minmax(0,1fr)
  }

  .specItem{
    grid-template-columns:125px 1fr
  }
}
</style>
</head>

<body>

<main class="page">

<div id="loading"
style="background:#fff;border-radius:20px;min-height:550px;display:flex;align-items:center;justify-content:center">
<b>Loading product...</b>
</div>

<section id="product" class="product">

<div class="grid">

<!-- ================= GALLERY ================= -->
<div class="gallery">

<div class="main">

<span id="badge" class="pill">BESTSELLER</span>

<button type="button"
class="navBtn prevBtn"
onclick="prevImage()"
aria-label="Previous image">‹</button>

<button type="button"
class="navBtn nextBtn"
onclick="nextImage()"
aria-label="Next image">›</button>

<div class="slider" id="slider"></div>

</div>

<div class="dots" id="dots"></div>

</div>


<!-- ================= PRODUCT INFO ================= -->
<div class="info">

<span id="tag" class="tag">BESTSELLER</span>

<h1 id="title" class="title"></h1>

<div class="rating">
<span id="rating" class="rate"></span>
<span id="reviews" class="reviews"></span>
</div>

<div class="pricebox">
<span id="price" class="price"></span>
<br>
<span id="mrp" class="mrp"></span>
<span id="off" class="off"></span>
</div>


<!-- ================= DELIVERY DETAILS ================= -->
<div id="deliveryDetails" class="deliveryDetails">

<div class="deliveryTitle">
Delivery details
</div>

<div class="deliveryCard">

<div class="deliveryAddress"
id="deliveryAddressRow"
role="button"
tabindex="0"
onclick="openAddressSelector()"
onkeydown="if(event.key==='Enter'||event.key===' ')openAddressSelector()">

<div class="deliveryIcon" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9">
<path d="M12 21s7-6.1 7-12A7 7 0 0 0 5 9c0 5.9 7 12 7 12Z"/>
<circle cx="12" cy="9" r="2.4"/>
</svg>
</div>

<div id="deliveryAddressText"
class="deliveryAddressText">
Add delivery address
</div>

<div class="deliveryArrow" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2">
<path d="m9 18 6-6-6-6"/>
</svg>
</div>

</div>


<div class="deliveryDate">

<div class="deliveryIcon" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
<path d="M3 7h11v10H3z"/>
<path d="M14 10h4l3 3v4h-7z"/>
<circle cx="7" cy="18" r="2"/>
<circle cx="18" cy="18" r="2"/>
<path d="M5 10h6M16 13h4"/>
</svg>
</div>

<div id="deliveryDateText">
Delivery by …
</div>

</div>


<div class="deliverySeller">

<div class="sellerMain">

<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
<path d="M4 10h16v10H4z"/>
<path d="m3 10 2-5h14l2 5"/>
<path d="M8 10v2a2 2 0 0 0 4 0v-2a2 2 0 0 0 4 0v-2"/>
</svg>

<span>Fulfilled by MyStore</span>

</div>

<div class="sellerSub">
Trusted seller · Quality checked
</div>

<a class="sellerLink" href="/ecom/index.html">
See other sellers <span>›</span>
</a>

/* =====================================================
   ADDRESS

function cleanPart(v){
return v==null ? "" : String(v).trim();
}

function uniqueParts(arr){

const out=[];

for(const x of arr){

const s=cleanPart(x);

if(
s &&
!out.some(
y=>y.toLowerCase()===s.toLowerCase()
)
){
out.push(s);
}

}

return out;
}


function formatSavedAddress(a){

if(!a) return "";

if(typeof a==="string")
return a.trim();

const village=cleanPart(
a.village ||
a.locality ||
a.area ||
a.town ||
a.place ||
""
);

const district=cleanPart(
a.district ||
a.district_name ||
""
);

const city=cleanPart(
a.city ||
a.city_name ||
""
);

const state=cleanPart(
a.state ||
a.state_name ||
""
);

const pincode=cleanPart(
a.pincode ||
a.pin ||
a.postal_code ||
a.postcode ||
""
);

const plus=cleanPart(
a.plus_code ||
a.plusCode ||
a.pluscode ||
a.plus_code_address ||
""
);

const direct=cleanPart(
a.full_address ||
a.fullAddress ||
a.formatted_address ||
a.formattedAddress
);

const first=
uniqueParts([
village,
district
]).join(", ");

const second=
uniqueParts([
state,
pincode
]).join(", ");

const lines=[
first,
second,
plus
].filter(Boolean);

if(lines.length)
return lines.join("\n");

const fallback=
uniqueParts([
city,
state,
pincode
]).join(", ");

return fallback || direct;
}

formatted

try{

const payload={
savedAt:Date.now(),
text:
formatted ||
formatSavedAddress(addressObject),
data:addressObject||null
};

localStorage.setItem(
addressCacheKey(userId),
JSON.stringify(payload)
);

}catch(e){
console.warn("Address cache error",e);
}

}

function readCachedAddress(userId){

try{

localStorage.getItem(
addressCacheKey(userId)
);

const x=JSON.parse(raw);

return cleanPart(x?.text) ||

}catch(e){

}

}

/* =====================================================
   FIND ADDRESS IN LOCAL STORAGE
===================================================== */

function looksLikeAddressObject(x){

if(
!x ||
typeof x!=="object" ||
Array.isArray(x)
)return false;

const keys=
Object.keys(x)
.map(k=>k.toLowerCase());

return keys.some(k=>[
"village",
"district",
"state",
"pincode",
"pin",
"postal_code",
"plus_code",
"full_address",
"fulladdress",
"formatted_address",
"address",
"locality"
].includes(k));

}


function scanLocalStorageForAddress(){

const preferred=[
"selectedAddress",
"selected_address",
"savedAddress",
"saved_address",
"savedAddresses",
"saved_addresses",
"deliveryAddress",
"delivery_address",
"currentAddress",
"current_address",
"userAddress",
"user_address",
"address",
"addresses"
];

const keys=[];

for(const k of preferred){

if(!keys.includes(k))
keys.push(k);

}

try{

for(
let i=0;
i<localStorage.length;
i++
){

const k=localStorage.key(i);

if(k && !keys.includes(k))
keys.push(k);

}

}catch(e){}


for(const key of keys){

try{

const raw=
localStorage.getItem(key);

if(!raw)continue;

let value;

try{
value=JSON.parse(raw);
}catch{
value=raw;
}

const candidates=[];

if(Array.isArray(value))
candidates.push(...value);
else
candidates.push(value);


for(const item of candidates){

if(typeof item==="string"){

const t=item.trim();

if(
t &&
/(\d{5,6}|uttar|pradesh|district|village|plus)/i.test(t)
){
return t;
}

}else if(
looksLikeAddressObject(item)
){

const t=
formatSavedAddress(item);

if(t)return t;

}

}

}catch(e){}

}

return "";

}

String(a?.type||"")
.toLowerCase()
.includes("current")
) || data[0];

const text=
formatSavedAddress(preferred);

text

return null;

/* =====================================================
   CART
===================================================== */

async function getUser(){

const {data}=
await supabaseClient
.auth
.getSession();

return data.session?.user||null;

}


async function addToCart(){

if(!product)return;

const user=
await getUser();

if(!user){

toast("Please login first");

setTimeout(
()=>location.href=
"/ecom/account.html",
800
);

return;

}


const {
data:old,
error:readError
}=
await supabaseClient
.from("cart_items")
.select("id,qty")
.eq("user_id",user.id)
.eq("product_id",product.id)
.maybeSingle();


if(readError){

toast(readError.message);
return;

}


const newQty=
(old?.qty||0)+qty;


const customizeInput=
document.getElementById(
"customizeInput"
);

const customizeText=
product.customize_enabled
?(customizeInput?.value||"").trim()
:"";


const row={

user_id:user.id,

product_id:product.id,

title:product.title,

image:product.image,

price:product.price,

mrp:product.mrp,

qty:newQty,

customize_text:customizeText,

updated_at:
new Date().toISOString()

};


const {error}=
await supabaseClient
.from("cart_items")
.upsert(
row,
{
onConflict:
"user_id,product_id"
}
);


if(error){

toast(error.message);
return;

}


updateCart();

toast("✓ Added to Cart");

}


async function updateCart(){

const user=
await getUser();

const cartBadge=
document.getElementById(
"cartCount"
);

if(!user){

if(cartBadge)
cartBadge.textContent="0";

return;

}


const {
data,
error
}=
await supabaseClient
.from("cart_items")
.select("qty")
.eq("user_id",user.id);


if(error){

console.error(error);
return;

}


if(cartBadge){

cartBadge.textContent=
(data||[])
.reduce(
(s,x)=>
s+
(Number(x.qty)||0),
0
);

}

}

===================================================== */

async function buyNow(){

}
