<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#6d28d9"
>

<title>Saved Addresses | MyStore</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================
   RESET
========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:#f7f7fb;
  color:#171717;
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}


/* =========================================
   VARIABLES
========================================= */

:root{

  --primary:#6d28d9;
  --primary-dark:#5b21b6;
  --primary-light:#f3e8ff;

  --text:#171717;
  --muted:#737373;

  --border:#e5e7eb;
  --background:#f7f7fb;
  --white:#ffffff;

  --success:#15803d;
  --success-bg:#dcfce7;

  --danger:#dc2626;
  --danger-bg:#fee2e2;

  --shadow:
    0 8px 30px rgba(0,0,0,.06);
}


/* =========================================
   HEADER
========================================= */

.header{

  position:sticky;
  top:0;
  z-index:1000;

  height:68px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 5%;

  background:rgba(255,255,255,.96);

  border-bottom:1px solid var(--border);

  backdrop-filter:blur(14px);
}

.logo{

  display:flex;
  align-items:center;
  gap:8px;

  color:var(--primary);

  font-size:25px;
  font-weight:900;

  cursor:pointer;

  user-select:none;
}

.logo-icon{

  width:30px;
  height:30px;

  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    #6d28d9,
    #8b5cf6
  );

  color:white;
}

.logo-icon svg{
  width:18px;
  height:18px;
}

.header-actions{

  display:flex;
  align-items:center;
  gap:10px;
}

.header-btn{

  height:40px;

  display:flex;
  align-items:center;
  gap:7px;

  padding:0 14px;

  border:1px solid var(--border);

  border-radius:10px;

  background:#fff;

  color:#333;

  font-size:13px;
  font-weight:700;

  cursor:pointer;

  transition:.2s;
}

.header-btn svg{
  width:18px;
  height:18px;
}

.header-btn:hover{

  color:var(--primary);

  border-color:
    var(--primary);

  background:
    #faf7ff;
}


/* =========================================
   PAGE
========================================= */

.container{

  width:92%;

  max-width:1080px;

  margin:0 auto;

  padding:
    35px 0
    70px;
}


/* =========================================
   TITLE
========================================= */

.page-title{

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:20px;

  margin-bottom:25px;
}

.title-left h1{

  font-size:29px;

  line-height:1.2;

  font-weight:850;
}

.title-left p{

  margin-top:7px;

  color:var(--muted);

  font-size:14px;
}

.add-address-btn{

  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:0 18px;

  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  color:#fff;

  font-size:13px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 7px 18px
    rgba(109,40,217,.22);

  transition:.2s;
}

.add-address-btn svg{
  width:18px;
  height:18px;
}

.add-address-btn:hover{

  transform:
    translateY(-1px);

  box-shadow:
    0 10px 24px
    rgba(109,40,217,.28);
}


/* =========================================
   ADDRESS GRID
========================================= */

.address-grid{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:18px;
}


/* =========================================
   ADDRESS CARD
========================================= */

.address-card{

  position:relative;

  background:#fff;

  border:1px solid var(--border);

  border-radius:17px;

  padding:21px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.035);

  transition:
    transform .2s,
    box-shadow .2s,
    border-color .2s;
}

.address-card:hover{

  transform:
    translateY(-2px);

  box-shadow:
    var(--shadow);

  border-color:
    #d8c7f7;
}


/* =========================================
   TYPE BADGE
========================================= */

.address-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;
}

.address-type{

  display:inline-flex;

  align-items:center;

  gap:6px;

  min-height:27px;

  padding:5px 9px;

  border-radius:7px;

  background:
    var(--primary-light);

  color:
    var(--primary);

  font-size:11px;

  font-weight:850;

  text-transform:uppercase;

  letter-spacing:.3px;
}

.address-type svg{

  width:14px;
  height:14px;
}


/* =========================================
   NAME
========================================= */

.person-name{

  font-size:18px;

  font-weight:850;

  color:#171717;

  margin-bottom:6px;
}

.phone{

  color:#555;

  font-size:13px;

  font-weight:600;

  margin-bottom:13px;
}


/* =========================================
   ADDRESS
========================================= */

.address-details{

  color:#444;

  font-size:14px;

  line-height:1.65;

  min-height:70px;
}

.address-details strong{

  color:#222;

  font-weight:700;
}


/* =========================================
   CARD ACTIONS
========================================= */

.card-actions{

  display:flex;

  align-items:center;

  gap:9px;

  margin-top:18px;

  padding-top:15px;

  border-top:
    1px solid #eeeeee;
}

.card-btn{

  height:36px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:6px;

  padding:0 12px;

  border:1px solid #ddd;

  border-radius:8px;

  background:#fff;

  color:#333;

  font-size:12px;

  font-weight:750;

  cursor:pointer;

  transition:.2s;
}

.card-btn svg{

  width:15px;
  height:15px;
}

.card-btn:hover{

  color:var(--primary);

  border-color:
    var(--primary);

  background:#faf7ff;
}

.card-btn.delete{

  color:var(--danger);
}

.card-btn.delete:hover{

  color:#fff;

  border-color:
    var(--danger);

  background:
    var(--danger);
}


/* =========================================
   EMPTY STATE
========================================= */

.empty-state{

  grid-column:1/-1;

  background:#fff;

  border:1px dashed #d4d4d4;

  border-radius:18px;

  padding:65px 20px;

  text-align:center;
}

.empty-icon{

  width:68px;
  height:68px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:
    0 auto
    16px;

  border-radius:50%;

  background:
    var(--primary-light);

  color:
    var(--primary);
}

.empty-icon svg{

  width:32px;
  height:32px;
}

.empty-state h2{

  font-size:20px;

  margin-bottom:7px;
}

.empty-state p{

  color:var(--muted);

  font-size:13px;

  margin-bottom:20px;
}


/* =========================================
   LOADING
========================================= */

.loading{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  min-height:250px;

  color:var(--muted);

  font-size:13px;
}

.spinner{

  width:35px;
  height:35px;

  border:
    3px solid #e9d5ff;

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin-bottom:12px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================================
   MODAL
========================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:9999;

  display:none;

  align-items:center;
  justify-content:center;

  padding:15px;

  background:
    rgba(0,0,0,.48);

  backdrop-filter:
    blur(4px);
}

.modal.show{

  display:flex;

  animation:
    modalFade .18s ease;
}

@keyframes modalFade{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

.modal-box{

  width:100%;

  max-width:650px;

  max-height:
    calc(100vh - 30px);

  overflow:auto;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.22);

  animation:
    modalUp .2s ease;
}

@keyframes modalUp{

  from{
    transform:translateY(15px) scale(.98);
  }

  to{
    transform:translateY(0) scale(1);
  }

}


/* =========================================
   MODAL HEADER
========================================= */

.modal-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    21px 23px;

  border-bottom:
    1px solid var(--border);
}

.modal-title h2{

  font-size:20px;

  font-weight:850;
}

.modal-title p{

  color:var(--muted);

  font-size:12px;

  margin-top:4px;
}

.close-btn{

  width:35px;
  height:35px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  border-radius:50%;

  background:#f4f4f5;

  color:#444;

  cursor:pointer;

  font-size:21px;

  transition:.2s;
}

.close-btn:hover{

  background:#ececec;

  transform:
    rotate(90deg);
}


/* =========================================
   FORM
========================================= */

.address-form{

  padding:23px;
}

.form-grid{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:16px;
}

.field{

  display:flex;

  flex-direction:column;

  gap:7px;
}

.field.full{

  grid-column:
    1/-1;
}

.field label{

  font-size:12px;

  font-weight:800;

  color:#333;
}

.required{

  color:
    var(--danger);
}

.field input,
.field select{

  width:100%;

  height:45px;

  padding:
    0 12px;

  border:
    1px solid #d8d8d8;

  border-radius:9px;

  background:#fff;

  color:#171717;

  font-size:13px;

  outline:none;

  transition:.2s;
}

.field input::placeholder{

  color:#a3a3a3;
}

.field input:focus,
.field select:focus{

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(109,40,217,.10);
}


/* =========================================
   MODAL ACTIONS
========================================= */

.form-actions{

  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:10px;

  margin-top:22px;

  padding-top:18px;

  border-top:
    1px solid #eeeeee;
}

.cancel-btn{

  height:43px;

  padding:
    0 17px;

  border:
    1px solid #ddd;

  border-radius:9px;

  background:#fff;

  color:#444;

  font-size:13px;

  font-weight:750;

  cursor:pointer;
}

.cancel-btn:hover{

  background:#f5f5f5;
}

.save-btn{

  height:43px;

  min-width:125px;

  padding:
    0 19px;

  border:0;

  border-radius:9px;

  background:
    var(--primary);

  color:#fff;

  font-size:13px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.save-btn:hover{

  background:
    var(--primary-dark);
}

.save-btn:disabled{

  opacity:.65;

  cursor:not-allowed;
}


/* =========================================
   TOAST
========================================= */

.toast{

  position:fixed;

  z-index:11000;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,20px);

  min-width:250px;

  max-width:
    calc(100% - 30px);

  padding:
    13px 17px;

  border-radius:10px;

  background:#18181b;

  color:#fff;

  text-align:center;

  font-size:13px;

  font-weight:650;

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:760px){

  .header{

    height:62px;

    padding:
      0 14px;
  }

  .logo{

    font-size:21px;
  }

  .logo-icon{

    width:27px;
    height:27px;

    border-radius:7px;
  }

  .header-btn{

    height:37px;

    padding:
      0 10px;

    font-size:11px;
  }

  .header-btn svg{

    width:16px;
    height:16px;
  }

  .container{

    width:94%;

    padding:
      23px 0
      50px;
  }

  .page-title{

    align-items:center;
  }

  .title-left h1{

    font-size:23px;
  }

  .title-left p{

    font-size:12px;
  }

  .add-address-btn{

    height:40px;

    padding:
      0 12px;

    font-size:11px;
  }

  .address-grid{

    grid-template-columns:1fr;

    gap:14px;
  }

  .address-card{

    padding:17px;
  }

  .person-name{

    font-size:17px;
  }

  .address-details{

    font-size:13px;
  }

  .modal{

    align-items:flex-end;

    padding:0;
  }

  .modal-box{

    max-height:
      94vh;

    border-radius:
      19px 19px 0 0;
  }

  .modal-header{

    padding:
      18px;
  }

  .address-form{

    padding:
      18px;
  }

  .form-grid{

    grid-template-columns:1fr;

    gap:14px;
  }

  .field.full{

    grid-column:auto;
  }

  .form-actions{

    position:sticky;

    bottom:0;

    background:#fff;

    padding-bottom:2px;
  }

}


/* =========================================
   VERY SMALL MOBILE
========================================= */

@media(max-width:430px){

  .header-actions{

    gap:6px;
  }

  .header-btn{

    padding:
      0 8px;
  }

  .header-btn span{

    display:none;
  }

  .page-title{

    align-items:flex-start;
  }

  .title-left h1{

    font-size:21px;
  }

  .add-address-btn{

    width:42px;

    padding:0;

    font-size:0;
  }

  .add-address-btn svg{

    width:19px;
    height:19px;
  }

  .card-actions{

    flex-wrap:wrap;
  }

}


/* =========================================
   SCROLLBAR
========================================= */

.modal-box::-webkit-scrollbar{

  width:7px;
}

.modal-box::-webkit-scrollbar-thumb{

  background:#d4d4d8;

  border-radius:20px;
}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">


  <div
    class="logo"
    onclick="goHome()"
  >

    <span class="logo-icon">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <path
          d="M3 10.5 12 3l9 7.5"
        />

        <path
          d="M5 9.5V21h14V9.5"
        />

        <path
          d="M9 21v-7h6v7"
        />

      </svg>

    </span>

    MyStore

  </div>


  <div class="header-actions">


    <button
      class="header-btn"
      onclick="goProfile()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >

        <circle
          cx="12"
          cy="8"
          r="3.5"
        />

        <path
          d="M5 20c1.5-4 4-6 7-6s5.5 2 7 6"
        />

      </svg>

      <span>My Account</span>

    </button>


    <button
      class="header-btn"
      onclick="goCart()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >

        <path
          d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6"
        />

        <circle
          cx="10"
          cy="20"
          r="1.2"
        />

        <circle
          cx="18"
          cy="20"
          r="1.2"
        />

      </svg>

      <span>Cart</span>

    </button>


  </div>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main class="container">


  <div class="page-title">


    <div class="title-left">

      <h1>
        Saved Addresses
      </h1>

      <p>
        Add and manage your delivery addresses.
      </p>

    </div>


    <button
      class="add-address-btn"
      onclick="openAddAddress()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <path
          d="M12 5v14"
        />

        <path
          d="M5 12h14"
        />

      </svg>

      Add Address

    </button>


  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    Loading your saved addresses...

  </div>


  <!-- ADDRESS GRID -->

  <div
    id="addressGrid"
    class="address-grid"
    style="display:none"
  ></div>


</main>


<!-- =========================================
     ADDRESS MODAL
========================================= -->

<div
  id="addressModal"
  class="modal"
>

  <div class="modal-box">


    <div class="modal-header">


      <div class="modal-title">

        <h2 id="modalHeading">
          Add New Address
        </h2>

        <p>
          Enter your complete delivery details.
        </p>

      </div>


      <button
        class="close-btn"
        onclick="closeModal()"
        aria-label="Close"
      >
        ×
      </button>


    </div>


    <div class="address-form">


      <div class="form-grid">


        <!-- NAME -->

        <div class="field">

          <label>
            Full Name
            <span class="required">*</span>
          </label>

          <input
            id="name"
            type="text"
            autocomplete="name"
            placeholder="Enter receiver name"
          >

        </div>


        <!-- PHONE -->

        <div class="field">

          <label>
            Mobile Number
            <span class="required">*</span>
          </label>

          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel"
            placeholder="10 digit mobile number"
          >

        </div>


        <!-- HOUSE -->

        <div class="field full">

          <label>
            House / Flat / Building
            <span class="required">*</span>
          </label>

          <input
            id="house"
            type="text"
            autocomplete="address-line1"
            placeholder="House no., Flat no., Building name"
          >

        </div>


        <!-- ROAD -->

        <div class="field full">

          <label>
            Road / Area / Locality
            <span class="required">*</span>
          </label>

          <input
            id="road"
            type="text"
            autocomplete="address-line2"
            placeholder="Road, area, locality"
          >

        </div>


        <!-- CITY -->

        <div class="field">

          <label>
            City
            <span class="required">*</span>
          </label>

          <input
            id="city"
            type="text"
            autocomplete="address-level2"
            placeholder="Enter city"
          >

        </div>


        <!-- STATE -->

        <div class="field">

          <label>
            State
            <span class="required">*</span>
          </label>

          <input
            id="state"
            type="text"
            autocomplete="address-level1"
            placeholder="Enter state"
          >

        </div>


        <!-- PINCODE -->

        <div class="field">

          <label>
            PIN Code
            <span class="required">*</span>
          </label>

          <input
            id="pincode"
            type="text"
            inputmode="numeric"
            maxlength="6"
            autocomplete="postal-code"
            placeholder="6 digit PIN code"
          >

        </div>


        <!-- TYPE -->

        <div class="field">

          <label>
            Address Type
          </label>

          <select id="type">

            <option value="Home">
              Home
            </option>

            <option value="Work">
              Work
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


      </div>


      <div class="form-actions">


        <button
          class="cancel-btn"
          onclick="closeModal()"
        >
          Cancel
        </button>


        <button
          id="saveBtn"
          class="save-btn"
          onclick="saveAddress()"
        >
          Save Address
        </button>


      </div>


    </div>

  </div>

</div>


<!-- =========================================
     TOAST
========================================= -->

<div
  id="toast"
  class="toast"
></div>


<script>

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   GLOBALS
========================================= */

let currentUser = null;

let editingId = null;


/* =========================================
   AUTH CHECK
========================================= */

async function checkAuth(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if(error){

    console.error(
      "Auth error:",
      error
    );

    window.location.href =
      "login.html";

    return false;
  }


  if(!data || !data.user){

    window.location.href =
      "login.html";

    return false;
  }


  currentUser =
    data.user;


  return true;

}


/* =========================================
   LOAD ADDRESSES
========================================= */

async function loadAddresses(){

  const loading =
    document.getElementById(
      "loading"
    );

  const grid =
    document.getElementById(
      "addressGrid"
    );


  const authenticated =
    await checkAuth();


  if(!authenticated)
    return;


  try{

    const {
      data,
      error
    } =
      await supabaseClient

        .from("saved_addresses")

        .select(`
          id,
          user_id,
          name,
          phone,
          pincode,
          state,
          city,
          house,
          road,
          type,
          created_at
        `)

        .eq(
          "user_id",
          currentUser.id
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error)
      throw error;


    loading.style.display =
      "none";


    grid.style.display =
      "grid";


    renderAddresses(
      data || []
    );

  }
  catch(error){

    console.error(
      "Load addresses error:",
      error
    );


    loading.innerHTML = `

      <div style="
        color:#dc2626;
        text-align:center;
        line-height:1.6;
      ">

        <strong>
          Addresses load nahi ho paaye.
        </strong>

        <br>

        <small>
          ${escapeHtml(error.message)}
        </small>

      </div>

    `;

  }

}


/* =========================================
   RENDER ADDRESSES
========================================= */

function renderAddresses(
  addresses
){

  const grid =
    document.getElementById(
      "addressGrid"
    );


  if(!addresses.length){

    grid.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >

            <path
              d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12z"
            />

            <circle
              cx="12"
              cy="9"
              r="2.5"
            />

          </svg>

        </div>


        <h2>
          No saved addresses
        </h2>


        <p>
          Add your first delivery address
          for faster checkout.
        </p>


        <button
          class="add-address-btn"
          onclick="openAddAddress()"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <path
              d="M12 5v14"
            />

            <path
              d="M5 12h14"
            />

          </svg>

          Add Address

        </button>

      </div>

    `;

    return;
  }


  grid.innerHTML =
    addresses
      .map(
        createAddressCard
      )
      .join("");

}


/* =========================================
   ADDRESS CARD
========================================= */

function createAddressCard(
  address
){

  const type =
    escapeHtml(
      address.type ||
      "Home"
    );


  const name =
    escapeHtml(
      address.name ||
      "Customer"
    );


  const phone =
    escapeHtml(
      address.phone ||
      ""
    );


  const house =
    escapeHtml(
      address.house ||
      ""
    );


  const road =
    escapeHtml(
      address.road ||
      ""
    );


  const city =
    escapeHtml(
      address.city ||
      ""
    );


  const state =
    escapeHtml(
      address.state ||
      ""
    );


  const pincode =
    escapeHtml(
      address.pincode ||
      ""
    );


  let icon = `

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >

      <path
        d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12z"
      />

      <circle
        cx="12"
        cy="9"
        r="2.5"
      />

    </svg>

  `;


  if(
    String(address.type)
      .toLowerCase()
      === "work"
  ){

    icon = `

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >

        <rect
          x="3"
          y="7"
          width="18"
          height="13"
          rx="2"
        />

        <path
          d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
        />

        <path
          d="M3 12h18"
        />

      </svg>

    `;

  }


  return `

    <article
      class="address-card"
    >


      <div class="address-top">

        <div class="address-type">

          ${icon}

          ${type}

        </div>

      </div>


      <div class="person-name">

        ${name}

      </div>


      <div class="phone">

        +91 ${phone}

      </div>


      <div class="address-details">

        <strong>
          ${house}
        </strong>

        ${road
          ? `<br>${road}`
          : ""
        }

        <br>

        ${city},
        ${state}
        - ${pincode}

      </div>


      <div class="card-actions">


        <button
          class="card-btn"
          onclick="editAddress('${address.id}')"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >

            <path
              d="M12 20h9"
            />

            <path
              d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"
            />

          </svg>

          Edit

        </button>


        <button
          class="card-btn delete"
          onclick="deleteAddress('${address.id}')"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >

            <path
              d="M4 7h16"
            />

            <path
              d="M10 11v6"
            />

            <path
              d="M14 11v6"
            />

            <path
              d="M6 7l1 14h10l1-14"
            />

            <path
              d="M9 7V4h6v3"
            />

          </svg>

          Delete

        </button>


      </div>


    </article>

  `;

}


/* =========================================
   OPEN ADD MODAL
========================================= */

function openAddAddress(){

  editingId =
    null;


  document.getElementById(
    "modalHeading"
  ).textContent =
    "Add New Address";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Save Address";


  clearForm();


  document.getElementById(
    "addressModal"
  ).classList.add(
    "show"
  );


  setTimeout(
    () =>
      document.getElementById(
        "name"
      ).focus(),
    100
  );

}


/* =========================================
   EDIT ADDRESS
========================================= */

async function editAddress(
  id
){

  try{

    const {
      data,
      error
    } =
      await supabaseClient

        .from("saved_addresses")

        .select("*")

        .eq(
          "id",
          id
        )

        .eq(
          "user_id",
          currentUser.id
        )

        .single();


    if(error)
      throw error;


    editingId =
      id;


    document.getElementById(
      "modalHeading"
    ).textContent =
      "Edit Address";


    document.getElementById(
      "saveBtn"
    ).textContent =
      "Update Address";


    document.getElementById(
      "name"
    ).value =
      data.name || "";


    document.getElementById(
      "phone"
    ).value =
      data.phone || "";


    document.getElementById(
      "pincode"
    ).value =
      data.pincode || "";


    document.getElementById(
      "state"
    ).value =
      data.state || "";


    document.getElementById(
      "city"
    ).value =
      data.city || "";


    document.getElementById(
      "house"
    ).value =
      data.house || "";


    document.getElementById(
      "road"
    ).value =
      data.road || "";


    document.getElementById(
      "type"
    ).value =
      data.type || "Home";


    document.getElementById(
      "addressModal"
    ).classList.add(
      "show"
    );

  }
  catch(error){

    console.error(
      "Edit address error:",
      error
    );


    showToast(
      error.message ||
      "Address load nahi ho paaya."
    );

  }

}


/* =========================================
   SAVE / UPDATE
========================================= */

async function saveAddress(){

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value
      .replace(/\D/g,"")
      .trim();


  const pincode =
    document.getElementById(
      "pincode"
    ).value
      .replace(/\D/g,"")
      .trim();


  const state =
    document.getElementById(
      "state"
    ).value.trim();


  const city =
    document.getElementById(
      "city"
    ).value.trim();


  const house =
    document.getElementById(
      "house"
    ).value.trim();


  const road =
    document.getElementById(
      "road"
    ).value.trim();


  const type =
    document.getElementById(
      "type"
    ).value;


  /* =========================
     VALIDATION
  ========================= */

  if(!name){

    showToast(
      "Full name enter karo."
    );

    return;
  }


  if(
    !/^[0-9]{10}$/.test(phone)
  ){

    showToast(
      "Valid 10 digit mobile number enter karo."
    );

    return;
  }


  if(
    !/^[0-9]{6}$/.test(pincode)
  ){

    showToast(
      "Valid 6 digit PIN code enter karo."
    );

    return;
  }


  if(!state){

    showToast(
      "State enter karo."
    );

    return;
  }


  if(!city){

    showToast(
      "City enter karo."
    );

    return;
  }


  if(!house){

    showToast(
      "House / Flat details enter karo."
    );

    return;
  }


  if(!road){

    showToast(
      "Road / Area enter karo."
    );

    return;
  }


  /* =========================
     BUTTON LOADING
  ========================= */

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    editingId
    ?
    "Updating..."
    :
    "Saving...";


  try{

    /*
      EXACT DATABASE SCHEMA

      saved_addresses:

      user_id
      name
      phone
      pincode
      state
      city
      house
      road
      type
    */

    const payload = {

      user_id:
        currentUser.id,

      name:
        name,

      phone:
        phone,

      pincode:
        pincode,

      state:
        state,

      city:
        city,

      house:
        house,

      road:
        road,

      type:
        type

    };


    /* =========================
       UPDATE
    ========================= */

    if(editingId){

      const {
        error
      } =
        await supabaseClient

          .from("saved_addresses")

          .update(payload)

          .eq(
            "id",
            editingId
          )

          .eq(
            "user_id",
            currentUser.id
          );


      if(error)
        throw error;


      showToast(
        "Address updated successfully."
      );

    }


    /* =========================
       INSERT
    ========================= */

    else{

      const {
        error
      } =
        await supabaseClient

          .from("saved_addresses")

          .insert(
            payload
          );


      if(error)
        throw error;


      showToast(
        "Address saved successfully."
      );

    }


    closeModal();


    await loadAddresses();

  }
  catch(error){

    console.error(
      "Save address error:",
      error
    );


    showToast(
      error.message ||
      "Address save nahi ho paaya."
    );

  }
  finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      editingId
      ?
      "Update Address"
      :
      "Save Address";

  }

}


/* =========================================
   DELETE ADDRESS
========================================= */

async function deleteAddress(
  id
){

  const confirmDelete =
    window.confirm(
      "Kya aap ye address delete karna chahte hain?"
    );


  if(!confirmDelete)
    return;


  try{

    const {
      error
    } =
      await supabaseClient

        .from("saved_addresses")

        .delete()

        .eq(
          "id",
          id
        )

        .eq(
          "user_id",
          currentUser.id
        );


    if(error)
      throw error;


    showToast(
      "Address deleted successfully."
    );


    await loadAddresses();

  }
  catch(error){

    console.error(
      "Delete address error:",
      error
    );


    showToast(
      error.message ||
      "Address delete nahi ho paaya."
    );

  }

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

  document.getElementById(
    "name"
  ).value = "";


  document.getElementById(
    "phone"
  ).value = "";


  document.getElementById(
    "pincode"
  ).value = "";


  document.getElementById(
    "state"
  ).value = "";


  document.getElementById(
    "city"
  ).value = "";


  document.getElementById(
    "house"
  ).value = "";


  document.getElementById(
    "road"
  ).value = "";


  document.getElementById(
    "type"
  ).value =
    "Home";

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

  document.getElementById(
    "addressModal"
  ).classList.remove(
    "show"
  );


  editingId =
    null;


  clearForm();

}


/* =========================================
   MODAL OUTSIDE CLICK
========================================= */

document.getElementById(
  "addressModal"
).addEventListener(
  "click",
  function(event){

    if(
      event.target === this
    ){

      closeModal();

    }

  }
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeModal();

    }

  }
);


/* =========================================
   TOAST
========================================= */

let toastTimer = null;


function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2800
    );

}


/* =========================================
   NAVIGATION
========================================= */

function goHome(){

  window.location.href =
    "index.html";

}


function goProfile(){

  window.location.href =
    "profile.html";

}


function goCart(){

  window.location.href =
    "cart.html";

}


/* =========================================
   START
========================================= */

loadAddresses();

</script>
