<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6d28d9">
<title>Saved Addresses | MyStore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f7f7fb;color:#171717;min-height:100vh}button,input,select{font:inherit}.header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:20}.logo{display:flex;align-items:center;gap:8px;color:#6d28d9;font-size:25px;font-weight:900;cursor:pointer}.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center}.logo-icon svg{width:18px}.header-actions{display:flex;gap:10px}.header-btn{height:40px;padding:0 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#333;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:750;cursor:pointer}.header-btn svg{width:18px}.container{width:92%;max-width:1080px;margin:auto;padding:35px 0 70px}.page-title{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.page-title h1{font-size:29px;font-weight:850}.page-title p{margin-top:7px;color:#737373;font-size:14px}.add-btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#6d28d9,#5b21b6);color:#fff;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(109,40,217,.22);display:flex;align-items:center;gap:8px}.add-btn svg{width:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:21px;box-shadow:0 5px 20px rgba(0,0,0,.035)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.type{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;background:#f3e8ff;color:#6d28d9;font-size:11px;font-weight:850;text-transform:uppercase}.type svg{width:14px}.name{font-size:18px;font-weight:850;margin-bottom:6px}.phone{color:#555;font-size:13px;font-weight:600;margin-bottom:13px}.details{color:#444;font-size:14px;line-height:1.65;min-height:70px}.actions{display:flex;gap:9px;margin-top:18px;padding-top:15px;border-top:1px solid #eee}.card-btn{height:36px;padding:0 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#333;font-size:12px;font-weight:750;cursor:pointer;display:flex;align-items:center;gap:6px}.card-btn svg{width:15px}.card-btn.delete{color:#dc2626}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d4d4d4;border-radius:18px;padding:65px 20px;text-align:center}.empty-icon{width:68px;height:68px;margin:0 auto 16px;border-radius:50%;background:#f3e8ff;color:#6d28d9;display:flex;align-items:center;justify-content:center}.empty-icon svg{width:32px}.empty h2{font-size:20px;margin-bottom:7px}.empty p{color:#737373;font-size:13px;margin-bottom:20px}.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:250px;color:#737373;font-size:13px}.spinner{width:35px;height:35px;border:3px solid #e9d5ff;border-top-color:#6d28d9;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(0,0,0,.48);backdrop-filter:blur(4px)}.modal.show{display:flex}.box{width:100%;max-width:650px;max-height:calc(100vh - 30px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.22)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:21px 23px;border-bottom:1px solid #e5e7eb}.modal-head h2{font-size:20px}.modal-head p{color:#737373;font-size:12px;margin-top:4px}.close{width:35px;height:35px;border:0;border-radius:50%;background:#f4f4f5;color:#444;font-size:21px;cursor:pointer}.form{padding:23px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#333}.field input,.field select{width:100%;height:45px;padding:0 12px;border:1px solid #d8d8d8;border-radius:9px;background:#fff;outline:none;font-size:13px}.field input:focus,.field select:focus{border-color:#6d28d9;box-shadow:0 0 0 3px rgba(109,40,217,.1)}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid #eee}.cancel{height:43px;padding:0 17px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:13px;font-weight:750;cursor:pointer}.save{height:43px;min-width:125px;padding:0 19px;border:0;border-radius:9px;background:#6d28d9;color:#fff;font-size:13px;font-weight:800;cursor:pointer}.save:disabled{opacity:.65}.toast{position:fixed;z-index:200;left:50%;bottom:25px;transform:translate(-50%,20px);min-width:250px;max-width:calc(100% - 30px);padding:13px 17px;border-radius:10px;background:#18181b;color:#fff;text-align:center;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.header{height:62px;padding:0 14px}.logo{font-size:21px}.logo-icon{width:27px;height:27px}.header-btn{height:37px;padding:0 10px;font-size:11px}.container{width:94%;padding:23px 0 50px}.page-title{align-items:center}.page-title h1{font-size:23px}.page-title p{font-size:12px}.add-btn{height:40px;padding:0 12px;font-size:11px}.grid{grid-template-columns:1fr;gap:14px}.card{padding:17px}.modal{align-items:flex-end;padding:0}.box{max-height:94vh;border-radius:19px 19px 0 0}.modal-head,.form{padding:18px}.form-grid{grid-template-columns:1fr;gap:14px}.field.full{grid-column:auto}}@media(max-width:430px){.header-btn span{display:none}.add-btn{width:42px;padding:0;font-size:0}.add-btn svg{width:19px}}
</style>
</head>
<body>
<header class="header"><div class="logo" onclick="location.href='index.html'"><span class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg></span>MyStore</div><div class="header-actions"><button class="header-btn" onclick="location.href='profile.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-4 4-6 7-6s5.5 2 7 6"/></svg><span>My Account</span></button><button class="header-btn" onclick="location.href='cart.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg><span>Cart</span></button></div></header>
<main class="container"><div class="page-title"><div><h1>Saved Addresses</h1><p>Add and manage your delivery addresses.</p></div><button class="add-btn" onclick="openAdd()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add Address</button></div><div id="loading" class="loading"><div class="spinner"></div>Loading your saved addresses...</div><div id="grid" class="grid" style="display:none"></div></main>
<div id="modal" class="modal"><div class="box"><div class="modal-head"><div><h2 id="heading">Add New Address</h2><p>Enter your complete delivery details.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="form-grid"><div class="field"><label>Full Name *</label><input id="name" autocomplete="name" placeholder="Enter receiver name"></div><div class="field"><label>Mobile Number *</label><input id="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 digit mobile number"></div><div class="field full"><label>House / Flat / Building *</label><input id="house" autocomplete="address-line1" placeholder="House no., Flat no., Building name"></div><div class="field full"><label>Road / Area / Locality *</label><input id="road" autocomplete="address-line2" placeholder="Road, area, locality"></div><div class="field"><label>City *</label><input id="city" autocomplete="address-level2" placeholder="Enter city"></div><div class="field"><label>State *</label><input id="state" autocomplete="address-level1" placeholder="Enter state"></div><div class="field"><label>PIN Code *</label><input id="pincode" inputmode="numeric" maxlength="6" autocomplete="postal-code" placeholder="6 digit PIN code"></div><div class="field"><label>Address Type</label><select id="type"><option value="home">Home</option><option value="work">Work</option><option value="other">Other</option></select></div></div><div class="form-actions"><button class="cancel" onclick="closeModal()">Cancel</button><button id="save" class="save" onclick="saveAddress()">Save Address</button></div></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://bszojvhitsoamhksyjul.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let user=null,editingId=null,toastTimer=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
async function init(){
  try{
    if(!window.supabase || !window.supabase.createClient){
      throw new Error('Supabase library load nahi hui. Internet connection check karke page refresh karein.');
    }

    const {data,error}=await sb.auth.getSession();
    if(error) throw error;

    user=data?.session?.user || null;

    if(!user){
      showLoginRequired();
      return;
    }

    await loadAddresses();
  }catch(e){
    console.error('INIT ERROR:',e);
    showPageError(e?.message || 'Page load nahi ho paya.');
  }
}

function showLoginRequired(){
  $('loading').style.display='none';
  $('grid').style.display='grid';
  $('grid').innerHTML=`<div class="empty">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="8" r="3.2"/>
        <path d="M5 20c1.5-4 4-6 7-6s5.5 2 7 6"/>
      </svg>
    </div>
    <h2>Please Login</h2>
    <p>Saved addresses dekhne aur add karne ke liye pehle MyStore account me login karein.</p>
    <button class="add-btn" style="margin:auto" onclick="location.href='login.html?redirect=saved-addresses.html'">Login</button>
  </div>`;
}

function showPageError(message){
  $('loading').style.display='none';
  $('grid').style.display='grid';
  $('grid').innerHTML=`<div class="empty">
    <div class="empty-icon">⚠️</div>
    <h2>Something went wrong</h2>
    <p>${esc(message)}</p>
    <button class="add-btn" style="margin:auto" onclick="location.reload()">Try Again</button>
  </div>`;
}

async function loadAddresses(){
  $('loading').style.display='flex';$('grid').style.display='none';
  const {data,error}=await sb.from('saved_addresses').select('id,user_id,name,phone,pincode,state,city,house,road,type,created_at').eq('user_id',user.id).order('created_at',{ascending:false});
  if(error)throw error;
  $('loading').style.display='none';$('grid').style.display='grid';render(data||[]);
}
function render(rows){
  if(!rows.length){$('grid').innerHTML='<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div><h2>No saved addresses</h2><p>Add your first delivery address for faster checkout.</p><button class="add-btn" style="margin:auto" onclick="openAdd()">+ Add Address</button></div>';return}
  $('grid').innerHTML=rows.map(a=>{const t=(a.type||'home').toLowerCase();return `<article class="card"><div class="top"><span class="type">${t==='work'?'🏢':t==='other'?'📍':'🏠'} ${esc(t)}</span></div><div class="name">${esc(a.name||'')}</div><div class="phone">+91 ${esc(a.phone||'')}</div><div class="details"><strong>${esc(a.house||'')}</strong><br>${esc(a.road||'')}<br>${esc(a.city||'')}, ${esc(a.state||'')} - ${esc(a.pincode||'')}</div><div class="actions"><button class="card-btn" onclick="editAddress('${a.id}')">✎ Edit</button><button class="card-btn delete" onclick="deleteAddress('${a.id}')">🗑 Delete</button></div></article>`}).join('');
}
function openAdd(){editingId=null;$('heading').textContent='Add New Address';$('save').textContent='Save Address';clearForm();$('modal').classList.add('show');setTimeout(()=>$('name').focus(),80)}
async function editAddress(id){
  const {data,error}=await sb.from('saved_addresses').select('*').eq('id',id).eq('user_id',user.id).maybeSingle();
  if(error) return toast(error.message);if(!data)return toast('Address nahi mila.');
  editingId=id;$('heading').textContent='Edit Address';$('save').textContent='Update Address';
  ['name','phone','pincode','state','city','house','road','type'].forEach(k=>$(k).value=data[k]||'');$('modal').classList.add('show');
}
async function saveAddress(){
  const payload={user_id:user.id,name:$('name').value.trim(),phone:$('phone').value.replace(/\D/g,''),pincode:$('pincode').value.replace(/\D/g,''),state:$('state').value.trim(),city:$('city').value.trim(),house:$('house').value.trim(),road:$('road').value.trim(),type:$('type').value};
  if(!payload.name||!/^[6-9]\d{9}$/.test(payload.phone)||!/^\d{6}$/.test(payload.pincode)||!payload.state||!payload.city||!payload.house||!payload.road){return toast('Sabhi required details sahi se bharo.')}
  const btn=$('save');btn.disabled=true;btn.textContent=editingId?'Updating...':'Saving...';
  try{
    let error;
    if(editingId){({error}=await sb.from('saved_addresses').update(payload).eq('id',editingId).eq('user_id',user.id));}
    else {({error}=await sb.from('saved_addresses').insert(payload));}
    if(error)throw error;
    closeModal();toast(editingId?'Address updated successfully.':'Address saved successfully.');await loadAddresses();
  }catch(e){console.error(e);toast(e.message||'Address save nahi ho paya.')}finally{btn.disabled=false;btn.textContent=editingId?'Update Address':'Save Address'}
}
async function deleteAddress(id){
  if(!confirm('Kya aap ye address delete karna chahte hain?'))return;
  const {error}=await sb.from('saved_addresses').delete().eq('id',id).eq('user_id',user.id);
  if(error)return toast(error.message);toast('Address deleted successfully.');await loadAddresses();
}
function clearForm(){['name','phone','pincode','state','city','house','road'].forEach(k=>$(k).value='');$('type').value='home'}
function closeModal(){$('modal').classList.remove('show');editingId=null;clearForm()}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
sb.auth.onAuthStateChange((event, session)=>{
  if(event==='SIGNED_IN' && session?.user && !user){
    user=session.user;
    loadAddresses().catch(e=>showPageError(e?.message || 'Addresses load nahi hue.'));
  }
  if(event==='SIGNED_OUT'){
    user=null;
    showLoginRequired();
  }
});

init();
</script>
</body>
</html>
