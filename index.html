<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore - Online Shopping</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --violet:#6d28d9;
  --violet-dark:#4c1d95;
  --violet-light:#f3e8ff;
  --green:#dff7e8;
  --green-dark:#166534;
  --white:#ffffff;
  --bg:#f7f8fc;
  --text:#171717;
  --muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 5px 20px rgba(50,20,90,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */

.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.header-top{
  max-width:1280px;
  margin:auto;
  height:72px;
  display:flex;
  align-items:center;
  gap:22px;
  padding:0 18px;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:var(--violet);
  white-space:nowrap;
  cursor:pointer;
}

.logo span{
  color:#22a35a;
}

/* SEARCH */

.search-box{
  flex:1;
  position:relative;
}

.search-box input{
  width:100%;
  height:46px;
  border:2px solid #e4d4ff;
  border-radius:12px;
  padding:0 48px 0 18px;
  font-size:15px;
  outline:none;
  background:#faf8ff;
  transition:.2s;
}

.search-box input:focus{
  border-color:var(--violet);
  background:#fff;
}

.search-icon{
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px;
}

/* HEADER BUTTONS */

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.login-btn,
.cart-btn{
  height:44px;
  border:0;
  border-radius:11px;
  padding:0 16px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}

.login-btn{
  background:var(--violet-light);
  color:var(--violet-dark);
}

.cart-btn{
  background:var(--violet);
  color:#fff;
}

.cart-count{
  display:inline-flex;
  min-width:22px;
  height:22px;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:var(--violet);
  border-radius:50%;
  margin-left:5px;
  font-size:12px;
}

/* ================= CATEGORY ================= */

.category-wrap{
  background:#fff;
  border-top:1px solid #f0f0f0;
}

.categories{
  max-width:1280px;
  margin:auto;
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:10px 18px 11px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  min-width:88px;
  border:0;
  background:transparent;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
  white-space:nowrap;
  color:#333;
  font-size:13px;
}

.category-icon{
  width:45px;
  height:45px;
  border-radius:50%;
  background:var(--violet-light);
  margin:0 auto 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.category.active{
  color:var(--violet);
  font-weight:800;
}

.category.active .category-icon{
  background:var(--green);
}

/* ================= MAIN ================= */

.main{
  max-width:1280px;
  margin:auto;
  padding:18px;
}

/* ================= HERO ================= */

.hero{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:14px;
  margin-bottom:25px;
}

.hero-main{
  min-height:245px;
  border-radius:18px;
  padding:35px;
  background:
    radial-gradient(circle at 80% 20%,rgba(255,255,255,.45),transparent 30%),
    linear-gradient(120deg,#6d28d9,#8b5cf6,#dff7e8);
  display:flex;
  align-items:center;
  overflow:hidden;
  position:relative;
}

.hero-main::after{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  right:-60px;
  bottom:-90px;
  background:rgba(255,255,255,.18);
  border-radius:50%;
}

.hero-content{
  position:relative;
  z-index:2;
  color:#fff;
}

.hero-tag{
  display:inline-block;
  background:#fff;
  color:var(--violet);
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  margin-bottom:12px;
}

.hero h1{
  font-size:34px;
  line-height:1.1;
  margin-bottom:10px;
}

.hero p{
  font-size:15px;
  margin-bottom:18px;
  opacity:.95;
}

.shop-btn{
  border:0;
  background:#fff;
  color:var(--violet-dark);
  border-radius:9px;
  padding:11px 19px;
  font-weight:800;
  cursor:pointer;
}

.hero-side{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:14px;
}

.hero-small{
  border-radius:16px;
  padding:22px;
  background:var(--green);
  border:1px solid #c9efd8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
}

.hero-small:nth-child(2){
  background:var(--violet-light);
  border-color:#e4d4ff;
}

.hero-small h3{
  font-size:18px;
  margin-bottom:6px;
}

.hero-small p{
  color:var(--muted);
  font-size:13px;
}

.hero-emoji{
  font-size:48px;
}

/* ================= SECTION HEADER ================= */

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 0 14px;
}

.section-header h2{
  font-size:22px;
}

.section-header p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.sort{
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  padding:10px 13px;
  outline:none;
}

/* ================= PRODUCTS ================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
}

.product-card{
  background:#fff;
  border:1px solid #ececf0;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.22s ease;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.product-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
  border-color:#dcc8ff;
}

.product-image{
  width:100%;
  height:215px;
  background:#f7f7f8;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/*
 IMPORTANT:
 Image poori dikhegi.
 Product image crop nahi hogi.
*/
.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:10px;
  display:block;
}

.discount-badge{
  position:absolute;
  top:9px;
  left:9px;
  background:var(--green);
  color:var(--green-dark);
  border-radius:6px;
  padding:5px 7px;
  font-size:11px;
  font-weight:800;
}

.product-info{
  padding:12px;
}

.rating{
  display:inline-flex;
  align-items:center;
  gap:3px;
  background:#eefbf2;
  color:#14753b;
  padding:4px 7px;
  border-radius:5px;
  font-size:11px;
  font-weight:800;
  margin-bottom:8px;
}

.product-title{
  font-size:14px;
  line-height:1.35;
  font-weight:700;
  min-height:38px;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.price-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:9px;
}

.price{
  font-size:19px;
  font-weight:900;
}

.mrp{
  font-size:12px;
  color:#999;
  text-decoration:line-through;
}

.off{
  color:#159447;
  font-size:12px;
  font-weight:700;
}

.delivery{
  margin-top:8px;
  font-size:11px;
  color:#16813e;
}

/* ================= LOADING ================= */

.loading-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
}

.skeleton{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);
}

.skeleton-img{
  height:215px;
  background:linear-gradient(
    90deg,
    #f0f0f0 25%,
    #fafafa 50%,
    #f0f0f0 75%
  );
  background-size:200% 100%;
  animation:loading 1.2s infinite;
}

.skeleton-line{
  height:13px;
  margin:12px;
  border-radius:5px;
  background:#eee;
}

@keyframes loading{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.hidden{
  display:none!important;
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  padding:70px 20px;
  background:#fff;
  border-radius:15px;
}

.empty-icon{
  font-size:50px;
  margin-bottom:10px;
}

.empty h2{
  margin-bottom:5px;
}

.empty p{
  color:var(--muted);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .header-top{
    height:auto;
    padding:10px 12px;
    flex-wrap:wrap;
    gap:10px;
  }

  .logo{
    font-size:23px;
  }

  .search-box{
    order:3;
    flex-basis:100%;
  }

  .header-actions{
    margin-left:auto;
  }

  .login-btn{
    display:none;
  }

  .main{
    padding:12px;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .hero-main{
    min-height:210px;
    padding:25px;
  }

  .hero h1{
    font-size:27px;
  }

  .hero-side{
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr;
  }

  .hero-small{
    padding:15px;
  }

  .hero-emoji{
    font-size:32px;
  }

  .product-grid{
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }

  .loading-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .product-image{
    height:190px;
  }

  .product-info{
    padding:9px;
  }

  .product-title{
    font-size:13px;
  }

  .price{
    font-size:17px;
  }
}

@media(max-width:600px){

  .header-top{
    padding:9px 10px;
  }

  .logo{
    font-size:22px;
  }

  .cart-btn{
    padding:0 12px;
    height:40px;
  }

  .search-box input{
    height:42px;
  }

  .categories{
    padding-left:8px;
    padding-right:8px;
  }

  .category{
    min-width:75px;
    padding:5px 8px;
    font-size:11px;
  }

  .category-icon{
    width:38px;
    height:38px;
    font-size:18px;
  }

  .hero{
    gap:10px;
  }

  .hero-main{
    min-height:185px;
    padding:20px;
    border-radius:14px;
  }

  .hero h1{
    font-size:24px;
  }

  .hero p{
    font-size:12px;
  }

  .hero-small{
    border-radius:12px;
    min-height:105px;
  }

  .hero-small h3{
    font-size:14px;
  }

  .hero-small p{
    font-size:10px;
  }

  .hero-emoji{
    font-size:26px;
  }

  .section-header{
    align-items:flex-start;
  }

  .section-header h2{
    font-size:19px;
  }

  .sort{
    font-size:11px;
    padding:8px;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .loading-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .product-image{
    height:175px;
  }

  .product-image img{
    padding:8px;
  }

  .product-info{
    padding:9px;
  }

  .product-title{
    font-size:12px;
    min-height:33px;
  }

  .price-row{
    flex-wrap:wrap;
    gap:4px;
  }

  .price{
    font-size:17px;
  }

  .mrp,
  .off{
    font-size:10px;
  }

  .delivery{
    font-size:10px;
  }

  .rating{
    font-size:10px;
  }
}

@media(max-width:360px){

  .product-grid{
    gap:7px;
  }

  .product-image{
    height:155px;
  }

  .product-title{
    font-size:11px;
  }

  .price{
    font-size:15px;
  }
}
</style>
</head>

<script>

/* =========================================
   SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL =
  "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL
===================================================== */

let allProducts = [];
let currentCategory = "all";
let currentSearch = "";


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  const loading =
    document.getElementById("loading");

  const grid =
    document.getElementById("productGrid");

  const empty =
    document.getElementById("noProducts");

  loading.classList.remove("hidden");
  grid.innerHTML = "";
  empty.classList.add("hidden");

  try{

    const { data, error } =
      await supabaseClient
      .from("products")
      .select("*");

    if(error){
      console.error(error);
      throw error;
    }

    allProducts = data || [];

    renderProducts();

  }catch(error){

    console.error(
      "Products loading error:",
      error
    );

    grid.innerHTML = "";

    empty.classList.remove("hidden");

    empty.querySelector("h2").textContent =
      "Products load nahi ho rahe";

    empty.querySelector("p").textContent =
      "Supabase connection ya products table check karo.";

  }finally{

    loading.classList.add("hidden");

  }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

  const grid =
    document.getElementById("productGrid");

  const empty =
    document.getElementById("noProducts");

  let products =
    [...allProducts];


  /* CATEGORY */

  if(currentCategory !== "all"){

    products =
      products.filter(product => {

        const category =
          String(
            product.category ||
            product.categories ||
            ""
          ).toLowerCase();

        return category.includes(
          currentCategory.toLowerCase()
        );

      });

  }


  /* SEARCH */

  if(currentSearch){

    const search =
      currentSearch.toLowerCase();

    products =
      products.filter(product => {

        const title =
          String(
            product.title ||
            product.name ||
            ""
          ).toLowerCase();

        const category =
          String(
            product.category ||
            ""
          ).toLowerCase();

        const brand =
          String(
            product.brand ||
            ""
          ).toLowerCase();

        return (
          title.includes(search) ||
          category.includes(search) ||
          brand.includes(search)
        );

      });

  }


  /* SORT */

  const sort =
    document.getElementById("sortSelect").value;


  if(sort === "low"){

    products.sort(
      (a,b) =>
        Number(
          a.price ||
          a.sale_price ||
          a.selling_price ||
          0
        )
        -
        Number(
          b.price ||
          b.sale_price ||
          b.selling_price ||
          0
        )
    );

  }


  if(sort === "high"){

    products.sort(
      (a,b) =>
        Number(
          b.price ||
          b.sale_price ||
          b.selling_price ||
          0
        )
        -
        Number(
          a.price ||
          a.sale_price ||
          a.selling_price ||
          0
        )
    );

  }


  if(sort === "new"){

    products.sort(
      (a,b) =>
        new Date(b.created_at || 0)
        -
        new Date(a.created_at || 0)
    );

  }


  /* EMPTY */

  if(products.length === 0){

    grid.innerHTML = "";

    empty.classList.remove("hidden");

    return;

  }

  empty.classList.add("hidden");


  /* HTML */

  grid.innerHTML =
    products
    .map(createProductCard)
    .join("");

}


/* =====================================================
   PRODUCT CARD
===================================================== */

function createProductCard(product){

  const id =
    product.id;

  const title =
    product.title ||
    product.name ||
    "Product";

  const image =
    product.image ||
    product.image_url ||
    product.thumbnail ||
    product.images?.[0] ||
    "https://via.placeholder.com/500x500?text=Product";


  const price =
    Number(
      product.price ||
      product.sale_price ||
      product.selling_price ||
      0
    );


  const mrp =
    Number(
      product.mrp ||
      product.original_price ||
      product.compare_price ||
      price
    );


  const rating =
    product.rating ||
    product.average_rating ||
    "4.5";


  let discount = 0;

  if(mrp > price && price > 0){

    discount =
      Math.round(
        ((mrp-price)/mrp)*100
      );

  }


  return `

    <article
      class="product-card"
      onclick="openProduct('${escapeHtml(id)}')"
    >

      <div class="product-image">

        ${
          discount > 0
          ?
          `<div class="discount-badge">
             ${discount}% OFF
           </div>`
          :
          ""
        }

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(title)}"
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/500x500?text=Product'"
        >

      </div>


      <div class="product-info">

        <div class="rating">
          ★ ${escapeHtml(String(rating))}
        </div>


        <div class="product-title">
          ${escapeHtml(title)}
        </div>


        <div class="price-row">

          <span class="price">
            ₹${formatPrice(price)}
          </span>

          ${
            mrp > price
            ?
            `<span class="mrp">
               ₹${formatPrice(mrp)}
             </span>`
            :
            ""
          }

          ${
            discount > 0
            ?
            `<span class="off">
               ${discount}% OFF
             </span>`
            :
            ""
          }

        </div>


        <div class="delivery">
          ✓ Free delivery available
        </div>

      </div>

    </article>

  `;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(value){

  return Number(value || 0)
    .toLocaleString("en-IN");

}


/* =====================================================
   PRODUCT
===================================================== */

function openProduct(id){

  window.location.href =
    "product.html?id=" +
    encodeURIComponent(id);

}

/* =====================================================
   CART
===================================================== */

async function loadCartCount(){

  try{

    const {
      data:{
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if(!user){

      document
      .getElementById("cartCount")
      .textContent = "0";

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
      .from("cart_items")
      .select("id,quantity")
      .eq("user_id",user.id);


    if(error){

      console.error(
        "Cart count error:",
        error
      );

      return;

    }


    const count =
      (data || [])
      .reduce(
        (total,item) =>
          total +
          Number(item.quantity || 1),
        0
      );


    document
    .getElementById("cartCount")
    .textContent =
      count;


  }catch(error){

    console.error(error);

  }

}
