<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore - Online Shopping</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7fb;
  color:#171717;
  padding-bottom:80px;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:72px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:24px;
  padding:0 4%;
}

.logo{
  font-size:29px;
  font-weight:800;
  color:#7027e8;
  white-space:nowrap;
}

.search-box{
  flex:1;
  position:relative;
}

.search-box input{
  width:100%;
  height:46px;
  border:2px solid #e5d5ff;
  background:#faf8ff;
  border-radius:13px;
  padding:0 50px 0 18px;
  outline:none;
  font-size:15px;
}

.search-box input:focus{
  border-color:#7629e8;
  background:#fff;
}

.search-icon{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  width:21px;
  height:21px;
  stroke:#111;
  fill:none;
  stroke-width:1.8;
}

/* ================= RIGHT HEADER ================= */

.header-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.account-wrap{
  position:relative;
}

.account-btn{
  border:0;
  background:#fff;
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px 8px;
  font-size:15px;
  color:#222;
  white-space:nowrap;
}

.account-btn:hover{
  color:#7027e8;
}

.user-svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.arrow-svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:.2s;
}

.account-wrap.open .arrow-svg{
  transform:rotate(180deg);
}

.cart-header{
  border:0;
  background:#7027e8;
  color:white;
  border-radius:12px;
  height:46px;
  padding:0 17px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
}

.cart-svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.cart-badge{
  min-width:21px;
  height:21px;
  border-radius:50%;
  background:white;
  color:#7027e8;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  font-size:12px;
  font-weight:800;
}

/* ================= ACCOUNT MENU ================= */

.account-menu{
  position:absolute;
  right:0;
  top:calc(100% + 8px);
  width:310px;
  max-height:calc(100vh - 95px);
  overflow-y:auto;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);
  display:none;
}

.account-wrap.open .account-menu{
  display:block;
  animation:drop .15s ease;
}

@keyframes drop{
  from{
    opacity:0;
    transform:translateY(-5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.signup-row{
  padding:17px 19px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:14px;
}

.signup-row a{
  text-decoration:none;
  color:#2874f0;
  font-weight:700;
}

.account-title{
  padding:18px 20px 10px;
  font-size:17px;
  font-weight:700;
}

.menu-item{
  min-height:46px;
  padding:11px 19px;
  display:flex;
  align-items:center;
  gap:15px;
  font-size:15px;
  color:#333;
  transition:.15s;
}

.menu-item:hover{
  background:#f7f7f7;
}

.menu-item svg{
  width:20px;
  height:20px;
  flex:0 0 20px;
  fill:none;
  stroke:#333;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.logout-item{
  border-top:1px solid #eee;
  margin-top:5px;
  color:#d32f2f;
}

.logout-item svg{
  stroke:#d32f2f;
}

/* ================= CATEGORY ================= */

.categories{
  height:94px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  overflow-x:auto;
  padding:8px 4%;
}

.category{
  min-width:65px;
  border:0;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  font-size:13px;
  color:#222;
  position:relative;
}

.category-icon{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#f0e5ff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.category-icon svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:#7027e8;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.category.active{
  color:#7027e8;
  font-weight:700;
}

.category.active .category-icon{
  background:#dcf7e8;
}

.category.active .category-icon svg{
  stroke:#17834c;
}

/* ================= MAIN ================= */

main{
  width:min(1280px,92%);
  margin:auto;
}

.hero-space{
  display:none;
}

.section-head{
  margin:32px 0 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-head h2{
  font-size:24px;
}

.section-head p{
  color:#777;
  font-size:14px;
  margin-top:5px;
}

.sort-select{
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:10px 13px;
  outline:none;
}

/* ================= PRODUCT GRID ================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
  padding-bottom:35px;
}

.product-card{
  background:#fff;
  border:1px solid #e9e9e9;
  border-radius:14px;
  overflow:hidden;
  min-width:0;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.09);
}

.product-image-box{
  width:100%;
  height:245px;
  background:#f7f7f7;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.discount{
  position:absolute;
  left:10px;
  top:10px;
  background:#dcf7e8;
  color:#17834c;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
}

.product-info{
  padding:12px;
}

.rating{
  display:inline-flex;
  align-items:center;
  background:#dcf7e8;
  color:#147d47;
  border-radius:5px;
  padding:4px 7px;
  font-size:12px;
  font-weight:700;
  margin-bottom:9px;
}

.product-title{
  font-size:15px;
  font-weight:600;
  line-height:20px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:40px;
}

.price-row{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.price{
  font-size:20px;
  font-weight:800;
}

.mrp{
  color:#999;
  text-decoration:line-through;
  font-size:12px;
}

.offer{
  color:#17834c;
  font-size:12px;
  font-weight:700;
}

.delivery{
  margin-top:8px;
  color:#17834c;
  font-size:12px;
  font-weight:600;
}

/* ================= PAGE VIEWS ================= */

.page-view{
  display:none;
  padding:30px 0 90px;
}

.page-view.active{
  display:block;
}

.page-title{
  font-size:28px;
  margin-bottom:20px;
}

.back-btn{
  border:0;
  background:#eee7ff;
  color:#7027e8;
  padding:10px 15px;
  border-radius:9px;
  margin-bottom:20px;
}

/* ================= PROFILE ================= */

.profile-card,
.orders-card,
.address-card{
  background:#fff;
  border:1px solid #e6e6e6;
  border-radius:15px;
  padding:22px;
  margin-bottom:16px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:13px;
  font-weight:700;
}

.form-group input,
.form-group select{
  height:45px;
  border:1px solid #ddd;
  border-radius:9px;
  padding:0 13px;
  outline:none;
}

.form-group input:focus{
  border-color:#7027e8;
}

.primary-btn{
  margin-top:18px;
  border:0;
  background:#7027e8;
  color:#fff;
  border-radius:9px;
  padding:12px 20px;
  font-weight:700;
}

.green-btn{
  background:#198754;
}

.danger-btn{
  border:0;
  background:#ffe7e7;
  color:#d32f2f;
  border-radius:8px;
  padding:8px 12px;
  font-weight:600;
}

/* ================= ORDERS ================= */

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.order-number{
  font-size:17px;
  font-weight:800;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  background:#dcf7e8;
  color:#147d47;
  font-size:12px;
  font-weight:700;
}

.order-date{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

.order-total{
  margin-top:15px;
  font-size:18px;
  font-weight:800;
}

.order-address{
  margin-top:12px;
  padding:12px;
  background:#f7f7f7;
  border-radius:9px;
  font-size:13px;
  line-height:20px;
}

.order-items{
  display:grid;
  gap:10px;
  margin-top:15px;
}

.order-item{
  display:flex;
  align-items:center;
  gap:12px;
}

.order-item img{
  width:58px;
  height:58px;
  object-fit:contain;
  border:1px solid #eee;
  border-radius:8px;
  background:#fff;
}

.order-item-name{
  font-weight:600;
  font-size:14px;
}

/* ================= ADDRESS ================= */

.address-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.address-type{
  display:inline-block;
  background:#dcf7e8;
  color:#147d47;
  padding:4px 8px;
  border-radius:5px;
  font-size:11px;
  font-weight:800;
  margin-bottom:8px;
}

.address-name{
  font-size:17px;
  font-weight:700;
}

.address-text{
  margin-top:7px;
  line-height:21px;
  font-size:14px;
  color:#444;
}

.address-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.address-form{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #eee;
}

.address-form.open{
  display:block;
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  background:#fff;
  border:1px dashed #ccc;
  border-radius:15px;
  padding:45px 20px;
  color:#777;
}

.empty h3{
  color:#222;
  margin-bottom:7px;
}

/* ================= MOBILE NAV ================= */

.mobile-nav{
  display:none;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:20px;
  bottom:25px;
  z-index:5000;
  background:#222;
  color:white;
  padding:13px 18px;
  border-radius:9px;
  opacity:0;
  pointer-events:none;
  transform:translateY(10px);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

  .product-grid{
    grid-template-columns:repeat(4,1fr);
  }

}

@media(max-width:800px){

  body{
    padding-bottom:78px;
  }

  .header{
    height:64px;
    padding:0 12px;
    gap:10px;
  }

  .logo{
    font-size:23px;
  }

  .search-box{
    order:3;
    position:absolute;
    top:70px;
    left:12px;
    right:12px;
  }

  .search-box input{
    height:44px;
  }

  .header{
    margin-bottom:60px;
  }

  /* Mobile header cart hidden */
  .cart-header{
    display:none;
  }

  .header-right{
    margin-left:auto;
  }

  .account-btn{
    padding:7px 3px;
  }

  .account-menu{
    position:fixed;
    top:64px;
    right:8px;
    left:8px;
    width:auto;
    max-height:calc(100vh - 145px);
  }

  .categories{
    height:88px;
    justify-content:flex-start;
    gap:20px;
    padding-left:15px;
  }

  main{
    width:94%;
  }

  .section-head{
    margin-top:24px;
    align-items:flex-end;
  }

  .section-head h2{
    font-size:20px;
  }

  .product-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-image-box{
    height:210px;
  }

  .product-info{
    padding:10px;
  }

  .product-title{
    font-size:14px;
    line-height:18px;
    min-height:36px;
  }

  .price{
    font-size:18px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .address-list{
    grid-template-columns:1fr;
  }

  .page-title{
    font-size:23px;
  }

  .mobile-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    background:#fff;
    border-top:1px solid #ddd;
    z-index:4000;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    box-shadow:0 -3px 14px rgba(0,0,0,.08);
  }

  .mobile-nav button{
    border:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
    color:#555;
  }

  .mobile-nav button.active{
    color:#7027e8;
    font-weight:700;
  }

  .mobile-nav svg{
    width:22px;
    height:22px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

}

@media(max-width:420px){

  .product-image-box{
    height:185px;
  }

  .categories{
    gap:14px;
  }

  .category-icon{
    width:40px;
    height:40px;
  }

  .category-icon svg{
    width:21px;
    height:21px;
  }

}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="logo">MyStore</div>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="Search for Products, Brands and More"
    >

    <svg class="search-icon" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M16.5 16.5L21 21"></path>
    </svg>
  </div>

  <div class="header-right">

    <!-- ACCOUNT -->
    <div class="account-wrap" id="accountWrap">

      <button class="account-btn" id="accountBtn">

        <svg class="user-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20c.7-4 3.1-6 7-6s6.3 2 7 6"></path>
        </svg>

        <span id="accountName">Login</span>

        <svg class="arrow-svg" viewBox="0 0 24 24">
          <path d="M7 10l5 5 5-5"></path>
        </svg>

      </button>


      <div class="account-menu" id="accountMenu">

        <!-- LOGGED OUT -->

        <div id="loggedOutMenu">

          <div class="signup-row">
            <span>New customer?</span>
            <a href="signup.html">Sign Up</a>
          </div>

          <div class="menu-item" onclick="requireLogin('profile')">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M5 20c.7-4 3.1-6 7-6s6.3 2 7 6"/>
            </svg>
            <span>My Profile</span>
          </div>

          <div class="menu-item" onclick="requireLogin('orders')">
            <svg viewBox="0 0 24 24">
              <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
              <path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>
            </svg>
            <span>Orders</span>
          </div>

          <div class="menu-item" onclick="requireLogin('addresses')">
            <svg viewBox="0 0 24 24">
              <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/>
              <circle cx="12" cy="10" r="2.5"/>
            </svg>
            <span>Saved Addresses</span>
          </div>

        </div>


        <!-- LOGGED IN -->

        <div id="loggedInMenu" style="display:none;">

          <div class="account-title">
            Your Account
          </div>

          <div class="menu-item" onclick="showPage('profile')">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M5 20c.7-4 3.1-6 7-6s6.3 2 7 6"/>
            </svg>
            <span>My Profile</span>
          </div>

          <div class="menu-item" onclick="showPage('orders')">
            <svg viewBox="0 0 24 24">
              <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
              <path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>
            </svg>
            <span>Orders</span>
          </div>

          <div class="menu-item" onclick="showPage('addresses')">
            <svg viewBox="0 0 24 24">
              <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/>
              <circle cx="12" cy="10" r="2.5"/>
            </svg>
            <span>Saved Addresses</span>
          </div>

          <div class="menu-item" onclick="goCart()">
            <svg viewBox="0 0 24 24">
              <path d="M3 4h2l2 12h11l2-8H6"/>
              <circle cx="9" cy="20" r="1.5"/>
              <circle cx="17" cy="20" r="1.5"/>
            </svg>
            <span>Cart</span>
          </div>

          <div class="menu-item logout-item" id="logoutBtn">
            <svg viewBox="0 0 24 24">
              <path d="M10 5H5v14h5"/>
              <path d="M14 8l4 4-4 4M8 12h10"/>
            </svg>
            <span>Logout</span>
          </div>

        </div>

      </div>
    </div>


    <!-- DESKTOP CART -->

    <button class="cart-header" onclick="goCart()">

      <svg class="cart-svg" viewBox="0 0 24 24">
        <path d="M3 4h2l2 12h11l2-8H6"/>
        <circle cx="9" cy="20" r="1.5"/>
        <circle cx="17" cy="20" r="1.5"/>
      </svg>

      <span>Cart</span>

      <span class="cart-badge" id="cartCount">0</span>

    </button>

  </div>

</header>


<!-- ================= CATEGORIES ================= -->

<nav class="categories">

  <button class="category active" onclick="goHome()">
    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 11l9-8 9 8"/>
        <path d="M5 10v10h14V10"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </span>
    <span>For You</span>
  </button>

  <button class="category">
    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M7 5l2-2h6l2 2 3 3-3 4-2-2v11H9V10l-2 2-3-4 3-3z"/>
      </svg>
    </span>
    <span>Fashion</span>
  </button>

  <button class="category">
    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="19" rx="2"/>
        <path d="M10 5h4M11 18h2"/>
      </svg>
    </span>
    <span>Mobiles</span>
  </button>

  <button class="category">
    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="13" rx="1"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
    </span>

/* =========================================================

   ========================================================= */

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   MAIN IMAGE
   ========================================================= */

function getMainImage(product){

  /*
    MAIN IMAGE KO HAMESHA PRIORITY
  */

  const direct =
    product.main_image ||
    product.mainImage ||
    product.image ||
    product.image_url ||
    product.imageUrl ||
    product.thumbnail;

  if(typeof direct === "string" && direct.trim()){
    return direct;
  }

  /*
    Agar images JSON array hai
  */

  let imgs = product.images;

  if(typeof imgs === "string"){

    try{
      imgs = JSON.parse(imgs);
    }catch{
      imgs = [imgs];
    }

  }

  if(Array.isArray(imgs) && imgs.length){

    return imgs[0];
  }

  return "https://via.placeholder.com/500x500?text=Product";
}


/* =========================================================
   AUTH
   ========================================================= */

async function loadUser(){

  const {data,error} = await sb.auth.getUser();

  if(error || !data || !data.user){

    currentUser = null;

    updateAccountUI();

    return null;
  }

  currentUser = data.user;

  updateAccountUI();

  return currentUser;
}


/* =========================================================
   ACCOUNT UI
   ========================================================= */

async function updateAccountUI(){

  const nameEl =
    document.getElementById("accountName");

  const loggedOut =
    document.getElementById("loggedOutMenu");

  const loggedIn =
    document.getElementById("loggedInMenu");


  if(!currentUser){

    nameEl.textContent = "Login";

    loggedOut.style.display = "block";
    loggedIn.style.display = "none";

    return;
  }


  let name = "";


  /*
    AUTH METADATA
  */

  if(currentUser.user_metadata){

    name =
      currentUser.user_metadata.full_name ||
      currentUser.user_metadata.name ||
      "";
  }


  /*
    ACCOUNTS TABLE
  */

  try{

    const {data} = await sb
      .from("accounts")
      .select("full_name")
      .eq("id",currentUser.id)
      .maybeSingle();

    if(data && data.full_name){
      name = data.full_name;
    }

  }catch(err){

    console.log(err);

  }


  if(!name && currentUser.email){

    name =
      currentUser.email
        .split("@")[0]
        .replace(/[._-]/g," ");

  }


  name =
    name
      .trim()
      .split(" ")
      .map(x =>
        x.charAt(0).toUpperCase()+x.slice(1)
      )
      .join(" ");


  nameEl.textContent = name || "Account";

  loggedOut.style.display = "none";
  loggedIn.style.display = "block";
}

/* =========================================================
   PRODUCTS
   ========================================================= */

async function loadProducts(){

  const loading =
    document.getElementById("productLoading");

  const grid =
    document.getElementById("productGrid");


  const {data,error} =
    await sb
      .from("products")
      .select("*");


  if(error){

    console.error(error);

    loading.innerHTML =
      "<h3>Products load nahi ho rahe</h3><p>Supabase products table check karein.</p>";

    return;
  }


  products = data || [];

  renderProducts(products);

}


function renderProducts(list){

  const grid =
    document.getElementById("productGrid");

  const loading =
    document.getElementById("productLoading");


  loading.style.display = "none";


  if(!list.length){

    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <h3>No products found</h3>
        <p>Try another search.</p>
      </div>
    `;

    return;
  }


  grid.innerHTML =
    list.map(product=>{

      const image =
        getMainImage(product);

      const title =
        product.title ||
        product.name ||
        product.product_name ||
        "Product";


      const price =
        Number(
          product.price ||
          product.sale_price ||
          0
        );


      const mrp =
        Number(
          product.mrp ||
          product.original_price ||
          price
        );


      let discount = 0;

      if(mrp > price && price > 0){

        discount =
          Math.round(
            ((mrp-price)/mrp)*100
          );

      }


      const rating =
        product.rating ||
        product.average_rating ||
        "4.6";


      return `

        <article
          class="product-card"
          onclick="openProduct('${escapeHtml(product.id || product.product_id || "")}')"
        >

          <div class="product-image-box">

            ${
              discount > 0
              ? `<span class="discount">${discount}% OFF</span>`
              : ""
            }

            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(title)}"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/500x500?text=Product'"
            >

          </div>


          <div class="product-info">

            <span class="rating">
              ★ ${escapeHtml(rating)}
            </span>


            <div class="product-title">
              ${escapeHtml(title)}
            </div>


            <div class="price-row">

              <span class="price">
                ₹${price.toLocaleString("en-IN")}
              </span>

              ${
                mrp > price
                ? `
                  <span class="mrp">
                    ₹${mrp.toLocaleString("en-IN")}
                  </span>
                `
                : ""
              }

              ${
                discount > 0
                ? `
                  <span class="offer">
                    ${discount}% OFF
                  </span>
                `
                : ""
              }

            </div>


            <div class="delivery">
              ✓ Delivery available
            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   PRODUCT SEARCH
   ========================================================= */

document
  .getElementById("searchInput")
  .addEventListener("input",function(){

    const query =
      this.value
        .trim()
        .toLowerCase();


    if(!query){

      renderProducts(products);

      return;
    }


    const filtered =
      products.filter(p=>{

        const text = [

          p.title,
          p.name,
          p.product_name,
          p.category,
          p.brand

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(query);

      });


    renderProducts(filtered);

});


/* =========================================================
   SORT
   ========================================================= */

document
  .getElementById("sortSelect")
  .addEventListener("change",function(){

    let list =
      [...products];


    if(this.value === "low"){

      list.sort(
        (a,b)=>
          Number(a.price||a.sale_price||0)
          -
          Number(b.price||b.sale_price||0)
      );

    }


    if(this.value === "high"){

      list.sort(
        (a,b)=>
          Number(b.price||b.sale_price||0)
          -
          Number(a.price||a.sale_price||0)
      );

    }


    if(this.value === "new"){

      list.sort(
        (a,b)=>
          new Date(b.created_at||0)
          -
          new Date(a.created_at||0)
      );

    }


    renderProducts(list);

});


function openProduct(id){

  if(id){

    window.location.href =
      "product.html?id="+
      encodeURIComponent(id);

  }

}

   PROFILE
   ========================================================= */

async function loadProfile(){

  if(!currentUser) return;


  document.getElementById("profileEmail")
    .value =
      currentUser.email || "";


  const {data,error} =
    await sb
      .from("accounts")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(error){

    console.error(error);

    return;
  }


  if(data){

    document.getElementById("profileName")
      .value =
        data.full_name || "";

    document.getElementById("profileMobile")
      .value =
        data.mobile || "";

  }

}


async function saveProfile(){

  if(!currentUser){

    requireLogin("profile");

    return;
  }


  const full_name =
    document
      .getElementById("profileName")
      .value
      .trim();


  const mobile =
    document
      .getElementById("profileMobile")
      .value
      .trim();


  if(!full_name){

    toast("Name enter karein");

    return;
  }


  const {error} =
    await sb
      .from("accounts")
      .upsert({

        id:currentUser.id,

        email:
          currentUser.email,

        full_name,

        mobile

      },{
        onConflict:"id"
      });


  if(error){

    console.error(error);

    toast(error.message);

    return;
  }


  /*
    Auth metadata bhi update
  */

  await sb.auth.updateUser({

    data:{
      full_name:full_name
    }

  });


  toast("Profile successfully updated");

  await loadUser();

}

   ORDERS
   ========================================================= */

async function loadOrders(){

  const container =
    document.getElementById("ordersContainer");


  container.innerHTML = `
    <div class="empty">
      Loading orders...
    </div>
  `;


  const {data,error} =
    await sb
      .from("orders")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        <h3>Orders load nahi ho rahe</h3>
        <p>${escapeHtml(error.message)}</p>
      </div>
    `;

    return;
  }


  if(!data || !data.length){

    container.innerHTML = `
      <div class="empty">
        <h3>No orders yet</h3>
        <p>Aapke orders yahan dikhai denge.</p>
      </div>
    `;

    return;
  }


  container.innerHTML =
    data.map(order=>{

      const items =
        Array.isArray(order.items)
        ? order.items
        : [];


      let address = order.address;

      if(typeof address === "string"){

        try{
          address =
            JSON.parse(address);
        }catch{
          address = {};
        }

      }


      return `

        <div class="orders-card">

          <div class="order-top">

            <div>

              <div class="order-number">
                Order #${
                  escapeHtml(
                    order.order_number ||
                    order.id?.slice(0,8)
                  )
                }
              </div>

              <div class="order-date">
                ${
                  order.created_at
                  ? new Date(order.created_at)
                    .toLocaleString("en-IN")
                  : ""
                }
              </div>

            </div>

            <span class="status">
              ${escapeHtml(
                order.status || "placed"
              )}
            </span>

          </div>


          <div class="order-items">

            ${
              items.length
              ?
              items.map(item=>{

                const itemImage =
                  item.main_image ||
                  item.image ||
                  item.image_url ||
                  item.url ||
                  (
                    Array.isArray(item.images)
                    ? item.images[0]
                    : ""
                  ) ||
                  "https://via.placeholder.com/100";

                const itemTitle =
                  item.title ||
                  item.name ||
                  item.product_name ||
                  "Product";

                const qty =
                  item.qty ||
                  item.quantity ||
                  1;


                return `

                  <div class="order-item">

                    <img
                      src="${escapeHtml(itemImage)}"
                      alt=""
                      onerror="this.src='https://via.placeholder.com/100'"
                    >

                    <div>

                      <div class="order-item-name">
                        ${escapeHtml(itemTitle)}
                      </div>

                      <div style="color:#777;font-size:12px;margin-top:4px">
                        Qty: ${escapeHtml(qty)}
                      </div>

                    </div>

                  </div>

                `;

              }).join("")
              :
              `
                <div style="color:#777">
                  Order items available nahi hain.
                </div>
              `
            }

          </div>


          <div class="order-total">
            Total:
            ₹${Number(order.total_amount||0)
              .toLocaleString("en-IN")}
          </div>


          ${
            address
            ?
            `
              <div class="order-address">

                <strong>
                  Delivery Address
                </strong>

                <br>

                ${
                  escapeHtml(
                    address.name ||
                    ""
                  )
                }

                ${
                  address.phone
                  ? " • "+escapeHtml(address.phone)
                  : ""
                }

                <br>

                ${
                  escapeHtml(
                    [
                      address.house,
                      address.road,
                      address.city,
                      address.state,
                      address.pincode
                    ]
                    .filter(Boolean)
                    .join(", ")
                  )
                }

              </div>
            `
            : ""
          }

        </div>

      `;

    }).join("");

}

    list.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <h3>No saved address</h3>
        <p>Apna delivery address save karein.</p>
      </div>
    `;

    return;
  }


  list.innerHTML =
    data.map(address=>`

      <div class="address-card">

        <span class="address-type">
          ${escapeHtml(address.type || "Home")}
        </span>

        <div class="address-name">
          ${escapeHtml(address.name || "")}
        </div>

        <div style="margin-top:5px;font-size:13px">
          ${escapeHtml(address.phone || "")}
        </div>

        <div class="address-text">

          ${escapeHtml(address.house || "")}
          ${address.road ? ", "+escapeHtml(address.road) : ""}

          <br>

          ${escapeHtml(address.city || "")},
          ${escapeHtml(address.state || "")}
          - ${escapeHtml(address.pincode || "")}

        </div>


        <div class="address-actions">

          <button
            class="primary-btn"
            style="margin:0;padding:8px 13px"
            onclick='editAddress(${JSON.stringify(address)})'
          >
            Edit
          </button>

          <button
            class="danger-btn"
            onclick="deleteAddress('${address.id}')"
          >
            Delete
          </button>

        </div>

      </div>

    `).join("");

}


/* =========================================================
   ADDRESS FORM
   ========================================================= */

function toggleAddressForm(){

  const form =
    document.getElementById("addressForm");

  form.classList.toggle("open");

}


function clearAddressForm(){

  [
    "addrName",
    "addrPhone",
    "addrPincode",
    "addrState",
    "addrCity",
    "addrHouse",
    "addrRoad"

  ].forEach(id=>{

    document.getElementById(id).value = "";

  });


  document.getElementById("addrType")
    .value = "Home";


  editingAddressId = null;

}


function editAddress(address){

  editingAddressId =
    address.id;


  document.getElementById("addrName")
    .value =
      address.name || "";

  document.getElementById("addrPhone")
    .value =
      address.phone || "";

  document.getElementById("addrPincode")
    .value =
      address.pincode || "";

  document.getElementById("addrState")
    .value =
      address.state || "";

  document.getElementById("addrCity")
    .value =
      address.city || "";

  document.getElementById("addrHouse")
    .value =
      address.house || "";

  document.getElementById("addrRoad")
    .value =
      address.road || "";

  document.getElementById("addrType")
    .value =
      address.type || "Home";


  document.getElementById("addressForm")
    .classList.add("open");


  document
    .getElementById("addressForm")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}


async function saveAddress(){

  if(!currentUser){

    requireLogin("addresses");

    return;
  }


  const address = {

    user_id:
      currentUser.id,

    name:
      document.getElementById("addrName")
        .value.trim(),

    phone:
      document.getElementById("addrPhone")
        .value.trim(),

    pincode:
      document.getElementById("addrPincode")
        .value.trim(),

    state:
      document.getElementById("addrState")
        .value.trim(),

    city:
      document.getElementById("addrCity")
        .value.trim(),

    house:
      document.getElementById("addrHouse")
        .value.trim(),

    road:
      document.getElementById("addrRoad")
        .value.trim(),

    type:
      document.getElementById("addrType")
        .value

  };


  if(
    !address.name ||
    !address.phone ||
    !address.pincode ||
    !address.state ||
    !address.city ||
    !address.house ||
    !address.road
  ){

    toast("Saare address fields bharein");

    return;
  }


  let result;


  if(editingAddressId){

    result =
      await sb
        .from("saved_addresses")
        .update(address)
        .eq("id",editingAddressId)
        .eq("user_id",currentUser.id);

  }else{

    result =
      await sb
        .from("saved_addresses")
        .insert(address);

  }


  if(result.error){

    console.error(result.error);

    toast(result.error.message);

    return;
  }


  toast(
    editingAddressId
    ? "Address updated"
    : "Address saved"
  );


  clearAddressForm();

  document
    .getElementById("addressForm")
    .classList.remove("open");


  await loadAddresses();

}


async function deleteAddress(id){

  if(!confirm("Is address ko delete karna hai?")){

    return;
  }


  const {error} =
    await sb
      .from("saved_addresses")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);


  if(error){

    console.error(error);

    toast(error.message);

    return;
  }


  toast("Address deleted");

  await loadAddresses();

}


/* =========================================================
   LOGOUT
   ========================================================= */

document
  .getElementById("logoutBtn")
  .addEventListener("click",async()=>{

    const {error} =
      await sb.auth.signOut();


    if(error){

      toast(error.message);

      return;
    }


    currentUser = null;

    updateAccountUI();

    accountWrap.classList.remove("open");

    goHome();

    toast("Logged out successfully");

});


/* =========================================================
   AUTH STATE
   ========================================================= */

sb.auth.onAuthStateChange(
  async(event,session)=>{

    currentUser =
      session?.user || null;

    updateAccountUI();

  }
);


/* =========================================================
   CART COUNT
   ========================================================= */

async function loadCartCount(){

  if(!currentUser){

    document.getElementById("cartCount")
      .textContent = "0";

    return;
  }


  /*
    cart_items me quantity/qty dono
    handle kiya gaya hai.
  */

  const {data,error} =
    await sb
      .from("cart_items")
      .select("*")
      .eq("user_id",currentUser.id);


  if(error){

    console.log("Cart count:",error.message);

    return;
  }


  let count = 0;


  (data||[]).forEach(item=>{

    count += Number(
      item.quantity ||
      item.qty ||
      1
    );

  });


  document.getElementById("cartCount")
    .textContent = count;

}


/* =========================================================
   START
   ========================================================= */

(async function(){

  await loadUser();

  await loadProducts();

  await loadCartCount();

})();

</script>
