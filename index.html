<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   MY STORE
   VIOLET + WHITE + LIGHT GREEN
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --violet:#6d28d9;
    --violet-dark:#4c1d95;
    --violet-light:#ede9fe;

    --green:#86efac;
    --green-dark:#166534;
    --green-soft:#ecfdf5;

    --white:#ffffff;
    --bg:#fafafa;

    --text:#171717;
    --muted:#737373;

    --border:#e5e5e5;

    --shadow:0 10px 30px rgba(0,0,0,.07);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    color:var(--text);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #fafafa 50%,
            #f5fff9 100%
        );

    min-height:100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    width:100%;

    min-height:78px;

    padding:14px max(24px,5vw);

    display:flex;

    align-items:center;

    gap:25px;

    position:sticky;

    top:0;

    z-index:1000;

    background:rgba(255,255,255,.96);

    border-bottom:1px solid #eeeeee;

    backdrop-filter:blur(14px);
}


/* LOGO */

.logo{
    text-decoration:none;

    color:#111;

    font-size:28px;

    font-weight:900;

    letter-spacing:-1.5px;

    white-space:nowrap;
}

.logo span{
    color:var(--violet);
}


/* SEARCH */

.search{
    position:relative;

    flex:1;

    max-width:900px;

    height:48px;

    margin:auto;
}

.search-icon{
    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    font-size:24px;

    color:var(--violet);

    pointer-events:none;
}

#searchInput{
    width:100%;

    height:100%;

    border:1px solid #dddddd;

    border-radius:15px;

    outline:none;

    background:#fafafa;

    padding:0 18px 0 45px;

    font-size:15px;

    color:var(--text);

    transition:.2s;
}

#searchInput:focus{
    background:white;

    border-color:var(--violet);

    box-shadow:
        0 0 0 4px rgba(109,40,217,.10);
}


/* CART */

.cart-btn{
    height:48px;

    padding:0 18px;

    border:0;

    border-radius:14px;

    background:var(--violet);

    color:white;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:8px;

    white-space:nowrap;

    box-shadow:
        0 8px 20px rgba(109,40,217,.20);

    transition:.2s;
}

.cart-btn:hover{
    background:var(--violet-dark);

    transform:translateY(-1px);
}

.cart-count{
    min-width:24px;

    height:24px;

    padding:0 6px;

    border-radius:50px;

    background:var(--green);

    color:var(--green-dark);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:12px;

    font-weight:900;
}


/* =========================================================
   MAIN
========================================================= */

main{
    width:min(1400px,90%);

    margin:auto;

    padding:38px 0 70px;
}


/* =========================================================
   TOP SECTION
========================================================= */

.top-section{
    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.mini-title{
    display:inline-block;

    padding:6px 12px;

    border-radius:50px;

    background:var(--violet-light);

    color:var(--violet);

    font-size:11px;

    font-weight:900;

    letter-spacing:1.2px;

    margin-bottom:10px;
}

.top-section h1{
    font-size:clamp(32px,4vw,48px);

    line-height:1.05;

    letter-spacing:-2px;

    font-weight:900;
}

.top-section h1 span{
    color:var(--violet);
}

.top-section p{
    margin-top:9px;

    color:var(--muted);

    font-size:15px;
}


/* SORT */

#sortSelect{
    min-width:180px;

    height:45px;

    padding:0 14px;

    border:1px solid var(--border);

    border-radius:12px;

    background:white;

    color:#333;

    font-size:14px;

    font-weight:600;

    outline:none;

    cursor:pointer;
}

#sortSelect:focus{
    border-color:var(--violet);

    box-shadow:
        0 0 0 3px rgba(109,40,217,.08);
}


/* =========================================================
   CATEGORY
========================================================= */

.categories{
    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:3px 2px 15px;

    margin-bottom:20px;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;

    padding:10px 18px;

    border:1px solid #dddddd;

    border-radius:50px;

    background:white;

    color:#444;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.category:hover{
    color:var(--violet);

    border-color:var(--violet);
}

.category.active{
    background:var(--violet);

    border-color:var(--violet);

    color:white;

    box-shadow:
        0 6px 16px rgba(109,40,217,.18);
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.product-grid{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:20px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{
    background:white;

    border:1px solid #eeeeee;

    border-radius:18px;

    overflow:hidden;

    cursor:pointer;

    box-shadow:
        0 4px 16px rgba(0,0,0,.045);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.product-card:hover{
    transform:translateY(-5px);

    border-color:#d9ccf7;

    box-shadow:
        0 16px 35px rgba(109,40,217,.11);
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{
    width:100%;

    height:280px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #f5f3ff,
            #ffffff 55%,
            #f0fdf4
        );
}

.product-image img{
    width:100%;

    height:100%;

    display:block;

    object-fit:contain;

    object-position:center;

    padding:12px;

    transition:transform .35s ease;
}

.product-card:hover .product-image img{
    transform:scale(1.035);
}


/* =========================================================
   PRODUCT CONTENT
========================================================= */

.product-info{
    padding:15px;
}

.product-category{
    display:inline-flex;

    padding:5px 8px;

    border-radius:6px;

    background:var(--green-soft);

    color:var(--green-dark);

    font-size:10px;

    font-weight:900;

    margin-bottom:9px;
}

.product-title{
    font-size:16px;

    line-height:1.35;

    font-weight:800;

    margin-bottom:9px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.product-description{
    color:var(--muted);

    font-size:12px;

    line-height:1.45;

    margin-bottom:10px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}


/* PRICE */

.price-row{
    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:7px;
}

.price{
    color:var(--violet);

    font-size:21px;

    font-weight:900;
}

.mrp{
    color:#999;

    font-size:12px;

    text-decoration:line-through;
}

.discount{
    color:var(--green-dark);

    background:var(--green-soft);

    font-size:11px;

    font-weight:800;

    padding:4px 7px;

    border-radius:6px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    min-height:300px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:12px;

    color:var(--muted);

    font-size:14px;
}

.loader{
    width:36px;

    height:36px;

    border:4px solid var(--violet-light);

    border-top-color:var(--violet);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   NO PRODUCTS
========================================================= */

.no-products{
    min-height:350px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.hidden{
    display:none !important;
}

.no-icon{
    width:70px;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:var(--violet-light);

    color:var(--violet);

    font-size:32px;

    margin-bottom:15px;
}

.no-products h2{
    font-size:22px;

    margin-bottom:7px;
}

.no-products p{
    color:var(--muted);
}


/* =========================================================
   ERROR
========================================================= */

.error-box{
    margin:30px auto;

    max-width:600px;

    padding:20px;

    border-radius:15px;

    background:#fff1f2;

    border:1px solid #fecdd3;

    color:#9f1239;

    text-align:center;

    font-size:14px;

    line-height:1.6;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1050px){

    .header{
        padding-left:24px;
        padding-right:24px;
    }

    main{
        width:94%;
    }

    .product-grid{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .product-image{
        height:250px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .header{
        display:grid;

        grid-template-columns:auto auto;

        gap:10px;

        padding:12px;

        min-height:auto;
    }

    .logo{
        font-size:24px;
    }

    .cart-btn{
        margin-left:auto;

        height:42px;

        padding:0 14px;

        border-radius:12px;
    }

    .search{
        grid-column:1 / -1;

        grid-row:2;

        width:100%;

        max-width:none;

        height:44px;
    }

    main{
        width:94%;

        padding-top:25px;
    }

    .top-section{
        flex-direction:column;

        align-items:flex-start;

        margin-bottom:20px;
    }

    .top-section h1{
        font-size:34px;

        letter-spacing:-1.4px;
    }

    #sortSelect{
        width:100%;
    }

    .product-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:12px;
    }

    .product-card{
        border-radius:14px;
    }

    .product-image{
        height:190px;
    }

    .product-image img{
        padding:8px;
    }

    .product-info{
        padding:12px;
    }

    .product-title{
        font-size:14px;
    }

    .product-description{
        font-size:11px;
    }

    .price{
        font-size:18px;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:390px){

    .logo{
        font-size:22px;
    }

    .cart-btn span.cart-text{
        display:none;
    }

    .cart-btn{
        padding:0 12px;
    }

    .product-grid{
        gap:9px;
    }

    .product-image{
        height:165px;
    }

    .product-image img{
        padding:6px;
    }

    .product-info{
        padding:10px;
    }

    .product-title{
        font-size:13px;
    }

    .price{
        font-size:17px;
    }
}

</style>
</head>


<body>


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

    <a href="./index.html" class="logo">
        My<span>Store</span>
    </a>


    <div class="search">

        <span class="search-icon">⌕</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            autocomplete="off"
        >

    </div>


    <button
        class="cart-btn"
        id="cartBtn">

        🛒

        <span class="cart-text">
            Cart
        </span>

        <b
            class="cart-count"
            id="cartCount">
            0
        </b>

    </button>

</header>



<!-- ======================================================
     MAIN
====================================================== -->

<main>


    <section class="top-section">

        <div>

            <div class="mini-title">
                MY STORE
            </div>

            <h1>
                Explore <span>Products</span>
            </h1>

            <p>
                Discover products you'll love.
            </p>

        </div>


        <select id="sortSelect">

            <option value="popular">
                Popular
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

            <option value="new">
                Newest
            </option>

        </select>

    </section>



    <!-- CATEGORY -->

    <div
        id="categoryBar"
        class="categories">

        <button
            class="category active"
            data-category="all">

            All

        </button>

    </div>



    <!-- LOADING -->

    <div
        id="loading"
        class="loading">

        <div class="loader"></div>

        <span>
            Loading products...
        </span>

    </div>



    <!-- PRODUCTS -->

    <section
        id="productGrid"
        class="product-grid">
    </section>



    <!-- NO PRODUCTS -->

    <div
        id="noProducts"
        class="no-products hidden">

        <div class="no-icon">
            ⌕
        </div>

        <h2>
            No products found
        </h2>

        <p>
            Try another search or category.
        </p>

    </div>


</main>



<script>

/* =========================================
   SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL =
  "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTS
========================================================= */

const productGrid =
    document.getElementById("productGrid");

const loading =
    document.getElementById("loading");

const noProducts =
    document.getElementById("noProducts");

const searchInput =
    document.getElementById("searchInput");

const sortSelect =
    document.getElementById("sortSelect");

const categoryBar =
    document.getElementById("categoryBar");

const cartCount =
    document.getElementById("cartCount");

const cartBtn =
    document.getElementById("cartBtn");


/* =========================================================
   DATA
========================================================= */

let allProducts = [];

let selectedCategory = "all";


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await loadProducts();

        await updateCartCount();

    }
);


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    loading.classList.remove("hidden");

    productGrid.innerHTML = "";

    noProducts.classList.add("hidden");


    try{

        const {
            data,
            error
        } =
        await supabaseClient

            .from("products")

            .select("*");


        if(error){

            throw error;

        }


        allProducts =
            data || [];


        buildCategories();

        renderProducts();


    }catch(error){

        console.error(
            "Product loading error:",
            error
        );


        productGrid.innerHTML = `

            <div class="error-box">

                <strong>
                    Products load nahi ho paaye.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Unknown Supabase error"
                )}

            </div>

        `;

    }


    loading.classList.add("hidden");

}


/* =========================================================
   CATEGORIES
========================================================= */

function buildCategories(){

    const categories =
        new Set();


    allProducts.forEach(
        product => {

            const category =
                product.category ||
                product.category_name ||
                product.type;


            if(category){

                categories.add(
                    String(category).trim()
                );

            }

        }
    );


    categoryBar.innerHTML = `

        <button
            class="category active"
            data-category="all">

            All

        </button>

    `;


    categories.forEach(
        category => {

            const button =
                document.createElement("button");


            button.className =
                "category";


            button.dataset.category =
                category;


            button.textContent =
                category;


            categoryBar.appendChild(
                button
            );

        }
    );


    categoryBar
        .querySelectorAll(".category")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    categoryBar
                        .querySelectorAll(".category")
                        .forEach(
                            b =>
                            b.classList.remove(
                                "active"
                            )
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedCategory =
                        button.dataset.category;


                    renderProducts();

                }
            );

        });

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    let products =
        [...allProducts];


    /* SEARCH */

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    if(search){

        products =
            products.filter(
                product => {

                    const title =
                        String(
                            product.title ||
                            product.name ||
                            product.product_name ||
                            ""
                        )
                        .toLowerCase();


                    const description =
                        String(
                            product.description ||
                            product.details ||
                            ""
                        )
                        .toLowerCase();


                    const category =
                        String(
                            product.category ||
                            product.category_name ||
                            ""
                        )
                        .toLowerCase();


                    return (
                        title.includes(search) ||
                        description.includes(search) ||
                        category.includes(search)
                    );

                }
            );

    }


    /* CATEGORY */

    if(
        selectedCategory !== "all"
    ){

        products =
            products.filter(
                product => {

                    const category =
                        String(
                            product.category ||
                            product.category_name ||
                            product.type ||
                            ""
                        )
                        .trim();


                    return (
                        category ===
                        selectedCategory
                    );

                }
            );

    }


    /* SORT */

    const sort =
        sortSelect.value;


    if(sort === "low"){

        products.sort(
            (a,b) =>
                getPrice(a) -
                getPrice(b)
        );

    }


    if(sort === "high"){

        products.sort(
            (a,b) =>
                getPrice(b) -
                getPrice(a)
        );

    }


    if(sort === "new"){

        products.sort(
            (a,b) => {

                const dateA =
                    new Date(
                        a.created_at ||
                        0
                    ).getTime();


                const dateB =
                    new Date(
                        b.created_at ||
                        0
                    ).getTime();


                return dateB - dateA;

            }
        );

    }


    if(sort === "popular"){

        products.sort(
            (a,b) => {

                const aValue =
                    Number(
                        a.sales ||
                        a.orders_count ||
                        a.rating ||
                        0
                    );


                const bValue =
                    Number(
                        b.sales ||
                        b.orders_count ||
                        b.rating ||
                        0
                    );


                return bValue - aValue;

            }
        );

    }


    /* EMPTY */

    if(products.length === 0){

        productGrid.innerHTML = "";

        noProducts.classList.remove(
            "hidden"
        );

        return;

    }


    noProducts.classList.add(
        "hidden"
    );


    productGrid.innerHTML =
        products
            .map(
                product =>
                    createProductCard(
                        product
                    )
            )
            .join("");


    /* CLICK */

    productGrid
        .querySelectorAll(".product-card")
        .forEach(card => {

            card.addEventListener(
                "click",
                () => {

                    const id =
                        card.dataset.id;


                    if(!id) return;


                    window.location.href =
                        `./product.html?id=${encodeURIComponent(id)}`;

                }
            );

        });

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function createProductCard(
    product
){

    const id =
        product.id;


    const title =
        product.title ||
        product.name ||
        product.product_name ||
        "Product";


    const image =
        product.image ||
        product.image_url ||
        product.thumbnail ||
        product.product_image ||
        "";


    const description =
        product.description ||
        product.details ||
        product.short_description ||
        "";


    const category =
        product.category ||
        product.category_name ||
        product.type ||
        "";


    const price =
        getPrice(product);


    const mrp =
        Number(
            product.mrp ||
            product.original_price ||
            product.compare_price ||
            price
        );


    let discount =
        "";


    if(
        mrp > price &&
        price > 0
    ){

        discount =
            Math.round(
                ((mrp - price) /
                mrp) * 100
            );

    }


    return `

        <article
            class="product-card"
            data-id="${escapeAttribute(id)}">


            <div class="product-image">

                ${
                    image
                    ?

                    `<img
                        src="${escapeAttribute(image)}"
                        alt="${escapeAttribute(title)}"
                        loading="lazy"
                        onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22500%22 height=%22500%22 viewBox=%220 0 500 500%22%3E%3Crect width=%22500%22 height=%22500%22 fill=%22%23f5f3ff%22/%3E%3Ctext x=%22250%22 y=%22260%22 text-anchor=%22middle%22 font-size=%2224%22 fill=%22%236d28d9%22%3ENo Image%3C/text%3E%3C/svg%3E';"
                    >`

                    :

                    `<div
                        style="
                            color:#6d28d9;
                            font-weight:800;
                            font-size:14px;
                        ">
                        No Image
                    </div>`
                }

            </div>


            <div class="product-info">


                ${
                    category
                    ?

                    `<div class="product-category">
                        ${escapeHTML(category)}
                    </div>`

                    :

                    ""
                }


                <div class="product-title">
                    ${escapeHTML(title)}
                </div>


                ${
                    description
                    ?

                    `<div class="product-description">
                        ${escapeHTML(description)}
                    </div>`

                    :

                    ""
                }


                <div class="price-row">

                    <span class="price">
                        ₹${formatPrice(price)}
                    </span>


                    ${
                        mrp > price
                        ?

                        `<span class="mrp">
                            ₹${formatPrice(mrp)}
                        </span>`

                        :

                        ""
                    }


                    ${
                        discount
                        ?

                        `<span class="discount">
                            ${discount}% OFF
                        </span>`

                        :

                        ""
                    }

                </div>


            </div>

        </article>

    `;

}


/* =========================================================
   PRICE
========================================================= */

function getPrice(product){

    return Number(
        product.price ??
        product.sale_price ??
        product.selling_price ??
        product.amount ??
        0
    ) || 0;

}


function formatPrice(
    number
){

    return Number(
        number || 0
    ).toLocaleString(
        "en-IN"
    );

}


/* =========================================================
   CART COUNT
========================================================= */

async function updateCartCount(){

    try{

        const {
            data: {
                user
            }
        } =
        await supabaseClient
            .auth
            .getUser();


        if(!user){

            cartCount.textContent =
                "0";

            return;

        }


        /*
          IMPORTANT:

          Ye cart_items me user_id aur
          quantity column use karta hai.
        */


        const {
            data,
            error
        } =
        await supabaseClient

            .from("cart_items")

            .select("quantity")

            .eq(
                "user_id",
                user.id
            );


        if(error){

            console.warn(
                "Cart count error:",
                error.message
            );

            cartCount.textContent =
                "0";

            return;

        }


        const total =
            (data || [])
                .reduce(
                    (
                        sum,
                        item
                    ) =>
                        sum +
                        Number(
                            item.quantity ||
                            0
                        ),
                    0
                );


        cartCount.textContent =
            total;


    }catch(error){

        console.warn(
            "Cart error:",
            error
        );

        cartCount.textContent =
            "0";

    }

}

/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}
