/* =========================================================
   MOBILE BOTTOM NAV — FIXED + INSTANT ACTIVE PAGE
   ========================================================= */
(function(){
  const nav = document.querySelector(".bottom-nav");
  if(!nav) return;

  const items = Array.from(nav.querySelectorAll(".bottom-item"));
  const keys = ["home","categories","account","orders","cart"];

  function pageKey(){
    let page = (window.location.pathname || "").toLowerCase().split("/").pop() || "index.html";
    if(page === "" || page === "index.html") return "home";
    if(page === "categories.html") return "categories";
    if(page === "account.html") return "account";
    if(page === "my-orders.html") return "orders";
    if(page === "cart.html") return "cart";
    return null;
  }

  function setActive(key){
    const index = keys.indexOf(key);
    if(index < 0) return;

    items.forEach(function(item,i){
      item.classList.toggle("active", i === index);
      if(i === index) item.setAttribute("aria-current","page");
      else item.removeAttribute("aria-current");
    });

    try{
      sessionStorage.setItem("mystore_active_bottom_nav", key);
    }catch(e){}
  }

  /* Page URL wins: index.html = Home active. */
  const current = pageKey();
  if(current){
    setActive(current);
  }else{
    try{
      const saved = sessionStorage.getItem("mystore_active_bottom_nav");
      if(saved) setActive(saved);
    }catch(e){}
  }

  /* Active state changes immediately on touch/click.
     Existing inline onclick functions remain untouched. */
  items.forEach(function(item,index){
    function activate(){
      setActive(keys[index]);
    }
    item.addEventListener("pointerdown",activate,{passive:true});
    item.addEventListener("click",activate,{passive:true});
  });
})();
