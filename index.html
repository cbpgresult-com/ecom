<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore - Online Shopping</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --violet:#6d28d9;
    --violet2:#8b5cf6;
    --light-violet:#f3e8ff;
    --green:#dcfce7;
    --green-dark:#15803d;
    --white:#ffffff;
    --text:#171717;
    --muted:#6b7280;
    --border:#e5e7eb;
    --bg:#f7f7fb;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* ================= HEADER ================= */

.header{
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1250px;
    margin:auto;
    min-height:72px;
    display:flex;
    align-items:center;
    gap:22px;
    padding:10px 18px;
}

.logo{
    font-size:29px;
    font-weight:900;
    color:var(--violet);
    white-space:nowrap;
}

.search-box{
    flex:1;
    position:relative;
}

.search-box input{
    width:100%;
    height:46px;
    border:2px solid #ddd6fe;
    background:#faf7ff;
    border-radius:13px;
    outline:none;
    padding:0 48px 0 18px;
    font-size:15px;
    transition:.2s;
}

.search-box input:focus{
    border-color:var(--violet);
    background:#fff;
}

.search-icon{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:21px;
    height:21px;
    color:#111;
}

.header-actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.login-btn,
.cart-btn{
    height:44px;
    border:0;
    border-radius:12px;
    padding:0 17px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
}

.login-btn{
    background:var(--light-violet);
    color:#4c1d95;
}

.cart-btn{
    background:var(--violet);
    color:#fff;
}

.cart-count{
    min-width:22px;
    height:22px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:white;
    color:var(--violet);
    border-radius:50%;
    font-size:12px;
}

/* ================= CATEGORY ================= */

.category-wrap{
    background:#fff;
    border-bottom:1px solid var(--border);
}

.categories{
    max-width:1250px;
    margin:auto;
    display:flex;
    gap:26px;
    padding:12px 18px;
    overflow-x:auto;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    min-width:70px;
    text-align:center;
    cursor:pointer;
    flex-shrink:0;
    color:#222;
    font-size:13px;
}

.category-icon{
    width:45px;
    height:45px;
    border-radius:50%;
    margin:0 auto 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--light-violet);
    color:var(--violet);
}

.category.active{
    color:var(--violet);
    font-weight:700;
}

.category.active .category-icon{
    background:var(--green);
    color:var(--green-dark);
}

/* ================= MAIN ================= */

main{
    max-width:1250px;
    margin:auto;
    padding:18px;
}

/* ================= HERO ================= */

.hero-area{
    display:grid;
    grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);
    gap:14px;
    margin-bottom:24px;
}

.slider{
    position:relative;
    overflow:hidden;
    border-radius:18px;
    min-height:265px;
    background:#ddd;
}

.slides{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .55s ease;
}

.slide{
    min-width:100%;
    position:relative;
    height:265px;
    overflow:hidden;
    background:#eee;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.slide-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.72),
        rgba(0,0,0,.25),
        transparent
    );
    display:flex;
    align-items:center;
    padding:30px;
}

.slide-content{
    color:#fff;
    max-width:420px;
}

.slide-content small{
    display:inline-block;
    padding:7px 12px;
    border-radius:30px;
    background:#fff;
    color:var(--violet);
    font-weight:800;
    margin-bottom:13px;
}

.slide-content h2{
    font-size:30px;
    line-height:1.08;
    margin-bottom:8px;
}

.slide-content p{
    font-size:15px;
    margin-bottom:17px;
}

.shop-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff;
    color:var(--violet);
    border:0;
    border-radius:9px;
    padding:10px 17px;
    font-weight:800;
    cursor:pointer;
}

.slider-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:3;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.prev{
    left:12px;
}

.next{
    right:12px;
}

.dots{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:4;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    opacity:.6;
    cursor:pointer;
}

.dot.active{
    width:23px;
    border-radius:10px;
    opacity:1;
}

/* ================= DEAL BOX ================= */

.deal-side{
    display:grid;
    gap:14px;
}

.deal-box{
    border-radius:17px;
    padding:24px;
    min-height:125px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.deal-box.green{
    background:var(--green);
}

.deal-box.violet{
    background:var(--light-violet);
}

.deal-text h3{
    font-size:20px;
    margin-bottom:7px;
}

.deal-text p{
    color:#6b7280;
    font-size:14px;
}

.deal-icon{
    width:52px;
    height:52px;
}

/* ================= SECTION TITLE ================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0 13px;
}

.section-title{
    font-size:24px;
    font-weight:800;
}

.section-subtitle{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

.sort-select{
    height:40px;
    padding:0 13px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:10px;
    outline:none;
}

/* ================= PRODUCT GRID ================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.product-card{
    background:#fff;
    border:1px solid #ececf2;
    border-radius:15px;
    overflow:hidden;
    transition:.2s;
    cursor:pointer;
    min-width:0;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(76,29,149,.10);
}

.product-image{
    height:220px;
    position:relative;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
}

.discount{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--green);
    color:var(--green-dark);
    padding:5px 8px;
    border-radius:6px;
    font-size:11px;
    font-weight:800;
    z-index:2;
}

.product-info{
    padding:12px;
}

.rating{
    display:inline-flex;
    align-items:center;
    gap:3px;
    background:var(--green);
    color:#166534;
    border-radius:5px;
    padding:4px 7px;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
}

.product-title{
    font-size:14px;
    line-height:1.35;
    font-weight:600;
    height:38px;
    overflow:hidden;
}

.price-row{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.price{
    font-size:18px;
    font-weight:800;
}

.mrp{
    font-size:12px;
    color:#9ca3af;
    text-decoration:line-through;
}

.off{
    font-size:11px;
    color:#15803d;
    font-weight:800;
}

.delivery{
    margin-top:8px;
    font-size:11px;
    color:#166534;
    font-weight:600;
}

/* ================= LOADING ================= */

.loading{
    padding:50px;
    text-align:center;
    color:#6b7280;
}

.skeleton-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.skeleton{
    height:300px;
    border-radius:15px;
    background:linear-gradient(
        90deg,
        #eee 25%,
        #f7f7f7 50%,
        #eee 75%
    );
    background-size:200% 100%;
    animation:loading 1.2s infinite;
}

@keyframes loading{
    to{
        background-position:-200% 0;
    }
}

.hidden{
    display:none!important;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .header-inner{
        flex-wrap:wrap;
        gap:9px;
        padding:10px 12px;
    }

    .logo{
        font-size:24px;
    }

    .search-box{
        order:3;
        flex-basis:100%;
    }

    .header-actions{
        margin-left:auto;
    }

    .login-btn{
        display:none;
    }

    .cart-btn{
        height:40px;
        padding:0 12px;
    }

    .categories{
        gap:20px;
        padding:10px 12px;
    }

    main{
        padding:12px;
    }

    .hero-area{
        grid-template-columns:1fr;
    }

    .deal-side{
        grid-template-columns:1fr 1fr;
    }

    .slider,
    .slide{
        height:210px;
    }

    .slide-content{
        padding:22px;
        max-width:270px;
    }

    .slide-content h2{
        font-size:22px;
    }

    .slide-content p{
        font-size:12px;
    }

    .deal-box{
        min-height:100px;
        padding:16px;
    }

    .deal-text h3{
        font-size:16px;
    }

    .deal-text p{
        font-size:11px;
    }

    .deal-icon{
        width:38px;
        height:38px;
    }

    .product-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .product-image{
        height:190px;
    }

    .section-title{
        font-size:20px;
    }

    .sort-select{
        height:36px;
        font-size:12px;
    }
}

@media(max-width:500px){

    .header-inner{
        min-height:auto;
    }

    .logo{
        font-size:23px;
    }

    .search-box input{
        height:42px;
    }

    .category{
        min-width:62px;
        font-size:11px;
    }

    .category-icon{
        width:40px;
        height:40px;
    }

    .hero-area{
        gap:10px;
    }

    .slider,
    .slide{
        height:185px;
        border-radius:14px;
    }

    .slide-overlay{
        padding:16px;
    }

    .slide-content h2{
        font-size:18px;
    }

    .slide-content p{
        font-size:11px;
        margin-bottom:10px;
    }

    .slide-content small{
        padding:5px 8px;
        font-size:9px;
    }

    .shop-btn{
        padding:7px 11px;
        font-size:11px;
    }

    .slider-arrow{
        width:32px;
        height:32px;
    }

    .deal-side{
        gap:8px;
    }

    .deal-box{
        padding:12px;
        border-radius:13px;
    }

    .deal-text h3{
        font-size:14px;
    }

    .deal-text p{
        font-size:9px;
    }

    .deal-icon{
        width:30px;
        height:30px;
    }

    .product-image{
        height:170px;
        padding:8px;
    }

    .product-info{
        padding:9px;
    }

    .product-title{
        font-size:12px;
    }

    .price{
        font-size:16px;
    }

    .mrp{
        font-size:10px;
    }

    .off{
        font-size:9px;
    }

    .delivery{
        font-size:9px;
    }
}
</style>
</head>

<!-- ================= HERO ================= -->

        <div>
            <h2 class="section-title">Suggested For You</h2>

                Discover products you'll love.
            </p>
        </div>

        <select id="sortSelect" class="sort-select">

            <option value="popular">Popular</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="new">Newest</option>

        </select>

    </div>


    <div id="loading" class="loading">
        Loading products...
    </div>

    <div id="productGrid" class="product-grid"></div>

</section>

</main>


<script>

/* =========================================
   SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL =
  "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL
========================================================= */

let allProducts = [];
let filteredProducts = [];

let currentSlide = 0;
let slideTimer;


/* =========================================================
   IMAGE HELPER
========================================================= */

function getMainImage(product){

    /*
      IMPORTANT:
      First/main image hi use hogi.
      Agar images JSON array hai to [0].
    */

    let image =
        product.image ||
        product.image_url ||
        product.main_image ||
        product.thumbnail ||
        "";

    if(Array.isArray(product.images)){
        image = product.images[0] || image;
    }

    if(typeof product.images === "string"){

        try{

            const parsed =
                JSON.parse(product.images);

            if(Array.isArray(parsed)){
                image =
                    parsed[0] || image;
            }

        }catch(e){

            if(product.images.trim()){
                image = product.images;
            }

        }

    }

    return image || "https://via.placeholder.com/600x600?text=Product";
}


/* =========================================================
   PRICE
========================================================= */

function getPrice(p){

    return Number(
        p.price ||
        p.selling_price ||
        p.sale_price ||
        0
    );

}

function getMrp(p){

    return Number(
        p.mrp ||
        p.original_price ||
        p.price ||
        0
    );

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    const loading =
        document.getElementById("loading");

    try{

        const { data, error } =
            await supabaseClient
            .from("products")
            .select("*");

        if(error){
            console.error(error);
            loading.innerHTML =
                "Products load nahi ho paaye.";
            return;
        }

        allProducts = data || [];

        filteredProducts =
            [...allProducts];

        loading.classList.add("hidden");

        renderProducts();

        createSlides();

        updateCartCount();

    }catch(error){

        console.error(error);

        loading.innerHTML =
            "Something went wrong.";

    }

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function renderProducts(){

    const grid =
        document.getElementById("productGrid");

    grid.innerHTML = "";

    if(!filteredProducts.length){

        grid.innerHTML = `
            <div style="
                grid-column:1/-1;
                padding:50px;
                text-align:center;
                color:#777;
            ">
                No products found
            </div>
        `;

        return;
    }


    filteredProducts.forEach(product => {

        const image =
            getMainImage(product);

        const price =
            getPrice(product);

        const mrp =
            getMrp(product);

        let discount = 0;

        if(mrp > price && price > 0){

            discount =
                Math.round(
                    ((mrp-price)/mrp)*100
                );

        }


        const card =
            document.createElement("div");

        card.className =
            "product-card";


        card.onclick = () => {

            if(product.id){

                window.location.href =
                    `product.html?id=${product.id}`;

            }

        };


        card.innerHTML = `

            <div class="product-image">

                ${
                    discount > 0
                    ?
                    `<span class="discount">
                        ${discount}% OFF
                    </span>`
                    :
                    ""
                }

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.title || product.name || "Product")}"
                    loading="lazy"
                    onerror="
                        this.src='https://via.placeholder.com/600x600?text=Product'
                    "
                >

            </div>


            <div class="product-info">

                <div class="rating">

                    <svg width="12" height="12"
                         viewBox="0 0 24 24"
                         fill="currentColor">
                        <path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2-6.2 3.2L7 14.2 2 9.3l6.9-1L12 2z"/>
                    </svg>

                    ${product.rating || 4.6}

                </div>


                <div class="product-title">

                    ${escapeHtml(
                        product.title ||
                        product.name ||
                        "Product"
                    )}

                </div>


                <div class="price-row">

                    <span class="price">
                        ₹${price.toLocaleString("en-IN")}
                    </span>

                    ${
                        mrp > price
                        ?
                        `<span class="mrp">
                            ₹${mrp.toLocaleString("en-IN")}
                        </span>`
                        :
                        ""
                    }

                    ${
                        discount > 0
                        ?
                        `<span class="off">
                            ${discount}% OFF
                        </span>`
                        :
                        ""
                    }

                </div>


                <div class="delivery">

                    ✓ Delivery available

                </div>

            </div>
        `;


        grid.appendChild(card);

    });

}


/* =========================================================
   SLIDER
========================================================= */

function createSlides(){

    const container =
        document.getElementById("slides");

    const dots =
        document.getElementById("dots");

    container.innerHTML = "";
    dots.innerHTML = "";

    const products =
        allProducts.slice(0,6);


    if(!products.length){
        return;
    }


    products.forEach((product,index) => {

        const image =
            getMainImage(product);

        const price =
            getPrice(product);

        const slide =
            document.createElement("div");

        slide.className = "slide";

        slide.innerHTML = `

            <img
                src="${escapeHtml(image)}"
                alt=""
                onerror="
                    this.src='https://via.placeholder.com/1200x500?text=MyStore'
                "
            >

            <div class="slide-overlay">

                <div class="slide-content">

                    <small>BIG SAVINGS</small>

                    <h2>
                        ${escapeHtml(
                            product.title ||
                            product.name ||
                            "Amazing Product"
                        )}
                    </h2>

                    <p>
                        Starting from
                        ₹${price.toLocaleString("en-IN")}
                    </p>

                    <button
                        class="shop-btn"
                        onclick="event.stopPropagation(); openProduct('${product.id}')"
                    >
                        Shop Now

                        <svg width="16"
                             height="16"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                        </svg>

                    </button>

                </div>

            </div>
        `;

        slide.onclick = () => {
            openProduct(product.id);
        };

        container.appendChild(slide);


        const dot =
            document.createElement("span");

        dot.className =
            "dot" +
            (index === 0 ? " active" : "");

        dot.onclick = () => {
            currentSlide = index;
            updateSlider();
            restartSlider();
        };

        dots.appendChild(dot);

    });


    currentSlide = 0;

    updateSlider();

    restartSlider();

}


/* =========================================================
   SLIDER CONTROLS
========================================================= */

function updateSlider(){

    const slides =
        document.getElementById("slides");

    slides.style.transform =
        `translateX(-${currentSlide * 100}%)`;


    document
        .querySelectorAll(".dot")
        .forEach((dot,index) => {

            dot.classList.toggle(
                "active",
                index === currentSlide
            );

        });

}


function nextSlide(){

    const total =
        document.querySelectorAll(".slide").length;

    if(!total) return;

    currentSlide =
        (currentSlide + 1) % total;

    updateSlider();

}


function previousSlide(){

    const total =
        document.querySelectorAll(".slide").length;

    if(!total) return;

    currentSlide =
        (currentSlide - 1 + total) % total;

    updateSlider();

}


function restartSlider(){

    clearInterval(slideTimer);

    slideTimer =
        setInterval(
            nextSlide,
            3500
        );

}


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById("searchInput")
.addEventListener("input", function(){

    const query =
        this.value
        .trim()
        .toLowerCase();


    filteredProducts =
        allProducts.filter(product => {

            const title =
                String(
                    product.title ||
                    product.name ||
                    ""
                ).toLowerCase();


            const category =
                String(
                    product.category ||
                    ""
                ).toLowerCase();


            return (
                title.includes(query) ||
                category.includes(query)
            );

        });


    renderProducts();

});


/* =========================================================
   SORT
========================================================= */

document
.getElementById("sortSelect")
.addEventListener("change", function(){

    const value = this.value;


    if(value === "low"){

        filteredProducts.sort(
            (a,b) =>
            getPrice(a)-getPrice(b)
        );

    }


    if(value === "high"){

        filteredProducts.sort(
            (a,b) =>
            getPrice(b)-getPrice(a)
        );

    }


    if(value === "new"){

        filteredProducts.sort(
            (a,b) =>
            new Date(b.created_at || 0)
            -
            new Date(a.created_at || 0)
        );

    }


    if(value === "popular"){

        filteredProducts =
            [...allProducts];

    }


    renderProducts();

});


/* =========================================================
   CATEGORY
========================================================= */

document
.querySelectorAll(".category")
.forEach(category => {

    category.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".category")
            .forEach(c =>
                c.classList.remove("active")
            );

            category.classList.add("active");


            const selected =
                category.dataset.category;


            if(selected === "all"){

                filteredProducts =
                    [...allProducts];

            }else{

                filteredProducts =
                    allProducts.filter(p => {

                        const cat =
                            String(
                                p.category || ""
                            ).toLowerCase();

                        return cat ===
                            selected.toLowerCase();

                    });

            }


            renderProducts();

        }
    );

});


/* =========================================================
   CART COUNT
========================================================= */

async function updateCartCount(){

    try{

        const {
            data: {
                user
            }
        } =
        await supabaseClient.auth.getUser();


        if(!user){

            document
            .getElementById("cartCount")
            .textContent = "0";

            return;

        }


        const { count, error } =
            await supabaseClient
            .from("cart_items")
            .select("*", {
                count:"exact",
                head:true
            })
            .eq("user_id", user.id);


        if(error){

            console.error(error);

            return;

        }


        document
        .getElementById("cartCount")
        .textContent =
            count || 0;


    }catch(e){

        console.error(e);

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

function goCart(){

    window.location.href =
        "cart.html";

}


function goLogin(){

    window.location.href =
        "login.html";

}


function openProduct(id){

    if(!id) return;

    window.location.href =
        `product.html?id=${id}`;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   AUTH CHANGE
========================================================= */

supabaseClient.auth.onAuthStateChange(
    () => {
        updateCartCount();
    }
);


/* =========================================================
   START
========================================================= */

loadProducts();

</script>

</body>
</html>
