<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore - Online Shopping</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --violet:#6d28d9;
  --violet2:#7c3aed;
  --light-violet:#f3e8ff;
  --green:#dcfce7;
  --green-dark:#15803d;
  --white:#fff;
  --text:#171717;
  --muted:#737373;
  --border:#e5e7eb;
  --bg:#f7f7fb;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:0;
}

/* ================= HEADER ================= */

.header{
  height:72px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:22px;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:var(--violet);
  white-space:nowrap;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:46px;
  border:2px solid #dfcaff;
  border-radius:13px;
  padding:0 48px 0 18px;
  outline:none;
  font-size:15px;
  background:#fff;
}

.search input:focus{
  border-color:var(--violet);
}

.search-icon{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
}

/* desktop account */

.header-account{
  position:relative;
}

.account-btn{
  border:0;
  background:#fff;
  height:44px;
  padding:0 8px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:15px;
  cursor:pointer;
  white-space:nowrap;
}

.account-btn:hover{
  color:var(--violet);
}

.account-icon{
  width:21px;
  height:21px;
}

.arrow{
  width:14px;
  height:14px;
  transition:.2s;
}

.account-btn.open .arrow{
  transform:rotate(180deg);
}

.cart-btn{
  height:44px;
  border:0;
  background:var(--violet);
  color:white;
  padding:0 17px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  position:relative;
}

.cart-icon{
  width:20px;
  height:20px;
}

.cart-number{
  position:absolute;
  top:-7px;
  right:-7px;
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:999px;
  display:none;
  justify-content:center;
  align-items:center;
  background:#ef4444;
  color:#fff;
  border:2px solid #fff;
  font-size:11px;
  font-weight:800;
  line-height:1;
  box-shadow:0 2px 7px rgba(0,0,0,.2);
  z-index:3;
}

.cart-number.show{
  display:inline-flex;
}

/* ================= ACCOUNT DROPDOWN ================= */

.account-menu{
  position:absolute;
  right:0;
  top:53px;
  width:310px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 12px 35px rgba(0,0,0,.20);
  border:1px solid #ddd;
  overflow:hidden;
  display:none;
  z-index:2000;
}

.account-menu.show{
  display:block;
  animation:menuIn .16s ease;
}

@keyframes menuIn{
  from{
    opacity:0;
    transform:translateY(-5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.account-top{
  padding:18px 20px 10px;
}

.new-customer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:15px;
}

.signup{
  color:#2563eb;
  font-weight:700;
  cursor:pointer;
}

.account-divider{
  height:1px;
  background:#eee;
  margin:8px 0;
}

.menu-item{
  height:47px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 20px;
  cursor:pointer;
  font-size:15px;
}

.menu-item:hover{
  background:#f7f7f7;
  color:var(--violet);
}

.menu-svg{
  width:20px;
  height:20px;
  flex:none;
}

.logout{
  color:#dc2626;
}

/* ================= CATEGORY ================= */

.categories{
  height:82px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:30px;
  padding:0 5%;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  min-width:64px;
  border:0;
  background:transparent;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  font-size:13px;
  white-space:nowrap;
}

.category-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--light-violet);
  display:flex;
  align-items:center;
  justify-content:center;
}

.category-icon svg{
  width:23px;
  height:23px;
}

.category.active{
  color:var(--violet);
  font-weight:700;
}

.category.active .category-icon{
  background:var(--green);
}

/* ================= MAIN ================= */

main{
  width:90%;
  max-width:1250px;
  margin:auto;
}

.top-space{
  height:20px;
}

/* ================= PRODUCT HEADER ================= */

.product-heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:28px 0 18px;
}

.product-heading h1{
  font-size:25px;
}

.product-heading p{
  color:var(--muted);
  margin-top:5px;
  font-size:14px;
}

#sortSelect{
  padding:10px 30px 10px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}


/* =========================================================
   PRODUCT CARD ONLY — REAL NAVIGATION LOADER
========================================================= */
let productNavigationStarted = false;

document.addEventListener("click", function(event){

  const card = event.target.closest(".product-card");
  if(!card) return;
  if(event.defaultPrevented) return;

  const loader =
    document.getElementById("indexProductLoading");

  if(!loader) return;

  productNavigationStarted = true;
  loader.classList.add("show");
  loader.setAttribute("aria-hidden","false");

}, true);


/* =========================================================
   PRODUCT CARD
========================================================= */

function createProductCard(product){

  const card =
    document.createElement("article");

  card.className =
    "product-card";


  const image =
    getMainImage(product);


  const title =
    product.title ||
    product.name ||
    "Product";


  const price =
    Number(
      product.price ||
      product.selling_price ||
      0
    );


  const mrp =
    Number(
      product.mrp ||
      product.original_price ||
      0
    );


  let discount = "";

  if(mrp > price && price > 0){

    discount =
      Math.round(
        ((mrp-price)/mrp)*100
      );

  }


  card.innerHTML = `

    <div class="product-image-box">

      ${
        discount
        ?
        `<div class="discount">
          ${discount}% OFF
        </div>`
        :
        ""
      }

      <img
        class="product-image"
        src="${escapeHtml(image)}"
        alt="${escapeHtml(title)}"
        loading="lazy"
        onerror="this.style.display='none';"
      >

    </div>


    <div class="product-info">

      <div class="rating">
        ★ ${product.rating || "4.6"}
      </div>


      <div class="product-name">
        ${escapeHtml(title)}
      </div>


      <div class="price-row">

        <span class="price">
          ₹${price.toLocaleString("en-IN")}
        </span>

        ${
          mrp > price
          ?
          `<span class="mrp">
            ₹${mrp.toLocaleString("en-IN")}
          </span>`
          :
          ""
        }

      </div>


      ${
        discount
        ?
        `<div class="off">
          ${discount}% OFF
        </div>`
        :
        ""
      }


      <div class="delivery">
        ✓ Delivery available
      </div>

    </div>

  `;


  card.addEventListener(
    "click",
    function(){

      if(!product.id) return;

      /*
        Do NOT put a blocking overlay on index.html.
        The product page owns the real loader. This guarantees
        desktop and mobile navigation both happen immediately.
      */
window.location.href =
        "product.html?id=" +
        encodeURIComponent(product.id) +
        (productNavigationStarted ? "&navt=1" : "");

    }
  );


  return card;

}


/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    function(){

      const value =
        this.value
          .toLowerCase()
          .trim();


      document
        .querySelectorAll(".product-card")
        .forEach(card => {

          const title =
            card
              .querySelector(".product-name")
              ?.textContent
              .toLowerCase() || "";


          card.style.display =
            !value ||
            title.includes(value)
            ?
            ""
            :
            "none";

        });

    }
  );


/* =========================================================
   CART COUNT
========================================================= */

async function loadCartCount(){

  const badge =
    document.getElementById("cartCount");

  if(!badge) return;

  try{

    const {
      data:{
        user
      }
    } =
    await supabaseClient.auth.getUser();

    if(!user){
      badge.textContent = "";
      badge.classList.remove("show");
      return;
    }

    const {
      data,
      error
    } =
    await supabaseClient
      .from("cart_items")
      .select("id, quantity")
      .eq("user_id",user.id);

    if(error){
      console.error("Cart count:",error);
      badge.textContent = "";
      badge.classList.remove("show");
      return;
    }

    let total = 0;

    (data || []).forEach(item => {
      total += Number(item.quantity || 0);
    });

    if(total > 0){
      badge.textContent = total > 99 ? "99+" : String(total);
      badge.classList.add("show");
    }else{
      badge.textContent = "";
      badge.classList.remove("show");
    }

  }catch(error){
    console.error(error);
    badge.textContent = "";
    badge.classList.remove("show");
  }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   NAVIGATION
========================================================= */

function goLogin(){

  window.location.href =
    "login.html";

}

function goSignup(){

  window.location.href =
    "signup.html";

}

function goProfile(){

  window.location.href =
    "profile.html";

}

function goAddresses(){

  window.location.href =
    "saved-addresses.html";

}

function goOrders(){

  window.location.href =
    "orders.html";

}

function goCart(){

  window.location.href =
    "cart.html";

}

function goHome(){

  window.location.href =
    "index.html";

}

function goCategories(){

  window.location.href =
    "categories.html";

}

function goAccount(){

  if(window.innerWidth <= 700){
    goProfile();
    return;
  }

  const menu =
    document.getElementById(
      "accountMenu"
    );

  menu.classList.toggle(
    "show"
  );

}


/* =========================================================
   LOGOUT
========================================================= */

async function logoutUser(){

  await supabaseClient.auth.signOut();

  window.location.reload();

}


/* =========================================================
   START
========================================================= */

loadAccount();

loadCartCount();

loadProducts();


</script>

</body>
</html>
