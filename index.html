<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore - Online Shopping</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --violet:#6d28d9;
  --violet2:#7c3aed;
  --violet-light:#f3e8ff;
  --green:#dcfce7;
  --green-dark:#15803d;
  --white:#fff;
  --bg:#f7f7fb;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:0;
}

/* ================= HEADER ================= */

.header{
  width:100%;
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1240px;
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:24px;
  padding:12px 18px;
}

.logo{
  font-size:29px;
  font-weight:900;
  color:var(--violet);
  white-space:nowrap;
  letter-spacing:-1px;
}

/* SEARCH */

.search-box{
  flex:1;
  position:relative;
}

.search-box input{
  width:100%;
  height:46px;
  border:2px solid #dfccff;
  background:#fcfaff;
  border-radius:13px;
  padding:0 48px 0 18px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

.search-box input:focus{
  border-color:var(--violet2);
  background:#fff;
}

.search-icon{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
  color:#111;
}

/* DESKTOP ACTIONS */

.header-actions{
  display:flex;
  align-items:center;
  gap:22px;
  white-space:nowrap;
}

.account-btn,
.cart-btn{
  border:0;
  background:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  color:#111;
  font-size:15px;
  font-weight:500;
}

.account-btn:hover,
.cart-btn:hover{
  color:var(--violet);
}

.svg-icon{
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.down-arrow{
  width:14px;
  height:14px;
  stroke-width:2;
}

.cart-wrap{
  position:relative;
  display:flex;
  align-items:center;
}

.cart-badge{
  position:absolute;
  top:-10px;
  right:-10px;
  min-width:18px;
  height:18px;
  padding:0 4px;
  background:#ef233c;
  color:#fff;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
}

/* ACCOUNT MENU */

.account-area{
  position:relative;
}

.account-menu{
  position:absolute;
  right:0;
  top:45px;
  width:190px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
  padding:8px;
  display:none;
}

.account-menu.show{
  display:block;
}

.account-menu button{
  width:100%;
  border:0;
  background:none;
  padding:11px 12px;
  text-align:left;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.account-menu button:hover{
  background:var(--violet-light);
}

/* ================= CATEGORY BAR ================= */

.categories{
  max-width:1240px;
  margin:auto;
  padding:10px 18px 12px;
  background:#fff;
  display:flex;
  gap:28px;
  overflow-x:auto;
  scrollbar-width:none;
  border-bottom:1px solid #eee;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  min-width:60px;
  border:0;
  background:none;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:#222;
  white-space:nowrap;
}

.category-icon{
  width:45px;
  height:45px;
  border-radius:50%;
  background:var(--violet-light);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--violet);
}

.category-icon svg{
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.category.active{
  color:var(--violet);
  font-weight:800;
}

.category.active .category-icon{
  background:#dcfce7;
  color:var(--green-dark);
}

/* ================= MAIN ================= */

main{
  max-width:1240px;
  margin:auto;
  padding:22px 18px 100px;
}

/* ================= SUGGESTED ================= */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:8px 0 15px;
}

.section-title h1{
  font-size:24px;
  font-weight:800;
}

.section-title p{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;
}

.sort-select{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:10px 35px 10px 12px;
  font-size:13px;
  outline:none;
}

/* ================= PRODUCT GRID ================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.product-card{
  background:#fff;
  border:1px solid #e7e7e7;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  min-width:0;
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(109,40,217,.10);
}

.product-image-box{
  height:245px;
  background:#f8f8f8;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#fff;
}

.discount{
  position:absolute;
  left:10px;
  top:10px;
  z-index:3;
  background:var(--green);
  color:var(--green-dark);
  font-size:11px;
  font-weight:800;
  padding:6px 8px;
  border-radius:6px;
}

.rating{
  position:absolute;
  left:10px;
  bottom:10px;
  z-index:3;
  background:var(--green);
  color:var(--green-dark);
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}

.product-info{
  padding:12px;
}

.product-title{
  font-size:15px;
  font-weight:700;
  line-height:1.35;
  margin-bottom:10px;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  min-height:40px;
}

.price-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.price{
  font-size:19px;
  font-weight:900;
}

.mrp{
  font-size:11px;
  color:#999;
  text-decoration:line-through;
}

.offer{
  font-size:11px;
  font-weight:800;
  color:var(--green-dark);
}

.delivery{
  margin-top:9px;
  color:var(--green-dark);
  font-size:11px;
  font-weight:700;
}

/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.hidden{
  display:none!important;
}

.no-products{
  text-align:center;
  padding:60px;
}

/* ================= MOBILE BOTTOM NAV ================= */

.mobile-bottom-nav{
  display:none;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  body{
    padding-bottom:72px;
  }

  .header{
    position:sticky;
    top:0;
  }

  .header-inner{
    min-height:auto;
    padding:10px 12px;
    gap:10px;
    flex-wrap:wrap;
  }

  .logo{
    font-size:23px;
    order:1;
  }

  .header-actions{
    order:2;
    margin-left:auto;
  }

  /* MOBILE ME CART HEADER HIDE */
  .header-actions .cart-btn{
    display:none;
  }

  /* MOBILE ME LOGIN ICON ONLY */
  .account-btn span.account-name{
    display:none;
  }

  .account-btn{
    padding:5px;
  }

  .account-btn .down-arrow{
    display:none;
  }

  .search-box{
    order:3;
    flex-basis:100%;
  }

  .search-box input{
    height:42px;
    font-size:14px;
  }

  .categories{
    padding:9px 12px;
    gap:18px;
  }

  .category{
    min-width:58px;
    font-size:11px;
  }

  .category-icon{
    width:40px;
    height:40px;
  }

  main{
    padding:17px 12px 90px;
  }

  .section-head{
    align-items:flex-start;
    gap:10px;
  }

  .section-title h1{
    font-size:21px;
  }

  .section-title p{
    font-size:12px;
  }

  .sort-select{
    padding:8px 25px 8px 8px;
    font-size:11px;
  }

  .product-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-image-box{
    height:190px;
  }

  .product-info{
    padding:9px;
  }

  .product-title{
    font-size:13px;
    line-height:1.3;

    /* 2 LINE KE BAAD ... */
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;

    min-height:34px;
  }

  .price{
    font-size:17px;
  }

  .mrp{
    font-size:9px;
  }

  .offer{
    font-size:9px;
  }

  .delivery{
    font-size:9px;
  }

  .discount{
    font-size:9px;
    padding:5px 6px;
    left:7px;
    top:7px;
  }

  .rating{
    font-size:9px;
    padding:4px 6px;
    left:7px;
    bottom:7px;
  }

  /* FIXED BOTTOM NAV */
  .mobile-bottom-nav{
    position:fixed;
    display:flex;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:68px;
    background:#fff;
    border-top:1px solid #e5e7eb;
    box-shadow:0 -5px 20px rgba(0,0,0,.08);
    z-index:99999;

    /* IMPORTANT */
    transform:none!important;
    visibility:visible!important;
    opacity:1!important;
  }

  .bottom-item{
    flex:1;
    border:0;
    background:#fff;
    color:#777;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
    cursor:pointer;
    position:relative;
  }

  .bottom-item.active{
    color:var(--violet);
    font-weight:800;
  }

  .bottom-item svg{
    width:22px;
    height:22px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .bottom-cart-badge{
    position:absolute;
    top:7px;
    margin-left:23px;
    background:#ef233c;
    color:#fff;
    font-size:9px;
    min-width:16px;
    height:16px;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:800;
  }
}

/* ================= SMALL PHONE ================= */

@media(max-width:390px){

  .logo{
    font-size:21px;
  }

  .product-grid{
    gap:8px;
  }

  .product-image-box{
    height:175px;
  }

  .product-title{
    font-size:12px;
  }

  .price{
    font-size:16px;
  }
}

/* ================= DESKTOP ONLY ================= */

@media(min-width:769px){

  .mobile-bottom-nav{
    display:none!important;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-inner">

    <div class="logo">
      MyStore
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Search for Products, Brands and More"
        autocomplete="off"
      >

      <svg class="search-icon"
           viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
    </div>

    <!-- DESKTOP ACTIONS -->

    <div class="header-actions">

      <div class="account-area">

        <button
          class="account-btn"
          id="accountBtn"
          type="button"
        >

          <!-- REAL USER SVG -->

          <svg class="svg-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20c.7-3.2 3.1-5 7-5s6.3 1.8 7 5"></path>
            <circle cx="12" cy="12" r="10"></circle>
          </svg>

          <span class="account-name" id="accountName">
            Login
          </span>

          <svg class="svg-icon down-arrow"
               viewBox="0 0 24 24">
            <path d="m6 9 6 6 6-6"></path>
          </svg>

        </button>

        <div
          class="account-menu"
          id="accountMenu"
        >

          <button
            id="profileMenuBtn"
            type="button"
          >
            My Account
          </button>

          <button
            id="ordersMenuBtn"
            type="button"
          >
            My Orders
          </button>

          <button
            id="logoutBtn"
            type="button"
          >
            Logout
          </button>

        </div>

      </div>


      <!-- CART -->

      <button
        class="cart-btn"
        id="desktopCartBtn"
        type="button"
      >

        <span class="cart-wrap">

          <!-- REAL CART SVG -->

          <svg
            class="svg-icon"
            viewBox="0 0 24 24"
          >
            <circle cx="9" cy="20" r="1.5"></circle>
            <circle cx="18" cy="20" r="1.5"></circle>
            <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"></path>
          </svg>

          <span
            class="cart-badge"
            id="cartCount"
          >
            0
          </span>

        </span>

        <span>Cart</span>

      </button>

    </div>

  </div>

</header>


<!-- ================= CATEGORY ================= -->

<div class="categories" id="categoryBar">

  <button class="category active" data-category="all">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 11.5 12 4l9 7.5"></path>
        <path d="M5 10v9h14v-9"></path>
        <path d="M9 19v-5h6v5"></path>
      </svg>
    </span>

    <span>For You</span>

  </button>


  <button class="category" data-category="Fashion">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M8 5 5 7l-3 3 3 3 2-2v9h10v-9l2 2 3-3-3-3-3-2"></path>
        <path d="M9 4c0 2 6 2 6 0"></path>
      </svg>
    </span>

    <span>Fashion</span>

  </button>


  <button class="category" data-category="Mobiles">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">

        <path d="M10 5h4"></path>
        <circle cx="12" cy="18.5" r=".7"></circle>
      </svg>
    </span>

    <span>Mobiles</span>

  </button>


  <button class="category" data-category="Electronics">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="13" rx="1"></rect>
        <path d="M8 21h8"></path>
        <path d="M12 17v4"></path>
      </svg>
    </span>

    <span>Electronics</span>

  </button>


  <button class="category" data-category="Beauty">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M9 3h6"></path>
        <path d="M10 3v5l-3 4v8h10v-8l-3-4V3"></path>
      </svg>
    </span>

    <span>Beauty</span>

  </button>


  <button class="category" data-category="Home">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 11 12 4l9 7"></path>
        <path d="M5 10v10h14V10"></path>
        <path d="M9 20v-6h6v6"></path>
      </svg>
    </span>

    <span>Home</span>

  </button>


  <button class="category" data-category="Appliances">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <path d="M7 8h10"></path>
        <path d="M7 12h10"></path>
      </svg>
    </span>

    <span>Appliances</span>

  </button>


  <button class="category" data-category="Toys">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="8" cy="8" r="3"></circle>
        <circle cx="16" cy="8" r="3"></circle>
        <path d="M4 19c0-4 2-6 4-6s4 2 4 6"></path>
        <path d="M12 19c0-4 2-6 4-6s4 2 4 6"></path>
      </svg>
    </span>

    <span>Toys</span>

  </button>


  <button class="category" data-category="Food">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 10h16"></path>
        <path d="M5 10c0 5 2 8 7 8s7-3 7-8"></path>
        <path d="M7 6c0-2 2-2 2 0"></path>

      </svg>
    </span>

    <span>Food</span>

  </button>


  <button class="category" data-category="Sports">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3v5l4 3-2 4h-4l-2-4 4-3"></path>
      </svg>
    </span>

    <span>Sports</span>

  </button>


  <button class="category" data-category="Furniture">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 12v7"></path>
        <path d="M20 12v7"></path>
        <path d="M4 14h16"></path>
        <path d="M6 14V9a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v5"></path>
      </svg>
    </span>

    <span>Furniture</span>

  </button>


  <button class="category" data-category="Books">

    <span class="category-icon">
      <svg viewBox="0 0 24 24">
        <path d="M5 4h13v16H5z"></path>
        <path d="M8 4v16"></path>
        <path d="M8 8h7"></path>
      </svg>
    </span>

    <span>Books</span>

  </button>

</div>


<!-- ================= MAIN ================= -->

<main>

  <div class="section-head">

    <div class="section-title">

      <h1>Suggested For You</h1>

      <p>Discover products you'll love.</p>

    </div>

    <select
      class="sort-select"
      id="sortSelect"
    >

      <option value="popular">
        Popular
      </option>

      <option value="low">
        Price: Low to High
      </option>

      <option value="high">
        Price: High to Low
      </option>

      <option value="new">
        Newest
      </option>

    </select>

  </div>


  <div
    id="loading"
    class="loading"
  >
    Loading products...
  </div>


  <section
    id="productGrid"
    class="product-grid"
  ></section>


  <div
    id="noProducts"
    class="no-products hidden"
  >

    <div style="font-size:40px;">⌕</div>

    <h2>No products found</h2>

    <p>Try another search or category.</p>

  </div>

</main>


<!-- ================= MOBILE BOTTOM NAV ================= -->

<nav class="mobile-bottom-nav">

  <!-- HOME -->

  <button
    class="bottom-item active"
    data-bottom="home"
    id="bottomHome"
  >

    <svg viewBox="0 0 24 24">
      <path d="M3 11 12 4l9 7"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>

    <span>Home</span>

  </button>


  <!-- CATEGORIES -->

  <button
    class="bottom-item"
    data-bottom="categories"
    id="bottomCategories"
  >

    <svg viewBox="0 0 24 24">
      <rect x="4" y="4" width="6" height="6" rx="1"></rect>
      <rect x="14" y="4" width="6" height="6" rx="1"></rect>
      <rect x="4" y="14" width="6" height="6" rx="1"></rect>
      <rect x="14" y="14" width="6" height="6" rx="1"></rect>
    </svg>

    <span>Categories</span>

  </button>


  <!-- ACCOUNT -->

  <button
    class="bottom-item"
    data-bottom="account"
    id="bottomAccount"
  >

    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.5"></circle>
      <path d="M5 20c.7-3.2 3.1-5 7-5s6.3 1.8 7 5"></path>
      <circle cx="12" cy="12" r="10"></circle>
    </svg>

    <span>Account</span>

  </button>


  <!-- ORDERS -->

  <button
    class="bottom-item"
    data-bottom="orders"
    id="bottomOrders"
  >

    <svg viewBox="0 0 24 24">
      <path d="M6 3h12v18H6z"></path>
      <path d="M9 7h6"></path>
      <path d="M9 11h6"></path>
      <path d="M9 15h4"></path>
    </svg>

    <span>Orders</span>

  </button>


  <!-- CART -->

  <button
    class="bottom-item"
    data-bottom="cart"
    id="bottomCart"
  >

    <span style="position:relative;display:flex;">

      <svg viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1.5"></circle>
        <circle cx="18" cy="20" r="1.5"></circle>
        <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"></path>
      </svg>

      <span
        class="bottom-cart-badge"
        id="bottomCartCount"
      >
        0
      </span>

    </span>

    <span>Cart</span>

  </button>

</nav>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   GLOBAL
   ========================================================= */

let allProducts = [];
let selectedCategory = "all";


/* =========================================================
   DOM
   ========================================================= */

const productGrid =
  document.getElementById("productGrid");

const loading =
  document.getElementById("loading");

const noProducts =
  document.getElementById("noProducts");

const searchInput =
  document.getElementById("searchInput");

const sortSelect =
  document.getElementById("sortSelect");

const cartCount =
  document.getElementById("cartCount");

const bottomCartCount =
  document.getElementById("bottomCartCount");

const accountName =
  document.getElementById("accountName");

const accountBtn =
  document.getElementById("accountBtn");

const accountMenu =
  document.getElementById("accountMenu");


/* =========================================================
   GET IMAGE
   MAIN IMAGE FIRST
   ========================================================= */

function getMainImage(product){

  /*
    MAIN IMAGE KO SABSE PEHLE CHECK KIYA JAYEGA.

    Agar tumhare products table me:
    image
    image_url
    main_image
    thumbnail

    me se koi hai to wahi use hoga.

    Agar images array/json hai,
    uska FIRST image main image maana jayega.
  */

  const possibleMain = [
    product.image,
    product.image_url,
    product.main_image,
    product.thumbnail,
    product.primary_image
  ];

  for(const img of possibleMain){

    if(typeof img === "string" && img.trim()){
      return img.trim();
    }

  }


  /* images JSON/string */

  if(Array.isArray(product.images)){

    const first =
      product.images.find(
        x => typeof x === "string" && x.trim()
      );

    if(first){
      return first;
    }

  }


  if(typeof product.images === "string"){

    try{

      const parsed =
        JSON.parse(product.images);

      if(Array.isArray(parsed)){

        const first =
          parsed.find(
            x => typeof x === "string" && x.trim()
          );

        if(first){
          return first;
        }

      }

    }catch(e){

      /* comma separated images */

      const first =
        product.images
          .split(",")
          .map(x => x.trim())
          .find(Boolean);

      if(first){
        return first;
      }

    }

  }


  return "https://via.placeholder.com/600x600?text=Product";

}


/* =========================================================
   PRODUCT DATA
   ========================================================= */

async function loadProducts(){

  loading.classList.remove("hidden");
  noProducts.classList.add("hidden");

  const {
    data,
    error
  } = await supabaseClient
    .from("products")
    .select("*");

  if(error){

    console.error(error);

    loading.textContent =
      "Products load nahi ho paaye.";

    return;
  }

  allProducts = data || [];

  loading.classList.add("hidden");

  renderProducts();

}


/* =========================================================
   PRICE
   ========================================================= */

function getPrice(product){

  return Number(
    product.price ??
    product.sale_price ??
    product.selling_price ??
    0
  );

}


function getMrp(product){

  return Number(
    product.mrp ??
    product.original_price ??
    product.compare_price ??
    getPrice(product)
  );

}


function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}


/* =========================================================
   PRODUCT NAME
   ========================================================= */

function getProductName(product){

  return (
    product.title ??
    product.name ??
    product.product_name ??
    "Product"
  );

}


/* =========================================================
   CATEGORY
   ========================================================= */

function getProductCategory(product){

  return String(
    product.category ??
    product.category_name ??
    ""
  );

}


/* =========================================================
   RATING
   ========================================================= */

function getRating(product){

  return Number(
    product.rating ??
    product.average_rating ??
    4.6
  );

}


/* =========================================================
   RENDER PRODUCTS
   ========================================================= */

function renderProducts(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  let products =
    [...allProducts];


  /* CATEGORY */

  if(selectedCategory !== "all"){

    products =
      products.filter(product =>

        getProductCategory(product)
          .toLowerCase() ===
        selectedCategory.toLowerCase()

      );

  }


  /* SEARCH */

  if(search){

    products =
      products.filter(product => {

        const text =
          (
            getProductName(product) +
            " " +
            getProductCategory(product) +
            " " +
            (product.brand || "")
          )
          .toLowerCase();

        return text.includes(search);

      });

  }


  /* SORT */

  const sort =
    sortSelect.value;


  if(sort === "low"){

    products.sort(
      (a,b) =>
        getPrice(a) - getPrice(b)
    );

  }


  if(sort === "high"){

    products.sort(
      (a,b) =>
        getPrice(b) - getPrice(a)
    );

  }


  if(sort === "new"){

    products.sort(
      (a,b) =>
        new Date(b.created_at || 0) -
        new Date(a.created_at || 0)
    );

  }


  if(!products.length){

    productGrid.innerHTML = "";

    noProducts.classList.remove("hidden");

    return;

  }


  noProducts.classList.add("hidden");


  productGrid.innerHTML =
    products.map(product => {

      const price =
        getPrice(product);

      const mrp =
        getMrp(product);

      const discount =
        mrp > price
          ? Math.round(
              ((mrp-price)/mrp)*100
            )
          : 0;

      const image =
        getMainImage(product);

      const title =
        getProductName(product);

      const rating =
        getRating(product);


      return `

        <article
          class="product-card"
          data-id="${product.id}"
        >

          <div class="product-image-box">

            ${
              discount > 0
              ? `
                <div class="discount">
                  ${discount}% OFF
                </div>
              `
              : ""
            }

            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(title)}"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/600x600?text=Product'"
            >

            <div class="rating">
              ★ ${rating}
            </div>

          </div>


          <div class="product-info">

            <div class="product-title"
                 title="${escapeHtml(title)}">

              ${escapeHtml(title)}

            </div>


            <div class="price-row">

              <span class="price">
                ${money(price)}
              </span>

              ${
                mrp > price
                ? `
                  <span class="mrp">
                    ${money(mrp)}
                  </span>
                `
                : ""
              }

              ${
                discount > 0
                ? `
                  <span class="offer">
                    ${discount}% OFF
                  </span>
                `
                : ""
              }

            </div>


            <div class="delivery">
              ✓ Delivery available
            </div>

          </div>

        </article>

      `;

    }).join("");


  /* PRODUCT CLICK */

  document
    .querySelectorAll(".product-card")
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          const id =
            card.dataset.id;

          window.location.href =
            `product.html?id=${encodeURIComponent(id)}`;

        }
      );

    });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   AUTH
   ========================================================= */

async function loadUser(){

  const {
    data
  } =
    await supabaseClient.auth.getUser();

  const user =
    data?.user;


  if(user){

    /*
      Naam priority:
      user metadata name
      full_name
      name
      email ka first part
    */

    const name =
      user.user_metadata?.full_name ||
      user.user_metadata?.name ||
      user.user_metadata?.fullName ||
      user.email?.split("@")[0] ||
      "Account";


    accountName.textContent =
      name;

  }else{

    accountName.textContent =
      "Login";

  }

}


/* =========================================================
   AUTH CHANGE
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
  async () => {

    await loadUser();
    await loadCartCount();

  }
);


/* =========================================================
   ACCOUNT CLICK
   ========================================================= */

accountBtn.addEventListener(
  "click",
  async () => {

    const {
      data
    } =
      await supabaseClient.auth.getUser();

    if(!data?.user){

      window.location.href =
        "login.html";

      return;

    }

    accountMenu.classList.toggle(
      "show"
    );

  }
);


/* =========================================================
   OUTSIDE ACCOUNT MENU
   ========================================================= */

document.addEventListener(
  "click",
  event => {

    if(
      !event.target.closest(
        ".account-area"
      )
    ){

      accountMenu.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   LOGOUT
   ========================================================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      accountMenu.classList.remove(
        "show"
      );

      accountName.textContent =
        "Login";

      await loadCartCount();

    }
  );


/* =========================================================
   MY ORDERS
   ========================================================= */

document
  .getElementById("ordersMenuBtn")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "orders.html";

    }
  );


/* =========================================================
   MY ACCOUNT
   ========================================================= */

document
  .getElementById("profileMenuBtn")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "account.html";

    }
  );


/* =========================================================
   CART COUNT
   ========================================================= */

async function loadCartCount(){

  const {
    data
  } =
    await supabaseClient.auth.getUser();

  const user =
    data?.user;


  if(!user){

    updateCartCount(0);

    return;

  }


  /*
    IMPORTANT:
    select("*") use kiya gaya hai,
    isliye qty/title/image jaise
    fixed columns par dependency nahi hai.
  */

  const {
    data: cart,
    error
  } =
    await supabaseClient
      .from("cart_items")
      .select("*")
      .eq("user_id",user.id);


  if(error){

    console.error(
      "Cart count error:",
      error
    );

    updateCartCount(0);

    return;

  }


  /*
    Agar qty available hai
    to quantity sum hogi.
    Warna rows count.
  */

  let count = 0;


  (cart || []).forEach(item => {

    const qty =
      Number(
        item.qty ??
        item.quantity ??
        1
      );

    count +=
      Number.isFinite(qty)
      ? qty
      : 1;

  });


  updateCartCount(count);

}


function updateCartCount(count){

  cartCount.textContent =
    count > 99
    ? "99+"
    : count;

  bottomCartCount.textContent =
    count > 99
    ? "99+"
    : count;

}


/* =========================================================
   DESKTOP CART
   ========================================================= */

document
  .getElementById("desktopCartBtn")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "cart.html";

    }
  );


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
  "input",
  renderProducts
);


/* =========================================================
   SORT
   ========================================================= */

sortSelect.addEventListener(
  "change",
  renderProducts
);


/* =========================================================
   CATEGORY
   ========================================================= */

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".category")
          .forEach(btn =>
            btn.classList.remove(
              "active"
            )
          );

        button.classList.add(
          "active"
        );

        selectedCategory =
          button.dataset.category;

        renderProducts();

      }
    );

  });


/* =========================================================
   MOBILE BOTTOM NAV
   FIXED - NEVER HIDE
   ========================================================= */

document
  .querySelectorAll(".bottom-item")
  .forEach(item => {

    item.addEventListener(
      "click",
      () => {

        const type =
          item.dataset.bottom;


        if(type === "home"){

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }


        if(type === "categories"){

          document
            .getElementById("categoryBar")
            .scrollIntoView({
              behavior:"smooth",
              block:"start"
            });

        }


        if(type === "account"){

          supabaseClient.auth
            .getUser()
            .then(({data}) => {

              if(data?.user){

                window.location.href =
                  "account.html";

              }else{

                window.location.href =
                  "login.html";

              }

            });

        }


        if(type === "orders"){

          window.location.href =
            "orders.html";

        }


        if(type === "cart"){

          window.location.href =
            "cart.html";

        }

      }
    );

  });


/* =========================================================
   LOAD
   ========================================================= */

(async function(){

  await loadUser();

  await loadProducts();

  await loadCartCount();

})();

</script>

</body>
</html>
