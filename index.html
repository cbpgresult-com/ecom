<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyStore - Online Shopping</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    background:#f7f7fb;
    color:#17121f;
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   COLORS
========================================================= */

:root{
    --violet:#6d28d9;
    --violet-dark:#5521b5;
    --violet-light:#f1e9ff;

    --green:#dcfce7;
    --green-dark:#087443;

    --white:#ffffff;
    --text:#17121f;
    --muted:#77727f;
    --border:#e7e2ee;

    --shadow:
        0 4px 18px rgba(50,25,80,.07);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    width:100%;
    background:#fff;
    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1250px;
    margin:auto;

    min-height:74px;

    display:flex;
    align-items:center;
    gap:24px;

    padding:12px 20px;
}

/* LOGO */

.logo{
    flex-shrink:0;

    font-size:28px;
    font-weight:900;

    color:var(--violet);

    letter-spacing:-1px;
}

/* SEARCH */

.search-box{
    flex:1;
    position:relative;
}

.search-box input{
    width:100%;
    height:46px;

    border:2px solid #dfd0ff;
    border-radius:14px;

    background:#fcfaff;

    padding:0 48px 0 18px;

    outline:none;

    color:#222;
}

.search-box input:focus{
    border-color:var(--violet);
    background:#fff;
}

.search-icon{
    position:absolute;
    right:16px;
    top:50%;

    transform:translateY(-50%);

    width:20px;
    height:20px;
}

/* HEADER BUTTONS */

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.login-btn,
.cart-btn{
    border:0;

    height:44px;
    padding:0 16px;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    font-weight:700;
}

.login-btn{
    background:var(--violet-light);
    color:#4c1d95;
}

.cart-btn{
    background:var(--violet);
    color:white;

    box-shadow:0 6px 14px rgba(109,40,217,.18);
}

.cart-count{
    min-width:22px;
    height:22px;

    padding:0 6px;

    background:white;
    color:var(--violet);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
    font-weight:900;
}

/* =========================================================
   CATEGORY BAR
========================================================= */

.category-wrap{
    background:#fff;
    border-bottom:1px solid var(--border);
}

.categories{
    max-width:1250px;
    margin:auto;

    display:flex;
    align-items:center;

    gap:28px;

    padding:12px 20px;

    overflow-x:auto;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;

    min-width:64px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:6px;

    background:none;
    border:0;

    color:#252027;

    font-size:13px;
}

.category-icon{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#f0e7ff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#5b21b6;
}

.category.active{
    color:var(--violet);
    font-weight:800;
}

.category.active .category-icon{
    background:#ddf8e7;
    color:#087443;
}

/* =========================================================
   MAIN
========================================================= */

main{
    max-width:1250px;
    margin:auto;
    padding:26px 20px 70px;
}

/* =========================================================
   TOP SECTION
========================================================= */

.top-section{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    margin-bottom:20px;
}

.top-title h1{
    font-size:30px;
    font-weight:900;
    letter-spacing:-.8px;
}

.top-title p{
    color:var(--muted);
    margin-top:5px;
    font-size:14px;
}

.sort-select{
    height:40px;

    border:1px solid var(--border);
    border-radius:10px;

    background:white;

    padding:0 14px;

    outline:none;
}

/* =========================================================
   PRODUCT GRID
========================================================= */

.product-grid{
    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:16px;
}

/* =========================================================
   PRODUCT CARD
========================================================= */

.product-card{
    background:white;

    border:1px solid var(--border);

    border-radius:16px;

    overflow:hidden;

    min-width:0;

    box-shadow:var(--shadow);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.product-card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 30px rgba(40,20,70,.12);
}

/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image-wrap{
    width:100%;

    height:245px;

    background:#fff;

    position:relative;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image{
    width:100%;
    height:100%;

    display:block;

    /*
      IMPORTANT:
      Product ko crop nahi karega.
      Pura MAIN image dikhega.
    */

    object-fit:contain;

    object-position:center;

    padding:12px;

    background:#fff;
}

/* DISCOUNT */

.discount{
    position:absolute;

    left:10px;
    top:10px;

    background:var(--green);

    color:var(--green-dark);

    padding:5px 8px;

    border-radius:7px;

    font-size:11px;
    font-weight:900;

    z-index:2;
}

/* RATING */

.rating{
    position:absolute;

    left:10px;
    bottom:10px;

    background:var(--green);

    color:var(--green-dark);

    padding:4px 7px;

    border-radius:6px;

    font-size:11px;
    font-weight:800;

    z-index:2;
}

/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
    padding:12px;
    min-width:0;
}

/*
  MOBILE ISSUE FIX:
  Product name controlled line count.
*/

.product-name{
    font-size:15px;
    line-height:1.35;

    font-weight:800;

    color:#18131d;

    display:-webkit-box;
    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;

    overflow:hidden;

    text-overflow:ellipsis;

    min-height:40px;

    word-break:break-word;
}

.price-row{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:9px;

    flex-wrap:wrap;
}

.price{
    font-size:20px;
    font-weight:900;

    color:#111;
}

.mrp{
    font-size:11px;

    color:#999;

    text-decoration:line-through;
}

.offer{
    color:#078444;
    font-size:12px;
    font-weight:800;
}

.delivery{
    margin-top:8px;

    color:#087443;

    font-size:11px;
    font-weight:700;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    text-align:center;

    padding:50px;

    color:var(--muted);

    font-size:14px;
}

.hidden{
    display:none!important;
}

/* =========================================================
   NO PRODUCTS
========================================================= */

.no-products{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
}

/* =========================================================
   MOBILE BOTTOM NAV
========================================================= */

.mobile-bottom-nav{
    display:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    body{
        padding-bottom:72px;
    }

    .header-inner{
        min-height:auto;

        padding:10px 12px;

        display:grid;

        grid-template-columns:
            1fr auto;

        gap:9px 10px;
    }

    .logo{
        font-size:23px;
    }

    .header-actions{
        gap:6px;
    }

    .login-btn{
        display:none;
    }

    .cart-btn{
        height:40px;
        padding:0 12px;
        font-size:13px;
    }

    .search-box{
        grid-column:1 / -1;
        grid-row:2;
    }

    .search-box input{
        height:42px;
        border-radius:12px;
        font-size:13px;
    }

    /* categories */

    .categories{
        gap:20px;

        padding:10px 12px;
    }

    .category{
        min-width:55px;
        font-size:11px;
    }

    .category-icon{
        width:38px;
        height:38px;
    }

    /* MAIN */

    main{
        padding:
            18px
            12px
            85px;
    }

    .top-section{
        align-items:center;
        gap:10px;
    }

    .top-title h1{
        font-size:22px;
    }

    .top-title p{
        font-size:11px;
    }

    .sort-select{
        height:36px;
        font-size:12px;
        padding:0 8px;
        max-width:115px;
    }

    /* GRID */

    .product-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:10px;
    }

    .product-card{
        border-radius:13px;
    }

    /* IMAGE */

    .product-image-wrap{
        height:185px;
    }

    .product-image{
        padding:8px;
    }

    /* INFO */

    .product-info{
        padding:9px;
    }

    .product-name{
        font-size:13px;

        line-height:1.3;

        /*
          exactly 2 lines,
          then ...
        */

        -webkit-line-clamp:2;

        min-height:34px;
    }

    .price{
        font-size:17px;
    }

    .mrp{
        font-size:9px;
    }

    .offer{
        font-size:10px;
    }

    .delivery{
        font-size:10px;
    }

    .discount{
        left:7px;
        top:7px;

        padding:4px 6px;

        font-size:9px;
    }

    .rating{
        left:7px;
        bottom:7px;

        font-size:9px;
    }

    /* =====================================================
       MOBILE BOTTOM NAV
    ===================================================== */

    .mobile-bottom-nav{
        position:fixed;

        left:0;
        right:0;
        bottom:0;

        height:68px;

        background:rgba(255,255,255,.97);

        border-top:1px solid #e6e0ed;

        display:grid;

        grid-template-columns:
            repeat(5,1fr);

        align-items:center;

        z-index:9999;

        box-shadow:
            0 -5px 20px rgba(30,10,50,.08);

        padding-bottom:
            env(safe-area-inset-bottom);
    }

    .bottom-item{
        border:0;
        background:none;

        height:100%;

        display:flex;
        flex-direction:column;

        align-items:center;
        justify-content:center;

        gap:3px;

        color:#77727f;

        font-size:10px;
        font-weight:700;

        position:relative;
    }

    .bottom-item svg{
        width:22px;
        height:22px;
    }

    .bottom-item.active{
        color:var(--violet);
    }

    .bottom-item.active svg{
        stroke-width:2.5;
    }

    .bottom-cart-count{
        position:absolute;

        top:8px;
        margin-left:23px;

        min-width:16px;
        height:16px;

        padding:0 4px;

        border-radius:20px;

        background:var(--violet);

        color:white;

        font-size:8px;

        display:flex;
        align-items:center;
        justify-content:center;
    }
}

/* =========================================================
   TABLET
========================================================= */

@media(min-width:701px) and (max-width:1050px){

    .product-grid{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .product-image-wrap{
        height:230px;
    }
}

</style>
</head>

<script>


/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================================
   GLOBAL
========================================================= */

let allProducts = [];

let currentCategory = "all";


/* =========================================================
   MAIN IMAGE
========================================================= */

/*
   IMPORTANT FIX:

   Product card me second image nahi,
   MAIN image use hogi.

   Priority:

   1. image
   2. image_url
   3. imageUrl
   4. images[0]
*/

function getMainImage(product){

    let image = null;


    /* MAIN IMAGE */

    if(
        product.image &&
        typeof product.image === "string"
    ){

        image = product.image;

    }


    /* image_url */

    if(
        !image &&
        product.image_url
    ){

        image = product.image_url;

    }


    /* imageUrl */

    if(
        !image &&
        product.imageUrl
    ){

        image = product.imageUrl;

    }


    /* images array */

    if(
        !image &&
        Array.isArray(product.images)
    ){

        image = product.images[0];

    }


    /* images JSON string */

    if(
        !image &&
        typeof product.images === "string"
    ){

        try{

            const parsed =
                JSON.parse(product.images);

            if(
                Array.isArray(parsed) &&
                parsed.length
            ){

                image = parsed[0];

            }

        }catch(e){}

    }


    /* fallback */

    return image ||
        "https://via.placeholder.com/500x500?text=Product";

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    const loading =
        document.getElementById("loading");

    const grid =
        document.getElementById("productGrid");

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("products")
            .select("*");


        if(error){

            console.error(error);

            loading.innerHTML =
                "Unable to load products.";

            return;

        }


        allProducts =
            data || [];


        loading.classList.add("hidden");


        createCategories();


        renderProducts();

    }
    catch(error){

        console.error(error);

        loading.innerHTML =
            "Something went wrong.";

    }

}


/* =========================================================
   CATEGORIES
========================================================= */

function createCategories(){

    const bar =
        document.getElementById("categoryBar");


    const categories =
        [
            ...new Set(
                allProducts
                .map(p =>
                    p.category
                )
                .filter(Boolean)
            )
        ];


    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category";

        button.dataset.category =
            category;

        button.onclick =
            function(){

                selectCategory(
                    category,
                    this
                );

            };


        button.innerHTML = `

            <span class="category-icon">

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <rect
                        x="4"
                        y="4"
                        width="16"
                        height="16"
                        rx="2"
                    ></rect>

                    <path
                        d="M8 8h8M8 12h8M8 16h5"
                    ></path>

                </svg>

            </span>

            <span>
                ${escapeHTML(category)}
            </span>

        `;


        bar.appendChild(button);

    });

}


/* =========================================================
   CATEGORY SELECT
========================================================= */

function selectCategory(
    category,
    element
){

    currentCategory =
        category;


    document
        .querySelectorAll(".category")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    if(element){

        element.classList.add("active");

    }


    renderProducts();

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    const grid =
        document.getElementById(
            "productGrid"
        );

    const noProducts =
        document.getElementById(
            "noProducts"
        );


    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    let products =
        [...allProducts];


    /* CATEGORY */

    if(
        currentCategory !== "all"
    ){

        products =
            products.filter(
                product =>
                    String(
                        product.category || ""
                    ).toLowerCase()
                    ===
                    String(
                        currentCategory
                    ).toLowerCase()
            );

    }


    /* SEARCH */

    if(search){

        products =
            products.filter(product => {

                const title =
                    String(
                        product.title ||
                        product.name ||
                        ""
                    )
                    .toLowerCase();


                const category =
                    String(
                        product.category ||
                        ""
                    )
                    .toLowerCase();


                return(
                    title.includes(search) ||
                    category.includes(search)
                );

            });

    }


    /* SORT */

    const sort =
        document.getElementById(
            "sortSelect"
        ).value;


    if(sort === "low"){

        products.sort(
            (a,b) =>
                Number(
                    a.price || 0
                )
                -
                Number(
                    b.price || 0
                )
        );

    }


    if(sort === "high"){

        products.sort(
            (a,b) =>
                Number(
                    b.price || 0
                )
                -
                Number(
                    a.price || 0
                )
        );

    }


    if(sort === "new"){

        products.sort(
            (a,b) =>
                new Date(
                    b.created_at || 0
                )
                -
                new Date(
                    a.created_at || 0
                )
        );

    }


    grid.innerHTML = "";


    if(!products.length){

        noProducts.classList.remove(
            "hidden"
        );

        return;

    }


    noProducts.classList.add(
        "hidden"
    );


    products.forEach(product => {

        grid.appendChild(
            createProductCard(product)
        );

    });

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function createProductCard(product){

    const card =
        document.createElement("article");

    card.className =
        "product-card";


    const image =
        getMainImage(product);


    const title =
        product.title ||
        product.name ||
        "Product";


    const price =
        Number(
            product.price || 0
        );


    const mrp =
        Number(
            product.mrp || 0
        );


    let discount = "";


    if(
        mrp > price &&
        price > 0
    ){

        discount =
            Math.round(
                ((mrp - price) / mrp) * 100
            );

    }


    const rating =
        product.rating ||
        product.average_rating ||
        "4.6";


    card.innerHTML = `

        <div class="product-image-wrap">

            ${
                discount
                ?
                `
                <div class="discount">
                    ${discount}% OFF
                </div>
                `
                :
                ""
            }


            <img
                class="product-image"
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(title)}"
                loading="lazy"
                onerror="
                    this.src='https://via.placeholder.com/500x500?text=Product';
                "
            >


            <div class="rating">
                ★ ${escapeHTML(String(rating))}
            </div>

        </div>


        <div class="product-info">

            <div
                class="product-name"
                title="${escapeAttribute(title)}"
            >
                ${escapeHTML(title)}
            </div>


            <div class="price-row">

                <span class="price">
                    ₹${price.toLocaleString("en-IN")}
                </span>


                ${
                    mrp > price
                    ?
                    `
                    <span class="mrp">
                        ₹${mrp.toLocaleString("en-IN")}
                    </span>
                    `
                    :
                    ""
                }


                ${
                    discount
                    ?
                    `
                    <span class="offer">
                        ${discount}% OFF
                    </span>
                    `
                    :
                    ""
                }

            </div>


            <div class="delivery">
                ✓ Delivery available
            </div>

        </div>

    `;


    /*
      Product click
    */

    card.addEventListener(
        "click",
        function(){

            if(product.id){

                window.location.href =
                    "product.html?id=" +
                    encodeURIComponent(
                        product.id
                    );

            }

        }
    );


    return card;

}


/* =========================================================
   SEARCH

document

/* =========================================================

document

/* =========================================================
   CART COUNT
========================================================= */

async function updateCartCount(){

    try{

        const {
            data: {
                user
            }
        } =
        await supabaseClient
            .auth
            .getUser();


        if(!user){

            setCartCount(0);

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient
            .from("cart_items")
            .select("quantity")
            .eq(
                "user_id",
                user.id
            );


        if(error){

            console.log(
                "Cart count error:",
                error
            );

            setCartCount(0);

            return;

        }


        let total = 0;


        (data || []).forEach(item => {

            total +=
                Number(
                    item.quantity || 0
                );

        });


        setCartCount(total);

    }
    catch(error){

        console.log(error);

        setCartCount(0);

    }

}


function setCartCount(count){

    document.getElementById(
        "cartCount"
    ).textContent =
        count;


    document.getElementById(
        "bottomCartCount"
    ).textContent =
        count;

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}
