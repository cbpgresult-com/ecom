<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Notifications</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#2563eb;--blue2:#4f46e5;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7fb;--card:#fff;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}.page{max-width:980px;margin:auto;padding:18px 18px 50px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}.back{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 5px 20px #1111110d;cursor:pointer;font-size:22px}.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}.top-actions{display:flex;gap:8px;align-items:center}.readall{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer}.hero{margin-top:14px;background:linear-gradient(135deg,#eef4ff,#f7f4ff);border:1px solid #e7eaf4;border-radius:22px;padding:20px;display:flex;align-items:center;gap:15px;box-shadow:0 14px 40px #1d4ed80c}.bell{width:54px;height:54px;border-radius:17px;background:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 8px 25px #1111110d}.hero-title{font-size:16px;font-weight:800}.hero-sub{font-size:12.5px;color:var(--muted);margin-top:4px}.count{margin-left:auto;min-width:34px;height:34px;padding:0 9px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 7px 18px #2563eb44}.filters{display:flex;gap:8px;overflow:auto;padding:16px 0 12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#667085;border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer}.filter.active{background:#111827;border-color:#111827;color:#fff}.list{display:grid;gap:10px}.notice{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;display:flex;gap:13px;position:relative;transition:.2s;box-shadow:0 5px 20px #11182705;animation:rise .28s ease both}.notice.unread{border-color:#c7d7ff;box-shadow:0 8px 28px #2563eb10}.notice.unread:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 4px 4px 0;background:var(--blue)}.nicon{width:45px;height:45px;border-radius:14px;background:#f1f5ff;display:grid;place-items:center;font-size:22px;flex:0 0 45px}.nbody{min-width:0;flex:1}.ntop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{font-size:14px;font-weight:800;line-height:1.35}.time{font-size:10.5px;color:#9ca3af;white-space:nowrap}.msg{font-size:13px;line-height:1.55;color:#5f6673;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.type{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;padding:4px 8px;border-radius:999px;background:#f3f4f6;color:#6b7280}.download{border:0;background:#111827;color:#fff;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.download:hover{background:#000}.mark{border:1px solid var(--line);background:#fff;color:#667085;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;cursor:pointer}.empty,.error,.login{background:#fff;border:1px solid var(--line);border-radius:20px;min-height:300px;display:grid;place-items:center;text-align:center;padding:35px}.empty-icon{font-size:45px}.empty h3,.error h3{margin:10px 0 5px}.empty p,.error p{color:#9ca3af;font-size:13px;margin:0}.loader{display:flex;justify-content:center;padding:45px}.spinner{width:34px;height:34px;border:3px solid #dbe4ff;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:700;z-index:20;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:700px){.page{padding:10px 11px 35px}.top{height:54px}.top h1{font-size:18px}.back{width:38px;height:38px}.readall{font-size:12px}.hero{border-radius:18px;padding:15px}.bell{width:48px;height:48px;border-radius:15px;font-size:24px}.hero-title{font-size:14px}.hero-sub{font-size:11.5px}.count{min-width:30px;height:30px}.notice{padding:13px 12px;border-radius:15px;gap:10px}.nicon{width:40px;height:40px;flex-basis:40px;border-radius:12px;font-size:20px}.title{font-size:13px}.msg{font-size:12.5px}.time{font-size:9.5px}.download{font-size:10.5px;padding:7px 9px}.filter{padding:8px 13px}.empty,.error{min-height:260px}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><button class="back" onclick="goBack()" aria-label="Back">‹</button><h1>Notifications</h1><div class="top-actions"><button class="readall" onclick="markAllRead()">Mark all read</button></div></div>
  <section class="hero"><div class="bell">🔔</div><div><div class="hero-title">Your Notifications</div><div class="hero-sub" id="heroSub">Stay updated with your latest activity</div></div><div class="count" id="count">0</div></section>
  <div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="unread">Unread</button><button class="filter" data-filter="order">Orders</button><button class="filter" data-filter="offer">Offers</button><button class="filter" data-filter="account">Account</button></div>
  <main id="content"><div class="loader"><div class="spinner"></div></div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://bszojvhitsoamhksyjul.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let all=[],filter='all',channel=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(d){const x=new Date(d);return x.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function goBack(){if(history.length>1)history.back();else location.href='index.html'}
function getRows(){let rows=all.slice();if(filter==='unread')rows=rows.filter(x=>!x.is_read);else if(filter!=='all')rows=rows.filter(x=>(x.type||'').toLowerCase()===filter);return rows}
function render(){const c=document.getElementById('content');const rows=getRows();const unread=all.filter(x=>!x.is_read).length;document.getElementById('count').textContent=unread;document.getElementById('heroSub').textContent=unread?`${unread} unread notification${unread>1?'s':''}`:'You\'re all caught up';if(!rows.length){c.innerHTML=`<div class="empty"><div><div class="empty-icon">🔔</div><h3>${filter==='unread'?'No unread notifications':'No notifications'}</h3><p>When something important happens, it will appear here.</p></div></div>`;return}c.innerHTML='<div class="list">'+rows.map(n=>{const icon=n.icon||'🔔';const receipt=n.receipt_url||n.receipt_download_link||'';return `<article class="notice ${n.is_read?'':'unread'}" data-id="${esc(n.id)}"><div class="nicon">${esc(icon)}</div><div class="nbody"><div class="ntop"><div class="title">${esc(n.title||'Notification')}</div><div class="time">${fmt(n.created_at)}</div></div><div class="msg">${esc(n.message||'')}</div><div class="meta"><span class="type">${esc(n.type||'general')}</span>${receipt?`<button class="download" onclick="downloadReceipt('${esc(receipt)}')">⇩ Download</button>`:''}${!n.is_read?`<button class="mark" onclick="markRead('${esc(n.id)}')">Mark read</button>`:''}</div></div></article>`}).join('')+'</div>'}
async function load(){const {data:session}=await sb.auth.getSession();const user=session?.session?.user;if(!user){document.getElementById('content').innerHTML='<div class="login"><div><h3>Please login</h3><p>Login to see your notifications.</p><br><button class="download" onclick="location.href=\'login.html\'">Login</button></div></div>';return}const {data,error}=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){document.getElementById('content').innerHTML=`<div class="error"><div><div class="empty-icon">⚠️</div><h3>Couldn't load notifications</h3><p>${esc(error.message)}</p></div></div>`;return}all=data||[];render();subscribe(user.id)}
function subscribe(uid){if(channel)sb.removeChannel(channel);channel=sb.channel('notifications-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'user_id=eq.'+uid},p=>{if(p.eventType==='INSERT')all=[p.new,...all];else if(p.eventType==='UPDATE'){const i=all.findIndex(x=>x.id===p.new.id);if(i>-1)all[i]=p.new}else if(p.eventType==='DELETE')all=all.filter(x=>x.id!==p.old.id);render()}).subscribe()}
async function markRead(id){const {error}=await sb.from('notifications').update({is_read:true}).eq('id',id);if(error)toast(error.message);else{const n=all.find(x=>x.id===id);if(n)n.is_read=true;render()}}
async function markAllRead(){const {data:session}=await sb.auth.getSession();const uid=session?.session?.user?.id;if(!uid)return;const unread=all.filter(x=>!x.is_read).map(x=>x.id);if(!unread.length){toast('Already all read');return}const {error}=await sb.from('notifications').update({is_read:true}).eq('user_id',uid).eq('is_read',false);if(error)toast(error.message);else{all.forEach(x=>x.is_read=true);render();toast('All notifications marked read')}}
async function downloadReceipt(url){try{const r=await fetch(url);if(!r.ok)throw new Error('Download failed');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(url.split('/').pop()||'receipt').split('?')[0];document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}catch(e){const a=document.createElement('a');a.href=url;a.download='receipt';a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();toast('Opening download link...')}}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});load();
</script>
</body></html>
