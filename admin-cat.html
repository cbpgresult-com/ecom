<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>MyStore Admin - Subcategories</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;color:#202027}
button,input{font:inherit}
.wrap{max-width:1100px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.top h1{font-size:26px}
.card{background:#fff;border:1px solid #e4e4ec;border-radius:16px;padding:18px}
.form-card{max-width:520px}
label{display:block;font-size:13px;font-weight:700;margin:4px 0 7px}
input{width:100%;padding:12px;border:1px solid #d9d9e3;border-radius:10px;outline:none;background:#fff}
input:focus{border-color:#5b45e8;box-shadow:0 0 0 3px rgba(91,69,232,.08)}
.preview{height:150px;margin-top:10px;border-radius:12px;background:#f2f2f6;overflow:hidden;display:grid;place-items:center;color:#888}
.preview img{width:100%;height:100%;object-fit:contain}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:#5b45e8;color:#fff}
.secondary{background:#eeeef5;color:#222}
.danger{background:#fff0f1;color:#c33}
.full{width:100%;margin-top:12px}
.status{min-height:20px;margin-top:12px;font-size:13px}
.ok{color:#168447}.err{color:#c33}.loading{color:#5b45e8}
.list-card{margin-top:20px}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:15px}
.item{border:1px solid #e3e3eb;border-radius:14px;padding:12px;background:#fff}
.item img,.placeholder{width:78px;height:78px;border-radius:12px;object-fit:cover;background:#f1f1f6;display:grid;place-items:center;color:#777;font-weight:700}
.item-name{font-weight:750;margin-top:10px;word-break:break-word}
.item-link{font-size:11px;color:#777;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:7px;margin-top:10px}
.actions button{flex:1;padding:8px 9px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:#777;padding:40px 10px}
@media(max-width:800px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.top .btn{width:100%}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.item img,.placeholder{width:64px;height:64px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Subcategories Manager</h1>
    <button class="btn secondary" onclick="clearForm()">New</button>
  </div>

  <div class="card form-card">
    <h2 id="formTitle">Add Subcategory</h2>
    <br>

    <label for="subName">Subcategory Name</label>
    <input id="subName" type="text" placeholder="e.g. Hoodies">

    <label for="subImage" style="margin-top:15px">Subcategory Image Link</label>
    <input id="subImage" type="url" placeholder="https://example.com/hoodies.webp" oninput="previewImage()">

    <div class="preview" id="preview">Image preview</div>

    <button class="btn primary full" id="saveBtn" onclick="saveSubcategory()">Add Subcategory</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card list-card">
    <h2>Subcategories</h2>
    <div id="list" class="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://bszojvhitsoamhksyjul.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const MARKER="__SUBCATEGORY_ONLY__";
let items=[];
let editingId=null;

const nameEl=document.getElementById("subName");
const imageEl=document.getElementById("subImage");
const previewEl=document.getElementById("preview");
const listEl=document.getElementById("list");
const statusEl=document.getElementById("status");
const saveBtn=document.getElementById("saveBtn");
const formTitle=document.getElementById("formTitle");

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function showStatus(msg,type="ok"){
  statusEl.textContent=msg;
  statusEl.className="status "+type;
}
function previewImage(){
  const url=imageEl.value.trim();
  if(!url){previewEl.textContent="Image preview";return}
  previewEl.innerHTML=`<img src="${esc(url)}" alt="Preview" onerror="this.parentElement.textContent='Image load nahi hui'">`;
}
function isOurItem(row){
  const s=row?.sections;
  return Array.isArray(s) && s.some(x=>x && x.title===MARKER);
}
function clearForm(){
  editingId=null;
  nameEl.value="";
  imageEl.value="";
  previewEl.textContent="Image preview";
  formTitle.textContent="Add Subcategory";
  saveBtn.textContent="Add Subcategory";
  saveBtn.disabled=false;
  showStatus("");
  nameEl.focus();
}
async function load(){
  listEl.innerHTML=`<div class="empty">Loading...</div>`;
  const {data,error}=await db.from("categories")
    .select("id,name,image_url,sections,sort_order,created_at,is_active")
    .eq("is_active",true)
    .order("sort_order",{ascending:true})
    .order("created_at",{ascending:true});

  if(error){
    console.error(error);
    listEl.innerHTML=`<div class="empty"><b>Load nahi hua</b><br><br>${esc(error.message)}</div>`;
    showStatus(error.message,"err");
    return;
  }
  items=(data||[]).filter(isOurItem);
  renderList();
}
function renderList(){
  if(!items.length){
    listEl.innerHTML=`<div class="empty" style="grid-column:1/-1">Abhi koi subcategory nahi hai.</div>`;
    return;
  }
  listEl.innerHTML=items.map(row=>{
    const image=row.image_url
      ? `<img src="${esc(row.image_url)}" alt="${esc(row.name)}" onerror="this.style.display='none'">`
      : `<div class="placeholder">${esc((row.name||"?")[0].toUpperCase())}</div>`;
    return `<div class="item">
      ${image}
      <div class="item-name">${esc(row.name)}</div>
      <div class="item-link" title="${esc(row.image_url||"")}">${esc(row.image_url||"No image link")}</div>
      <div class="actions">
        <button class="secondary" onclick="editItem('${esc(row.id)}')">Edit</button>
        <button class="danger" onclick="deleteItem('${esc(row.id)}')">Delete</button>
      </div>
    </div>`;
  }).join("");
}
function editItem(id){
  const row=items.find(x=>String(x.id)===String(id));
  if(!row)return;
  editingId=row.id;
  nameEl.value=row.name||"";
  imageEl.value=row.image_url||"";
  formTitle.textContent="Edit Subcategory";
  saveBtn.textContent="Update Subcategory";
  previewImage();
  showStatus("Edit mode active.","ok");
  window.scrollTo({top:0,behavior:"smooth"});
}
async function saveSubcategory(){
  const name=nameEl.value.trim();
  const image=imageEl.value.trim();
  if(!name){
    showStatus("Subcategory name required.","err");
    nameEl.focus(); return;
  }
  saveBtn.disabled=true;
  saveBtn.textContent=editingId?"Updating...":"Saving...";
  showStatus("Supabase me save ho raha hai...","loading");

  const payload={
    name:name,
    image_url:image||null,
    sections:[{title:MARKER,items:[]}],
    is_active:true
  };

  let result;
  if(editingId){
    result=await db.from("categories").update(payload).eq("id",editingId).select().single();
  }else{
    result=await db.from("categories").insert(payload).select().single();
  }

  if(result.error){
    console.error(result.error);
    showStatus(result.error.message,"err");
    saveBtn.disabled=false;
    saveBtn.textContent=editingId?"Update Subcategory":"Add Subcategory";
    return;
  }

  clearForm();
  showStatus("✓ Subcategory successfully save ho gayi.","ok");
  await load();
}
async function deleteItem(id){
  const row=items.find(x=>String(x.id)===String(id));
  if(!row)return;
  if(!confirm(`"${row.name}" delete karni hai?`))return;

  showStatus("Delete ho raha hai...","loading");
  const {error}=await db.from("categories").delete().eq("id",id);
  if(error){showStatus(error.message,"err");return}
  if(String(editingId)===String(id))clearForm();
  showStatus("✓ Subcategory delete ho gayi.","ok");
  await load();
}

db.channel("subcategory-admin-live")
 .on("postgres_changes",{event:"*",schema:"public",table:"categories"},load)
 .subscribe();

document.addEventListener("DOMContentLoaded",load);
</script>
</body>
</html>
