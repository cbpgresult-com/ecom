<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart | MyStore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111;font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}.top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 5%;gap:20px;position:sticky;top:0;z-index:10}.logo{font-size:25px;font-weight:800}.search{flex:1;max-width:850px;height:44px;border:1px solid #ddd;border-radius:12px;padding:0 15px;background:#f8f8f8}.account{margin-left:auto;background:#111;color:#fff;border:0;border-radius:12px;height:44px;padding:0 16px;font-weight:800}.page{width:min(1250px,100%);margin:auto;padding:25px 4%}.title{font-size:30px;margin:0 0 20px}.layout{display:grid;grid-template-columns:1fr 360px;gap:18px}.card,.summary{background:#fff;border:1px solid #e5e7eb;border-radius:18px}.item{display:grid;grid-template-columns:100px 1fr auto;gap:18px;padding:18px;border-bottom:1px solid #eee;align-items:center}.item:last-child{border-bottom:0}.img{width:100px;height:100px;border:1px solid #eee;border-radius:12px;object-fit:contain;padding:7px}.name{font-weight:800;font-size:15px}.price{font-weight:800;margin-top:10px}.mrp{text-decoration:line-through;color:#888;font-size:12px;margin-left:7px}.qty{display:flex;height:36px;border:1px solid #ddd;border-radius:9px;overflow:hidden;margin-top:12px}.qty button{width:36px;border:0;background:#f7f7f7}.qty span{width:38px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}.remove{border:0;background:none;color:#dc2626;font-size:12px;font-weight:800;margin-top:9px}.summary{padding:22px;height:max-content;position:sticky;top:90px}.summary h2{font-size:18px;margin:0 0 18px}.line{display:flex;justify-content:space-between;padding:9px 0;color:#555;font-size:13px}.total{border-top:1px solid #eee;margin-top:9px;padding-top:15px;font-size:17px;font-weight:800;color:#111}.checkout{width:100%;height:52px;margin-top:17px;border:0;border-radius:12px;background:#ff9900;font-weight:900}.empty{text-align:center;padding:70px 20px}.continue{display:inline-block;background:#111;color:#fff;padding:13px 18px;border-radius:10px;font-weight:800;margin-top:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#111;color:#fff;padding:13px 17px;border-radius:11px;font-size:12px;font-weight:800;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.top{height:62px;padding:0 12px}.logo{font-size:20px}.search{display:none}.account{height:40px}.page{padding:15px 10px 30px}.title{font-size:25px}.layout{grid-template-columns:1fr}.summary{position:static}.item{grid-template-columns:78px 1fr}.img{width:78px;height:78px}.actions{grid-column:2}.checkout{position:relative}.summary{border-radius:15px}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/ecom/">MyStore</a><input class="search" placeholder="Search products..." id="search"><button class="account" onclick="location.href='/ecom/account.html'">Account</button></header>
<main class="page">
<h1 class="title">My Cart</h1>
<div id="login" class="card empty" style="display:none"><h2>Please login to view your cart</h2><p>Your cart is saved to your account.</p><a class="continue" href="/ecom/account.html">Login / Account</a></div>
<div id="empty" class="card empty" style="display:none"><div style="font-size:50px">🛒</div><h2>Your cart is empty</h2><p>Add products to continue shopping.</p><a class="continue" href="/ecom/">Continue Shopping</a></div>
<div id="layout" class="layout" style="display:none"><div id="items" class="card"></div><aside class="summary"><h2>Price Details</h2><div class="line"><span>Items</span><b id="itemCount">0</b></div><div class="line"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="line"><span>Delivery</span><b id="delivery">FREE</b></div><div class="line total"><span>Total</span><span id="total">₹0</span></div><button class="checkout" onclick="checkout()">Proceed to Checkout</button></aside></div>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://bszojvhitsoamhksyjul.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";
const sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,cart=[];
const money=n=>"₹"+Math.round(Number(n)||0).toLocaleString("en-IN");
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2200)}
async function init(){
 const {data}=await sbClient.auth.getSession();user=data.session?.user||null;
 if(!user){document.getElementById("login").style.display="block";return}
 await loadCart();
}
async function loadCart(){
 const {data,error}=await sbClient.from("cart_items").select("*").eq("user_id",user.id).order("created_at",{ascending:true});
 if(error){toast(error.message);return}
 cart=data||[];
 render();
}
function render(){
 if(!cart.length){document.getElementById("empty").style.display="block";document.getElementById("layout").style.display="none";return}
 document.getElementById("empty").style.display="none";document.getElementById("layout").style.display="grid";
 document.getElementById("items").innerHTML=cart.map((x,i)=>`
 <div class="item">
   <img class="img" src="${x.image||""}" onerror="this.style.visibility='hidden'">
   <div><div class="name">${escapeHtml(x.title)}</div><div class="price">${money(x.price)} <span class="mrp">${money(x.mrp)}</span></div><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="changeQty('${x.id}',1)">+</button></div></div>
   <div class="actions"><button class="remove" onclick="removeItem('${x.id}')">Remove</button></div>
 </div>`).join("");
 const count=cart.reduce((s,x)=>s+Number(x.qty||0),0),sub=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||0),0);
 itemCount.textContent=count;subtotal.textContent=money(sub);total.textContent=money(sub);
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function changeQty(id,n){
 const x=cart.find(a=>String(a.id)===String(id));if(!x)return;
 const q=Math.max(1,Number(x.qty)+n);
 const {error}=await sbClient.from("cart_items").update({qty:q,updated_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);
 if(error){toast(error.message);return}await loadCart();
}
async function removeItem(id){
 const {error}=await sbClient.from("cart_items").delete().eq("id",id).eq("user_id",user.id);
 if(error){toast(error.message);return}toast("Removed from cart");await loadCart();
}
function checkout(){location.href="/ecom/checkout.html?mode=cart"}
init();
</script>
</body>
</html>
