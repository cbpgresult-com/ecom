<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Cart | MyStore</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #151515;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 70px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 0 5%;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .search {
      flex: 1;
    }

    .search input {
      width: 100%;
      height: 44px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 16px;
      background: #f7f7f8;
      outline: none;
      font-size: 14px;
    }

    .search input:focus {
      background: #fff;
      border-color: #aaa;
    }

    .header-cart {
      background: #111;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-count {
      background: #fff;
      color: #111;
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: 4px;
    }

    /* =========================
       MAIN
    ========================= */

    .page {
      max-width: 1350px;
      margin: auto;
      padding: 32px 5% 70px;
    }

    .page-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .page-title {
      margin: 0;
      font-size: 32px;
      font-weight: 900;
    }

    .page-subtitle {
      color: #777;
      margin-top: 7px;
      font-size: 14px;
    }

    .continue-btn {
      border: 1px solid #ddd;
      background: #fff;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .continue-btn:hover {
      background: #f7f7f7;
    }

    /* =========================
       CART LAYOUT
    ========================= */

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(320px, .75fr);
      gap: 22px;
      align-items: start;
    }

    /* =========================
       CART ITEMS
    ========================= */

    .cart-items {
      background: #fff;
      border-radius: 20px;
      padding: 8px 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,.04);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 20px;
      padding: 25px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child {
      border-bottom: 0;
    }

    .item-image-wrap {
      width: 130px;
      height: 130px;
      background: #f6f6f7;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .item-info {
      min-width: 0;
    }

    .item-name {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .item-brand {
      color: #777;
      font-size: 13px;
      margin-bottom: 13px;
    }

    .item-price {
      font-size: 21px;
      font-weight: 900;
    }

    .item-mrp {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      margin-left: 8px;
    }

    .item-discount {
      color: #16803c;
      font-size: 12px;
      font-weight: 800;
      margin-left: 8px;
    }

    .item-actions {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 9px;
      overflow: hidden;
    }

    .quantity-box button {
      width: 38px;
      height: 36px;
      border: 0;
      background: #f7f7f7;
      cursor: pointer;
      font-size: 17px;
      font-weight: 800;
    }

    .quantity-box span {
      width: 42px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
    }

    .remove-btn {
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .remove-btn:hover {
      color: #d32f2f;
    }

    .item-total {
      text-align: right;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,.05);
      position: sticky;
      top: 95px;
    }

    .summary-title {
      margin: 0 0 20px;
      font-size: 21px;
      font-weight: 900;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 14px 0;
      font-size: 14px;
      color: #555;
    }

    .summary-row.discount {
      color: #16803c;
    }

    .summary-divider {
      border: 0;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 21px;
      font-weight: 900;
    }

    .checkout-btn {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s;
    }

    .checkout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }

    .secure-payment {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 15px;
    }

    /* =========================
       EMPTY CART
    ========================= */

    .empty-cart {
      background: #fff;
      border-radius: 22px;
      padding: 90px 20px;
      text-align: center;
      box-shadow: 0 6px 25px rgba(0,0,0,.04);
    }

    .empty-icon {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .empty-cart h2 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .empty-cart p {
      color: #777;
      margin-bottom: 25px;
    }

    .shop-btn {
      border: 0;
      background: #111;
      color: #fff;
      padding: 14px 25px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translate(-50%, 30px);
      background: #111;
      color: #fff;
      padding: 13px 20px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 9999;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .header {
        height: auto;
        padding: 12px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .logo {
        font-size: 21px;
      }

      .search {
        order: 3;
        flex-basis: 100%;
      }

      .header-cart {
        padding: 10px 13px;
      }

      .page {
        padding: 20px 12px 40px;
      }

      .page-top {
        align-items: flex-start;
      }

      .page-title {
        font-size: 25px;
      }

      .continue-btn {
        padding: 9px 11px;
        font-size: 12px;
      }

      .cart-layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }

      .cart-items {
        padding: 5px 15px;
        border-radius: 16px;
      }

      .cart-item {
        grid-template-columns: 88px 1fr;
        gap: 12px;
        padding: 17px 0;
      }

      .item-image-wrap {
        width: 88px;
        height: 88px;
        border-radius: 11px;
      }

      .item-info {
        min-width: 0;
      }

      .item-name {
        font-size: 14px;
      }

      .item-brand {
        font-size: 11px;
        margin-bottom: 8px;
      }

      .item-price {
        font-size: 17px;
      }

      .item-mrp {
        font-size: 11px;
      }

      .item-discount {
        font-size: 10px;
      }

      .item-actions {
        margin-top: 10px;
        gap: 10px;
      }

      .quantity-box button {
        width: 31px;
        height: 31px;
      }

      .quantity-box span {
        width: 34px;
      }

      .item-total {
        display: none;
      }

      .remove-btn {
        font-size: 11px;
      }

      .summary {
        padding: 20px;
        border-radius: 16px;
      }

      .summary-title {
        font-size: 19px;
      }

      .total-row {
        font-size: 19px;
      }

      .checkout-btn {
        height: 50px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div
      class="logo"
      onclick="window.location.href='index.html'">
      MyStore
    </div>

    <div class="search">
      <input
        type="text"
        placeholder="Search products..."
        onclick="window.location.href='index.html'">
    </div>

    <button
      class="header-cart"
      onclick="window.location.href='cart.html'">

      🛒 Cart
      <span
        id="cartCount"
        class="cart-count">
        0
      </span>

    </button>

  </header>


  <main class="page">

    <!-- PAGE HEADER -->

    <div class="page-top">

      <div>
        <h1 class="page-title">
          Your Cart
        </h1>

        <div
          id="cartSubtitle"
          class="page-subtitle">
          Your selected products
        </div>
      </div>

      <button
        class="continue-btn"
        onclick="window.location.href='index.html'">

        ← Continue Shopping

      </button>

    </div>


    <!-- CART -->

    <div
      id="cartLayout"
      class="cart-layout">

      <section
        id="cartItems"
        class="cart-items">
      </section>


      <aside class="summary">

        <h2 class="summary-title">
          Order Summary
        </h2>


        <div class="summary-row">

          <span>
            Price
          </span>

          <strong id="subtotal">
            ₹0
          </strong>

        </div>


        <div class="summary-row discount">

          <span>
            Discount
          </span>

          <strong id="discount">
            - ₹0
          </strong>

        </div>


        <div class="summary-row">

          <span>
            Delivery
          </span>

          <strong id="delivery">
            FREE
          </strong>

        </div>


        <hr class="summary-divider">


        <div class="total-row">

          <span>
            Total
          </span>

          <span id="total">
            ₹0
          </span>

        </div>


        <button
          id="checkoutBtn"
          class="checkout-btn"
          onclick="goCheckout()">

          Proceed to Checkout →

        </button>


        <div class="secure-payment">
          🔒 Safe & Secure Checkout
        </div>

      </aside>

    </div>


    <!-- EMPTY -->

    <div
      id="emptyCart"
      class="empty-cart"
      style="display:none;">

      <div class="empty-icon">
        🛒
      </div>

      <h2>
        Your cart is empty
      </h2>

      <p>
        Looks like you haven't added anything yet.
      </p>

      <button
        class="shop-btn"
        onclick="window.location.href='index.html'">

        Start Shopping

      </button>

    </div>

  </main>


  <div
    id="toast"
    class="toast">
  </div>


  <script>

    /* =========================
       CART DATA
    ========================= */

    let cart =
      JSON.parse(
        localStorage.getItem("cart") || "[]"
      );


    /* =========================
       ELEMENTS
    ========================= */

    const cartItems =
      document.getElementById("cartItems");

    const cartLayout =
      document.getElementById("cartLayout");

    const emptyCart =
      document.getElementById("emptyCart");

    const cartCount =
      document.getElementById("cartCount");

    const cartSubtitle =
      document.getElementById("cartSubtitle");

    const subtotalElement =
      document.getElementById("subtotal");

    const discountElement =
      document.getElementById("discount");

    const totalElement =
      document.getElementById("total");


    /* =========================
       FORMAT MONEY
    ========================= */

    function money(value) {

      return Number(value || 0)
        .toLocaleString("en-IN");

    }


    /* =========================
       RENDER CART
    ========================= */

    function renderCart() {

      cart =
        JSON.parse(
          localStorage.getItem("cart") || "[]"
        );


      updateCartCount();


      if (!cart.length) {

        cartLayout.style.display = "none";

        emptyCart.style.display = "block";

        cartSubtitle.textContent =
          "Your cart is empty";

        return;
      }


      cartLayout.style.display = "grid";

      emptyCart.style.display = "none";


      const itemCount =
        cart.reduce(
          (sum, item) =>
            sum + Number(item.quantity || 0),
          0
        );


      cartSubtitle.textContent =
        `${itemCount} item${itemCount !== 1 ? "s" : ""} in your cart`;


      cartItems.innerHTML = "";


      cart.forEach(
        (item, index) => {

          const quantity =
            Number(item.quantity || 1);

          const price =
            Number(item.price || 0);

          const mrp =
            Number(item.mrp || price);

          const itemTotal =
            price * quantity;


          const itemDiscount =
            Math.max(
              0,
              (mrp - price) * quantity
            );


          const card =
            document.createElement("div");

          card.className =
            "cart-item";


          card.innerHTML = `

            <div class="item-image-wrap">

              <img
                class="item-image"
                src="${
                  item.image ||
                  "https://placehold.co/300x300/png?text=Product"
                }"
                alt="${escapeHTML(item.name)}">

            </div>


            <div class="item-info">

              <div class="item-name">

                ${escapeHTML(item.name)}

              </div>


              <div class="item-brand">

                ${item.brand ? escapeHTML(item.brand) : "Product"}

              </div>


              <div>

                <span class="item-price">

                  ₹${money(price)}

                </span>


                ${
                  mrp > price
                    ? `
                      <span class="item-mrp">
                        ₹${money(mrp)}
                      </span>

                      <span class="item-discount">
                        ${Math.round(
                          ((mrp - price) / mrp) * 100
                        )}% OFF
                      </span>
                    `
                    : ""
                }

              </div>


              <div class="item-actions">

                <div class="quantity-box">

                  <button
                    onclick="changeQuantity(${index}, -1)">
                    −
                  </button>

                  <span>
                    ${quantity}
                  </span>

                  <button
                    onclick="changeQuantity(${index}, 1)">
                    +
                  </button>

                </div>


                <button
                  class="remove-btn"
                  onclick="removeItem(${index})">

                  Remove

                </button>

              </div>

            </div>


            <div class="item-total">

              ₹${money(itemTotal)}

            </div>

          `;


          cartItems.appendChild(card);

        }
      );


      calculateSummary();

    }


    /* =========================
       SUMMARY
    ========================= */

    function calculateSummary() {

      let subtotal = 0;

      let mrpTotal = 0;


      cart.forEach(item => {

        const quantity =
          Number(item.quantity || 1);

        subtotal +=
          Number(item.price || 0) *
          quantity;

        mrpTotal +=
          Number(item.mrp || item.price || 0) *
          quantity;

      });


      const discount =
        Math.max(
          0,
          mrpTotal - subtotal
        );


      subtotalElement.textContent =
        `₹${money(subtotal)}`;


      discountElement.textContent =
        `- ₹${money(discount)}`;


      totalElement.textContent =
        `₹${money(subtotal)}`;

    }


    /* =========================
       CHANGE QUANTITY
    ========================= */

    function changeQuantity(index, change) {

      if (!cart[index]) return;


      cart[index].quantity =
        Number(cart[index].quantity || 1) +
        change;


      if (
        cart[index].quantity <= 0
      ) {

        cart.splice(index, 1);

      }


      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );


      renderCart();

    }


    /* =========================
       REMOVE
    ========================= */

    function removeItem(index) {

      if (!cart[index]) return;


      const name =
        cart[index].name;


      cart.splice(index, 1);


      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );


      showToast(
        `${name} removed from cart`
      );


      renderCart();

    }


    /* =========================
       CHECKOUT
    ========================= */

    function goCheckout() {

      if (!cart.length) {

        showToast(
          "Your cart is empty"
        );

        return;
      }


      window.location.href =
        "checkout.html";

    }


    /* =========================
       COUNT
    ========================= */

    function updateCartCount() {

      const count =
        cart.reduce(
          (total, item) =>
            total +
            Number(item.quantity || 0),
          0
        );


      cartCount.textContent =
        count;

    }


    /* =========================
       TOAST
    ========================= */

    let toastTimer;


    function showToast(message) {

      const toast =
        document.getElementById("toast");


      toast.textContent =
        message;


      toast.classList.add("show");


      clearTimeout(toastTimer);


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove("show");

          },
          2200
        );

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(value) {

      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       START
    ========================= */

    renderCart();

  </script>

</body>
</html>
