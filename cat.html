<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#ffffff"
>

<title>MyStore - Categories</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html,
body{
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#202027;
}


body{
    overflow:hidden;
}


button{
    font-family:inherit;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    height:64px;

    min-height:64px;

    display:flex;

    align-items:center;

    gap:14px;

    padding:0 18px;

    background:#fff;

    border-bottom:1px solid #e8e8ef;

    z-index:20;

}


.back-btn{

    width:38px;

    height:38px;

    border:0;

    background:transparent;

    display:grid;

    place-items:center;

    font-size:34px;

    line-height:1;

    cursor:pointer;

    color:#202027;

}


.logo{

    width:38px;

    height:38px;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #5b45e8,
            #8975ff
        );

    color:#fff;

    display:grid;

    place-items:center;

    font-size:20px;

    font-weight:800;

}


.page-title{

    font-size:21px;

    font-weight:750;

}


.top-actions{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:12px;

}


.top-action{

    width:40px;

    height:40px;

    border:0;

    background:transparent;

    display:grid;

    place-items:center;

    font-size:26px;

    cursor:pointer;

}


/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    min-height:0;

    display:flex;

    overflow:hidden;

}


/* =========================================================
   LEFT SIDEBAR
========================================================= */

.sidebar{

    width:210px;

    min-width:210px;

    height:100%;

    background:#fafaff;

    border-right:1px solid #e8e8ef;

    overflow-y:auto;

    scrollbar-width:none;

}


.sidebar::-webkit-scrollbar{

    display:none;

}


/* CATEGORY BUTTON */

.category-button{

    width:100%;

    min-height:78px;

    padding:9px 12px;

    border:0;

    border-bottom:1px solid #e8e8ef;

    background:transparent;

    display:flex;

    align-items:center;

    gap:11px;

    text-align:left;

    cursor:pointer;

    color:#555560;

    font-size:14px;

    font-weight:650;

    position:relative;

}


.category-button.active{

    background:#fff;

    color:#5b45e8;

}


.category-button.active::before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    bottom:0;

    width:4px;

    background:#5b45e8;

    border-radius:
        0 5px 5px 0;

}


/* CATEGORY IMAGE */

.category-image{

    width:46px;

    height:46px;

    min-width:46px;

    border-radius:50%;

    overflow:hidden;

    background:#f0eff7;

    display:grid;

    place-items:center;

}


.category-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

    flex:1;

    min-width:0;

    height:100%;

    overflow-y:auto;

    padding:
        22px
        30px
        50px;

    scroll-behavior:smooth;

}


/* =========================================================
   SECTION
========================================================= */

.section{

    margin-bottom:40px;

}


.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-bottom:18px;

}


.section-title{

    font-size:23px;

    font-weight:750;

}


.view-all{

    border:0;

    background:transparent;

    color:#5b45e8;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

}


/* =========================================================
   SUBCATEGORY GRID
========================================================= */

.items-grid{

    display:grid;

    grid-template-columns:
        repeat(
            5,
            minmax(105px,1fr)
        );

    gap:
        28px
        18px;

}


/* SUBCATEGORY */

.subcategory{

    border:0;

    background:transparent;

    cursor:pointer;

    text-align:center;

    color:#202027;

}


.subcategory-image{

    width:
        min(
            125px,
            100%
        );

    aspect-ratio:1/1;

    margin:
        0
        auto
        10px;

    border-radius:50%;

    overflow:hidden;

    background:#f5f4f8;

}


.subcategory-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


.subcategory-name{

    font-size:14px;

    line-height:1.25;

    font-weight:600;

}


/* =========================================================
   IMAGE PLACEHOLDER
========================================================= */

.image-placeholder{

    width:100%;

    height:100%;

    display:grid;

    place-items:center;

    color:#777;

    font-weight:700;

    font-size:22px;

}


/* =========================================================
   EMPTY
========================================================= */

.empty-content{

    width:100%;

    min-height:100%;

    display:grid;

    place-items:center;

    text-align:center;

    padding:40px;

}


.empty-box{

    max-width:340px;

}


.empty-icon{

    width:78px;

    height:78px;

    margin:
        0
        auto
        16px;

    border-radius:50%;

    background:#f3f1ff;

    color:#5b45e8;

    display:grid;

    place-items:center;

    font-size:32px;

}


.empty-title{

    font-size:20px;

    font-weight:750;

    color:#34343c;

    margin-bottom:7px;

}


.empty-text{

    font-size:14px;

    line-height:1.5;

    color:#777783;

}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    max-width:500px;

    margin:
        60px
        auto;

    padding:24px;

    border:
        1px solid
        #ffd2d2;

    background:#fff6f6;

    border-radius:14px;

}


.error-title{

    color:#c62828;

    font-size:18px;

    font-weight:750;

    margin-bottom:8px;

}


.error-message{

    color:#777;

    font-size:14px;

    line-height:1.5;

}


/* =========================================================
   LOADING
========================================================= */

.loading-box{

    width:100%;

    min-height:100%;

    display:grid;

    place-items:center;

}


.loader{

    width:34px;

    height:34px;

    border:
        3px solid
        #eee;

    border-top-color:#5b45e8;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .topbar{

        height:58px;

        min-height:58px;

        padding:0 9px;

        gap:7px;

    }


    .back-btn{

        width:34px;

        height:34px;

        font-size:30px;

    }


    .logo{

        width:32px;

        height:32px;

        border-radius:9px;

        font-size:16px;

    }


    .page-title{

        font-size:18px;

    }


    .top-actions{

        gap:3px;

    }


    .top-action{

        width:34px;

        height:34px;

        font-size:23px;

    }


    .sidebar{

        width:91px;

        min-width:91px;

    }


    .category-button{

        min-height:88px;

        padding:8px 3px;

        flex-direction:column;

        justify-content:center;

        gap:5px;

        text-align:center;

        font-size:10.5px;

    }


    .category-image{

        width:45px;

        height:45px;

    }


    .content{

        padding:
            17px
            11px
            30px;

    }


    .section{

        margin-bottom:32px;

    }


    .section-header{

        margin-bottom:15px;

    }


    .section-title{

        font-size:18px;

    }


    .view-all{

        font-size:12px;

    }


    .items-grid{

        grid-template-columns:
            repeat(
                3,
                minmax(70px,1fr)
            );

        gap:
            23px
            7px;

    }


    .subcategory-image{

        width:
            min(
                88px,
                100%
            );

        margin-bottom:8px;

    }


    .subcategory-name{

        font-size:11.5px;

    }

}


@media(max-width:380px){

    .sidebar{

        width:82px;

        min-width:82px;

    }


    .category-button{

        font-size:10px;

    }


    .items-grid{

        gap:
            20px
            5px;

    }


    .subcategory-name{

        font-size:11px;

    }

}

</style>

</head>


<body>


<div class="page">


    <!-- TOP -->

    <header class="topbar">


        <button
            class="back-btn"
            type="button"
            onclick="history.back()"
            aria-label="Back">

            ‹

        </button>


        <div class="logo">

            M

        </div>


        <div class="page-title">

            Categories

        </div>


        <div class="top-actions">


            <button
                class="top-action"
                type="button"
                onclick="openSearch()"
                aria-label="Search">

                ⌕

            </button>


            <button
                class="top-action"
                type="button"
                onclick="openCart()"
                aria-label="Cart">

                🛒

            </button>


        </div>

    </header>



    <!-- MAIN -->

    <main class="main">


        <!-- SIDEBAR -->

        <aside
            class="sidebar"
            id="categorySidebar">
        </aside>


        <!-- CONTENT -->

        <section
            class="content"
            id="categoryContent">

            <div class="loading-box">

                <div class="loader"></div>

            </div>

        </section>


    </main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE CONFIG

   SAME API AS INDEX.HTML
========================================================= */

const SUPABASE_URL =
    "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBALS
========================================================= */

let categories = [];

let activeCategoryId = null;


const sidebar =
    document.getElementById(
        "categorySidebar"
    );


const content =
    document.getElementById(
        "categoryContent"
    );


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}


/* =========================================================
   IMAGE HTML
========================================================= */

function imageHTML(
    url,
    name
){

    if(!url){

        return `

            <div class="image-placeholder">

                ${escapeHTML(
                    (name || "?")
                    .charAt(0)
                    .toUpperCase()
                )}

            </div>

        `;

    }


    return `

        <img
            src="${escapeHTML(url)}"
            alt="${escapeHTML(name)}"
            loading="lazy"
            onerror="
                this.style.display='none';
            "
        >

    `;

}


/* =========================================================
   LOAD CATEGORIES FROM SUPABASE
========================================================= */

async function loadCategories(){

    content.innerHTML = `

        <div class="loading-box">

            <div class="loader"></div>

        </div>

    `;


    const {

        data,
        error

    } = await db

        .from("categories")

        .select(`
            id,
            name,
            image_url,
            sections,
            sort_order,
            is_active,
            created_at
        `)

        .eq(
            "is_active",
            true
        )

        .order(
            "sort_order",
            {
                ascending:true
            }
        )

        .order(
            "created_at",
            {
                ascending:true
            }
        );


    /* ERROR */

    if(error){

        console.error(
            "Categories error:",
            error
        );


        categories = [];

        sidebar.innerHTML = "";

        content.innerHTML = `

            <div class="error-box">

                <div class="error-title">

                    Categories load nahi ho paayi

                </div>


                <div class="error-message">

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            </div>

        `;

        return;

    }


    categories =
        data || [];


    /* NO DATA */

    if(!categories.length){

        activeCategoryId = null;

        renderEmpty();

        return;

    }


    /* FIRST CATEGORY */

    activeCategoryId =
        categories[0].id;


    renderSidebar();

    renderContent();

}


/* =========================================================
   SIDEBAR
========================================================= */

function renderSidebar(){

    if(!categories.length){

        sidebar.innerHTML = "";

        return;

    }


    sidebar.innerHTML =

        categories
        .map(function(category){

            const active =
                String(
                    category.id
                ) ===
                String(
                    activeCategoryId
                )
                ?
                "active"
                :
                "";


            return `

                <button
                    type="button"
                    class="category-button ${active}"
                    onclick="
                        selectCategory(
                            '${escapeHTML(
                                category.id
                            )}'
                        )
                    "
                >

                    <span
                        class="category-image">

                        ${imageHTML(
                            category.image_url,
                            category.name
                        )}

                    </span>


                    <span>

                        ${escapeHTML(
                            category.name
                        )}

                    </span>

                </button>

            `;

        })
        .join("");

}


/* =========================================================
   CONTENT
========================================================= */

function renderContent(){

    const category =
        categories.find(function(item){

            return String(item.id) ===
                   String(activeCategoryId);

        });


    if(!category){

        renderEmpty();

        return;

    }


    const sections =
        Array.isArray(
            category.sections
        )
        ?
        category.sections
        :
        [];


    if(!sections.length){

        content.innerHTML = `

            <div class="empty-content">

                <div class="empty-box">

                    <div class="empty-icon">

                        +

                    </div>


                    <div class="empty-title">

                        No Subcategories Yet

                    </div>


                    <div class="empty-text">

                        Is category ke liye
                        Admin Panel se
                        subcategories add karein.

                    </div>

                </div>

            </div>

        `;

        return;

    }


    const sectionsHTML =

        sections
        .map(function(section){

            const items =
                Array.isArray(
                    section.items
                )
                ?
                section.items
                :
                [];


            /* EMPTY SECTION */

            if(!items.length){

                return `

                    <div class="section">

                        <div class="section-header">

                            <h2 class="section-title">

                                ${escapeHTML(
                                    section.title || ""
                                )}

                            </h2>

                        </div>

                    </div>

                `;

            }


            /* SECTION */

            return `

                <div class="section">


                    <div class="section-header">

                        <h2 class="section-title">

                            ${escapeHTML(
                                section.title || ""
                            )}

                        </h2>


                        <button
                            type="button"
                            class="view-all"
                            onclick="
                                viewAll(
                                    '${escapeHTML(
                                        category.name
                                    )}'
                                )
                            "
                        >

                            View All

                        </button>

                    </div>


                    <div class="items-grid">


                        ${
                            items
                            .map(function(item){

                                return `

                                    <button
                                        type="button"
                                        class="subcategory"
                                        onclick="
                                            openSubcategory(
                                                '${escapeHTML(
                                                    category.name
                                                )}',
                                                '${escapeHTML(
                                                    item.name
                                                )}'
                                            )
                                        "
                                    >


                                        <div
                                            class="subcategory-image">

                                            ${imageHTML(
                                                item.image,
                                                item.name
                                            )}

                                        </div>


                                        <div
                                            class="subcategory-name">

                                            ${escapeHTML(
                                                item.name
                                            )}

                                        </div>


                                    </button>

                                `;

                            })
                            .join("")

                        }


                    </div>

                </div>

            `;

        })
        .join("");


    content.innerHTML =
        sectionsHTML;

}


/* =========================================================
   EMPTY PAGE
========================================================= */

function renderEmpty(){

    sidebar.innerHTML = "";


    content.innerHTML = `

        <div class="empty-content">

            <div class="empty-box">

                <div class="empty-icon">

                    +

                </div>


                <div class="empty-title">

                    No Categories Yet

                </div>


                <div class="empty-text">

                    Admin Panel se category
                    add karne ke baad
                    yahan automatically dikhegi.

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   SELECT CATEGORY
========================================================= */

function selectCategory(id){

    activeCategoryId =
        id;


    renderSidebar();

    renderContent();


    content.scrollTop = 0;

}


/* =========================================================
   SUBCATEGORY CLICK
========================================================= */

function openSubcategory(
    categoryName,
    subcategoryName
){

    const url =
        "products.html" +
        "?category=" +
        encodeURIComponent(
            categoryName
        ) +
        "&subcategory=" +
        encodeURIComponent(
            subcategoryName
        );


    window.location.href =
        url;

}


/* =========================================================
   VIEW ALL
========================================================= */

function viewAll(
    categoryName
){

    const url =
        "products.html" +
        "?category=" +
        encodeURIComponent(
            categoryName
        );


    window.location.href =
        url;

}


/* =========================================================
   SEARCH
========================================================= */

function openSearch(){

    const query =
        prompt(
            "Search products"
        );


    if(
        !query ||
        !query.trim()
    ){

        return;

    }


    window.location.href =
        "products.html?search=" +
        encodeURIComponent(
            query.trim()
        );

}


/* =========================================================
   CART
========================================================= */

function openCart(){

    window.location.href =
        "cart.html";

}


/* =========================================================
   REALTIME UPDATE
=========================================================

   Admin se category add/update/delete
   hote hi Categories page automatically
   refresh ho jayega.
========================================================= */

db

    .channel(
        "categories-live"
    )

    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"categories"
        },
        function(){

            loadCategories();

        }
    )

    .subscribe();


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadCategories();

    }
);

</script>

</body>

</html>
