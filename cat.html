<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MyStore - Categories</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#5b45e8;
    --primary-soft:#f0edff;
    --text:#202027;
    --muted:#777783;
    --border:#e8e8ef;
    --sidebar:#fafaff;
}

html,
body{
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:var(--text);
}

body{
    overflow:hidden;
}

.page{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 18px;
    background:#fff;
    border-bottom:1px solid var(--border);
    z-index:20;
}

.back-btn{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    display:grid;
    place-items:center;
    font-size:34px;
    line-height:1;
    cursor:pointer;
    color:#202027;
}

.logo{
    width:38px;
    height:38px;
    border-radius:11px;
    background:linear-gradient(135deg,#5b45e8,#8975ff);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:20px;
    font-weight:800;
}

.page-title{
    font-size:21px;
    font-weight:750;
}

.top-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:16px;
}

.top-action{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    display:grid;
    place-items:center;
    font-size:25px;
    cursor:pointer;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;
    display:flex;
    overflow:hidden;
}

/* =========================
   LEFT CATEGORY BAR
========================= */

.sidebar{
    width:210px;
    min-width:210px;
    height:100%;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    overflow-y:auto;
    scrollbar-width:none;
}

.sidebar::-webkit-scrollbar{
    display:none;
}

.category-button{
    width:100%;
    min-height:74px;
    padding:9px 12px;
    border:0;
    border-bottom:1px solid var(--border);
    background:transparent;
    display:flex;
    align-items:center;
    gap:11px;
    text-align:left;
    cursor:pointer;
    color:#555560;
    font-size:14px;
    font-weight:650;
    position:relative;
}

.category-button.active{
    background:#fff;
    color:var(--primary);
}

.category-button.active::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:var(--primary);
    border-radius:0 5px 5px 0;
}

.category-image{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:50%;
    overflow:hidden;
    background:#f0eff7;
    display:grid;
    place-items:center;
}

.category-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   RIGHT CONTENT
========================= */

.content{
    flex:1;
    min-width:0;
    height:100%;
    overflow-y:auto;
    padding:22px 30px 40px;
    scroll-behavior:smooth;
}

.section{
    margin-bottom:36px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
}

.section-title{
    font-size:23px;
    font-weight:750;
}

.view-all{
    border:0;
    background:transparent;
    color:var(--primary);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.items-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(105px,1fr));
    gap:25px 18px;
}

.subcategory{
    border:0;
    background:transparent;
    cursor:pointer;
    text-align:center;
    color:var(--text);
}

.subcategory-image{
    width:min(125px,100%);
    aspect-ratio:1/1;
    margin:0 auto 10px;
    border-radius:50%;
    overflow:hidden;
    background:#f5f4f8;
}

.subcategory-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.subcategory-name{
    font-size:14px;
    line-height:1.25;
    font-weight:600;
}

.empty-content{
    width:100%;
    min-height:100%;
    display:grid;
    place-items:center;
    text-align:center;
    padding:40px;
}

.empty-box{
    max-width:330px;
    color:var(--muted);
}

.empty-icon{
    width:72px;
    height:72px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#f3f1ff;
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:30px;
}

.empty-title{
    font-size:19px;
    font-weight:700;
    color:#3a3a43;
    margin-bottom:7px;
}

.empty-text{
    font-size:14px;
    line-height:1.5;
}

/* =========================
   NO CATEGORY STATE
========================= */

.no-categories{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    padding:30px;
}

.no-categories-box{
    max-width:350px;
    text-align:center;
    color:var(--muted);
}

.no-categories-icon{
    width:78px;
    height:78px;
    border-radius:50%;
    margin:0 auto 16px;
    background:#f3f1ff;
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:32px;
}

.no-categories-title{
    font-size:20px;
    font-weight:750;
    color:#34343c;
    margin-bottom:7px;
}

.no-categories-text{
    font-size:14px;
    line-height:1.5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .topbar{
        height:58px;
        min-height:58px;
        padding:0 10px;
        gap:7px;
    }

    .back-btn{
        width:34px;
        height:34px;
        font-size:30px;
    }

    .logo{
        width:32px;
        height:32px;
        border-radius:9px;
        font-size:16px;
    }

    .page-title{
        font-size:18px;
    }

    .top-actions{
        gap:4px;
    }

    .top-action{
        width:34px;
        height:34px;
        font-size:23px;
    }

    .sidebar{
        width:91px;
        min-width:91px;
    }

    .category-button{
        min-height:85px;
        padding:8px 3px;
        flex-direction:column;
        justify-content:center;
        gap:5px;
        text-align:center;
        font-size:10.5px;
    }

    .category-button.active::before{
        width:4px;
    }

    .category-image{
        width:43px;
        height:43px;
    }

    .content{
        padding:17px 11px 30px;
    }

    .section-header{
        margin-bottom:15px;
    }

    .section-title{
        font-size:18px;
    }

    .view-all{
        font-size:12px;
    }

    .items-grid{
        grid-template-columns:repeat(3,minmax(70px,1fr));
        gap:21px 7px;
    }

    .subcategory-image{
        width:min(88px,100%);
        margin-bottom:8px;
    }

    .subcategory-name{
        font-size:11.5px;
    }
}

@media(max-width:380px){

    .sidebar{
        width:82px;
        min-width:82px;
    }

    .category-button{
        font-size:10px;
    }

    .items-grid{
        gap:19px 5px;
    }

    .subcategory-name{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="topbar">

        <button
            class="back-btn"
            type="button"
            onclick="history.back()"
            aria-label="Back">
            ‹
        </button>

        <div class="logo">M</div>

        <div class="page-title">
            Categories
        </div>

        <div class="top-actions">

            <button
                class="top-action"
                type="button"
                onclick="openSearch()"
                aria-label="Search">
                ⌕
            </button>

            <button
                class="top-action"
                type="button"
                onclick="openCart()"
                aria-label="Cart">
                🛒
            </button>

        </div>

    </header>

    <main class="main">

        <aside
            class="sidebar"
            id="categorySidebar">
        </aside>

        <section
            class="content"
            id="categoryContent">
        </section>

    </main>

</div>


<script>

/*
=========================================================
MYSTORE REAL CATEGORIES PAGE
=========================================================

IMPORTANT:

Is file me KISI bhi category ka naam hard-coded nahi hai.

Categories page sirf categories-data.json se data lega.

Admin Panel se jo add hoga:
    Category
    Category Image
    Section
    Subcategory
    Subcategory Image

Wahi yahan dikhega.

Agar database/API se categories-data.json replace/connect
kiya jayega to page automatically real data dikhayega.

=========================================================
*/


const DATA_URL = "categories-data.json";

let categories = [];
let activeCategoryId = null;


/* =====================================================
   LOAD DATA
===================================================== */

async function loadCategories(){

    try{

        const response = await fetch(
            DATA_URL + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error("Categories data not found");
        }

        const data = await response.json();

        if(!Array.isArray(data)){
            throw new Error("Invalid categories data");
        }

        categories = data;

    }catch(error){

        console.error("Categories load error:",error);

        categories = [];

    }


    /*
       IMPORTANT:
       Yahan koi default/fake category add nahi ki ja rahi.
    */

    if(categories.length === 0){

        activeCategoryId = null;

        renderEmptyPage();

        return;
    }


    activeCategoryId = categories[0].id;

    renderSidebar();

    renderContent();
}


/* =====================================================
   SIDEBAR
===================================================== */

function renderSidebar(){

    const sidebar =
        document.getElementById("categorySidebar");

    if(!categories.length){

        sidebar.innerHTML = "";

        return;
    }


    sidebar.innerHTML =
        categories.map(category => {

            const active =
                category.id === activeCategoryId
                ? "active"
                : "";

            return `

                <button
                    type="button"
                    class="category-button ${active}"
                    onclick="selectCategory('${escapeAttr(category.id)}')">

                    <span class="category-image">

                        ${
                            category.image
                            ?
                            `
                            <img
                                src="${escapeAttr(category.image)}"
                                alt="${escapeAttr(category.name)}"
                                loading="lazy"
                                onerror="this.style.display='none'">
                            `
                            :
                            ""
                        }

                    </span>

                    <span>
                        ${escapeHTML(category.name)}
                    </span>

                </button>

            `;

        }).join("");
}


/* =====================================================
   CONTENT
===================================================== */

function renderContent(){

    const content =
        document.getElementById("categoryContent");

    const category =
        categories.find(
            item => item.id === activeCategoryId
        );


    if(!category){

        renderEmptyPage();

        return;
    }


    const sections =
        Array.isArray(category.sections)
        ? category.sections
        : [];


    if(!sections.length){

        content.innerHTML = `

            <div class="empty-content">

                <div class="empty-box">

                    <div class="empty-icon">
                        +
                    </div>

                    <div class="empty-title">
                        No subcategories yet
                    </div>

                    <div class="empty-text">
                        Is category ke liye Admin Panel se
                        subcategories add karein.
                    </div>

                </div>

            </div>

        `;

        return;
    }


    content.innerHTML =
        sections.map(section => {

            const items =
                Array.isArray(section.items)
                ? section.items
                : [];


            if(!items.length){

                return `
                    <div class="section">

                        <div class="section-header">
                            <h2 class="section-title">
                                ${escapeHTML(section.title || "")}
                            </h2>
                        </div>

                        <div class="empty-content"
                             style="min-height:180px">

                            <div class="empty-box">

                                <div class="empty-text">
                                    No subcategories added yet.
                                </div>

                            </div>

                        </div>

                    </div>
                `;

            }


            return `

                <div class="section">

                    <div class="section-header">

                        <h2 class="section-title">
                            ${escapeHTML(section.title || "")}
                        </h2>

                        <button
                            type="button"
                            class="view-all"
                            onclick="viewAll(
                                '${escapeAttr(category.name)}'
                            )">

                            View All

                        </button>

                    </div>


                    <div class="items-grid">

                        ${
                            items.map(item => {

                                return `

                                    <button
                                        type="button"
                                        class="subcategory"
                                        onclick="openSubcategory(
                                            '${escapeAttr(category.name)}',
                                            '${escapeAttr(item.name)}'
                                        )">

                                        <div class="subcategory-image">

                                            ${
                                                item.image
                                                ?
                                                `
                                                <img
                                                    src="${escapeAttr(item.image)}"
                                                    alt="${escapeAttr(item.name)}"
                                                    loading="lazy"
                                                    onerror="this.style.display='none'">
                                                `
                                                :
                                                ""
                                            }

                                        </div>

                                        <div class="subcategory-name">
                                            ${escapeHTML(item.name)}
                                        </div>

                                    </button>

                                `;

                            }).join("")
                        }

                    </div>

                </div>

            `;

        }).join("");
}


/* =====================================================
   EMPTY PAGE
===================================================== */

function renderEmptyPage(){

    document.getElementById(
        "categorySidebar"
    ).innerHTML = "";


    document.getElementById(
        "categoryContent"
    ).innerHTML = `

        <div class="no-categories">

            <div class="no-categories-box">

                <div class="no-categories-icon">
                    +
                </div>

                <div class="no-categories-title">
                    No Categories Yet
                </div>

                <div class="no-categories-text">
                    Admin Panel se category add karne ke
                    baad yahan automatically dikhegi.
                </div>

            </div>

        </div>

    `;
}


/* =====================================================
   SELECT CATEGORY
===================================================== */

function selectCategory(id){

    activeCategoryId = id;

    renderSidebar();

    renderContent();

    const content =
        document.getElementById("categoryContent");

    content.scrollTop = 0;
}


/* =====================================================
   SUBCATEGORY
===================================================== */

function openSubcategory(
    categoryName,
    subcategoryName
){

    const url =
        "products.html" +
        "?category=" +
        encodeURIComponent(categoryName) +
        "&subcategory=" +
        encodeURIComponent(subcategoryName);


    window.location.href = url;
}


/* =====================================================
   VIEW ALL
===================================================== */

function viewAll(categoryName){

    const url =
        "products.html" +
        "?category=" +
        encodeURIComponent(categoryName);


    window.location.href = url;
}


/* =====================================================
   SEARCH
===================================================== */

function openSearch(){

    const query =
        prompt("Search products");


    if(!query || !query.trim()){
        return;
    }


    window.location.href =
        "products.html?search=" +
        encodeURIComponent(query.trim());
}


/* =====================================================
   CART
===================================================== */

function openCart(){

    window.location.href = "cart.html";
}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeAttr(value){

    return escapeHTML(value);

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadCategories
);


</script>

</body>
</html>
