<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyStore - Categories</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#5b45e8;--t:#202027;--m:#777783;--b:#e8e8ef}
html,body{height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--t);background:#fff}
body{overflow:hidden}.page{height:100dvh;display:flex;flex-direction:column}
.top{height:64px;min-height:64px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:14px;padding:0 18px}
.back{border:0;background:none;font-size:34px;cursor:pointer}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#5b45e8,#8975ff);color:#fff;display:grid;place-items:center;font-weight:800}
.title{font-size:21px;font-weight:750}.actions{margin-left:auto;display:flex;gap:12px}.act{border:0;background:none;font-size:25px;cursor:pointer}
.main{flex:1;min-height:0;display:flex;overflow:hidden}
.side{width:210px;min-width:210px;background:#fafaff;border-right:1px solid var(--b);overflow:auto;scrollbar-width:none}.side::-webkit-scrollbar{display:none}
.cat{width:100%;min-height:74px;border:0;border-bottom:1px solid var(--b);background:transparent;display:flex;align-items:center;gap:11px;padding:9px 12px;text-align:left;color:#555;cursor:pointer;font-weight:650;position:relative}
.cat.active{background:#fff;color:var(--p)}.cat.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p)}
.cimg{width:43px;height:43px;min-width:43px;border-radius:50%;overflow:hidden;background:#f0eff7;display:grid;place-items:center}.cimg img{width:100%;height:100%;object-fit:cover}
.content{flex:1;min-width:0;overflow:auto;padding:22px 30px 40px}.section{margin-bottom:36px}.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sh h2{font-size:23px}.view{border:0;background:none;color:var(--p);font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,minmax(105px,1fr));gap:25px 18px}.item{border:0;background:none;text-align:center;cursor:pointer}.pimg{width:min(125px,100%);aspect-ratio:1;margin:auto auto 10px;border-radius:50%;overflow:hidden;background:#f5f4f8}.pimg img{width:100%;height:100%;object-fit:cover}.iname{font-size:14px;font-weight:600;line-height:1.25}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px}.ebox{max-width:350px;color:var(--m)}.eicon{width:78px;height:78px;border-radius:50%;background:#f3f1ff;color:var(--p);display:grid;place-items:center;font-size:32px;margin:auto auto 15px}.etitle{font-size:20px;font-weight:750;color:#34343c;margin-bottom:7px}.etext{font-size:14px;line-height:1.5}
@media(max-width:700px){
.top{height:58px;min-height:58px;padding:0 10px;gap:7px}.back{font-size:30px}.logo{width:32px;height:32px;border-radius:9px;font-size:16px}.title{font-size:18px}.act{font-size:23px}
.side{width:91px;min-width:91px}.cat{min-height:85px;padding:8px 3px;flex-direction:column;justify-content:center;gap:5px;text-align:center;font-size:10.5px}.cimg{width:43px;height:43px}
.content{padding:17px 11px 30px}.sh{margin-bottom:15px}.sh h2{font-size:18px}.view{font-size:12px}.grid{grid-template-columns:repeat(3,minmax(70px,1fr));gap:21px 7px}.pimg{width:min(88px,100%)}.iname{font-size:11.5px}
}
</style>
</head>
<body>
<div class="page">
<header class="top">
<button class="back" onclick="history.back()">‹</button><div class="logo">M</div><div class="title">Categories</div>
<div class="actions"><button class="act" onclick="openSearch()">⌕</button><button class="act" onclick="location.href='cart.html'">🛒</button></div>
</header>
<main class="main"><aside class="side" id="side"></aside><section class="content" id="content"></section></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://bszojvhitsoamhksyjul.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let categories=[],activeId=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const image=(u,n)=>u?'<img src="'+esc(u)+'" alt="'+esc(n)+'" loading="lazy" onerror="this.style.display=\'none\'">':"";
async function load(){
 const r=await sb.from("categories").select("id,name,image_url,sections,sort_order,is_active").eq("is_active",true).order("sort_order",{ascending:true}).order("created_at",{ascending:true});
 if(r.error){console.error(r.error);categories=[]}else categories=r.data||[];
 if(!categories.length){renderEmpty();return}
 activeId=categories[0].id;renderSide();renderContent();
}
function renderSide(){
 side.innerHTML=categories.map(c=>'<button class="cat '+(c.id===activeId?"active":"")+'" onclick="selectCat(\''+esc(c.id)+'\')"><span class="cimg">'+image(c.image_url,c.name)+'</span><span>'+esc(c.name)+'</span></button>').join("");
}
function renderContent(){
 const c=categories.find(x=>String(x.id)===String(activeId));
 if(!c){renderEmpty();return}
 const sections=Array.isArray(c.sections)?c.sections:[];
 const html=sections.map(s=>{
  const items=Array.isArray(s.items)?s.items:[];
  if(!items.length)return "";
  return '<div class="section"><div class="sh"><h2>'+esc(s.title||"")+'</h2><button class="view" onclick="viewAll(\''+esc(c.name)+'\')">View All</button></div><div class="grid">'+items.map(i=>'<button class="item" onclick="openSub(\''+esc(c.name)+'\',\''+esc(i.name)+'\')"><div class="pimg">'+image(i.image,i.name)+'</div><div class="iname">'+esc(i.name)+'</div></button>').join("")+'</div></div>';
 }).join("");
 content.innerHTML=html||'<div class="empty"><div class="ebox"><div class="eicon">+</div><div class="etitle">No Subcategories Yet</div><div class="etext">Is category ke liye Admin Panel se subcategory add karein.</div></div></div>';
}
function renderEmpty(){
 side.innerHTML="";
 content.innerHTML='<div class="empty"><div class="ebox"><div class="eicon">+</div><div class="etitle">No Categories Yet</div><div class="etext">Admin Panel se category add karne ke baad yahan automatically dikhegi.</div></div></div>';
}
function selectCat(id){activeId=id;renderSide();renderContent();content.scrollTop=0}
function openSub(c,s){location.href="products.html?category="+encodeURIComponent(c)+"&subcategory="+encodeURIComponent(s)}
function viewAll(c){location.href="products.html?category="+encodeURIComponent(c)}
function openSearch(){const q=prompt("Search products");if(q&&q.trim())location.href="products.html?search="+encodeURIComponent(q.trim())}
load();
</script>
</body>
</html>
