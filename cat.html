<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Categories - MyStore</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
.header{height:64px;border-bottom:1px solid #e6e6e6;display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;background:#fff;z-index:20}
.back{border:0;background:none;font-size:30px;cursor:pointer;color:#111;padding:4px 8px}.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#6246f5,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}.title{font-size:22px;font-weight:800}
.header-actions{margin-left:auto;display:flex;gap:20px;align-items:center}.icon-btn{border:0;background:none;cursor:pointer;padding:4px;position:relative}.icon-btn svg{width:27px;height:27px;stroke:#111}.cart-badge{position:absolute;right:-7px;top:-7px;background:#ef4444;color:#fff;border-radius:99px;font-size:10px;min-width:18px;height:18px;display:none;align-items:center;justify-content:center;font-weight:700}
.page{padding:26px 28px 50px}.grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:34px 28px;max-width:1100px;margin:0 auto}.item{border:0;background:none;cursor:pointer;text-align:center;padding:0;min-width:0}.imgbox{width:150px;height:150px;margin:0 auto 12px;border-radius:50%;background:#f5f5fa;display:flex;align-items:center;justify-content:center;overflow:hidden}.imgbox img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{font-size:46px;font-weight:800;color:#6d5ce7}.name{font-size:16px;font-weight:700;line-height:1.25;word-break:break-word}
.loading,.empty,.error{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}.spinner{width:34px;height:34px;border:4px solid #eee;border-top-color:#6246f5;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.errorbox{max-width:480px;padding:25px;border:1px solid #fecaca;background:#fff5f5;border-radius:14px;color:#b91c1c}.error-title{font-size:18px;font-weight:800;margin-bottom:8px}.emptybox{color:#777;font-size:15px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(110px,1fr));gap:28px 18px}.imgbox{width:125px;height:125px}}
@media(max-width:600px){.header{height:58px;padding:0 10px;gap:9px}.back{font-size:27px;padding:2px 4px}.logo{width:36px;height:36px;border-radius:10px;font-size:18px}.title{font-size:20px}.header-actions{gap:13px}.icon-btn svg{width:25px;height:25px}.page{padding:22px 12px 35px}.grid{grid-template-columns:repeat(3,1fr);gap:30px 10px}.imgbox{width:min(26vw,105px);height:min(26vw,105px);margin-bottom:9px}.name{font-size:14px}}
@media(max-width:360px){.grid{gap:24px 6px}.name{font-size:13px}}
</style>
</head>
<body>
<header class="header">
<button class="back" onclick="history.back()" aria-label="Back">‹</button><div class="logo">M</div><div class="title">Categories</div>
<div class="header-actions">
<button class="icon-btn" onclick="openSearch()" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></button>
<button class="icon-btn" onclick="openCart()" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 7H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="18" cy="20" r="1.3"></circle></svg><span id="cartBadge" class="cart-badge"></span></button>
</div></header>
<main id="app" class="loading"><div class="spinner"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://bszojvhitsoamhksyjul.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MARKER="__SUBCATEGORY_ONLY__";
const app=document.getElementById("app");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function isOurItem(row){const s=row?.sections;return Array.isArray(s)&&s.some(x=>x&&x.title===MARKER);}
function imageHTML(url,name){if(!url)return `<div class="placeholder">${esc((name||"?").charAt(0).toUpperCase())}</div>`;return `<img src="${esc(url)}" alt="${esc(name)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;placeholder&quot;>?</div>'">`;}
async function load(){
 app.className="loading";app.innerHTML='<div class="spinner"></div>';
 const {data,error}=await db.from("categories").select("id,name,image_url,sections,sort_order,created_at,is_active").eq("is_active",true).order("sort_order",{ascending:true}).order("created_at",{ascending:true});
 if(error){app.className="error";app.innerHTML=`<div class="errorbox"><div class="error-title">Categories load nahi ho paayi</div><div>${esc(error.message)}</div></div>`;return;}
 const items=(data||[]).filter(isOurItem);
 if(!items.length){app.className="empty";app.innerHTML='<div class="emptybox"><b>No Subcategories Yet</b><br><br>Admin Panel se subcategory add karein.</div>';return;}
 app.className="page";app.innerHTML=`<div class="grid">${items.map(item=>`<button class="item" onclick="openSubcategory(${JSON.stringify(item.name)})"><div class="imgbox">${imageHTML(item.image_url,item.name)}</div><div class="name">${esc(item.name)}</div></button>`).join("")}</div>`;
}
function openSubcategory(name){window.location.href="products.html?subcategory="+encodeURIComponent(name);}
function openSearch(){const q=prompt("Search products");if(q&&q.trim())window.location.href="index.html?search="+encodeURIComponent(q.trim());}
function openCart(){window.location.href="cart.html";}
db.channel("categories-live").on("postgres_changes",{event:"*",schema:"public",table:"categories"},load).subscribe();
document.addEventListener("DOMContentLoaded",load);
</script></body></html>
