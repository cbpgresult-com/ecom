<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Categories - MyStore</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #202124;
      overflow: hidden;
    }

    /* =========================
       TOP HEADER
    ========================= */

    .top-header {
      height: 64px;
      min-height: 64px;

      display: flex;
      align-items: center;

      padding: 0 18px;

      background: #ffffff;

      border-bottom: 1px solid #e5e5eb;

      position: relative;
      z-index: 10;
    }

    .back-btn {
      width: 38px;
      height: 38px;

      border: none;
      background: transparent;

      font-size: 34px;
      line-height: 38px;

      cursor: pointer;

      color: #171717;
    }

    .logo {
      width: 40px;
      height: 40px;

      border-radius: 11px;

      background: linear-gradient(
        135deg,
        #5b45e8,
        #816eff
      );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
      font-weight: 800;

      margin-left: 5px;
    }

    .page-title {
      font-size: 21px;
      font-weight: 750;

      margin-left: 14px;

      color: #151515;
    }

    .header-actions {
      margin-left: auto;

      display: flex;
      align-items: center;

      gap: 16px;
    }

    .header-action {
      border: none;
      background: transparent;

      cursor: pointer;

      font-size: 27px;

      color: #111111;

      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      height: calc(100dvh - 64px);

      display: flex;

      overflow: hidden;
    }

    /* =========================
       LEFT CATEGORY BAR
    ========================= */

    .category-sidebar {
      width: 210px;
      min-width: 210px;

      height: 100%;

      background: #fafaff;

      border-right: 1px solid #e4e4eb;

      overflow-y: auto;

      scrollbar-width: none;
    }

    .category-sidebar::-webkit-scrollbar {
      display: none;
    }

    .category-button {
      width: 100%;

      min-height: 82px;

      border: none;
      border-bottom: 1px solid #e5e5eb;

      background: transparent;

      display: flex;
      align-items: center;

      gap: 11px;

      padding: 9px 12px;

      text-align: left;

      cursor: pointer;

      color: #666975;

      font-size: 14px;

      font-weight: 650;

      position: relative;
    }

    .category-button.active {
      background: #ffffff;

      color: #5b45e8;
    }

    .category-button.active::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background: #5b45e8;

      border-radius: 0 4px 4px 0;
    }

    .category-image {
      width: 46px;
      height: 46px;

      min-width: 46px;

      border-radius: 50%;

      background: #eeeeF6;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #777;

      font-weight: 700;

      font-size: 16px;
    }

    .category-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .category-name {
      line-height: 1.25;
    }

    /* =========================
       RIGHT CONTENT
    ========================= */

    .content {
      flex: 1;

      min-width: 0;

      height: 100%;

      overflow-y: auto;

      padding: 25px 30px 50px;

      scrollbar-width: thin;
    }

    /* =========================
       SECTION
    ========================= */

    .category-section {
      margin-bottom: 42px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .section-title {
      font-size: 23px;

      font-weight: 750;

      color: #202124;
    }

    .view-all-btn {
      border: none;

      background: transparent;

      color: #5b45e8;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;
    }

    /* =========================
       SUBCATEGORY GRID
    ========================= */

    .subcategory-grid {
      display: grid;

      grid-template-columns:
        repeat(5, minmax(110px, 1fr));

      gap: 28px 20px;
    }

    .subcategory-card {
      border: none;

      background: transparent;

      cursor: pointer;

      text-align: center;

      min-width: 0;
    }

    .subcategory-image {
      width: 125px;
      max-width: 100%;

      aspect-ratio: 1 / 1;

      margin: 0 auto 11px;

      border-radius: 50%;

      background: #f5f4f9;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subcategory-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .subcategory-placeholder {
      color: #999;

      font-size: 28px;

      font-weight: 700;
    }

    .subcategory-name {
      font-size: 14px;

      line-height: 1.3;

      font-weight: 600;

      color: #3d3d43;

      word-break: break-word;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty-container {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    .empty-box {
      max-width: 420px;
    }

    .empty-icon {
      width: 78px;
      height: 78px;

      border-radius: 50%;

      background: #f1efff;

      color: #5b45e8;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;

      margin: 0 auto 16px;
    }

    .empty-title {
      font-size: 21px;

      font-weight: 750;

      color: #25252a;

      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;

      line-height: 1.5;

      color: #777;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      max-width: 650px;

      margin: 50px auto;

      padding: 20px;

      border-radius: 12px;

      background: #fff4f4;

      border: 1px solid #ffd1d1;

      color: #b42318;
    }

    .error-title {
      font-weight: 750;

      font-size: 18px;

      margin-bottom: 8px;
    }

    .error-message {
      font-family: monospace;

      font-size: 12px;

      line-height: 1.5;

      word-break: break-word;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader {
      width: 34px;
      height: 34px;

      border: 4px solid #eee;

      border-top-color: #5b45e8;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      body {
        overflow: hidden;
      }

      .top-header {
        height: 58px;
        min-height: 58px;

        padding: 0 9px;
      }

      .back-btn {
        width: 32px;
        height: 32px;

        font-size: 30px;
      }

      .logo {
        width: 34px;
        height: 34px;

        border-radius: 9px;

        font-size: 16px;

        margin-left: 2px;
      }

      .page-title {
        font-size: 18px;

        margin-left: 9px;
      }

      .header-actions {
        gap: 8px;
      }

      .header-action {
        font-size: 24px;

        width: 32px;
        height: 32px;
      }

      .main {
        height: calc(100dvh - 58px);
      }

      .category-sidebar {
        width: 92px;
        min-width: 92px;
      }

      .category-button {
        min-height: 88px;

        padding: 8px 3px;

        flex-direction: column;

        justify-content: center;

        text-align: center;

        gap: 5px;

        font-size: 11px;
      }

      .category-image {
        width: 44px;
        height: 44px;

        min-width: 44px;
      }

      .content {
        padding: 18px 10px 35px;
      }

      .category-section {
        margin-bottom: 34px;
      }

      .section-header {
        margin-bottom: 15px;
      }

      .section-title {
        font-size: 18px;
      }

      .view-all-btn {
        font-size: 11px;
      }

      .subcategory-grid {
        grid-template-columns:
          repeat(3, minmax(65px, 1fr));

        gap: 23px 7px;
      }

      .subcategory-image {
        width: 88px;

        margin-bottom: 8px;
      }

      .subcategory-name {
        font-size: 11.5px;

        line-height: 1.25;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="top-header">

    <button
      class="back-btn"
      onclick="goBack()"
      aria-label="Back"
    >
      ‹
    </button>

    <div class="logo">
      M
    </div>

    <div class="page-title">
      Categories
    </div>

    <div class="header-actions">

      <button
        class="header-action"
        onclick="openSearch()"
        aria-label="Search"
      >
        ⌕
      </button>

      <button
        class="header-action"
        onclick="openCart()"
        aria-label="Cart"
      >
        🛒
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">

    <!-- LEFT CATEGORY LIST -->

    <aside
      class="category-sidebar"
      id="categorySidebar"
    >
      <div class="loading">
        <div class="loader"></div>
      </div>
    </aside>


    <!-- RIGHT CONTENT -->

    <section
      class="content"
      id="categoryContent"
    >
      <div class="loading">
        <div class="loader"></div>
      </div>
    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://bszojvhitsoamhksyjul.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmxlIiwicmVmIjoiYnN6b2p2aGl0c29hbWhrc3lqdWwiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NjU5NjQ5MywiZXhwIjoyMTAyMTcyNDkzfQ.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       VARIABLES
    ===================================================== */

    let categories = [];

    let activeCategoryId = null;


    const sidebar =
      document.getElementById("categorySidebar");

    const content =
      document.getElementById("categoryContent");


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =====================================================
       IMAGE HTML
    ===================================================== */

    function createImage(url, name) {

      if (!url || !url.trim()) {

        const first =
          String(name || "?")
            .trim()
            .charAt(0)
            .toUpperCase();

        return `
          <div class="subcategory-placeholder">
            ${escapeHTML(first)}
          </div>
        `;
      }

      return `
        <img
          src="${escapeHTML(url)}"
          alt="${escapeHTML(name)}"
          loading="lazy"
          onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;subcategory-placeholder&quot;>?</div>';"
        >
      `;
    }


    /* =====================================================
       LOAD CATEGORIES
    ===================================================== */

    async function loadCategories() {

      showLoading();


      try {

        /*
          IMPORTANT:

          Yahan .eq("is_active", true) intentionally
          nahi lagaya gaya.

          Database me jo category hai,
          wahi load hogi.
        */

        const {
          data,
          error
        } = await supabaseClient

          .from("categories")

          .select(`
            id,
            name,
            image_url,
            sections,
            sort_order,
            is_active,
            created_at
          `)

          .order(
            "sort_order",
            {
              ascending: true
            }
          )

          .order(
            "created_at",
            {
              ascending: true
            }
          );


        /* =========================
           SUPABASE ERROR
        ========================== */

        if (error) {

          console.error(
            "Categories Supabase Error:",
            error
          );

          showError(error);

          return;
        }


        console.log(
          "Categories received:",
          data
        );


        categories =
          Array.isArray(data)
            ? data
            : [];


        /* =========================
           NO DATA
        ========================== */

        if (!categories.length) {

          showEmpty();

          return;
        }


        /* =========================
           FIRST CATEGORY
        ========================== */

        activeCategoryId =
          categories[0].id;


        renderSidebar();

        renderContent();


      } catch (error) {

        console.error(
          "Categories Load Error:",
          error
        );

        showError(error);

      }

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function showLoading() {

      sidebar.innerHTML = `
        <div class="loading">
          <div class="loader"></div>
        </div>
      `;

      content.innerHTML = `
        <div class="loading">
          <div class="loader"></div>
        </div>
      `;

    }


    /* =====================================================
       EMPTY
    ===================================================== */

    function showEmpty() {

      sidebar.innerHTML = "";

      content.innerHTML = `

        <div class="empty-container">

          <div class="empty-box">

            <div class="empty-icon">
              +
            </div>

            <div class="empty-title">
              No Categories Yet
            </div>

            <div class="empty-text">
              Admin Panel se category add karne ke
              baad yahan automatically dikhegi.
            </div>

          </div>

        </div>

      `;

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(error) {

      sidebar.innerHTML = "";

      content.innerHTML = `

        <div class="error-box">

          <div class="error-title">
            Categories load nahi ho paayi
          </div>

          <div class="error-message">
            ${escapeHTML(
              error?.message ||
              "Unknown Supabase error"
            )}
          </div>

        </div>

      `;

    }


    /* =====================================================
       RENDER LEFT SIDEBAR
    ===================================================== */

    function renderSidebar() {

      sidebar.innerHTML = "";


      categories.forEach(category => {

        const button =
          document.createElement("button");


        button.className =
          "category-button";


        if (
          String(category.id) ===
          String(activeCategoryId)
        ) {

          button.classList.add("active");

        }


        const imageHTML =
          category.image_url

            ? `
              <img
                src="${escapeHTML(category.image_url)}"
                alt="${escapeHTML(category.name)}"
                loading="lazy"
                onerror="this.style.display='none';"
              >
            `

            : `
              <span>
                ${escapeHTML(
                  String(category.name || "?")
                    .charAt(0)
                    .toUpperCase()
                )}
              </span>
            `;


        button.innerHTML = `

          <span class="category-image">
            ${imageHTML}
          </span>

          <span class="category-name">
            ${escapeHTML(category.name)}
          </span>

        `;


        button.addEventListener(
          "click",
          function () {

            activeCategoryId =
              category.id;

            renderSidebar();

            renderContent();

            content.scrollTop = 0;

          }
        );


        sidebar.appendChild(button);

      });

    }


    /* =====================================================
       RENDER RIGHT CONTENT
    ===================================================== */

    function renderContent() {

      const category =
        categories.find(
          item =>
            String(item.id) ===
            String(activeCategoryId)
        );


      if (!category) {

        showEmpty();

        return;

      }


      let sections =
        Array.isArray(category.sections)
          ? category.sections
          : [];


      /*
        Empty sections ko remove kar rahe hain.
      */

      sections =
        sections.filter(
          section =>
            section &&
            Array.isArray(section.items) &&
            section.items.length > 0
        );


      /* =========================
         NO SUBCATEGORY
      ========================== */

      if (!sections.length) {

        content.innerHTML = `

          <div class="empty-container">

            <div class="empty-box">

              <div class="empty-icon">
                +
              </div>

              <div class="empty-title">
                No Subcategories Yet
              </div>

              <div class="empty-text">
                "${escapeHTML(category.name)}"
                ke liye Admin Panel se
                subcategory add karein.
              </div>

            </div>

          </div>

        `;

        return;

      }


      /* =========================
         BUILD SECTIONS
      ========================== */

      let output = "";


      sections.forEach(section => {

        const title =
          section.title || "";


        const items =
          Array.isArray(section.items)
            ? section.items
            : [];


        output += `

          <div class="category-section">

            <div class="section-header">

              <h2 class="section-title">
                ${escapeHTML(title)}
              </h2>

              <button
                class="view-all-btn"
                onclick="viewAll('${escapeHTML(category.name)}')"
              >
                View All
              </button>

            </div>


            <div class="subcategory-grid">
        `;


        items.forEach(item => {

          const name =
            item?.name || "";

          const image =
            item?.image || "";


          output += `

            <button
              class="subcategory-card"
              onclick="openSubcategory(
                '${escapeHTML(category.name)}',
                '${escapeHTML(name)}'
              )"
            >

              <div class="subcategory-image">

                ${createImage(
                  image,
                  name
                )}

              </div>

              <div class="subcategory-name">

                ${escapeHTML(name)}

              </div>

            </button>

          `;

        });


        output += `

            </div>

          </div>

        `;

      });


      content.innerHTML = output;

    }


    /* =====================================================
       SUBCATEGORY CLICK
    ===================================================== */

    function openSubcategory(
      categoryName,
      subcategoryName
    ) {

      const url =
        "products.html?category=" +
        encodeURIComponent(
          categoryName
        ) +
        "&subcategory=" +
        encodeURIComponent(
          subcategoryName
        );


      window.location.href = url;

    }


    /* =====================================================
       VIEW ALL
    ===================================================== */

    function viewAll(categoryName) {

      const url =
        "products.html?category=" +
        encodeURIComponent(
          categoryName
        );


      window.location.href = url;

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function openSearch() {

      const query =
        prompt("Search products");


      if (
        query &&
        query.trim()
      ) {

        window.location.href =
          "products.html?search=" +
          encodeURIComponent(
            query.trim()
          );

      }

    }


    /* =====================================================
       CART
    ===================================================== */

    function openCart() {

      window.location.href =
        "cart.html";

    }


    /* =====================================================
       BACK
    ===================================================== */

    function goBack() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        window.location.href =
          "index.html";

      }

    }


    /* =====================================================
       START
    ===================================================== */

    loadCategories();

  </script>

</body>
</html>
