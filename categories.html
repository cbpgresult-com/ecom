<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MyStore - Categories</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#202027;
}

body{
    overflow:hidden;
}

.page{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
    background:#fff;
    border-bottom:1px solid #e8e8ef;
    z-index:10;
}

.back{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    font-size:34px;
    cursor:pointer;
}

.logo{
    width:38px;
    height:38px;
    border-radius:11px;
    background:linear-gradient(135deg,#5b45e8,#8975ff);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:20px;
    font-weight:800;
}

.title{
    font-size:21px;
    font-weight:750;
}

.actions{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.action{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    font-size:25px;
    cursor:pointer;
    display:grid;
    place-items:center;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:24px 28px 50px;
}

/* =========================
   HEADER
========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.heading{
    font-size:23px;
    font-weight:750;
}

/* =========================
   CATEGORY GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(110px,1fr));
    gap:30px 18px;
    max-width:1000px;
}

.item{
    border:0;
    background:transparent;
    cursor:pointer;
    text-align:center;
    color:#202027;
    min-width:0;
}

/* =========================
   CATEGORY IMAGE
========================= */

.imgbox{
    width:min(105px,100%);
    aspect-ratio:1/1;
    margin:0 auto 10px;
    border-radius:50%;
    overflow:hidden;
    background:#f5f4f8;
    display:flex;
    align-items:center;
    justify-content:center;
}

/*
   IMPORTANT:
   contain = image poori dikhegi
   cover nahi = image crop nahi hogi
*/
.imgbox img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
    padding:3px;
}

/* =========================
   CATEGORY NAME
========================= */

.name{
    font-size:14px;
    line-height:1.25;
    font-weight:650;
    word-break:break-word;
}

/* =========================
   PLACEHOLDER
========================= */

.placeholder{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    color:#777;
    font-weight:800;
    font-size:28px;
}

/* =========================
   LOADING / EMPTY / ERROR
========================= */

.loading,
.empty,
.error{
    min-height:55vh;
    display:grid;
    place-items:center;
    text-align:center;
    color:#777;
}

.loader{
    width:34px;
    height:34px;
    border:3px solid #eee;
    border-top-color:#5b45e8;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.errorbox{
    max-width:520px;
    margin:auto;
    padding:22px;
    border:1px solid #ffd2d2;
    background:#fff6f6;
    border-radius:14px;
}

.errtitle{
    color:#c62828;
    font-weight:750;
    font-size:18px;
    margin-bottom:7px;
}

/* =========================
   TABLET / MOBILE
========================= */

@media(max-width:800px){

    .topbar{
        height:58px;
        min-height:58px;
        padding:0 9px;
        gap:7px;
    }

    .back{
        width:34px;
        height:34px;
        font-size:30px;
    }

    .logo{
        width:32px;
        height:32px;
        border-radius:9px;
        font-size:16px;
    }

    .title{
        font-size:18px;
    }

    .action{
        width:34px;
        height:34px;
        font-size:23px;
    }

    .main{
        padding:17px 11px 35px;
    }

    .header{
        margin-bottom:15px;
    }

    .heading{
        font-size:18px;
    }

    .grid{
        grid-template-columns:repeat(3,minmax(70px,1fr));
        gap:24px 7px;
    }

    .imgbox{
        width:min(72px,100%);
        margin-bottom:8px;
    }

    .imgbox img{
        padding:2px;
    }

    .name{
        font-size:11.5px;
    }
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

    .main{
        padding-left:8px;
        padding-right:8px;
    }

    .grid{
        gap:21px 5px;
        grid-template-columns:repeat(3,minmax(65px,1fr));
    }

    .imgbox{
        width:64px;
    }

    .name{
        font-size:11px;
    }
}

/* =========================
   VERY SMALL MOBILE
========================= */

@media(max-width:330px){

    .grid{
        grid-template-columns:repeat(3,minmax(60px,1fr));
    }

    .imgbox{
        width:58px;
    }

    .name{
        font-size:10.5px;
    }
}
</style>

</head>

<body>

<div class="page">

<header class="topbar">

<button
    class="back"
    onclick="history.back()"
    aria-label="Back">
    ‹
</button>

<div class="logo">
    M
</div>

<div class="title">
    Categories
</div>

<div class="actions">

    <button
        class="action"
        onclick="openSearch()"
        aria-label="Search">
        ⌕
    </button>

    <button
        class="action"
        onclick="openCart()"
        aria-label="Cart">
        🛒
    </button>

</div>

</header>

<main class="main">

<div
    id="app"
    class="loading">

    <div class="loader"></div>

</div>

</main>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SAME SUPABASE API
========================================================= */

const SUPABASE_URL =
    "https://bszojvhitsoamhksyjul.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   MARKER
========================================================= */

const MARKER =
    "__SUBCATEGORY_ONLY__";


const app =
    document.getElementById("app");


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(v){

    return String(v ?? "")
        .replace(
            /[&<>"']/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[c])
        );

}


/* =========================================================
   CHECK OUR SUBCATEGORY DATA
========================================================= */

function isOurItem(row){

    const s =
        row?.sections;

    return (
        Array.isArray(s) &&
        s.some(
            x =>
                x &&
                x.title === MARKER
        )
    );

}


/* =========================================================
   IMAGE HTML
========================================================= */

function imageHTML(url,name){

    if(url){

        return `
            <img
                src="${esc(url)}"
                alt="${esc(name)}"
                loading="lazy"
                onerror="
                    this.parentElement.innerHTML=
                    '<div class=&quot;placeholder&quot;>?</div>'
                "
            >
        `;

    }

    return `
        <div class="placeholder">
            ${esc(
                (name || "?")[0]
                    .toUpperCase()
            )}
        </div>
    `;

}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function load(){

    app.className =
        "loading";

    app.innerHTML =
        '<div class="loader"></div>';


    const {
        data,
        error
    } =
        await db
            .from("categories")
            .select(
                "id,name,image_url,sections,sort_order,created_at"
            )
            .eq(
                "is_active",
                true
            )
            .order(
                "sort_order",
                {
                    ascending:true
                }
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    /* =========================
       ERROR
    ========================= */

    if(error){

        app.className =
            "error";

        app.innerHTML = `

            <div class="errorbox">

                <div class="errtitle">
                    Categories load nahi ho paayi
                </div>

                <div>
                    ${esc(error.message)}
                </div>

            </div>

        `;

        return;

    }


    /* =========================
       ONLY SUBCATEGORY ITEMS
    ========================= */

    const items =
        (data || [])
            .filter(isOurItem);


    /* =========================
       EMPTY
    ========================= */

    if(!items.length){

        app.className =
            "empty";

        app.innerHTML = `

            <div>

                <b>
                    No Subcategories Yet
                </b>

                <br><br>

                Admin Panel se
                subcategory add karein.

            </div>

        `;

        return;

    }


    /* =========================
       SHOW DATA
    ========================= */

    app.className = "";


    app.innerHTML = `

        <div class="header">

            <div class="heading">
                Categories
            </div>

        </div>


        <div class="grid">

            ${
                items.map(
                    item => `

                        <button
                            class="item"
                            onclick="
                                openSubcategory(
                                    '${esc(item.name)}'
                                )
                            "
                        >

                            <div class="imgbox">

                                ${
                                    imageHTML(
                                        item.image_url,
                                        item.name
                                    )
                                }

                            </div>


                            <div class="name">

                                ${esc(item.name)}

                            </div>

                        </button>

                    `
                ).join("")
            }

        </div>

    `;

}


/* =========================================================
   OPEN SUBCATEGORY
========================================================= */

function openSubcategory(name){

    window.location.href =
        "products.html?subcategory=" +
        encodeURIComponent(name);

}


/* =========================================================
   SEARCH
========================================================= */

function openSearch(){

    const q =
        prompt("Search products");

    if(
        q &&
        q.trim()
    ){

        window.location.href =
            "products.html?search=" +
            encodeURIComponent(
                q.trim()
            );

    }

}


/* =========================================================
   CART
========================================================= */

function openCart(){

    window.location.href =
        "cart.html";

}


/* =========================================================
   REALTIME UPDATE
========================================================= */

db.channel(
    "categories-live"
)
.on(
    "postgres_changes",
    {
        event:"*",
        schema:"public",
        table:"categories"
    },
    load
)
.subscribe();


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    load
);

</script>

</body>
</html>
